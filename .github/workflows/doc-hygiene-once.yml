name: One-time D-050 documentation hygiene

on:
  push:
    paths:
      - '.github/workflows/doc-hygiene-once.yml'

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify exact documentation cleanup
        run: |
          python scripts/doc_hygiene_fix_once.py
          git diff --check
          git diff --stat

      - name: Commit documentation cleanup
        run: |
          if git diff --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_CONTEXT.md docs
          git commit -m "docs: finish D-050 repository hygiene cleanup [skip ci]"
          git push

name: 8A POST Finalization

on:
  push:
    branches:
      - work/8a-information-architecture

permissions:
  contents: write

jobs:
  post-finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/8a-information-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile 8A POST tooling
        run: python -m py_compile tools/validate_information_architecture.py tools/finalize_8a_post_step.py tools/audit_8a_post_step_stale.py tools/fix_pre_8a_living_state.py
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — accepted Stage 7 English mastery profile
        run: python tools/validate_technical_english_mastery_profile.py
      - name: Validate 8A candidate before POST
        run: python tools/validate_information_architecture.py
      - name: Apply 8A D-050 living-memory finalization
        run: python tools/finalize_8a_post_step.py
      - name: Validate accepted 8A artifacts after POST
        run: python tools/validate_information_architecture.py --write-report
      - name: Validate persistent external memory graph
        run: python tools/validate_external_memory.py
      - name: Run repo-wide 8A stale-reference audit
        run: python tools/audit_8a_post_step_stale.py
      - name: Commit POST-step state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No POST-step changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md PROJECT_CONTEXT.md \
            docs/INFORMATION_ARCHITECTURE_SPEC.md docs/DECISIONS.md docs/PROGRESS_LOG.md \
            docs/EXECUTION_INDEX.md docs/STEP_STATUS.md docs/MASTER_PLAN.md docs/HANDOFF_STATE.md \
            docs/START_HERE.md docs/LOCAL_MANAGER_HANDOFF.md \
            ux/8a_information_architecture/ia.yaml \
            ux/8a_information_architecture/qa_report.yaml \
            ux/8a_information_architecture/stale_reference_audit.yaml \
            vault/agent/CURRENT_CONTEXT.md vault/agent/OPEN_LOOPS.md \
            vault/agent/session-logs/2026-08-27-8a-information-architecture.md
          git commit -m "Finalize 8A UXIA-v0 POST-step memory and stale audit [skip ci]"
          git push

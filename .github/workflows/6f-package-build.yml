name: 6F Professional Engineering Package Build

on:
  push:
    branches:
      - work/6f-professional-engineering
    paths:
      - 'tools/6f_build_trigger.txt'

permissions:
  contents: write

jobs:
  build-validate-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Generate 6F package and reconcile prior professional overlays
        run: python tools/generate_professional_engineering_package.py
      - name: Revalidate prior packages
        run: |
          python tools/validate_foundations_package.py
          python tools/validate_systems_package.py
          python tools/validate_gpu_ml_inference_package.py
      - name: Independently validate 6F package
        run: python tools/validate_professional_engineering_package.py
      - name: Apply PROJECT_MEMORY_PROTOCOL POST-STEP
        run: |
          python tools/finalize_6f_poststep.py
          python tools/finalize_6f_poststep_extra.py
      - name: Repo-wide stale-reference audit
        run: python tools/audit_6f_poststep.py
      - name: Commit generated package and durable state
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize 6F professional engineering map and sync durable state [skip ci]'
          git push origin HEAD:work/6f-professional-engineering

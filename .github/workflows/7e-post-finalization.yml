name: 7E POST Finalization

on:
  push:
    branches:
      - work/7e-english-mastery

permissions:
  contents: write

jobs:
  post-finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/7e-english-mastery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — accepted 7B CEFR progression
        run: python tools/validate_technical_english_cefr_progression.py
      - name: Regression — accepted 7C Daily English component
        run: python tools/validate_daily_english_component.py
      - name: Regression — accepted 7D Technical English integration
        run: python tools/validate_technical_english_integration.py
      - name: Validate 7E candidate before POST
        run: python tools/validate_technical_english_mastery_profile.py
      - name: Apply 7E D-050 living-memory finalization
        run: python tools/finalize_7e_post_step.py
      - name: Validate accepted 7E artifacts after POST
        run: python tools/validate_technical_english_mastery_profile.py --write-report
      - name: Validate persistent external memory graph
        run: python tools/validate_external_memory.py
      - name: Run repo-wide 7E stale-reference audit
        run: python tools/audit_7e_post_step_stale.py
      - name: Commit POST-step state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No POST-step changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md PROJECT_CONTEXT.md \
            docs/TECHNICAL_ENGLISH_MASTERY_PROFILE_SPEC.md docs/DECISIONS.md docs/PROGRESS_LOG.md \
            docs/EXECUTION_INDEX.md docs/STEP_STATUS.md docs/MASTER_PLAN.md docs/HANDOFF_STATE.md \
            docs/START_HERE.md docs/LOCAL_MANAGER_HANDOFF.md \
            curriculum/english/7e_mastery_profile/policy.yaml \
            curriculum/english/7e_mastery_profile/qa_report.yaml \
            curriculum/english/7e_mastery_profile/stale_reference_audit.yaml \
            vault/agent/CURRENT_CONTEXT.md vault/agent/OPEN_LOOPS.md \
            vault/agent/session-logs/2026-08-27-7e-english-mastery.md
          git commit -m "Finalize 7E TEPM-v0 POST-step memory and stale audit [skip ci]"
          git push

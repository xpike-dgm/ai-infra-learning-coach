name: 6H Research AI Package

on:
  push:
    branches:
      - work/6h-external-research-qa
    paths:
      - '.github/workflows/6h-research-ai-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build evaluator package
        run: |
          set -euo pipefail
          mkdir -p package
          cat > package/README_FOR_RESEARCH_AI.md <<'EOF'
          # 6H External Research AI Input Package

          Start with `research/6h_external_research_ai_brief.md` and follow it as the evaluation contract.

          This package intentionally excludes the manager-side `research/6h_current_source_audit.md` so the evaluator performs an independent search rather than being anchored by the manager's hypotheses.

          The package contains the canonical Stage 6 summaries, professional-readiness target, the full machine-readable 6C–6G curriculum datasets, and the internal structural report. Do not treat the structural report as external validation; it only proves internal graph consistency.
          EOF
          mkdir -p package/research package/docs package/curriculum/decomposition
          cp research/6h_external_research_ai_brief.md package/research/
          cp docs/PROFESSIONAL_READINESS_TARGET.md package/docs/
          cp docs/CURRICULUM_DOMAIN_MAP.md package/docs/
          cp docs/CURRICULUM_KNOWLEDGE_GRAPH_CONTRACT.md package/docs/
          cp docs/GRANULARITY_NAMING_STANDARD.md package/docs/
          cp docs/FULL_ROUTE_DECOMPOSITION_BLUEPRINT.md package/docs/
          cp docs/FOUNDATIONS_DETAILED_MAP.md package/docs/
          cp docs/SYSTEMS_DETAILED_MAP.md package/docs/
          cp docs/GPU_ML_INFERENCE_DETAILED_MAP.md package/docs/
          cp docs/PROFESSIONAL_ENGINEERING_DETAILED_MAP.md package/docs/
          cp docs/WEAKNESS_LOCALIZATION_REMEDIATION_MAP.md package/docs/
          cp -R curriculum/decomposition/6c_foundations package/curriculum/decomposition/
          cp -R curriculum/decomposition/6d_systems package/curriculum/decomposition/
          cp -R curriculum/decomposition/6e_gpu_ml_inference package/curriculum/decomposition/
          cp -R curriculum/decomposition/6f_professional_engineering package/curriculum/decomposition/
          cp -R curriculum/decomposition/6g_weakness_remediation package/curriculum/decomposition/
          mkdir -p package/curriculum/decomposition/6h_research_qa
          cp curriculum/decomposition/6h_research_qa/structural_report.yaml package/curriculum/decomposition/6h_research_qa/
      - uses: actions/upload-artifact@v4
        with:
          name: 6h-external-research-ai-input
          path: package/
          retention-days: 7

name: 7C POST Finalization

on:
  push:
    branches:
      - work/7c-daily-english-component
    paths:
      - '.github/workflows/7c-post-finalization.yml'

permissions:
  contents: write

jobs:
  post-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/7c-daily-english-component
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — accepted 7B CEFR progression
        run: python tools/validate_technical_english_cefr_progression.py
      - name: Validate 7C candidate before POST
        run: python tools/validate_daily_english_component.py
      - name: Apply 7C D-050 living-memory finalization
        run: python tools/finalize_7c_post_step.py
      - name: Validate accepted 7C artifacts after POST
        run: python tools/validate_daily_english_component.py --write-report
      - name: Validate persistent external memory graph
        run: python tools/validate_external_memory.py
      - name: Run repo-wide 7C stale-reference audit
        run: python tools/audit_7c_post_step_stale.py
      - name: Commit POST-step state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No POST-step diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize 7C DECP-v0 POST-step memory and stale audit [skip ci]"
          git push

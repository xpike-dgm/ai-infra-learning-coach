# TVSX-v0 / D-081 tiers, as far as they can run without a device.
#
# T6 (device smoke on the single target device, D-080) is deliberately absent: it runs on the
# Poco M6 Pro by hand, and pretending an emulator job is the same thing would make the release
# gate claim something it does not check.

name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # T3 — structural. The dependency rule fails the build, not a test run.
      - name: T3 module boundaries
        run: ./gradlew verifyModuleBoundaries

      # T1 — pure domain. No device, no network, no database.
      - name: T1 pure domain
        run: >-
          ./gradlew :core-model:test :core-ports:test :core-engines:test
          :core-application:test :core-presentation:test

      # T2 — persistence contract. A real SQLite engine on the JVM through the bundled driver:
      # forbidden UPDATE/DELETE attempted and refused, populated-fixture migration, rollback on
      # partial failure (TVSX-v0 §8, LDBX-v0).
      - name: T2 persistence contract
        run: ./gradlew :data-persistence:test

      # T5 — the adapter degrades to evaluation_pending instead of throwing; AI absence is never a
      # crash in the default build either (AIAX-v0, APHX-v0). The content adapter is here for the
      # same reason: asking for unpublished curriculum is a missing resource, not a crash (11A).
      - name: T5 adapters
        run: ./gradlew :ai-adapter:test :data-curriculum:test

      # T5 — the null-evaluator path is proven by building the product without the adapter,
      # not by stubbing it. This is V1 criterion 8 as wiring (MSBX-v0, TVSX-v0 T5-NULLEVAL-01).
      - name: T5 build without the AI adapter
        run: ./gradlew :app-wiring:assembleDebug -PwithAiAdapter=false

      - name: Build with the AI adapter
        run: ./gradlew :app-wiring:assembleDebug

  # The repo's accepted specifications are guarded by their own validators. These are a separate
  # system from the product suite and neither substitutes for the other (TVSX-v0 §15).
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The keys are checked in the learner's toolchain generation (D-114, D-120): the course's own Python and a gcc
      # whose defaults are the ones the C lessons teach (GCC 14+: an implicit declaration or an int from a pointer is
      # a compile error). An older toolchain answers some questions differently, so it would check a different course.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: A current gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14
          sudo ln -sf /usr/bin/gcc-14 /usr/bin/gcc
          gcc --version | head -1
          python --version
      - run: pip install pyyaml
      # The sweep is the full glob, never a hand-maintained subset (TVSX-v0 §13 RG-11).
      - name: Standing validator sweep
        run: |
          set -e
          for f in tools/validate_*.py; do
            echo "== $f"
            # A failing validator shows its FAIL lines; a passing one stays quiet.
            if ! python "$f" > /tmp/validator.out; then
              tail -n 60 /tmp/validator.out
              exit 1
            fi
          done

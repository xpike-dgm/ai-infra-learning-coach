name: One-time 5C post-sync

on:
  push:
    paths:
      - '.github/workflows/step-5c-post-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and audit 5C POST-STEP sync
        run: |
          python scripts/step_5c_post_sync.py
          git diff --stat

      - name: Commit 5C POST-STEP sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_CONTEXT.md docs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: complete 5C FBB-v0 and activate 5D [skip ci]'
          git push

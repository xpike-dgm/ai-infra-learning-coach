name: 8B Today Home QA

on:
  push:
    branches:
      - work/8b-today-home

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/8b-today-home
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile 8B validator
        run: python -m py_compile tools/validate_today_home.py
      - name: Validate persistent external memory
        run: python tools/validate_external_memory.py
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — accepted Stage 7 English mastery profile
        run: python tools/validate_technical_english_mastery_profile.py
      - name: Regression — accepted 8A information architecture
        run: python tools/validate_information_architecture.py
      - name: Validate 8B Today home candidate
        run: python tools/validate_today_home.py --write-report
      - name: Commit 8B QA report
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No QA report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ux/8b_today_home/qa_report.yaml
          git commit -m "Record 8B Today home QA [skip ci]"
          git push

name: 6G Weakness Remediation Overlay Build

on:
  push:
    branches:
      - work/6g-weakness-remediation
    paths:
      - '.github/workflows/6g-overlay-build.yml'
      - 'tools/6g_build_trigger.txt'

permissions:
  contents: write

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Generate WLRM-v0 overlay
        run: python tools/generate_weakness_remediation_overlay.py
      - name: Revalidate accepted source packages
        run: |
          python tools/validate_foundations_package.py
          python tools/validate_systems_package.py
          python tools/validate_gpu_ml_inference_package.py
          python tools/validate_professional_engineering_package.py
      - name: Independently validate 6G overlay
        run: python tools/validate_weakness_remediation_overlay.py
      - name: Commit deterministic overlay
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curriculum/decomposition/6g_weakness_remediation
          git commit -m 'Generate and validate 6G weakness remediation overlay [skip ci]'
          git push origin HEAD:work/6g-weakness-remediation

name: 6F Final Living-Memory Date Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/6f-final-date-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync living-memory dates
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'docs/STEP_STATUS.md': ('## Güncel durum — 2026-08-26', '## Güncel durum — 2026-08-27'),
              'PROJECT_CONTEXT.md': ('**Son senkron:** 2026-08-26', '**Son senkron:** 2026-08-27'),
              'docs/HANDOFF_STATE.md': ('**Son güncelleme:** 2026-08-26', '**Son güncelleme:** 2026-08-27'),
              'docs/MASTER_PLAN.md': ('**Son senkron:** 2026-08-26', '**Son senkron:** 2026-08-27'),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing date marker in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('FINAL_6F_DATE_SYNC=PASS')
          PY
          python tools/validate_external_memory.py
      - name: Commit date sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STEP_STATUS.md PROJECT_CONTEXT.md docs/HANDOFF_STATE.md docs/MASTER_PLAN.md
          git commit -m 'Sync 6F living-memory update dates [skip ci]'
          git push origin HEAD:main

name: One-time 6A post-sync

on:
  push:
    paths:
      - '.github/workflows/step-6a-post-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and audit 6A POST-STEP sync
        run: |
          python scripts/step_6a_post_sync.py
          git diff --stat
      - name: Commit 6A POST-STEP sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_CONTEXT.md docs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: complete 6A GNS-v0 and activate 6B [skip ci]'
          git push

name: 7C Daily English QA

on:
  push:
    branches:
      - work/7c-daily-english-component

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/7c-daily-english-component
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — accepted 7B CEFR progression
        run: python tools/validate_technical_english_cefr_progression.py
      - name: Validate 7C Daily English component
        run: python tools/validate_daily_english_component.py --write-report
      - name: Commit deterministic 7C QA report
        run: |
          if [ -z "$(git status --porcelain -- curriculum/english/7c_daily_component/qa_report.yaml)" ]; then
            echo "No QA report diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/english/7c_daily_component/qa_report.yaml
          git commit -m "Record 7C Daily English QA report [skip ci]"
          git push

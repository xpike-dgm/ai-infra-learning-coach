name: 7E Technical English Mastery Profile QA

on:
  push:
    branches:
      - work/7e-english-mastery

permissions:
  contents: write

jobs:
  qa:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/7e-english-mastery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — accepted 7B CEFR progression
        run: python tools/validate_technical_english_cefr_progression.py
      - name: Regression — accepted 7C Daily English component
        run: python tools/validate_daily_english_component.py
      - name: Regression — accepted 7D Technical English integration
        run: python tools/validate_technical_english_integration.py
      - name: Validate 7E Technical English mastery profile
        run: python tools/validate_technical_english_mastery_profile.py --write-report
      - name: Commit deterministic 7E QA report
        run: |
          if [ -z "$(git status --porcelain curriculum/english/7e_mastery_profile/qa_report.yaml)" ]; then
            echo "QA report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/english/7e_mastery_profile/qa_report.yaml
          git commit -m "Record 7E Technical English mastery profile QA report [skip ci]"
          git push

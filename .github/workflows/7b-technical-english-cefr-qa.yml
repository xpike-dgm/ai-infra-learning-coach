name: 7B Technical English CEFR QA

on:
  push:
    branches:
      - work/7b-english-cefr-progression
    paths:
      - 'research/7b_technical_english_cefr_research.md'
      - 'docs/TECHNICAL_ENGLISH_CEFR_PROGRESSION_SPEC.md'
      - 'curriculum/english/7b_cefr_progression/alignment.yaml'
      - 'tools/validate_technical_english_cefr_progression.py'
      - '.github/workflows/7b-technical-english-cefr-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Regression — final Stage 6 registry
        run: python tools/validate_6h_external_reconciliation.py
      - name: Regression — 7A English Entry Diagnostic
        run: python tools/validate_english_entry_diagnostic.py --write-report
      - name: Validate 7B CEFR progression
        run: python tools/validate_technical_english_cefr_progression.py --write-report
      - name: Commit deterministic 7B QA report
        run: |
          if [ -z "$(git status --porcelain curriculum/english/7b_cefr_progression/qa_report.yaml curriculum/english/7a_entry_diagnostic/qa_report.yaml)" ]; then
            echo 'QA reports unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curriculum/english/7b_cefr_progression/qa_report.yaml curriculum/english/7a_entry_diagnostic/qa_report.yaml
          git commit -m 'Record 7B Technical English CEFR QA [skip ci]'
          git push origin HEAD:work/7b-english-cefr-progression

name: One-time local manager handoff audit

on:
  push:
    paths:
      - '.github/workflows/local-manager-handoff-sync.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit local manager takeover package
        run: python scripts/local_manager_handoff_audit.py

name: 6F Post-Merge Bootstrap Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/6f-postmerge-stale-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch remaining living bootstrap drift
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/START_HERE.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("6E, FRDB-v0 ile GPU Architecture, CUDA, Triton, ML/Transformer, LLM inference internals, serving systems, KV/batching/scheduling/quantization, Multi-GPU/NCCL/RDMA ve AI Infrastructure detailed map'ini üretecek; FDM-v0 ve SDM-v0 registry'lerindeki shared Skills'i clone'lamadan reuse edecektir.",
               "6F PEM-v0 / D-060 ile D23 professional engineering / OSS / project-capstone detailed map'ini tamamladı; D01–D22 accepted Skills canonical ID ile reuse edildi ve 6D/6E professional-overlay review'ları resolved edildi."),
              ("D-041, D-042, D-044–D-058 kararlarını oku;", "D-041, D-042, D-044–D-060 kararlarını oku;"),
              ("FOUNDATIONS_DETAILED_MAP, SYSTEMS_DETAILED_MAP, 6c_foundations ve 6d_systems manifest/skills/prerequisites,", "FOUNDATIONS_DETAILED_MAP, SYSTEMS_DETAILED_MAP, GPU_ML_INFERENCE_DETAILED_MAP, PROFESSIONAL_ENGINEERING_DETAILED_MAP ve 6c–6f decomposition manifest/skills/prerequisites,")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected stale marker: {old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('FINAL_6F_BOOTSTRAP_CLEANUP=PASS')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/START_HERE.md
          git commit -m 'Remove final stale 6F bootstrap references [skip ci]'
          git push origin HEAD:main

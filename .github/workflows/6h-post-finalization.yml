name: 6H POST Finalization

on:
  push:
    branches:
      - work/6h-external-research-qa
    paths:
      - 'tools/finalize_6h_post_step.py'
      - 'tools/fix_6h_post_stale_refs.py'
      - 'tools/audit_6h_post_step_stale.py'
      - '.github/workflows/6h-post-finalization.yml'

permissions:
  contents: write

jobs:
  post-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Clean remaining current-state 6H stale references
        run: python tools/fix_6h_post_stale_refs.py
      - name: Apply 6H D-050 living-memory finalization
        run: python tools/finalize_6h_post_step.py
      - name: Validate final external reconciliation still holds
        run: python tools/validate_6h_external_reconciliation.py
      - name: Validate persistent external memory graph
        run: python tools/validate_external_memory.py
      - name: Run repo-wide stale-reference audit
        run: python tools/audit_6h_post_step_stale.py
      - name: Commit POST-step state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No POST changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md PROJECT_CONTEXT.md docs vault curriculum/decomposition/6h_research_qa
          git commit -m 'Finalize 6H POST-step memory and stale audit [skip ci]'
          git push origin HEAD:work/6h-external-research-qa

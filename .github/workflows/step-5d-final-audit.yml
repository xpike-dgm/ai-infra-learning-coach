name: One-time 5D final audit

on:
  push:
    paths:
      - '.github/workflows/step-5d-final-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run final repository consistency audit
        run: python scripts/step_5d_final_audit.py

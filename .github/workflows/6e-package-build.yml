name: 6E GPU ML Inference Package Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/generate_gpu_ml_inference_package.py'
      - 'tools/validate_gpu_ml_inference_package.py'
      - 'tools/apply_6e_passb.py'
      - 'tools/6e_build_trigger.txt'
      - '.github/workflows/6e-package-build.yml'

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Normalize generator two-pass registry and known prior IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/generate_gpu_ml_inference_package.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    known_local: set[str] = set()\n    for line in SKILL_ROWS:\n',
              '    declared_local = {line.split("|", 1)[0] for line in SKILL_ROWS}\n    for line in SKILL_ROWS:\n'
          )
          s = s.replace('if x not in prior_skills and x not in known_local', 'if x not in prior_skills and x not in declared_local')
          s = s.replace('        known_local.add(sid)\n', '')
          replacements = {
              'skill.python.test_automation': 'skill.programming.test_case_basic',
              'skill.programming.sequence_index_reasoning': 'skill.dsa.sequence_traversal',
              'skill.dsa.heap_priority_queue_basic': 'skill.dsa.sequence_traversal',
              'skill.distributed.replication_partitioning': 'skill.distributed.replication_models',
              'skill.performance.capacity_cost_tradeoff': 'skill.performance.cost_efficiency_reasoning',
              'skill.c.function_definition_call': 'skill.c.functions_basic',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply FRDB hard-soft Pass B review
        run: python tools/apply_6e_passb.py
      - name: Preflight all declared prerequisite refs against 6C and 6D registries
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('.')
          text = (root/'tools/generate_gpu_ml_inference_package.py').read_text(encoding='utf-8')
          block = text.split('SKILL_ROWS = """', 1)[1].split('""".strip().splitlines()', 1)[0]
          rows = [x for x in block.strip().splitlines() if x.strip()]
          declared = {x.split('|', 1)[0] for x in rows}
          prior = set()
          for package in ('6c_foundations', '6d_systems'):
              values = yaml.safe_load((root/f'curriculum/decomposition/{package}/skills.yaml').read_text(encoding='utf-8'))
              prior |= {x['skill_id_candidate'] for x in values}
          missing = []
          for row in rows:
              fields = row.split('|')
              sid = fields[0]
              refs = [x for field in (fields[5], fields[6]) for x in field.split(';') if x]
              for ref in refs:
                  if ref not in prior and ref not in declared:
                      missing.append((sid, ref))
          if missing:
              print('PREREQUISITE_PREFLIGHT=FAIL')
              for sid, ref in missing:
                  print(f'- {sid} -> {ref}')
              raise SystemExit(1)
          print(f'PREREQUISITE_PREFLIGHT=PASS rows={len(rows)} prior={len(prior)}')
          PY
      - name: Generate 6E package and resolve 6D forward reuse review
        run: python tools/generate_gpu_ml_inference_package.py
      - name: Audit Pass B emitted edge classes
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          edges = yaml.safe_load(Path('curriculum/decomposition/6e_gpu_ml_inference/prerequisite_edges.yaml').read_text(encoding='utf-8'))
          soft = {(x['target_skill_id'], x['prerequisite_skill_id']) for x in edges if x['edge_kind'] == 'soft'}
          all_pairs = {(x['target_skill_id'], x['prerequisite_skill_id']) for x in edges}
          expected_soft = {
              ('skill.gpu.simt_divergence_reasoning', 'skill.arch.branch_prediction_cost'),
              ('skill.cuda.thread_index_calculation', 'skill.programming.iteration_reasoning'),
              ('skill.triton.reduction_kernel', 'skill.gpu.latency_hiding_reasoning'),
              ('skill.math.tensor_shape_reasoning', 'skill.dsa.sequence_traversal'),
              ('skill.inference.prefill_decode_distinction', 'skill.arch.latency_throughput_distinction'),
              ('skill.serving.worker_engine_topology', 'skill.distributed.partial_failure_model'),
              ('skill.optimization.prefix_cache_reuse', 'skill.storage.index_selection_reasoning'),
              ('skill.multi_gpu.rdma_transport_model', 'skill.os.memory_mapping_usage'),
              ('skill.ai_infra.gpu_capability_inventory', 'skill.platform.cloud_compute_resource_model'),
          }
          removed = {
              ('skill.multi_gpu.topology_discovery', 'skill.os.cpu_time_accounting'),
              ('skill.multi_gpu.collective_semantics', 'skill.distributed.replication_models'),
          }
          if not expected_soft <= soft:
              raise SystemExit(f'PASS_B_EDGE_AUDIT=FAIL missing_soft={sorted(expected_soft-soft)}')
          if removed & all_pairs:
              raise SystemExit(f'PASS_B_EDGE_AUDIT=FAIL unrelated_edges_remain={sorted(removed & all_pairs)}')
          print(f'PASS_B_EDGE_AUDIT=PASS hard={sum(x["edge_kind"]=="hard" for x in edges)} soft={len(soft)}')
          PY
      - name: Revalidate 6D after review closure
        run: python tools/validate_systems_package.py
      - name: Independently validate 6E package
        run: python tools/validate_gpu_ml_inference_package.py
      - name: Commit deterministic generated package to PR branch
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_gpu_ml_inference_package.py curriculum/decomposition/6e_gpu_ml_inference curriculum/decomposition/6d_systems/manifest.yaml curriculum/decomposition/6d_systems/review_queue.yaml curriculum/decomposition/6d_systems/qa_report.yaml
          git commit -m 'Generate and validate 6E GPU ML inference package [skip ci]'
          git push origin HEAD:${{ github.head_ref }}

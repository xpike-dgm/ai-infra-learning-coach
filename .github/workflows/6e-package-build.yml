name: 6E GPU ML Inference Package Build

on:
  workflow_run:
    workflows: ['One-time local manager handoff audit']
    types: [completed]

permissions:
  contents: write

jobs:
  build-validate-commit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Normalize generator two-pass registry and known prior IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/generate_gpu_ml_inference_package.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    known_local: set[str] = set()\n    for line in SKILL_ROWS:\n',
              '    declared_local = {line.split("|", 1)[0] for line in SKILL_ROWS}\n    for line in SKILL_ROWS:\n'
          )
          s = s.replace('if x not in prior_skills and x not in known_local', 'if x not in prior_skills and x not in declared_local')
          s = s.replace('        known_local.add(sid)\n', '')
          replacements = {
              'skill.python.test_automation': 'skill.programming.test_case_basic',
              'skill.programming.sequence_index_reasoning': 'skill.dsa.sequence_traversal',
              'skill.dsa.heap_priority_queue_basic': 'skill.dsa.sequence_traversal',
              'skill.distributed.replication_partitioning': 'skill.distributed.replication_models',
              'skill.performance.capacity_cost_tradeoff': 'skill.performance.cost_efficiency_reasoning',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Preflight all declared prerequisite refs against 6C and 6D registries
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('.')
          text = (root/'tools/generate_gpu_ml_inference_package.py').read_text(encoding='utf-8')
          block = text.split('SKILL_ROWS = """', 1)[1].split('""".strip().splitlines()', 1)[0]
          rows = [x for x in block.strip().splitlines() if x.strip()]
          declared = {x.split('|', 1)[0] for x in rows}
          prior = set()
          for package in ('6c_foundations', '6d_systems'):
              values = yaml.safe_load((root/f'curriculum/decomposition/{package}/skills.yaml').read_text(encoding='utf-8'))
              prior |= {x['skill_id_candidate'] for x in values}
          missing = []
          for row in rows:
              fields = row.split('|')
              sid = fields[0]
              refs = [x for field in (fields[5], fields[6]) for x in field.split(';') if x]
              for ref in refs:
                  if ref not in prior and ref not in declared:
                      missing.append((sid, ref))
          if missing:
              print('PREREQUISITE_PREFLIGHT=FAIL')
              for sid, ref in missing:
                  print(f'- {sid} -> {ref}')
              raise SystemExit(1)
          print(f'PREREQUISITE_PREFLIGHT=PASS rows={len(rows)} prior={len(prior)}')
          PY
      - name: Generate 6E package and resolve 6D forward reuse review
        run: python tools/generate_gpu_ml_inference_package.py
      - name: Revalidate 6D after review closure
        run: python tools/validate_systems_package.py
      - name: Independently validate 6E package
        run: python tools/validate_gpu_ml_inference_package.py
      - name: Commit deterministic generated package
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_gpu_ml_inference_package.py curriculum/decomposition/6e_gpu_ml_inference curriculum/decomposition/6d_systems/manifest.yaml curriculum/decomposition/6d_systems/review_queue.yaml curriculum/decomposition/6d_systems/qa_report.yaml
          git commit -m 'Generate and validate 6E GPU ML inference package [skip ci]'
          git push origin main

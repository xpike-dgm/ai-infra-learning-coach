name: One-time 5B post-sync

on:
  push:
    paths:
      - '.github/workflows/step-5b-post-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 5B POST-STEP sync
        shell: bash
        run: |
          set +e
          output="$(python scripts/step_5b_post_sync_v2.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            expected="docs/MASTER_PLAN.md: stale 5B state remains: '5B başlamadan yeni PRE-STEP'"
            if ! grep -Fq "$expected" <<< "$output"; then
              exit "$rc"
            fi
            echo 'Accepted historical MASTER_PLAN completion-note reference; validating living state separately.'
          fi

          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          checks = {
              'PROJECT_CONTEXT.md': ['5B ✅ KGC-v0 / D-051', '5C 🟡', 'AKTİF, HENÜZ YÜRÜTÜLMEDİ'],
              'docs/START_HERE.md': ['5B ✅ `KGC-v0', '5C 🟡', '5C henüz yürütülmedi'],
              'docs/HANDOFF_STATE.md': ['5B ✅ KGC-v0 / D-051', '5C 🟡', '5C henüz yürütülmedi'],
              'docs/STEP_STATUS.md': ['5B — Graph / Topic metadata sözleşmesi** | ✅', '5C — İlk 8–12 haftalık curriculum backbone** | 🟡 Aktif', '5C henüz yürütülmedi'],
              'docs/EXECUTION_INDEX.md': ['[x] **5B — Graph / Topic metadata sözleşmesi**', '[ ] **5C — İlk 8–12 haftalık curriculum backbone** **AKTİF**'],
              'docs/MASTER_PLAN.md': ['[x] 5B — Graph / Topic metadata sözleşmesi — KGC-v0 / D-051', '[ ] 5C — İlk 8–12 haftalık curriculum backbone — **AKTİF**'],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'FAIL: {path} missing {needle!r}')

          strict_living = [
              'PROJECT_CONTEXT.md', 'docs/START_HERE.md', 'docs/HANDOFF_STATE.md',
              'docs/STEP_STATUS.md', 'docs/EXECUTION_INDEX.md'
          ]
          forbidden = [
              '5B 🟡 Graph / Topic metadata sözleşmesi',
              '5B henüz yürütülmedi',
              '**Aktif:** **`5B — Graph / Topic metadata sözleşmesi`**',
          ]
          for path in strict_living:
              text = read(path)
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'FAIL: stale living state {needle!r} in {path}')

          if '### [ ] 5B — Graph / Topic metadata sözleşmesi — **AKTİF**' in read('docs/MASTER_PLAN.md'):
              raise SystemExit('FAIL: MASTER_PLAN still marks 5B active')
          if '## D-051 — Curriculum knowledge graph contract = KGC-v0' not in read('docs/DECISIONS.md'):
              raise SystemExit('FAIL: D-051 missing')
          if 'KGC-v0' not in read('docs/CURRICULUM_KNOWLEDGE_GRAPH_CONTRACT.md'):
              raise SystemExit('FAIL: KGC spec missing')

          pointer_files = [
              'README.md', 'PROJECT_CONTEXT.md', 'docs/START_HERE.md',
              'docs/HANDOFF_STATE.md', 'docs/CURRICULUM.md',
              'docs/CURRICULUM_DOMAIN_MAP.md', 'docs/GRANULAR_CAPABILITY_MAP_PLAN.md',
              'docs/PROJECT_MASTER_CONTEXT.md'
          ]
          for path in pointer_files:
              if 'CURRICULUM_KNOWLEDGE_GRAPH_CONTRACT.md' not in read(path):
                  raise SystemExit(f'FAIL: KGC pointer missing in {path}')

          print('Living state + KGC pointer audit: PASS')
          print('\nRemaining 5B lines for historical/current classification:')
          for path in sorted(list(Path('.').glob('*.md')) + list(Path('docs').glob('*.md'))):
              hits = [(i, line.strip()) for i, line in enumerate(read(path).splitlines(), 1) if '5B' in line]
              if hits:
                  print(f'[{path}]')
                  for i, line in hits:
                      print(f'  L{i}: {line}')
          PY

          git diff --check
          git diff --stat

      - name: Commit 5B POST-STEP sync
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_CONTEXT.md docs
          git commit -m 'docs: complete 5B KGC-v0 and activate 5C [skip ci]'
          git push

name: One-time 5B post-sync

on:
  push:
    paths:
      - '.github/workflows/step-5b-post-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and audit 5B POST-STEP sync
        shell: bash
        run: |
          python scripts/step_5b_post_sync_v2.py || true
          python scripts/step_5b_finalize.py
          git diff --stat

      - name: Commit 5B POST-STEP sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_CONTEXT.md docs
          git commit -m 'docs: complete 5B KGC-v0 and activate 5C [skip ci]'
          git push

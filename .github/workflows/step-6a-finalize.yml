name: One-time 6A final consistency check

on:
  push:
    paths:
      - '.github/workflows/step-6a-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run 6A final audit and progress-log correction
        run: |
          python scripts/step_6a_finalize.py
          git diff --stat
      - name: Commit final 6A audit note
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROGRESS_LOG.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: record final 6A consistency re-audit [skip ci]'
          git push

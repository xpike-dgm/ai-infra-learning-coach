name: 7A English Entry Diagnostic QA

on:
  push:
    branches:
      - work/7a-english-baseline-diagnostic
    paths:
      - 'research/7a_english_entry_diagnostic_research.md'
      - 'docs/ENGLISH_ENTRY_DIAGNOSTIC_SPEC.md'
      - 'curriculum/english/7a_entry_diagnostic/blueprint.yaml'
      - 'tools/validate_english_entry_diagnostic.py'
      - '.github/workflows/7a-english-entry-diagnostic-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Regression — final Stage 6 registry and reconciliation
        run: python tools/validate_6h_external_reconciliation.py
      - name: Validate 7A English entry diagnostic
        run: python tools/validate_english_entry_diagnostic.py --write-report
      - name: Commit deterministic QA report
        run: |
          if [ -z "$(git status --porcelain curriculum/english/7a_entry_diagnostic/qa_report.yaml)" ]; then
            echo 'QA report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curriculum/english/7a_entry_diagnostic/qa_report.yaml
          git commit -m 'Record 7A English entry diagnostic QA [skip ci]'
          git push origin HEAD:work/7a-english-baseline-diagnostic

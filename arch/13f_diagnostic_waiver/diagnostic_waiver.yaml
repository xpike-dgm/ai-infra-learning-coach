question: Which starting lessons can you skip, because you showed the Objective independently under mastery's own gates?

primary_invariant: >-
  A diagnostic is not an easier road to mastery; it gathers the same evidence sooner. A waiver is granted only where
  an Objective's gates first pass on diagnostic evidence, it names that evidence, and it is coverage — never mastery,
  never retention. Saying "I know this" is never evidence, one easy item never waives a Topic, help taken or a clean
  miss ends the fast path without blame, and a lesson is skipped only for what was shown.


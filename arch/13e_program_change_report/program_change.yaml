model: PCRX-v0
stage_step: 13E
status: accepted_13e
decision: D-103
result_semantics: ASUX-v0
also_answers: [WBA-v0 §30, MCA-v0 §30, V1_SCOPE release definition 3, PDT-v0 §8.10]
engines_read: [MSTX-v0, RVRX-v0, WLRX-v0, PRQX-v0]
planner: [PLNX-v0, RPLX-v0, RSNX-v0]
persistence: [LFPS-v0, DDM-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: what_canonical_state_and_the_plan_actually_changed_after_evidence_and_why

scope:
  state_changes_reported: true
  plan_changes_reported: true
  recompute_orchestrated: true
  replan_only_on_state_change: true
  result_families_filled: true
  schema_changed: false
  migration_added: false
  interfaces_added: false
  boundaries_changed: false
  planner_rule_changed: false
  mastery_rule_changed: false
  retention_rule_changed: false
  weakness_rule_changed: false
  gate_rule_changed: false
  durable_assessment_report: false
  app_calls_report: false

report_question: After this session, what actually changed in canonical state and in the plan — and why?

primary_invariant: >-
  A report is a diff of two readings; it can never claim more than the engines wrote. A change is stated only
  where an axis actually moved, a state nobody had written is not a before, a review coming due is the day and
  not a change, a plan change is the difference between two recorded plan versions, and when nothing changed
  the result says so plainly.

snapshot:
  watermark_read_first: true
  axes: [mastery_axis_state, retention_axis_state, weakness_axis_state]
  unwritten_reads_as: not_yet_evaluated
  plan: newest_plan_version_decoded_trace

state_changes:
  kinds: [capability_confirmed, verification_opened, verification_resolved, mastery_no_longer_confirmed, remediation_opened, remediation_closed, weakness_question_opened, weakness_supported, weakness_resolved, retention_revalidated, retention_at_risk]
  family_source: ASUX-v0 §13.1
  reason_source: ReplanTrigger (PDT-v0 §8.10)
  unwritten_before_claims_nothing: true
  unknown_before_listed: true
  time_only_transitions_reported: false
  contradiction_reported_as: verification_opened
  one_name_per_change_per_skill: true
  correction_downgrades_reported: false
  hypothesis_family: verification_needed
  readiness_diffed: false
  readiness_why: readiness is a function of the reported axes; its effect on dependents appears as plan changes

plan_changes:
  kinds: [need_opened, need_closed, task_added, task_removed]
  keys: {need: needKey, task: candidateId}
  same_plan_version_is_change: false
  first_plan_is_change: false
  reasons: state_change_codes_plus_new_plans_own_replan_codes

recompute:
  order: [RebuildMastery, RebuildRetention, RebuildWeakness, RebuildReadiness]
  profiles_from: PersistencePort.objectivesOf
  criticality: {critical: true, standard: false, other: refused}
  other_gate_parameters: GRE-v0 defaults
  unpublished_skill: nothing_written
  writes_truth: false

replan:
  only_when_state_changed: true
  through: BuildDailyPlan.replan
  trigger: {remediation_opened: new_remediation_created, verification_opened: new_verification_due_created, otherwise: new_evidence_recorded}
  trigger_sets_remaining_time: false
  report_read_after_new_plan: true

presentation:
  families_into: SessionResults.of(canonicalChanges)
  nothing_changed_sentence: true
  first_plan_sentence: true
  state_change_ref: "skill_state:<skill>#<change>"
  owner_of_wording: 14

port_refinements:
  - {port: PersistencePort, method: objectivesOf}
port_count: 4

suites:
  model: {file: android/core-model/src/test/kotlin/coach/model/ProgramChangeFactsTest.kt, class: coach.model.ProgramChangeFactsTest}
  engine: {file: android/core-engines/src/test/kotlin/coach/engines/ProgramChangeEngineTest.kt, class: coach.engines.ProgramChangeEngineTest}
  application: {file: android/core-application/src/test/kotlin/coach/application/ProgramChangesTest.kt, class: coach.application.ProgramChangesTest}
  presentation: {file: android/core-presentation/src/test/kotlin/coach/presentation/ProgramChangePresentationTest.kt, class: coach.presentation.ProgramChangePresentationTest}
  storage: {file: android/data-persistence/src/test/kotlin/coach/persistence/ProgramChangeStorageTest.kt, class: coach.persistence.ProgramChangeStorageTest}


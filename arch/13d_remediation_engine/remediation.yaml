model: WLRX-v0
stage_step: 13D
status: accepted_13d
decision: D-102
weakness_semantics: WLRM-v0
dataset: curriculum/decomposition/6g_weakness_remediation
engines_read: [MSTX-v0, RVRX-v0]
engines_fed: [PRQX-v0, PLNX-v0, WBAX-v0, MCAX-v0]
persistence: [LFPS-v0, DDM-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: weakness_localization_and_remediation_run_against_real_code

scope:
  weakness_axis_written: true
  objective_local_attribution: true
  weakness_needs_supplied: true
  dispositions_read: true
  retroactive_contamination: true
  schema_changed: true
  migration_added: true
  interfaces_added: false
  boundaries_changed: false
  planner_rule_changed: false
  gate_rule_changed: false
  mastery_rule_changed: false
  topic_state_implemented: false
  remediation_content_implemented: false
  misconception_memory_implemented: false
  app_calls_rebuild: false

weakness_question: What does this evidence really say about which Objective, how sure is it, and when is a weakness truly closed?

primary_invariant: >-
  A failed attempt is not a failed Skill. An attempt nobody can attribute is not the learner's, help taken is a
  hypothesis at most, a contradiction after mastery opens verification before anything is erased, a remediation
  is confirmed only when the mastery engine's gates stop passing, and it is closed only when fresh independent
  evidence makes them pass again.

lifecycle:
  source: WLRM-v0 §5
  signals: [none, hypothesis, supported, confirmed, resolved]
  open_signal_names_evidence: true
  resolution_names_evidence: true
  failure_lowers_signal: false

attribution:
  source: failure_attribution_rules.yaml
  outcomes: [not_attributable, content_or_environment_issue, prerequisite_signal, objective_weakness_hypothesis, objective_weakness_supported, verification_due, remediation_required, positive_recovery_evidence]
  rules: [failure.invalid_or_ambiguous, failure.prerequisite_contamination, failure.unattempted_or_deferred, failure.environment_outside_target, failure.assisted_h1_h4, failure.provisional_or_partial, failure.clean_premastery_h0_direct, failure.first_clean_postmastery_contradiction, failure.fresh_recheck_fail, failure.integrated_global_outcome_guard, failure.review_due_without_negative_evidence, failure.fresh_recovery_success]
  first_match_by_priority: true
  never_a_stored_row: [failure.unattempted_or_deferred, failure.environment_outside_target, failure.integrated_global_outcome_guard, failure.review_due_without_negative_evidence]
  clean: [h0, direct_for_objective, verified, prerequisite_valid, uncontested, no_solution_exposure]
  clean_but_indirect_failure: hypothesis
  confirmation: mastery_gates_fail_after_clean_failure
  assisted_can_confirm: false

closure:
  source: WLRM-v0 §7
  requires_fresh_item_and_family: true
  requires_clean: true
  hypothesis_closed_by_fresh_clean_success: true
  supported_closed_by_fresh_clean_success: true
  confirmed_closed_only_when_gates_pass: true
  task_completion_closes: false
  assisted_success_closes: false
  manual_mastery_override: false

axis:
  values: [none, hypothesis, supported, remediation_required, resolved]
  plus_unwritten: not_yet_evaluated
  confirmed_reads_as: remediation_required
  derived_from: strongest_open_objective_signal
  broadcast: false

needs:
  source: learning_need_mappings.yaml
  supplied: weakness_detected
  supplied_for: [hypothesis, supported]
  severity: {hypothesis: partial_or_uncertain_concern, supported: clean_contradiction_or_verification_due}
  not_supplied_when: [remediation_required_axis, mastery_confirmation_verification_due, off_route]
  one_concern_one_need: true
  receivers: [BuildDailyPlan, ComposeAssessmentBlueprint]

dispositions:
  read_by: store_evidenceFor
  newest_decides: true
  mapping:
    contested: contested
    invalidated_prerequisite_contaminated: prerequisite_contaminated
    invalidated_other: evaluator_invalid
    superseded: evaluator_invalid
    reinstated: as_recorded
  row_edited: false
  outcome_rewritten: false

retroactive_contamination:
  closes_open_loop_of: [13A, 13B]
  touches: slots_whose_item_requires_a_cleanly_failed_skill
  independent_branches_touched: false
  disposition: {disposition: invalidated, reason_code: prerequisite_contaminated, decided_by: deterministic_rule}
  idempotent: true

shared_mastery_timeline:
  file: android/core-application/src/main/kotlin/coach/application/MasteryTimeline.kt
  readers: [RebuildRetention, RebuildWeakness]
  mirrors: RebuildMastery

skill_state:
  writes: weakness_axis_state
  carries: [mastery_axis_state, retention_axis_state, prerequisite_axis_state, primary_presentation_state]
  watermark: min_of_existing_and_weakness
  policy_version: kept_from_mastery

schema_migration:
  from: 5
  to: 6
  owner: 13D
  table: weakness_state
  columns: [skill_logical_id, skill_version, last_attribution_outcome, last_failure_rule, verification_open, signal_evidence_ids, first_seen_on_study_day, last_seen_on_study_day, resolution_evidence_id, as_of_study_day]
  index: weakness_by_skill
  triggers: [weakness_state_signal_insert, weakness_state_signal_update]
  populated_fixture_tested: true
  earlier_rows_touched: false

port_refinements: []
port_count: 4

user_decisions:
  topic_state_machine: {owner: 16C, why: writing two of TSM-v0's six states would misreport every other Topic}
  high_stakes_gap_policy: {owner: 18D, why: the policy needs calibration evidence; until then a high-stakes pause is not resumed}

living_gates_narrowed:
  - {check: E13C-08_watermark_first, to: rows read through MasteryTimeline.rowsOf after the watermark}
  - {check: E13C-08_replay_mirrors, to: the shared MasteryTimeline replay, plus a check that retention reads it}
  - {check: E13C-10_schema_version_5, to: version 5 or later with every later version owned by its contract}
  - {test: RetentionStorageTest, to: Schema.VERSION at least 5}

suites:
  model: {file: android/core-model/src/test/kotlin/coach/model/WeaknessFactsTest.kt, class: coach.model.WeaknessFactsTest}
  engine: {file: android/core-engines/src/test/kotlin/coach/engines/WeaknessEngineTest.kt, class: coach.engines.WeaknessEngineTest}
  application: {file: android/core-application/src/test/kotlin/coach/application/RebuildWeaknessTest.kt, class: coach.application.RebuildWeaknessTest}
  storage: {file: android/data-persistence/src/test/kotlin/coach/persistence/WeaknessStorageTest.kt, class: coach.persistence.WeaknessStorageTest}


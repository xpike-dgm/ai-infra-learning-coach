      how: pairs a hypothesis and a supported weakness in both orders
    - test: "a failure not direct for its Objective is only a hypothesis"
      how: new — a clean failure of a non-direct evidence type is a hypothesis through the rebuild
    - test: "one contradiction after mastery keeps it and opens verification, exactly as the mastery engine decides"
      how: new — replays mastery after every row and checks the shared timeline keeps mastery through the first contradiction

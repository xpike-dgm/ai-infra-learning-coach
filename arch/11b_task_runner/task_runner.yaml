  total: 18
  detected: 18
  mutants:
    - {id: R01, mutant: h3_granted_without_disclosure}
    - {id: R02, mutant: disclosure_narrowed_to_target_scope}
    - {id: R03, mutant: solution_auto_revealed_after_error}

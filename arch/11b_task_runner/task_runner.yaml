device_verification:
  target_device: Poco M6 Pro
  device_connected: false
  t6_run: false
  claimed: false

not_verified:
  - the runner screen on the device, including the exit's reachability with TalkBack
  - any runner state past blocked_not_startable in the real app, because nothing can be confirmed startable yet
  - the consequence disclosure rendered in a real flow; it is a composable with no caller that can reach it today
  - the atomic submission from the app; no activity produces an attempt yet, so it is proven at T1 and T2 only

forbidden_runner_patterns:
  - starting_a_task_on_an_unconfirmed_condition
  - naming_an_unconfirmed_condition_a_failure
  - granting_help_that_was_not_requested
  - granting_h3_or_h4_before_the_consequence_is_disclosed
  - narrowing_an_accepted_disclosure_rule
  - revealing_a_solution_after_the_first_error
  - withholding_help_to_force_independence
  - a_stop_that_costs_debt_streak_or_catch_up
  - presenting_a_mid_segment_pause_as_saved
  - treating_a_pending_evaluation_as_a_pass_or_a_fail
  - advancing_a_cached_task_list
  - writing_evidence_from_the_runner
  - recording_an_attempt_without_provenance_or_assistance_in_the_same_transaction
  - storing_a_derived_fact_beside_its_source
  - inventing_attempt_fields_the_data_model_does_not_name
  - computing_runner_tones_in_the_ui


    - {id: R06, mutant: entry_checks_one_condition}
    - {id: R07, mutant: invalid_resume_continues}
    - {id: R08, mutant: pending_resolved_as_verdict}
    - {id: R09, mutant: stop_is_not_no_penalty}
    - {id: R10, mutant: mid_segment_pause_claims_saved}
    - {id: R11, mutant: cached_list_advance_added}
    - {id: R12, mutant: submission_writes_evidence}
    - {id: R13, mutant: submission_outside_transaction}
    - {id: R14, mutant: provenance_dropped}
    - {id: R15, mutant: recheck_flag_stored}
    - {id: R16, mutant: append_returns_sequence_not_rowid}
    - {id: R17, mutant: blocked_start_looks_like_a_fault}
    - {id: R18, mutant: h3_does_not_reveal}
  survived_at_first: []
  note_on_r16: >-
    expected to slip through, because the first attempt's row id and truth sequence are both 1; it
    was caught, but by the foreign key rather than by the id assertion — the artifact's sequence (2)
    names no artifact row, and SQLite refuses the provenance insert. Recorded as the mechanism that
    actually caught it, not the one that was intended.

validator_mutation:
  total: 18
  detected: 18
  mutants: [state_order, extra_provenance_value, level_renamed, disclosure_narrowed, unrequested_grant,
            today_assumes_all, failed_not_unmet, blocked_as_fault, ui_chooses_tone, submission_writes_evidence,
            two_timestamps, recheck_stored, exit_after_state, start_skips_revalidation, append_returns_unit,
            combining_dot_reintroduced, device_claimed, adjacent_duplicate_line_in_living_doc]
  negative_control: the disclosure rule named only in a comment must not fail the validator
  negative_control_result: no_false_positive
  guard_caught_itself: >-
    on its first run the U+0307 guard failed on the validator's own source, because the tool that
    wrote the file turned the escape sequence into the literal character; the character is now built
    with chr(0x0307) so the file never contains what it hunts for


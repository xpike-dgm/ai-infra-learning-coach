model: RNRX-v0
stage_step: 11B
status: accepted_11b
decision: D-088
daily_working_flow: TRUX-v0
today_interior: TDYX-v0
navigation: NSHX-v0
design_system: VDSX-v0
persistence: LFPS-v0
data_model: DDM-v0
local_database: LDBX-v0
boundaries: MSBX-v0
purpose: task_runner_as_an_execution_surface_with_atomic_attempt_recording

scope:
  task_runner_only: true
  evidence_written: false
  evidence_pipeline_implemented: false
  planner_implemented: false
  content_implemented: false
  resume_checkpoint_persisted: false
  surface_semantics_changed: false
  boundaries_changed: false
  ports_added: false
  schema_changed: false
  session_length_claim: null
  step_count_claim: null

runner_question: How do I do this work now, and what happens when I stop — truthfully, while nothing can be run yet?

primary_invariant: >-
  The Task Runner is an execution surface. It is not the planner, the mastery authority, the
  prerequisite authority or the evidence evaluator, so it can neither rank a task, change a state,
  advance a cached list nor turn an attempt into a pass or a fail.

found_before_11b:
  - id: combining_dot_in_living_docs
    was: >-
      11A's sync script built Turkish text with "İ".lower(), which in Python yields a dotted i
      followed by U+0307 COMBINING DOT ABOVE; five words (four "açık", one "taşımaz") reached AGENTS.md,
      PROJECT_CONTEXT.md, HANDOFF_STATE.md and START_HERE.md on main
    fixed_here: replaced with the dotless ı the words need
    guarded_by: the 11B validator now fails if any living document contains U+0307
  - id: sync_rerun_left_duplicates_and_a_gap
    was: >-
      the same 11A sync script crashed part way and was re-run in pieces; that left an adjacent
      duplicate D-087 line in HANDOFF_STATE.md, a duplicate "11B — Task runner" heading in
      MASTER_PLAN.md, and no 12.13 section for 11A in PROJECT_CONTEXT.md — all on main
    fixed_here: duplicates removed, the missing 12.13 section added and marked as late
    same_mistake_nearly_repeated: >-
      11B's own coverage block for MASTER_PLAN ended in the next heading, which would have duplicated
      "11C — Session state" the same way; it was caught before commit, and the remaining sync steps
      were made idempotent — replacements skip what is already applied and appends skip content
      already present

vocabularies:
  semantic_states:
    source: TRUX-v0 semantic_states
    count: 17
    order_is_source_order: true
  lifecycle_phases:
    source: TRUX-v0 task_run_lifecycle
    value: [enter, orient, work, submit, resolve, transition]
  entry_conditions:
    source: TRUX-v0 entry_revalidation
    count: 5
  resume_conditions:
    source: TRUX-v0 resume_revalidation
    count: 5
  assistance:
    source: DDM-v0 assistance_event
    levels: [H1, H2, H3, H4]
    timings: [before_attempt, during_attempt, after_submit, after_failure]
    scopes: [target_objective, non_target_support]
    sources: [deterministic_content, ai_generated]
    equal_to_schema_check_lists: true
  provenance_origins:
    source: DDM-v0 artifact_provenance
    values: [user_authored, user_authored_with_assistance, mixed_authorship, generated_or_copied, unknown_provenance]
    unknown_is_an_honest_answer: true
  pause_classes:
    source: TRUX-v0 checkpoint_model
    values: [checkpoint_pause, mid_segment_pause, high_stakes_pause]
  next_task_source:
    values: [recomputed_planner_selection]
    cached_local_list_advance: false

state_tones:
  source: VDSX-v0 surface_state_tones
  copied_not_chosen: true
  computed_in: core-presentation
  first_draft_was_in_the_ui: true
  first_draft_note: >-
    the first version computed runner tones inside app-ui with values chosen by hand; they happened
    to equal VDSX-v0, but a coincidence is not a guarantee and the UI toolkit is the wrong module, so
    the map moved to core-presentation with a test that pins every state

entry:
  conditions_must_be_confirmed: true
  unconfirmed_condition_assumed_to_hold: false
  result_field: unmet
  result_field_is_named_failed: false
  rationale: >-
    a condition nothing can confirm yet — no prerequisite engine, no published content — is not a
    failed condition, and the runner does not start on an assumption either
  confirmable_from_today_now: [planned_task_still_selected]
  startable_today: false
  startable_today_reason: prerequisites, the open need, content compatibility and local capability are facts other engines supply (12, 15) and none exists yet
  failure_is_negative_evidence: false
  failure_returns_to_today: true

assistance:
  always_requestable: true
  withheld_to_force_independence: false
  granted_without_request: false
  requested_by_user_on_every_runner_grant: true
  consequence_disclosure_before: [H3, H4]
  consequence_disclosure_scope_condition: none
  consequence_disclosure_scope_note: >-
    TRUX-v0 states the rule without a scope condition. Narrowing it to target-scoped help was
    considered and rejected: it would be a reasonable reading and still a quiet reinterpretation of
    an accepted contract. A mutant that narrows it is caught.
  consequence_framing: measurement_not_punishment
  auto_reveal_after_incorrect_attempt: false
  recheck_flag: derived_from_recorded_assistance
  recheck_scheduled_by_runner: false

stop_and_exit:
  exit_available_from_every_state: true
  exit_is_first_element_of_the_flow: true
  stop_state: stopped_no_penalty
  stop_creates_debt_streak_loss_or_catch_up: false
  mid_segment_pause_presented_as_saved: false

evaluation:
  pending_is_its_own_state: true
  pending_is_pass: false
  pending_is_fail: false
  runner_is_evidence_evaluator: false

submission:
  module: core-application
  one_learner_action_one_transaction: true
  rows: [attempt, artifact, artifact_provenance, assistance_event]
  evidence_rows_written: 0
  single_timestamp_per_action: true
  provenance_required: true
  artifact_reference_required: true
  derived_fields_not_stored: [highest_assistance_level, requires_independent_recheck]
  derived_fields_reason: a derived fact stored beside its source is a second source of truth waiting to disagree
  verified_by:
    t1: use-case shape with a recording store — one transaction, linked ids, no evidence, one timestamp
    t2: the storage guarantee on real SQLite — the four row kinds commit together, and a failure after any of them leaves none
  t2_split_reason: >-
    data-persistence may not depend on core-application, so the use case is proven by shape at T1
    and the same row sequence is proven atomic against the real engine at T2

port_refinement:
  port: PersistencePort
  changed: appendTruth now returns the inserted row id
  reason: rows of one learner action must refer to each other inside one transaction
  new_port: false
  port_count_unchanged: 4
  precedent: [LDBX-v0 ProjectionRecord, TDYX-v0 curriculumPublished]

not_stored_with_owner:
  - {field: planned_task_ref on attempt, owner: 12, reason: DDM-v0 does not name attempt fields; adding it would invent a field}
  - {field: runner_completion_state, owner: 12, reason: TRUX-v0 names the concept but no value set; inventing one is forbidden}
  - {field: component_results and target_objective_refs, owner: 12, reason: they belong to the evidence pipeline, which the runner is not}
  - {field: artifact body storage behind content_ref, owner: 11D, reason: the first step whose activities produce artifacts decides where their bodies live}
  - {field: resume checkpoint content, owner: 11C, reason: session state owns checkpoint persistence}

wiring:
  today_start_opens_runner: true
  runner_suspends_shell: true
  exit_returns_to_today: true
  entry_decided_in: core-presentation

tests:
  new_in_11b:
    TaskRunnerTest: 18
    SubmitAttemptTest: 7
    TransactionAndMigrationTest_learner_action: 3
  t2_total: 50
  skipped: 0
  failures: 0


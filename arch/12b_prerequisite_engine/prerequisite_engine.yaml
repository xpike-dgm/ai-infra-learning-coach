    test now reorders task requirements too. It was a gap in the test, not in the rule.

validator_mutation:
  total: 42
  detected: 42
  negative_control: forbidden words written only inside comments must not fail the validator
  negative_control_result: no_false_positive
  missed_at_first:
    - id: V41
      why: >-
        the cycle check only asked whether onCycle was called and PREREQUISITE_CYCLE was named, so a
        mutant that computed the cycle and then dropped it still passed; the check now asserts that the
        cycle reaches the problems the decision is made from
  reader_guard: >-
    every body the validator reads is itself checked to be non-empty, so the empty-string reader defect
    11D and 12A each found would now be a FAIL rather than a silent PASS


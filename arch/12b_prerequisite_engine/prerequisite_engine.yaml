future_stage_boundaries:
  12C: the planner that asks the gate, builds repair needs for blockers and reports independent branches
  12D: replan triggers, reverse invalidation of dependents, and assembling skill_state under one watermark
  12E: user-facing text from the reason inputs
  13: the retention and weakness axes the gate reads
  14: undeclared prerequisites discovered during evaluation
  15: promoting authored edges out of draft, and storing contamination_risk_if_missing
  18: an index on skill_prerequisite_edge if a bounded scan is ever shown to matter
  T6: device run

acceptance:
  - PRQX-v0 is the accepted prerequisite engine
  - readiness has PRG-v0's four values and eligibility its five, and neither is a number
  - the eligibility matrix equals PRG-v0 §4 and §5, and priority is not an input
  - review_due does not block, a soft gap never blocks, and only dependent work waits
  - a task-level requirement is hard even when the graph does not name it
  - a draft, invalidated or unknown edge, an unknown strictness profile, a self requirement and a cycle are all named metadata problems
  - an axis nobody has evaluated is named and never read as bad news; the gate fails closed on a missing readiness
  - work on a candidate that should have waited is recorded as contaminated evidence
  - only prerequisite_readiness is written, with provenance that cannot claim more than its input saw
  - the schema is unchanged, no migration or index was added and the port count stays four
  - nothing is claimed that was not run; T6 was not run
  - independent 12B QA passes and Stage 6-12A regressions pass

model: PRQX-v0
stage_step: 12B
status: accepted_12b
decision: D-093
prerequisite_contract: PRG-v0
graph_contract: KGC-v0
mastery_engine: MSTX-v0
retention_contract: RVR-v0
skill_presentation: SPWX-v0
data_model: DDM-v0
local_database: LDBX-v0
persistence: LFPS-v0
boundaries: MSBX-v0
purpose: prerequisite_readiness_and_candidate_eligibility_in_code

scope:
  prerequisite_engine_only: true
  planner_implemented: false
  replan_implemented: false
  reason_text_implemented: false
  retention_engine_implemented: false
  weakness_engine_implemented: false
  topic_state_implemented: false
  skill_state_axis_written: false
  presentation_state_derived: false
  schema_changed: false
  migration_added: false
  index_added: false
  interfaces_added: false
  boundaries_changed: false
  surface_semantics_changed: false
  readiness_score_claim: null
  priority_input_claim: null

gate_question: Would work on this target produce evidence that is interpretable and fair?

primary_invariant: >-
  A missing prerequisite holds back only the work that really depends on it. Review due is not
  forgetting, a soft gap never locks anything, priority cannot buy its way past a hard prerequisite,
  and a blocked candidate is a candidate that waits — never a need that failed.

found_before_12b:
  - id: every_authored_edge_is_draft
    was: >-
      all 950 authored edges carry lifecycle_status draft, and KGC-v0 §27 gives a draft entity no
      runtime selection; ignoring draft edges would silently drop 851 hard prerequisites
    resolved_here: >-
      a draft edge is reported as edge_not_published and the candidate is invalid_prerequisite_metadata;
      it is neither dropped nor quietly enforced, and promoting edges is authored content's (15)
  - id: one_strictness_profile_exists
    was: every authored edge names default_prg_v0, and KGC-v0 §12.2 says a profile only expresses PRG-v0
    resolved_here: default_prg_v0 is the only accepted profile; any other is unknown_strictness_profile
  - id: contamination_risk_has_no_column
    was: >-
      PRG-v0 §4.2 names contamination_risk_if_missing as a strictness trigger, but DDM-v0 gives the
      edge no such field and 10D forbids inventing one
    resolved_here: recorded as not stored; strictness comes from critical_prerequisite and the candidate's request
    owner: 15
  - id: retention_and_weakness_not_yet_written
    was: the retention and weakness engines are Stage 13, so two of the axes PRG-v0 reads have never been written
    resolved_here: >-
      an unwritten axis is named in the decision's notes and never read as bad news; confirmed mastery with
      retention not yet evaluated is ready, and remediation counts only when the weakness axis says so
  - id: skill_state_has_one_watermark_for_four_axes
    was: >-
      12A writes its axis on skill_state and carries the others; a second engine doing the same under its
      own watermark would make another engine's older axis look current
    resolved_here: >-
      12B writes only prerequisite_readiness; assembling skill_state's non-mastery axes and the primary
      presentation state under one watermark read belongs where recomputation is orchestrated
    owner: 12D
  - id: two_different_per_skill_questions
    was: >-
      prerequisite_readiness (a Skill's worth as a prerequisite) and prerequisite_axis_state (whether a
      Skill's own prerequisites are resolved) are different facts
    resolved_here: >-
      readiness is persisted; a Skill's own resolution is a decision computed on demand for a candidate
      targeting it, and becomes the axis when skill_state is assembled (12D)
  - id: contaminated_value_lived_in_the_adapter
    was: 12A's SqlitePersistence.CONTAMINATED was the only definition of the value the mastery engine reads
    resolved_here: PrerequisiteSnapshot.CONTAMINATED is core's, and the adapter reads it

readiness:
  source: PRG-v0 §3
  values: [ready, ready_due, uncertain, not_ready]
  is_a_score: false
  derived_from: [mastery_axis_state, retention_axis_state, weakness_axis_state]
  review_due_is_not_ready: false
  remediation_open_is_not_ready: true
  contradicted_mastery_is_uncertain: true
  retention_verification_due_or_at_risk_is_uncertain: true
  unevaluated_axis_read_as_bad_news: false
  unevaluated_axis_named: true
  missing_mastery_is_not_ready: true
  remediation_closed_without_evidence_unblocks: false

eligibility:
  source: PRG-v0 §4, §5, §7
  values: [eligible, conditional_eligible, eligible_with_support, blocked, invalid_prerequisite_metadata]
  matrix:
    ready: {hard_normal: eligible, hard_strict: eligible, soft: eligible}
    ready_due: {hard_normal: eligible, hard_strict: eligible, soft: eligible}
    uncertain: {hard_normal: conditional_eligible, hard_strict: blocked, soft: eligible_with_support}
    not_ready: {hard_normal: blocked, hard_strict: blocked, soft: eligible_with_support}
  strict_when: [source_skill_critical_prerequisite, candidate_requires_strict_prerequisite_confidence]
  soft_gap_blocks: false
  task_requirement_kind: hard
  needed_both_ways_is: hard
  missing_readiness_fails: closed
  priority_is_an_input: false
  blocked_is_failed: false
  only_dependent_work_waits: true
  english_hidden_prerequisite: false
  teach_task_for_the_blocker_blocked: false

graph:
  source: KGC-v0 §12, §27
  runtime_unit: skill_to_skill
  in_force_lifecycles: [published, deprecated]
  retired_edge_gates: false
  draft_edge: reported_as_edge_not_published
  invalidated_edge: reported_as_edge_invalidated
  unknown_lifecycle: reported
  newest_edge_version_in_force: true
  accepted_strictness_profiles: [default_prg_v0]
  cycle: reported_as_prerequisite_cycle
  cycle_walk_reads_each_skill_once: true
  transitive_readiness_computed: false
  transitive_why: >-
    a Skill's readiness is its own confirmed mastery; if B is mastered, a gap in B's own prerequisite does
    not make B unusable, and a gap in an unmastered B already makes B not_ready

metadata_problems:
  - unpublished_target
  - unpublished_required_skill
  - self_requirement
  - prerequisite_cycle
  - edge_not_published
  - edge_invalidated
  - unknown_edge_lifecycle
  - unknown_strictness_profile

reason_inputs:
  source: PRG-v0 §20
  produced_here:
    - blocked_missing_hard_prerequisite
    - blocked_critical_prerequisite_verification_due
    - blocked_prerequisite_remediation_required
    - eligible_prerequisite_review_due_not_blocking
    - eligible_with_soft_prerequisite_gap
    - conditional_prerequisite_uncertain
  owned_elsewhere:
    independent_branch_available: 12C
    prerequisite_repaired_replan: 12D
    invalid_due_to_prerequisite_contamination: evidence_written_under_a_contaminated_snapshot

decision_contract:
  source: PRG-v0 §7
  fields: [candidate_id, target, eligibility, hard_blocker_skills, uncertain_skills, soft_gap_skills,
           review_due_skills, metadata_problems, readiness_snapshot_refs,
           requires_strict_prerequisite_confidence, prerequisite_policy_version, reason_inputs, notes]
  priority_field: false
  failure_field: false
  deterministic: true

contamination:
  source: PRG-v0 §13
  snapshot_for_waiting_candidate: contaminated
  snapshot_owner: core-model
  mastery_engine_excludes_it: true
  negative_evidence_written_against_target: false

projection:
  family: prerequisite_readiness
  owned_by: PRG-v0
  payload: [state]
  writes_truth: false
  writes_skill_state: false
  watermark: the_mastery_rows_watermark_or_zero_when_absent
  written_without_a_published_curriculum: false
  provenance: [policy_version, truth_watermark, built_at_instant, input_curriculum_version]
  same_state_same_row: true

port_refinements:
  interfaces_added: 0
  port_count: 4
  refinements:
    - name: skill
      signature: skill(ref) -> SkillRow?
      reason: the gate needs critical_prerequisite and must tell an unpublished Skill from an unlearned one
      writes: false
    - name: prerequisiteEdgesInto
      signature: prerequisiteEdgesInto(target) -> List<PrerequisiteEdge>
      reason: the gate reads the graph; the store returns every lifecycle and version and filters nothing
      version_pinned: true
      writes: false

wiring:
  reachable_in_app_today: false
  why_not: no planner selects candidates yet, so nothing asks the gate
  caller_owner: 12C


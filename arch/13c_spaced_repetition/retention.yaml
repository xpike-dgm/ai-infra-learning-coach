model: RVRX-v0
stage_step: 13C
status: accepted_13c
decision: D-101
retention_semantics: RVR-v0
engines_read: [MSTX-v0]
engines_fed: [PRQX-v0, PLNX-v0, WBAX-v0, MCAX-v0]
persistence: [LFPS-v0, DDM-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: retention_verification_runs_against_real_code

scope:
  retention_axis_written: true
  rebuilt_from_evidence: true
  day_driven_refresh: true
  planner_refreshes_before_planning: true
  schema_changed: true
  migration_added: true
  interfaces_added: false
  boundaries_changed: false
  planner_rule_changed: false
  gate_rule_changed: false
  mastery_rule_changed: false
  remediation_implemented: false
  topic_weakening_implemented: false
  app_calls_rebuild: false

retention_question: When does a proven Skill need to be checked again, and what did that check show — without counting the passing of time as a deficiency?

primary_invariant: >-
  Time passing is not negative evidence. The day only says that a scheduled check has come: mastery does not
  decay, a due review is not forgetting, nothing locks, and only a clean independent check can move a Skill
  toward verification, risk or stability.

axis:
  source: RVR-v0 §2
  values: [untracked, fresh, stable, review_due, verification_due, at_risk]
  plus_unwritten: not_yet_evaluated
  review_due_stored_by_replay: false
  review_due_derived_from: next_review_on_study_day reached by the study day
  time_changes_other_states: false
  at_risk_from_time: false
  mastery_decays: false
  remediation_required_is_retention_state: false

policy_v0:
  source: RVR-v0 §20
  status: engineering_heuristic_needs_calibration
  calibration_owner: 18C
  initial_review_days: {factual: 2, standard: 4, complex: 7}
  critical_initial_cap_days: 3
  growth_factor: {standard: 2.0, critical: 1.6}
  max_interval_days: {standard: 180, critical: 90}
  verification_separation_days: 1
  rounding: down
  rounding_why: a shorter interval asks for an earlier check, never a later one
  separation_is_lock: false
  probability_or_half_life: false
  unknown_profile_schedules: false

transitions:
  mastery_source: per-row MasteryEngine decision, replayed exactly as RebuildMastery
  mastered_means: [confirmed_current, confirmation_verification_due]
  becomes_fresh: the row that makes the Skill mastered
  first_clean_failure: verification_due
  strong_check_on_or_after_due: stable_interval_grows
  strong_check_before_due: natural_reuse_clock_unchanged
  uncertain_due_check: at_risk
  recheck_pass: stable_interval_not_grown
  recheck_requires_fresh_item: true
  second_failure_mastery_holds: verification_due
  mastery_lost: untracked
  re_mastery: fresh_initial_interval
  cluster_refresh: false

evidence_rules:
  clean: [not_contested, prerequisite_valid, no_solution_exposure, direct_for_objective, verified, independent]
  strong: clean_positive_not_near_repeat_for_complex_or_critical
  near_repeat: item_or_variant_family_already_met_by_this_skill
  uncertain: [verified_partial, provisional_evaluator]

reason_codes:
  source: RVR-v0 §17
  codes: [FIRST_DELAYED_REVIEW, REVIEW_DUE, CRITICAL_REVIEW_DUE, NATURAL_REUSE_VERIFIED, RETENTION_FAILURE_FIRST, RETENTION_RECHECK_PASS, RETENTION_RECHECK_FAIL, RETENTION_AT_RISK, REMEDIATION_AFTER_RETENTION_FAILURE, OVERDUE_REPRESENTATIVE_CHECK, DEPENDENT_PREREQ_VERIFICATION_REQUIRED]
  produced_elsewhere: {OVERDUE_REPRESENTATIVE_CHECK: planner_18B}
  added_to_planner_catalog: false

refresh:
  query: PersistencePort.retentionDueBy
  index: retention_due
  moves: [fresh, stable]
  keeps_watermark: true
  unreadable_row: named_not_guessed
  caller: BuildDailyPlan before reading Skill states

skill_state:
  writes: retention_axis_state
  carries: [mastery_axis_state, prerequisite_axis_state, weakness_axis_state, primary_presentation_state]
  watermark: min_of_existing_and_retention
  policy_version: kept_from_mastery

schema_migration:
  from: 4
  to: 5
  owner: 13C
  table: retention_state
  columns: [retention_profile, critical_prerequisite, current_interval_days, next_review_on_study_day, last_strong_retention_on_study_day, last_retention_evidence_id, successful_delayed_review_count, unresolved_verification_evidence_id, verification_failure_on_study_day, at_risk_reason_codes, last_natural_reuse_on_study_day, reason_codes, as_of_study_day]
  index: retention_due
  triggers: [retention_state_axis_insert, retention_state_axis_update]
  populated_fixture_tested: true
  earlier_rows_touched: false

port_refinements:
  - {port: PersistencePort, method: retentionDueBy}
model_refinements:
  - {type: EvidenceRow, field: studyDay}
port_count: 4

living_gates_narrowed:
  - {check: E13B-10_schema_version_4, to: version 4 or later with every later version owned by its contract}
  - {test: MonthlySessionStorageTest, to: Schema.VERSION at least 4}

suites:
  model: {file: android/core-model/src/test/kotlin/coach/model/RetentionFactsTest.kt, class: coach.model.RetentionFactsTest}
  engine: {file: android/core-engines/src/test/kotlin/coach/engines/RetentionEngineTest.kt, class: coach.engines.RetentionEngineTest}
  application: {file: android/core-application/src/test/kotlin/coach/application/RebuildRetentionTest.kt, class: coach.application.RebuildRetentionTest}
  storage: {file: android/data-persistence/src/test/kotlin/coach/persistence/RetentionStorageTest.kt, class: coach.persistence.RetentionStorageTest}

mutation_results:
  total: 47
  detected: 47
  only_retention_suites_run: true
  harness_verified_to_run_gradle: true
  compile_failure_is_detection: false
  negative_control: a mutant that changes only a comment must survive, proving the harness can report a survivor
  negative_control_result: survived_as_expected
  survived_first_run:
    - id: R25
      why: the engine test built its weak checks before the mastery row, so the replay ordered them before mastery and ignored them for that reason alone
    - id: R26
      why: same test, same ordering defect
    - id: R45
      why: SQLite runs the insert guard before an upsert's conflict resolves, so the upsert case never reached the update guard
  tests_strengthened:
    - test: "only clean independent verified direct work counts as a review"
      how: each weak check is built after its mastery row, and the same check made clean is shown to count
    - test: "retention_state holds only the RVR-v0 axis, on insert and on the upsert's update"
      how: also issues a direct UPDATE, the one path the update guard alone protects
  final_run_is_a_single_clean_run: true
  mutants:

  self_check: rubric_shown_after_submission_as_practice
  self_check_is_exposure: true
  reevaluation: only_when_the_learner_asks
  background_retry: false

not_measured_reasons: [nothing_submitted, nothing_to_judge_by, verified_evaluator_required, task_text_missing, evaluator_did_not_answer]


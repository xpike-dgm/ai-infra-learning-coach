question: Serbest metin bir cevap neye göre değerlendirilir — ve kim karar verir?

primary_invariant: >-
  A free-text answer is judged against what the course said a correct answer contains, never against how it sounds.
  A short answer is verified by the course's accepted answers; a longer one is judged by its rubric, one criterion at a
  time. An AI may only say whether each criterion is met — the course decides what that means for each Objective — and
  its judgement is never more than provisional. A task that needs a verified result is never put to an AI. When nothing
  answers, the response waits: nothing is written, the learner may check their own answer against the rubric as
  practice, and it is evaluated again only when they ask.

user_decisions:
  date: "2026-10-02"
  short_answers: accepted_answer_list_verified
  evaluator_unavailable: waits_self_check_rubric_reevaluate_on_request

answer_key:
  id_pattern: answerkey.<namespace>.<slug>
  pinned_to: one_item_version
  speaks_for: one_objective_the_item_targets
  normalisation: trim_ends_and_crlf_only
  case_fold: authored_ascii_letters_only
  mismatch: not_met_verified
  mismatch_goes_to_ai: false
  package_sections: [answer_key, accepted_answer]
  read_by: ContentPort.answerKeyFor

rubric:
  id_pattern: rubric.<namespace>.<slug>
  pinned_to: one_item_version
  criterion_speaks_for: one_objective_the_item_targets
  verdicts: [met, not_met, unclear]
  package_sections: [rubric, rubric_criterion]
  read_by: ContentPort.rubricFor

aggregation:
  objective_met: every_criterion_met
  objective_not_met: every_judged_criterion_not_met
  objective_partially_met: mixed
  met_with_unclear: not_reliably_measured
  evaluator_component_results_used: false

routes:
  answer_key_exists: key_decides_no_ai
  rubric_verified_required: nothing_measured_no_ai
  rubric_provisional_allowed: ai_judges_criteria
  neither: nothing_to_judge_by
  ai_verified_claim: invalid_response
  ai_missing_unknown_or_repeated_criterion: invalid_response
  ai_sent: [target_objectives, task_text, rubric_criteria, learner_answer, catalog_labels]

request_extension:
  fields: [rubric, misconceptionCatalog]
  why: the rubric and the closed catalog's labels are curriculum text, never learner data (AIAX-v0 §11)

instructions:
  version: open_response_instructions/1
  reply_schema: open_response_evaluation/1
  result_field_restored: rubricFindings

waiting:

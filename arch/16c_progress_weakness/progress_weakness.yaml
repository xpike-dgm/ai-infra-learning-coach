question: Bir konu, bir zayıflık ve Teknik İngilizce profili öğrenciye nasıl gösterilir — becerilerin kendi durumlarından, hiçbir ortalama, yüzde, seviye iddiası ya da kapı uydurmadan?

primary_invariant: >-
  A Topic's state is TSM-v0's first rule that holds over its Skills' own states (16A's one function), whether work on it
  was ever recorded, and whether each Objective's lesson was worked or diagnostically waived; it is never an average, a
  percentage or a prerequisite claim, an unstarted Topic is locked only when none of its Skills can start, and a started
  Topic never goes back to locked. A weakness is shown where it was located — a hypothesis only as the catalog's own
  question, a remediation with what closes it, never the learner. The Technical English profile is TEPM-v0's one band
  rule over the English Skills' states, with its history replayed from the evidence; it is never a general or official
  level, never a number, and English is never a gate. Nothing is written.

user_decisions:
  approval: explicit_user_approval_2026-10-24
  scope: topic_state_topic_detail_weakness_context_and_technical_english_profile_core_and_real_compose_screen
  topic_entry: an_unstarted_topic_is_available_when_one_of_its_skills_can_start_locked_only_when_none_can
  topic_entry_first_choice: every_hard_edge_from_outside_the_topic_satisfied
  topic_entry_revised_because: the shipped graph showed 12 of 27 Topics as locked while the planner offered one of their Skills
  coverage_gate: the_objective_s_teach_task_has_a_recorded_attempt_or_a_13f_diagnostic_waiver
  english_history: replay_the_mastery_engine_over_the_evidence_no_new_table
  english_unpublished_band: named_not_published_never_incomplete_or_failed
  english_anchors_source: curriculum/english/7b_cefr_progression/alignment.yaml

assistant_defaults:
  - every Skill a Topic places is required for it (topic_skill links carry no optionality)
  - weakening is a mastered Topic with a retention signal — at_risk, or an open verification on mastery or retention; review_due alone keeps it mastered (RVR-v0, SPWX-v0 §15)
  - a Topic is started by any recorded attempt on an item of one of its Skills (lesson items included) or any evidence on one of its Objectives; truth is append-only, so it stays started
  - a started Topic with a Skill whose own state cannot be told is recomputing, never a guessed state (16A's rule, one level up)
  - an Objective with no authored teach task is never covered, and says so
  - a Skill whose prerequisite metadata the gate cannot read is not startable; a locked Topic names it as a metadata problem, not as a blocker Skill
  - the historical English band uses the replayed mastery decision; a confirmed remediation needs the mastery gates to have failed (13D), so a mastered Skill has none
  - only no_extension_evidence has a producer — no B2+ extension item is authored (15F wrote A1/A2)
  - the English profile names its Skills as text; UXIA-v0 accepts no technical_english_profile -> skill_detail edge
  - working Turkish microcopy (17 owns its polish); the six Topic labels are SPWX-v0 §6's

declared_extensions:
  - {what: "TopicState, TopicCoverage, TopicMember, TopicReading, TopicProjection and TopicStateProjection.derive in core-model", why: "the read path and the screen need the very same function and MSBX-v0 lets neither depend on the other", precedent: "SkillPresentationProjection (16A)"}
  - {what: "CefrBand, TechnicalEnglishAnchors, EnglishProfileProjection in core-model", why: "TEPM-v0's band rule for the current band and the replayed one alike", source_checked: "curriculum/english/7b_cefr_progression/alignment.yaml, entry for entry, by the 16C validator"}
  - {what: "PersistencePort.attemptedResources, defaulted", extends: "16B's planVersions/assessmentSessions (port refinements, port count unchanged)", default_answer: "nothing — only ever under-states coverage"}
  - {what: "ContentPort.lessonItemsFor, defaulted", extends: "14C explanationsFor, 14D codeTestsFor (content refinements)"}
  - {what: "ObjectiveProgress.misconceptions and SkillDetailFacts.englishBand, defaulted fields", extends: "16A ProgressFacts"}

scope:
  schema_changed: false
  migration_added: false
  new_truth_table: false
  ports_changed: refinements_only
  boundaries_changed: false
  mastery_rule_changed: false
  retention_rule_changed: false

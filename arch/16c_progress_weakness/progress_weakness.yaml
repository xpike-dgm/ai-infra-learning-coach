  topic_state_projection_unwritten: {owner: 18E, note: "the topic_state and english_profile tables stay unwritten: both are read-derived, nothing reads a stored copy, and a Topic depends on outside Skills whose changes do not re-assemble it — the reverse-invalidation loop 16A named"}
  planner_reading_topic_state: {owner: 18B, note: "TSM-v0 §13's planner reading of Topic state is not used; the planner decides per Skill"}
  b2_extension_content: {owner: 20, note: "no B2+ extension item is authored, so only no_extension_evidence is produced"}
  english_profile_to_skill_detail: {owner: 17, note: "not an accepted UXIA-v0 edge; the profile names Skills as text"}
  topic_history: {owner: 18E, note: "TSM-v0 §14's transition history can be replayed like 16B's; not built"}
  integration_context: {owner: 18D, note: "skill_detail shows an English Skill's anchor band; TEIP-v0 dual-target integration context has no stored task-to-Skill pairing to read yet"}
  replay_cost: {owner: 18E, note: "the historical band replays mastery over every English Skill's evidence on each profile read"}
  disposition_reason_in_traces: {owner: 16D, note: "13D sent the disposition reason in traces to 16C; 16C built the Topic, weakness and English views and did not show it — it moves with the app path that records a disposition (16D)"}
  t6_and_device: {owner: 19}


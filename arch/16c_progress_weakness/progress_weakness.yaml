  english_profile_written: false
  screen_drawn: true

topic:
  states: [locked, available, learning, mastered, weakening, remediation_required]
  labels_tr: {locked: Kilitli, available: Hazır, learning: Öğreniliyor, mastered: Öğrenildi, weakening: Tekrar Gerekebilir, remediation_required: Pekiştirme Gerekli}
  tones: {locked: neutral, available: neutral, learning: active, mastered: positive_confirmed, weakening: neutral, remediation_required: attention}
  derivation:
    owner: android/core-model/src/main/kotlin/coach/TopicFacts.kt
    function: TopicStateProjection.derive
    not_started:
      - {when: "one of its Skills can start (the gate's eligibility does not wait)", state: available, reason_code: hard_prerequisites_satisfied}
      - {when: otherwise, state: locked, names: outside Skills its Skills wait for, or a metadata problem}
    started:
      - {rule: 1, when: "a Skill's presentation state is remediation_required", state: remediation_required, reason_code: remediation_triggered}
      - {rule: 2, when: "every Skill confirmed by the mastery engine, every Objective covered, and a retention signal on one", state: weakening, reason_code: retention_risk_confirmed}
      - {rule: 3, when: "every Skill confirmed and every Objective covered", state: mastered, reason_code: mastery_gate_satisfied}
      - {rule: 4, when: otherwise, state: learning, reason_code: topic_started}
    recomputing_when: a started Topic has a Skill whose own state cannot be told (16A)
    started_never_locked: true
    average_of_skills: false
    percentage: false
    prerequisite_claim: false
  coverage: [lesson_worked, diagnostic_waiver, not_covered, no_lesson_authored]
  covered: [lesson_worked, diagnostic_waiver]
  lesson_items_disjoint_from_practice_items: true

weakness_context:
  display:
    hypothesis: the catalog's own open question, nothing more
    supported: localized signal, named
    confirmed: localized remediation on this Objective, named
    resolved: history, not a current problem
  remediation_closure_said: fresh, clean, independent, direct, verified, prerequisite-valid evidence in another context; finishing a task never closes it
  ai_hypothesis_above_hypothesis: false
  failure_language: false
  broadcast_up_or_down: false

english_profile:
  bands: [A1, A2, B1]
  anchors_per_band: 5
  published_anchors: {A1: 5, A2: 5, B1: 0}
  rule: the highest band all of whose anchor Skills at or below it are currently confirmed (confirmed_current, confirmed_review_due, confirmation_verification_due)
  status_values: [not_yet_complete, complete_current, complete_review_due, complete_verification_due]
  band_completion: [complete, incomplete, not_published, recomputing]
  historical_highest: replayed from the evidence (MasteryEngine.replay), never below the current band
  confirmation_sources: [learned_and_verified, validated_entry_evidence]
  extension_states: [no_extension_evidence, extension_practice_only, extension_evidence_present, extension_review_due, extension_verification_due]
  extension_states_with_a_producer: [no_extension_evidence]
  general_or_official_level_claim: false
  numeric_aggregate: false
  english_is_a_gate: false


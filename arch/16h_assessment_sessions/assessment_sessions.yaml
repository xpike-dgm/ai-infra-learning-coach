primary_invariant: >-
  A measurement planned for today runs in the one assessment interior, whatever composed it: a daily assessment task, a
  slot of this cycle's weekly or monthly blueprint, or a check of the learner's open diagnostic. Its kind is context and
  never extra weight. Entry confirms the slot is still in this cycle's stored blueprint, the check still belongs to the
  open diagnostic, and the item is published, judgeable, usable for its intent and unseen — nothing is guessed. Every
  attempt carries its session; a daily assessment's session opens when the learner begins, and a slot's answer is
  recorded as that slot's evidence, so a prerequisite the same session showed missing does not count against its
  target. A question may be left unanswered and that is not incorrect; an answered one may be reported, and its
  evidence is held as contested by an appended disposition, never edited and never held against the learner. The result
  is its state, what could not be measured and what the engines reported. The fast path is opened only by the learner,
  from a Topic, joins today's plan at once and keeps started work; leaving it owes nothing.


assistant_defaults:
  - the three measurement kinds run in the existing task runner, one item at a time — every one is a single atomic boundary (a slot and a diagnostic check carry one item; a daily assessment's items are served in the task's order); orientation says which session it is and the independence disclosure before any work (ASUX-v0 §6)
  - a daily assessment opens one daily assessment_session row when the learner begins, not at entry, so entry still writes no truth (16F); a slot's and a diagnostic's session exist before the run (the blueprint, the request)
  - an assess task's items are offered for the verification intent (its purpose serves verification_due); a slot's for its role's intent; a diagnostic check's for mastery evidence (13F's route); every other task's stay checkpoint
  - a measurement shows no lesson first; it is a check, not teaching
  - a slot's evidence goes through RecordSlotEvidence with what the session's earlier slots produced, read from the attempts that name the session; at the end of a slot run ApplyRetroactiveContamination runs before the recompute (13A, 13B, 13D)
  - a contest is offered only on an answered question that wrote evidence; it appends evidence_disposition contested, reason learner_reported_item_problem, decided by user_report (DDM-v0's deciders); before answering, leaving the question unanswered is the way — a report with no evidence would have nothing to hold, and promising a review nobody records would be untrue
  - the end-of-run recompute re-reads every answered Skill, so a contested row is read as contested before anything is reported (13D's open loop on stale Progress after a correction closes with it)
  - a reinstated row is the row again (13D) and names no correction in traces
  - the fast path requests only Skills new learning may start on (KGC-v0 §27); the others are left out rather than refusing the whole request
  - withdrawing does not replan: today's checks then fail entry by name (the request is no longer the open one), and the next plan omits them
  - working Turkish microcopy; 17 owns the polish


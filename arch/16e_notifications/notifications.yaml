reminder:
  per_study_day_at_most: 1
  default_enabled: false
  suggested_minute: 1140
  minute_range: [0, 1439]
  window_minutes: 10
  window_source: "AlarmManager.setWindow: apps should not pass in a window of less than 10 minutes (API 31+)"
  alarm_type: RTC_WAKEUP
  receiver_budget_millis: 8000
  receiver_limit_source: "BroadcastReceiver.goAsync: receivers may run for up to 10 seconds, goAsync included"
  content_from: [stored_plan_for_today, plan_preview]
  content_fields: [task_count, planned_minutes, includes_review, includes_weekly_assessment, includes_monthly_assessment]
  title_fixed: true
  tap_opens: app_launch_today_start_destination
  silences: [disabled, notifications_blocked, delivered_on_another_day, already_shown_today, no_curriculum, plan_unreadable, nothing_planned, work_recorded_today, day_unreadable, store_not_ready]
  rearm_on: [app_open, boot_completed, my_package_replaced, time_set, timezone_changed, after_each_alarm, restore]
  rearm_receiver_enabled_only_while_on: true
  forbidden_language: [day_count, series, absence, debt, urgency, verdict, percentage, goal]


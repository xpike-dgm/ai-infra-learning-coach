  - {what: "PersistencePort.reminderPreferences, defaulted", extends: "16D's preferenceRecords (port refinements, port count unchanged)", default_answer: "nothing — the reminder is off"}
  - {what: "BuildDailyPlan.preview and Built.Previewed", extends: "12C/12D's build: the same body, returning the composed plan one line before the write transaction", why: "a background wake must never write a plan on a day the learner did not open"}
  - {what: "BlueprintComposer.scopeOfCandidate", extends: "13A/13B's candidateId, its inverse"}
  - {what: "ReminderFacts in core-model", why: "core-application decides with them, core-presentation words them, app-wiring schedules from them"}


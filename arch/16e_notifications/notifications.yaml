purpose: one_quiet_daily_reminder_at_the_learner_s_time_that_says_only_what_today_s_plan_holds

question: Seçtiğim saatte, bugünün planında gerçekten yeni bir iş varsa, bana tek ve sessiz bir hatırlatma gelebilir mi — hiçbir günü saymadan, hiçbir seriyi tutmadan, hiçbir yokluğu borç saymadan ve hiçbir şey yazmadan?

primary_invariant: >-
  A reminder is one quiet note a day at most, at the time the learner chose, and it says only what today's plan holds —
  the plan the planner selected inside today's time, read from the store or composed without being written. It is off
  until the learner turns it on, and the decision is appended to the store like every preference. It writes no truth.
  Anything that could make it stale or unfounded is silence: it was turned off, Android blocks it, it arrived on another
  date, today's was already shown, nothing new is planned, or work is already recorded today. It never counts days,
  keeps a series, names an absence, raises its voice after one, or says what the learner did not do.

user_decisions:
  approval: explicit_user_approval_2026-10-25
  scope: one_daily_reminder_at_the_learner_s_time_at_most_one_a_day_content_built_from_current_state_silence_when_nothing_real_to_say
  default: off_until_turned_on_in_profile_notification_permission_asked_only_then
  timing: approximate_inexact_window_no_exact_alarm_permission

assistant_defaults:
  - the content is today's plan as the planner selected it — the stored plan when the learner already opened the app today, otherwise BuildDailyPlan.preview, the same composition never written — so a review or an assessment that did not fit today is not named; not fitting is not a debt (D-033, SRR-v0)
  - work recorded today means an attempt recorded on today's study day; until 16F links attempts to planned tasks, any recorded work silences the day's reminder rather than risk a stale one
  - the time suggestion is 19:00, where the field starts; nothing is scheduled until the learner turns the reminder on
  - the window is ten minutes, Android's shortest inexact window from API 31; the alarm never fires early
  - a reminder is only about its own local date; one delivered on another date (Doze, a late wake) is silent
  - the study day of the last reminder shown is kept on the device (not in the store): it is delivery bookkeeping, not a learner decision, and keeps the reminder to one a day
  - a tap opens the app the way its icon does; Today is the start destination and the notification carries no task, so nothing is opened past the checks every entry makes (UXIA-v0 §15)
  - the reminder setting is its own append-only table (schema v10), not more keys in preference_record, because changing that table's closed key CHECK would rebuild it and rewrite every stored row
  - the receiver waits at most eight seconds for the store and the decision; a receiver has ten in all, goAsync included; past that the reminder is silence
  - no end-of-day notification and no absence notification exist; EODX-v0's day closes because the date changed, and SRR-v0's absence is not debt
  - working Turkish microcopy; 17 owns the polish


question: AI'ın yazdığı bir kodu öğrenci anlıyor mu — ve bu neyi kanıtlar?

primary_invariant: >-
  Running code someone else wrote proves nothing about the learner; explaining it proves understanding, not
  production. When the learner submits code an AI or another source wrote, or that a shown solution largely gave them,
  a comprehension check is offered right after and may be skipped. Written checks come first and are judged by their
  answer key; only where none is written does the tutor ask about the learner's own code, and that is practice, never
  evidence. A correct answer is evidence of the kind its author declared — never of the item's own production — and
  code the learner did not write opens a fresh independent check of the production Objective.


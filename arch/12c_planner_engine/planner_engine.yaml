future_stage_boundaries:
  12D: replan triggers, re-entry, paused continuation, calling the planner, and skill_state assembly under one watermark
  12E: user-facing reason text and Today reading the plan
  12F: the 3H virtual-user scenarios against this implementation
  13: retention due buckets, at_risk and weakness needs
  15: authored tasks and their package format
  16D: the capacity setting
  18C: starvation and track-balance thresholds
  18E: the per-need candidate cap against real performance
  T6: device run

acceptance:
  - PLNX-v0 is the accepted planner engine
  - capacity resolves in D-033's order; the hard budget is never exceeded and the planning budget keeps the reserve
  - needs come from the axis each engine owns; an unwritten axis and a Skill off the route open nothing
  - the gate order is PDT-v0 §17's; priority never rescues a blocked, invalid or untrusted candidate
  - bands and the rank vector equal PBR-v0; nothing is summed, no tie is random, and a critical label alone is not P0
  - selection is fit, safe split, smaller alternative, defer; an atomic boundary is never split and one task serves a need
  - a need that did not fit is deferred for time, not called less important, and it is neither debt nor failure
  - no starvation threshold and no reason code is invented
  - the plan is appended as truth in one transaction with a trace that reads back exactly
  - the schema is unchanged, no migration was added and the port count stays four
  - nothing is claimed that was not run; T6 was not run
  - independent 12C QA passes and Stage 6-12B regressions pass

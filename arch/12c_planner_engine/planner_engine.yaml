purpose: initial_daily_plan_generation_with_a_reconstructable_trace

scope:
  initial_generation_only: true
  replan_implemented: false
  reentry_implemented: false
  paused_continuation_implemented: false
  reason_text_implemented: false
  today_reads_plan: false
  capacity_setting_stored: false
  authored_tasks_shipped: false
  starvation_threshold_calibrated: false
  schema_changed: false
  migration_added: false
  interfaces_added: false
  boundaries_changed: false
  surface_semantics_changed: false
  priority_score_claim: null
  utility_maximisation_claim: null

planner_question: Which of today's open needs are served, by which task, within the minutes the learner has?

primary_invariant: >-
  Semantic priority first, physical fit second. Priority never rescues a blocked or untrusted task,
  capacity never rewrites priority, the day is never lengthened to fit more, and a need no task served
  stays open — it is not tomorrow's debt and not a failure.

found_before_12c:
  - id: planned_task_cannot_hold_a_today_row
    was: planned_task carries the Skill and the position only; purpose, title, activity, minutes and reasons have no column
    resolved_here: >-
      the whole PDT-v0 trace, including every selected task keyed by position, is stored in
      planner_decision_trace.trace in the strict versioned format planner_trace/1; no column was invented
  - id: no_authored_task_exists
    was: curriculum_package/1 has no task section, so no need a real store opens has a candidate
    resolved_here: >-
      ContentPort.taskCandidates(need) is a port refinement and the file adapter answers with an empty list;
      the need is recorded as having no valid candidate, and no reason code is invented for it
    owner: 15
  - id: no_starvation_threshold_exists
    was: PBR-v0 §6.5 leaves the threshold to 18B/18C and 7C's QA refused to invent one
    resolved_here: pressure is an input with PBR-v0's promotion limits; the product supplies none
    owner: 18C
  - id: retention_and_weakness_not_yet_written
    was: overdue buckets, at_risk and weakness-derived needs have no input before Stage 13
    resolved_here: an unwritten axis opens no need; review due is just_due, never overdue_high, until RVR-v0 says so
    owner: 13
  - id: every_authored_skill_is_draft
    was: like the edges in 12B, every authored Skill is draft, and KGC-v0 §27 gives a draft entity no runtime selection
    resolved_here: a draft or retired Skill opens no need; the count off the route is recorded in the trace
  - id: candidate_cap_left_to_12c
    was: 3B §17 names 12C as the owner of the per-need candidate cap
    resolved_here: five per need, an engineering bound on how much is read, in a stable order with deprecated last

declared_constants:
  source: D-033
  calibrated_at: 18C
  short_profile_minutes_v0: 30
  normal_profile_minutes_v0: 60
  intensive_profile_minutes_v0: 90
  planning_reserve_ratio_v0: 0.10
  minimum_plannable_block_minutes_v0: 10
  planner_substitutes_a_default_for_a_setting: false
  is_ideal_study_time: false

engineering_bounds:
  max_candidates_per_need_v0: 5
  owner: 12C
  learning_meaning: false
  revisited_at: 18E

capacity:
  source: D-033
  resolution_order: [today_override, selected_day_profile, scheduled_default, normal_profile]
  hard_budget_exceeded: false
  planning_budget: floor_of_hard_budget_times_0_90
  below_minimum_block: reserve_relaxed_and_no_new_teaching
  remediation_lengthens_day: false
  fixed_category_percentages: false

needs:
  source: 3B §2.1
  triggers: [new_learning, continue_learning, weakness_detected, remediation_required, retention_review_due,
             verification_due, diagnostic_opportunity, reinforcement_opportunity, parallel_track_due,
             integration_opportunity]
  generated_from_state: [remediation_required, verification_due, retention_review_due, continue_learning, new_learning]
  supplied_by_owners: [weakness_detected, diagnostic_opportunity, reinforcement_opportunity, parallel_track_due,
                       integration_opportunity]
  need_is_task_id: false
  unwritten_axis_opens_a_need: false
  draft_skill_opens_a_need: false
  deprecated_skill_opens_new_learning: false

candidates:
  source: 3B §15
  generated_by: content
  planner_invents_a_task: false
  high_stakes_purposes: [assess, retain, diagnose]
  high_stakes_needs: [validated, trusted, deprecated]
  unselectable_lifecycles: [draft, invalidated, retired]
  deprecated_ordered_last: true

gate_order:
  source: PDT-v0 §17
  order: [current_state, learning_need_generation, bounded_candidates, validation_trust, prg_eligibility,
          pbr_priority, capacity_fit]
  priority_rescues_blocked_or_invalid: false
  missing_gate_answer: blocked

priority:
  source: PBR-v0
  bands: [integrity_blocker, repair_or_verify, maintain_or_continue, planned_progress, reinforce_or_optimize]
  rank_vector: [integrity_or_blocking_scope, criticality, evidence_severity, temporal_urgency, starvation_pressure,
                continuation_value, decision_value, track_balance_pressure, duration_fit_class, stable_tie_break_key]
  rank_vector_summed: false
  random_tie_break: false
  p0_from_critical_label_alone: false
  review_due_is_negative_evidence: false
  starvation_promotion: planned_progress_to_maintain_only
  starvation_passes_repair: false
  duration_before_priority: false

selection:
  source: D-033 §12, PBR-v0 §8, PDT-v0 §16
  order: [fits, safe_split, smaller_alternative, defer]
  atomic_evidence_boundary_split: false
  one_task_per_need: true
  knapsack: false
  deferred_is_debt: false
  deferred_high_priority_labelled_lower_priority: false

trace:
  source: PDT-v0 §4-§6
  format: planner_trace/1
  stored_in: planner_decision_trace.trace
  decode_on_unknown_format: refused
  records: [capacity, policy_versions, need_traces, candidate_traces, selected_tasks, plan_reason_codes,
            invariant_checks, truth_watermark, curriculum_version, skills_not_on_route]
  reason_code_invented_for_unserved_need: false
  private_rationale_stored: false

persistence:
  tables: [plan_version, planned_task, planner_decision_trace]
  region: truth
  one_transaction: true
  edited_in_place: false
  written_without_a_published_curriculum: false
  watermark_read_before_state: true
  projection_written: false
  evidence_read: false

port_refinements:
  interfaces_added: 0
  port_count: 4
  refinements:
    - name: publishedSkills
      port: PersistencePort
      signature: publishedSkills() -> List<SkillRow>
      reason: needs are opened from current Skill state, so the planner must know which Skills exist
      writes: false
    - name: taskCandidates
      port: ContentPort
      signature: taskCandidates(need) -> List<TaskCandidate>
      reason: which task serves which need, and how long it takes, is authored content

living_gates_narrowed:
  - check: E11D-13_content_methods
    validator: tools/validate_daily_micro_assessment.py
    was: an exact list of ContentPort's methods
    now: 11D's own three methods, in order, with later refinements allowed
    why: >-
      12C's taskCandidates refines the same port; 11D owns assessmentItem and curriculumPackage, not the rest
      of the interface. Same precedent as E11C-10, narrowed when 11D refined PersistencePort
    guarantee_weakened: false

wiring:
  reachable_in_app_today: false
  why_not: no capacity setting is stored (16D), no authored task ships (15), and Today cannot yet show trace-backed reasons (12E)
  caller_owner: 12D


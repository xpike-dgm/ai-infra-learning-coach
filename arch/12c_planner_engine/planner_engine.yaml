    every first-run survivor was a gap in the tests, not in the rules. The minimum-block test's teaching task
    would not have fitted anyway; no test pinned review due as no negative evidence, a non-critical blocker
    as P1, fit as the ninth rank field, or an invalid-metadata candidate; and the use-case tests never
    checked that a task's own requirements, its strict request, the weakness axis and the critical flag
    reach the engine. Each gained a test, Q55 was added with the independent-branch reason, and the whole
    set was then run again from scratch.

validator_mutation:
  total: 46
  detected: 46
  negative_control: forbidden words written only inside comments must not fail the validator
  negative_control_result: no_false_positive
  missed_at_first: []
  reader_defects_found_on_first_run:
    - id: rank_fields_anchor
      why: >-
        the anchor `PriorityRankVector` sits inside the block it names, so the reader took the next block
        (§6.1's scope values) as the rank vector; the anchor is now the section heading
    - id: invariant_names
      why: >-
        the invariant reader matched only `"name" to (`, so two checks written as `"name" to assessed...` and
        across a line break were missed; the reader now takes every name in the invariant block
  reader_guard: every body the validator reads is itself checked to be non-empty


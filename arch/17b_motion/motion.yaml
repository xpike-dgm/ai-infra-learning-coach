acceptance_criteria:
  - the purposes are VDSX-v0 §10.2's four, each with one band
  - every band is short, feedback is the briefest and nothing exceeds the ceiling
  - with the platform's animations removed every change is immediate
  - animation specs are made in one place, from a purpose
  - nothing repeats, pulses, counts down, scales, rotates, travels or celebrates
  - motion is never the only sign of a change, and the focused-flow exit is never behind motion
  - earlier gates still pass



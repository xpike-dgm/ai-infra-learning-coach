question: Uygulamadaki hareket bana yalnız nereye geldiğimi, aynı şeyin büyüdüğünü, girdimin alındığını ve durumun gerçekten değiştiğini mi söylüyor — beni acele ettirmeden, ödüllendirmeden, hiçbir şeyi yalnız hareketle söylemeden ve hareketi kapattığımda hiçbir bilgiyi kaybetmeden?

primary_invariant: >-
  Motion has four purposes — orientation, continuity, feedback and state change — each a short declared band, and
  nothing is long enough to delay the next action. Nothing repeats, pulses, counts down or celebrates, not even when
  canonical state genuinely changed. Motion is never the only sign of a change: the text beside it already says so and
  it is announced; leaving a focused flow is never animated. With the platform's animations removed every change is
  immediate and nothing is lost.


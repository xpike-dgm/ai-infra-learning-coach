  approval: explicit_user_approval_2026-10-27
  scope: core_motion_policy_plus_application_destinations_and_details_arriving_focused_flow_entered_panels_opening_result_arriving_chip_following_its_state
  celebration: none_at_all_even_on_a_genuine_canonical_change
  reduced_motion: the_platform_setting_animator_duration_scale_zero_in_app_preference_is_17d

assistant_defaults:
  - bands follow Material 3's duration tokens — feedback 100 ms, orientation and state change 200 ms, continuity 250 ms; ceiling 300 ms; declared defaults and calibration inputs for 18
  - easing — decelerate for arrival (orientation), standard otherwise
  - arrival is a fade only; no scale, rotation or travel, which could read as falling or rising
  - a chip animates its colour only; its label and announced state change at once

found:
  - id: no_motion_existed
    what: the app made no animation of its own; only Material components' defaults moved
  - id: keyed_fade_not_crossfade
    what: the shell's content is one lambda reading the current state, so a cross-fade would draw the new screen twice
    resolution: an arriving surface fades in on its key and nothing animates its leaving, which also keeps the exit free
  - id: compose_scales_by_platform
    what: Compose already scales durations by the animator duration scale
    resolution: the rule is made explicit (ReducedMotion, snap) so it holds by construction
  - id: review_blocking_exit_faded
    what: the independent review found the focused flow faded in as a whole, so its exit started invisible though clickable
    resolution: a focused flow is never faded; the validator now reads AppShell's focused branch
  - id: review_blocking_blank_frame
    what: with motion reduced every arrival drew one blank frame (Animatable started at 0)
    resolution: an arrival starts visible when motion is reduced and no effect runs
  - id: review_suggestions
    what: a chip animated when reused for another subject; a stage swap animated as one object; the result announced from a transparent node; validator gaps
    resolution: StateChip(subject) with key; continuity only on the help panel and grouping blocks; the live region outside the fade; the validator scans generic specs, more animation APIs, frame loops and app-wiring
  - id: emulator_system_ui_anr
    what: the emulator's System UI stopped responding once after boot; not the app

policy:
  purposes: [orientation, continuity, feedback, state_change]
  bands_ms: {feedback: 100, orientation: 200, state_change: 200, continuity: 250}
  ceiling_ms: 300
  reduced: every duration 0 (snap) when the platform's animator duration scale is 0
  celebration_allowed: false
  forbidden: [countdown_or_urgency, pressure_pulse, celebration_on_completion, decay_or_loss, streak_combo_or_score, sole_indicator_of_change, blocks_exit]

application:
  orientation: AppShell — a destination or a detail fades in on its surface id
  continuity: SectionBlock and the run's help panel grow and shrink (animateContentSize); a stage swap is not continuity
  feedback: TaskRunnerScreen — an answer's result fades in; the polite live region sits outside the fading layer
  state_change: StateChip(subject) — its colour follows a new state of the same subject; a new subject starts a new chip; the label and stateDescription change at once
  focused_flow: never faded in or out; its exit is the first item, visible and acting from the first frame
  reduced: an arrival is visible from its first frame (no blank frame)


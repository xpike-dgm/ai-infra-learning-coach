  mastery_rule_changed: false
  planner_rule_changed: false
  labels_authored: false
  memory_used_for_selection: false
  app_calls_analysis: false

question: What does this wrong answer show — and how sure can we be?

primary_invariant: >-
  A wrong answer is information, not a verdict about the learner. A misconception label is only ever as strong as
  the evidence it rides on and its source allows: it moves exactly as far as the weakness engine's own rule moves its
  Objective, an AI's proposal never rises above a hypothesis, a label nobody declared for the Objective is never
  stored, and a hypothesis is put to the learner only as a question.

user_decisions:
  date: "2026-10-01"
  catalog: closed_curriculum_authored
  undeclared_label_stored: false
  hypothesis_shown: only_as_open_question_right_after_the_answer

catalog:
  table: misconception
  id_pattern: misconception.<namespace>.<slug>
  pinned_to: one_objective_version
  fields: [logical_id, version, objective_logical_id, objective_version, name, open_question]
  open_question_is_a_question: true
  immutable: true
  refused_if: [objective_unpublished, other_version]
  package_section: misconception
  read_by: PersistencePort.misconceptionsOf

labels:
  written_to: evidence_event.misconception_tags
  format: misconception_tags/1
  only_on: [not_met, partially_met]
  only_for_component_objective: true
  only_if_declared: true
  source_from_verified: deterministic
  source_from_provisional: ai_proposed
  non_answer_writes: nothing

memory:
  table: misconception_state
  owner: WLRM-v0
  lifecycle: [none, hypothesis, supported, confirmed, resolved]
  attribution: weakness_engine_rule_against_objective_state
  reach:
    - {rule: failure.assisted_h1_h4, to: hypothesis}
    - {rule: failure.provisional_or_partial, to: hypothesis}
    - {rule: failure.clean_premastery_h0_direct, to: supported}
    - {rule: failure.first_clean_postmastery_contradiction, to: supported}
    - {rule: failure.fresh_recheck_fail, to: confirmed_if_gates_fail_else_supported}
  source_ceiling: {deterministic: confirmed, ai_proposed: hypothesis}
  moves_no_label: [invalid_or_ambiguous, prerequisite_contamination, diagnostic_baseline]
  lowered_by_weaker_row: false
  resolved_by: fresh_clean_success_confirmed_only_when_gates_pass
  resolved_by_time: false
  undeclared_label_moves: false
  written_for_every_catalog_label: true

analysis:
  reads_stored_attribution: true
  shared_event_builder: WeaknessEvents
  writes: nothing
  calls_ai: false
  labels_mentioned_only_after: [objective_weakness_hypothesis, objective_weakness_supported, verification_due, remediation_required]
  hypothesis_shown_as: open_question
  supported_or_confirmed_shown_as: named
  resolved_shown: false

review_resolved:
  id: review.6g.misconception_taxonomy_expansion
  resolution: runtime_contract_and_closed_catalog_here_labels_in_15_expansion_from_real_errors_in_18

port_count: 5
port_refinements: [{port: PersistencePort, method: misconceptionsOf}]
projection_extension: {table: misconception_state, grain: per_catalog_label, owner: WLRM-v0, decision: D-106}
curriculum_extension: {table: misconception, grain: per_label_per_objective_version, decision: D-106}
schema_version: 8
schema_migration: {from: 7, to: 8, owner: 14B, tables: [misconception, misconception_state], truth_altered: false, decision: D-106}


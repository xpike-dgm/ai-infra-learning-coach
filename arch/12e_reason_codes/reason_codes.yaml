explanation_question: Why this task today, why not that one, why is this waiting, and why did the plan change?

primary_invariant: >-
  An explanation is a projection of the decision trace. Every sentence stands for a reason code the trace
  recorded or a fact the trace holds in a field; a reason the planner never recorded cannot be constructed,
  deferred work is never called less important, a waiting task names its real Skill blocker, review_due is
  never forgetting, and absence is never debt.

found_before_12e:
  - id: trace_could_not_name_a_blocker
    was: PDT-v0 §11 and 3H invariant 6 require a waiting task to name its Skill blocker, but CandidateTrace had no related_refs
    resolved_here: CandidateTrace.relatedSkills records the gate's answer at planning time; the trace format moved to planner_trace/3
  - id: today_could_not_read_a_plan
    was: TodayFactsQuery held plan = null, and latestPlan() returned no planned_task ids for a row to point at
    resolved_here: PlanReading reads the stored plan and its trace; latestPlan() returns the plan's own rows in position order
  - id: an_un_namespaced_code_in_plans
    was: the planner writes independent_branch_available, which PDT-v0 §8 does not list
    resolved_here: it is PRG-v0 §20's explainability input; the catalogue names both sources
  - id: continuation_label_would_claim_a_start
    was: 11A worded CONTINUE_CURRENT_LEARNING as learning already started, but new learning maps to the same THUX-v0 family
    resolved_here: the label says progress on the route, true for new and continued learning
  - id: kept_work_would_be_offered_again
    was: after a replan the first tasks are ones already started, and Today would have offered them to start
    resolved_here: kept work stays in the plan and is not startable; continuing is the resumable session's path

catalogue:
  source: [PDT-v0 §8, PRG-v0 §20]
  families: [learning_need, validation_trust, prerequisite, retention, priority, capacity, diagnostic, reentry, selection, replan, prerequisite_input]
  counts: [10, 7, 9, 7, 15, 13, 10, 8, 9, 13, 9]
  closed: true
  code_outside_catalogue_can_be_shown: false

trace:
  format: planner_trace/3
  reads: [planner_trace/2, planner_trace/1]
  added_field: related_skills
  older_format_may_claim_related_skills: false
  related_skills_by_gate_answer:
    blocked: hard_blockers_or_else_the_uncertain_prerequisites_it_waits_on
    conditional_eligible: uncertain_skills
    eligible_with_support: soft_gap_skills
    eligible: review_due_skills
    never_answered: none
  gate_re_run_to_explain: false

plan_reading:
  plan_day_is_the_row_s_own: true
  trusted_only_when_trace_describes_rows: true
  checks: [trace_present, trace_decodes, same_study_day, same_positions_and_skills, no_position_twice, selected_task_has_its_need_decision]
  unreadable_is_guessed_around: false
  row_points_at_stored_planned_task: true
  minutes_shown: planned_minutes
  capacity_source: the_planner_s_trace
  too_small_is_the_planner_s_finding: true
  unreadable_today_state: error_recoverable
  kept_work_startable: false

today_row_families:
  source: THUX-v0 §7.1
  families_unchanged: true
  primary_from: need_trigger
  primary_by_trigger:
    remediation_required: repair_confirmed_weakness
    verification_due: verify_uncertain_state
    weakness_detected: verify_uncertain_state
    retention_review_due: review_due_knowledge
    diagnostic_opportunity: collect_missing_evidence
    new_learning: continue_current_learning
    continue_learning: continue_current_learning
    reinforcement_opportunity: continue_current_learning
    integration_opportunity: continue_current_learning
    parallel_track_due: parallel_technical_english_on_the_english_track_else_continue_current_learning
  paused_safe_checkpoint_primary: resume_valid_paused_work
  supporting_from: [split_or_smaller_alternative_fit, english_track_context]
  at_most_supporting: 1
  english_primary_only_for_parallel_track_cadence: true
  attention_from_trace: [plan_changed, prerequisite_blocker]

explanation:
  surface: planner_explanation
  parts: [plan, today, not_today]
  statement_sources: [recorded_catalogue_code, trace_fact]
  statement_constructor_private: true
  trace_facts: [kept_from_earlier_version, no_task_for_need, not_taken_today, waiting, plan_replaced, day_over_budget_after_keeping]
  band_code_shown_as_reason: false
  shown_priority_codes: [priority.blocks_current_required_path, priority.blocks_next_ready_dependency, priority.continuation_value, priority.starvation_promoted, priority.decision_value, priority.track_balance_pressure]
  shown_eligibility_codes: [eligibility.conditional_uncertain, eligibility.soft_gap_support, eligibility.ready_due_allowed]
  shown_fit_codes: [capacity.split_to_fit, capacity.smaller_alternative_to_fit]
  deferred_for_time_called_lower_priority: false
  waiting_need_names_related_skills: true
  reconsideration: [next_plan, when_prerequisite_ready, when_a_task_is_available]
  date_promised: false
  states: [explained, no_plan_yet, plan_from_another_day, unreadable]

copy:
  owner_of_wording: 14
  lives_in: core-presentation
  every_catalogue_code_has_a_template: true
  forgetting_named_only_to_deny_it: true
  absence_as_failure_or_debt: false
  deferral_as_lower_importance: false
  date_promised: false
  score_percentage_or_streak: false

port_refinement:
  method: PersistencePort.latestPlan
  change: StoredPlan now carries the plan's own planned_task rows (id, position, Skill) in position order
  new_port: false
  port_count: 4

living_gates_narrowed:
  - check: E11A-07_blocked_filtered
    why: the blocked filter became one named rule that also keeps kept work from being offered
    guarantee_weakened: false
  - check: E11A-11_no_invented_plan
    why: Today now reads the plan; the gate checks it comes only from the stored plan through PlanReading
    guarantee_weakened: false
  - check: E11A-11_no_invented_capacity
    why: capacity now comes only from the planner's record of today's plan
    guarantee_weakened: false
  - check: E12C-07_unknown_format_refused
    why: the decoder refuses any version outside a closed set of three known formats
    guarantee_weakened: false
  - check: E12D-08_format_v2
    why: the written format moved to /3; /2 and /1 still read
    guarantee_weakened: false
  - check: E12D-08_only_known_versions
    why: same closed set of known formats
    guarantee_weakened: false


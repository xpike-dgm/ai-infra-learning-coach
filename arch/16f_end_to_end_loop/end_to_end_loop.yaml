assistant_defaults:
  - the attempt names its planned task in a new nullable column (schema v11, attempt.planned_task_id); TRUX-v0 §6.5 hands off planned_task_ref and 11B left the column to the step that runs a planned task
  - a started task is one with an attempt in today's plan version, or one an earlier version of today kept because it was started then; Today does not offer it again, and every replan (after evidence, after a capacity change) keeps it
  - the required local capability means the app can run the activity now — an assess task needs the assessment session (16G); a task needs at least one item the app can judge by its answer key (code reports and rubric evaluation are 16G) that the learner has not seen
  - items are offered with the CHECKPOINT intent (low-stakes checks of the task's own Objectives) and served unseen, in the task's authored order; the run never repeats a question and ends when none is left
  - provenance is asked once, at orientation, with nothing preselected, and recorded on every answer of the run (TRUX-v0 §9)
  - the lesson is the course's own explanation (CANONICAL) of the task's target Objectives; seeing it again during a question is H2 concept help, recorded with the answer
  - seeing the answer before answering is H4 after the consequence is said (TRUX-v0 §8.3); the question becomes learning, no attempt and no evidence exist, and the solution exposure is recorded
  - seeing the answer after answering is recorded as H4 after_submit and a solution exposure; the frozen answer's evidence stays as it was written (TRUX-v0 §6.4) — the item and its family are never again a fresh check
  - the end-of-run processing runs once, when the learner finishes, when no question is left, or when they leave; with nothing answered nothing is recomputed or replanned
  - the reminder's 16E rule "an attempt recorded today" became "every task in today's plan started" (the open loop 16E named); its silences are unchanged
  - the entry's open needs come from BuildDailyPlan.openNeeds, the very composition build reads; build keeps its own lines because earlier gates read its body, and a test holds both to the same keys
  - working Turkish microcopy; 17 owns the polish


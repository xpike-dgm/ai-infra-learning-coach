question: Bugünün planındaki bir görevi başlatıp sonuna kadar yapabilir miyim — girişi gerçekten doğrulanmış, dersi gösterilmiş, soruları sunulmuş, cevapları dersin anahtarıyla değerlendirilmiş, kanıtı yazılmış ve planı yalnız durum değiştiyse, başladığım işi koruyarak yenilenmiş biçimde?

primary_invariant: >-
  A planned task runs only when every entry condition is confirmed from the store, the gate, the open needs and the
  authored task — nothing is assumed, and what cannot be confirmed is named, never blamed. The runner stays an execution
  surface: it shows the course's own lesson, serves the task's unseen questions in their authored order, records each
  frozen answer with its help, its provenance and the planned task it was made for as one learner action, has it judged
  by the course's answer key and hands it to the evidence pipeline — it never decides what the answer proves about the
  learner. The answer's result is right, partly, not right or not measured; seeing the answer is a separate step the
  learner chooses. At the end the touched Skills are recomputed, the report says only what canonical state did, and only
  a change asks the planner for a new plan, which keeps every task the learner started. The next task is always the
  planner's current selection.


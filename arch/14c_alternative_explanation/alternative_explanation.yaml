decision: D-107
implements: [LEARNING_BEHAVIOR_RULES, WLRM-v0, TUTX-v0, AIAX-v0]
builds_on: [TUTX-v0, WAAX-v0]
boundaries: MSBX-v0
purpose: how_a_concept_is_explained_again_and_what_that_explanation_rests_on

scope:
  closed_form_vocabulary: true
  written_explanations_read: true
  learner_chooses_form: true
  written_first: true
  ai_grounded_in_canonical: true
  instructions_version_raised: true
  schema_changed: false
  state_family_added: false
  weakness_rule_changed: false
  mastery_rule_changed: false
  planner_rule_changed: false
  form_chosen_automatically: false
  explanations_authored: false
  learner_state_sent: false
  app_calls_menu: false

question: Anlatım tutmadığında başka nasıl anlatılır — ve bu anlatım neye dayanır?

primary_invariant: >-
  When an explanation does not land, the method changes — the scope and the truth do not. The learner chooses the
  form; a verified, written explanation is shown first; only where none exists does the tutor write one — grounded in
  the course's own explanation, told never to contradict it, labelled as unverified, and never the last word: the
  course's explanation is always one action away. A form that would need the learner's own state is never written by
  the AI.

user_decisions:
  date: "2026-10-01"
  form_choice: learner_chooses_from_menu
  source_order: written_first_otherwise_ai

forms:
  - {id: plain_reteach, source: "LEARNING_BEHAVIOR_RULES §9 daha sade anlatım", strategy: strategy.targeted_reteach, ai_allowed: true, offered: true}
  - {id: different_example, source: "LEARNING_BEHAVIOR_RULES §9 farklı örnek/analogy", strategy: null, ai_allowed: true, offered: true}
  - {id: worked_example, source: "LEARNING_BEHAVIOR_RULES §9 worked example", strategy: strategy.worked_example, ai_allowed: true, offered: true}
  - {id: state_trace, source: WLRM-v0 remediation strategy, strategy: strategy.state_trace_reconstruction, ai_allowed: true, offered: true}
  - {id: prerequisite_refresh, source: "LEARNING_BEHAVIOR_RULES §9 prerequisite'e kısa geri dönüş", strategy: strategy.prerequisite_refresh, ai_allowed: true, offered: true}
  - {id: misconception_contrast, source: WLRM-v0 remediation strategy, strategy: strategy.misconception_contrast, ai_allowed: false, offered: true}
  - {id: canonical, source: "LEARNING_BEHAVIOR_RULES §12 verified core", strategy: null, ai_allowed: false, offered: false}

written_explanations:
  id_pattern: explanation.<namespace>.<slug>
  pinned_to: one_objective_version
  fields: [logical_id, version, objective, form, level, misconception, text]
  level_declared_by_author: true
  canonical_has_no_level: true
  contrast_names_one_catalog_misconception: true
  package_section: explanation
  line_break_encoding: backslash_n
  unknown_key_refused: true
  unknown_level_refused: true
  read_by: ContentPort.explanationsFor
  published_into_store: false

menu:
  order: vocabulary_order
  ranked: false
  written_source_when: a_written_variant_exists
  ai_source_when: no_written_variant_and_ai_allowed
  contrast_offered_when: written_contrast_for_an_open_label
  open_label_states: [hypothesis, supported, confirmed]
  contrast_worded_as: common_mix_up_never_the_learners_mistake
  seen_marked: true
  seen_stored: false

showing:
  written_choice: least_revealing_that_fits_the_ceiling
  written_calls_tutor: false
  ai_only_if: [no_fitting_written, form_ai_allowed, request_names_that_form]
  canonical_attached_when_written: true
  nothing_to_show_is_said: true
  written_solution_is_exposure: true
  tutx_rules_unchanged: [ceiling, disclosure_h3_h4, nothing_recorded_outside_an_attempt]

instructions:
  version: tutor_instructions/2
  reply_schema: tutor_reply/1
  added_rules: [14_canonical_grounding, 15_forms]
  canonical_section_neutralised: true
  form_line_only_for_ai_allowed_forms: true
  messages_without_form_or_canonical_unchanged: true

presentation:
  ai_label: "AI tarafından üretildi: dersin doğrulanmış içeriği değildir"
  way_back_always_offered: true
  numbers_or_scores: false

tutx_validator_narrowed:
  file: tools/validate_tutor_contract.py
  checks: [E14A-05_context_fields, E14A-05_leaked_fields, E14A-05_message_sections, E14A-06_version]
  why: the sixth context field (canonicalExplanation), the sixth section (canonical), the instructions version, and field names read word by word


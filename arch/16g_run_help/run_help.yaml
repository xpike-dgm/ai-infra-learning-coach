assistant_defaults:
  - the shipped suites travel as assets byte for byte as authored (tools/ship_code_suites.py, 480 files named <item logical id>-v<N>.json) with the 14D runner as code_test_runner.py; --check holds the shipped set equal to the sources
  - a suite text is served only when it names exactly the item version and the suite version the package declares, in the code_test_suite/1 format; a code item without its shipped suite is not served at all
  - an item is servable when the app can judge it — an answer key (14F), the course's tests with a shipped suite (14D), or a rubric whose task allows a provisional result (14F) — and still only when 11D's usable says so
  - the pasted report is read and not stored; the code is the attempt's artifact and the evidence names the suite version (14D expected the report could become an artifact; 16G keeps only what proves something)
  - an open answer freezes first, then the evaluator is asked; no answer leaves it evaluation_pending with no evidence, and asking again judges the same attempt with the independence recorded with it
  - help runs on the store thread: what the tutor showed and what the evaluator said are written in the same job, and the store has one writer
  - the asks offered while the answer is open are a hint, the concept another way and a question; once it froze, explain my answer, the concept another way and a question; a gloss is not offered, because which segment is the learning target is task metadata no task declares (TEIP-v0 §4) and guessing it is forbidden
  - the instruction mode is turkish_primary: every shipped task is Turkish-primary and none declares another; the tutor never picks a language
  - after the answer froze, the timing is after_failure when it did not fully match and after_submit otherwise; no level is asked, so the record never claims less help than may have been given (14A)
  - help shown while the answer is open travels with the attempt; help shown after it froze is appended as an assistance_event on that attempt, in the same shape SubmitAttempt writes, and changes nothing the frozen answer proved
  - the comprehension check is offered after a code answer the learner did not write alone; a written check answered alone is independent, except in a teaching task, which is practice by design (AssistanceInterpretation)
  - the wrong-answer summary appears after a not-right or partly-right answer that wrote evidence, read from the stored attribution (AnalyzeWrongAnswer); it writes nothing
  - a pause is offered between questions only; the boundary confirms the four safe-checkpoint conditions unless a help reply is still on its way or an evaluation is pending; a measuring purpose pauses as high_stakes_pause; the checkpoint names the shown and remaining items and the run ends the way every run ends
  - resuming is the planner's (TRUX-v0 §7.3, 12D): a checkpoint makes an open continue_learning need paused work at the next plan; Today offers no checkpoint (11C)
  - working Turkish microcopy; 17 owns the polish


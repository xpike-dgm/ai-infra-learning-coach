primary_invariant: >-
  Inside a run, every judgement stays the course's and every rule stays an earlier step's. A code answer is judged only
  by the course's own tests, which the learner runs on their computer from the suite and the runner the app gives them
  to copy; a report that cannot be read, is for another item or suite, or reports an environment error measures nothing
  and nothing is written. An open answer freezes first and is judged by its rubric, criterion by criterion and
  provisional at most; with no evaluator it waits, is never wrong, and is judged again only when the learner asks. Help
  is always one action away; nothing is sent until the rules say the ask is ready, help shown while the answer is open
  goes with the attempt, help shown after it froze is recorded on that attempt, and help never shown is recorded
  nowhere. A wrong answer is read from the attribution the engines already made. Code the learner did not write alone is
  followed by the comprehension check. A pause is saved only at a boundary the pause policy confirms, as one checkpoint,
  and a high-stakes pause is marked.


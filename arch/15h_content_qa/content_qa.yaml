model: CQAX-v0
stage_step: 15H
status: accepted_15h
decision: D-121
implements: [PRG-v0, KGC-v0, GRE-v0, AIV-v0, QAB-v0, CDEX-v0, LFPS-v0]
builds_on: [CPFX-v0, PYFX-v0, CFNX-v0, MMFX-v0, LGSX-v0, EAAX-v0, ACNX-v0, PRQX-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: stage_15_content_says_only_what_its_graph_checks_and_labels_stand_behind

question: Aşama 15'in yayımladığı içerik, her adımın tek başına göremediği yerlerde de söylediğini taşıyor mu — ve taşımıyorsa, yayımlanmış hiçbir şeyin üzerine yazmadan nasıl düzeltilir?

primary_invariant: >-
  Content says only what its graph, its checks and its labels can stand behind. The graph names what every lesson needs;
  a code item's suite can tell the work from a program that only prints the answer unless printing it is the work; every
  construct an item uses is taught by a lesson it may rely on; a difficulty label is the level its review says. A
  correction is the next version — the version it replaces is retired by an appended record, never edited — and ships
  only after an independent reviewer passed it.

user_decisions:
  approval: explicit_user_approval_2026-10-10
  graph: add_content_edges_hard_only_where_lesson_and_every_item_else_soft
  requires_transfer: close_no_gate_on_standard_refuse_critical_until_stored
  flawed_items: publish_next_version_retire_old_by_appended_record
  pool: technical_to_15_english_keeps_small_pool
  authorship: assistant_writes_independent_agents_review

assistant_defaults:
  - edge rules lesson_and_every_item -> hard, lesson -> soft, reads_glossed -> soft
  - lessons read code line by line (checks and texts) against what the teach task reaches after 15H
  - fixed-output exemptions per item, never per Objective
  - a label goes to the level its review says, not one step down

declared_extensions:
  - {what: "earlier_supplements; revision of a published item as its next version, same logical id and variant family; an appended retired validation record", extends: "D-120 supplements, LFPS-v0"}
  - {what: "[prerequisite_edge] between published Skills in a supplement; teach_requires on a task's next version", extends: "D-113 incremental packages, PRG-v0 §6"}
  - {what: "source_checks on code items (Python not_in_source, required, variables, updated, bound_from; C required, not_in_source, unused variables)", extends: "CDEX-v0 suites"}
  - {what: "CurriculumStore refuses an edge version or a validation record carried a second time", extends: "LDBX-v0 never overwrite"}


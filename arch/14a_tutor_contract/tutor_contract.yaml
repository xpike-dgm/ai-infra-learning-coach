model: TUTX-v0
stage_step: 14A
status: accepted_14a
decision: D-105
implements: [AIAX-v0, 2D, TRUX-v0, ASUX-v0, TEIP-v0, VDWX-v0]
persistence: [LFPS-v0, DDM-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: how_the_tutor_behaves_what_it_may_reveal_what_leaves_the_device_and_what_its_help_means_for_evidence

scope:
  intents_closed: true
  level_ceiling_enforced: true
  disclosure_before_h3_h4: true
  message_built_in_core: true
  reply_schema_constrained: true
  nothing_unshown_recorded: true
  independence_derived_from_recorded_help: true
  solution_exposure_recorded_and_read: true
  null_tutor_ships: true
  port_added: true
  schema_changed: false
  network_call: false
  mastery_rule_changed: false
  retention_rule_changed: false
  planner_rule_changed: false
  weakness_rule_changed: false
  app_calls_tutor: false

question: When, with what and how much does the tutor help — and what does the help it shows change?

primary_invariant: >-
  The tutor teaches on request and never decides. It answers only what was asked, never reveals more than the
  learner chose, never claims what the learner can do, and every piece of help it actually shows is recorded for
  what it is. Help it did not show is recorded nowhere, and nothing it says is evidence.

user_decisions:
  date: "2026-10-01"
  tutor_port: separate_port_declared_extension
  free_questions: allowed_learner_chooses_level_while_answer_open
  level_asked_outside_attempt: false
  first_live_call: 14G

intents:
  - {id: hint, fits: answer_open, level: learner_choice, scope: target_objective}
  - {id: explain_differently, fits: any_time, level: learner_choice_while_answer_open, scope: target_objective}
  - {id: question, fits: any_time, level: learner_choice_while_answer_open, scope: target_objective}
  - {id: explain_mistake, fits: answer_frozen, level: not_asked_recorded_h4, scope: target_objective}
  - {id: gloss, fits: any_time_non_target_segment_only, level: recorded_h1, scope: non_target_support}

preparation:
  outcomes: [ready, level_needed, disclosure_needed, redirect, incomplete]
  refusal_outcome_exists: false
  redirects:
    hint_outside_attempt: explain_differently
    hint_after_answer_frozen: explain_mistake
    explain_mistake_before_answer: hint
    explain_mistake_outside_attempt: explain_differently
    gloss_of_target_segment: hint_or_explain_differently
  one_redirect_reaches_help: true
  incomplete: [question_text, frozen_answer, segment]

recording:
  no_attempt: nothing
  gloss: {level: H1, scope: non_target_support}
  answer_open: learner_ceiling
  answer_frozen: H4
  tutor_declaration_lowers_record: false
  tutor_declaration_used_to_refuse: true
  disclosure_wording_depends_on_timing: true
  request_constructor: internal

privacy:
  built_in_core: true
  fields: [target_objectives, task_text, learner_work, segment, learner_question, instruction_mode, ceiling]
  never_sent: [evidence_history, mastery_state, plan, profile, exposure_records, provenance, planner_traces, other_attempts]
  reference_solution_travels_only: [answer_frozen, h4_chosen, outside_attempt]
  material_neutralised: own_tags_only
  with_ai_absent_nothing_leaves_device: true

reply:
  schema_id: tutor_reply/1
  fields: [intent, text, revealed_level, instruction_mode]
  additional_properties: false
  shown_only_if: [same_intent, non_blank_text, same_instruction_mode, revealed_level_within_ceiling]
  text_parsed_for_verdict: false
  unshowable_reply: invalid_response

non_answers:
  reasons: [refused, timed_out, transport_error, invalid_response, unavailable]
  recorded: false
  blamed_on_learner: false
  silent_retry: false
  fallback: authored_help_same_intent_within_ceiling_recorded_at_its_own_level
  fabricated_reply: false

independence:
  rules:
    - {when: h3_or_h4_with_target_before_answer_froze, class: requires_independent_recheck}
    - {when: provenance_generated_or_copied, class: practice_only}
    - {when: teach_task, class: practice_only}
    - {when: h1_or_h2_with_target_before_answer_froze, class: assisted}
    - {when: provenance_user_authored_with_assistance_or_mixed, class: assisted}
    - {when: otherwise, class: independent}
  after_answer_froze_reaches_back: false
  non_target_support_counts: false
  unknown_provenance_accuses: false

measuring:
  purposes: [assess, retain, diagnose]
  help_blocked: false
  shown_solution_on_open_item_converts_to_learning: true
  frozen_answer_converted_after_the_fact: false
  diagnostic_target_help_ends_fast_path: true

exposure:
  shown_solution_is_exposure_from_that_moment: true
  kind: solution_exposure
  keyed_by: [resource, variant_family]
  read_on_later_evidence_by: attempt_sequence
  seen_item_is_shown_solution: false
  tutor_text_stored: false

instructions:
  version: tutor_instructions/1
  language: english_addressed_to_model
  reply_language: task_instruction_mode
  guidance_fading_owner: planner_and_task_instruction_mode
  tutor_withholds_to_fade: false

presentation:
  states: [level_needed, disclosure_needed, redirected, incomplete, waiting, shown, not_shown]
  fault_tone_state: null
  pending_state: waiting
  ai_label_says_not_a_judgement: true

port_count: 5
port_extension: {port: TutorPort, provides: help_on_request, implemented_by: ai-adapter_or_null_tutor, decision: D-105}
port_refinements: []
msbx_contract_edited: false


  instructions: {file: android/core-model/src/test/kotlin/coach/model/TutorInstructionsTest.kt}
  interpretation: {file: android/core-model/src/test/kotlin/coach/model/AssistanceInterpretationTest.kt}
  application: {file: android/core-application/src/test/kotlin/coach/application/AskTutorTest.kt}

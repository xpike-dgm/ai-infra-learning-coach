validator_mutation:
  total: 20
  detected: 20
  mutants: [entry_source_order, mid_segment_storable, context_elapsed_field, decode_lenient_keys, pause_two_rows,
            consumed_flag, any_condition_durable, mid_segment_shown_saved, gap_threshold_invented,
            checkpoint_confirms_content, session_score_field, blocked_entry_starts, ended_rewritten, fifth_port,
            read_truth_writes, saved_copy_elsewhere, today_offers_checkpoint, device_claimed, t2_count_inflated,
            session_reason_tone]
  missed_at_first:
    - id: today_offers_checkpoint
      why: >-
        the check read the brace body after the Today call, but a call has arguments, not a body, so it
        looked at an empty string and passed; it now reads the parenthesis-balanced arguments of
        todayInput and fails if a resumable reaches it
  negative_control: forbidden words named only in a comment must not fail the validator
  negative_control_result: no_false_positive


not_verified:
  - any pause, checkpoint or resume in the real app; no activity can reach active work yet, so none can pause
  - the checkpoint_paused and resume_invalidated texts rendered on a device
  - a working session started in the real app; nothing is startable, so none starts

forbidden_session_patterns:
  - mid_segment_pause_written_or_shown_as_saved
  - checkpoint_storing_elapsed_time_score_or_count
  - checkpoint_decoded_by_best_guess
  - checkpoint_updated_or_flagged_consumed
  - resume_confirmed_on_assumption
  - high_stakes_gap_threshold_invented
  - invalidated_resume_as_failure_or_erasure
  - checkpoint_offered_on_today_bypassing_planner
  - session_scored_graded_or_timed
  - session_persisted_as_invented_entity
  - ended_session_rewritten_or_extended
  - capacity_verdict_derived_from_session

future_stage_boundaries:
  11D: artifact body storage, segment boundaries and checkpoint_ids, the first runnable activity
  12: resume_context_ref and the continue_learning need, the facts that confirm content, prerequisites and need, capacity verdict, plan_exhausted
  13: high-stakes gap policy for assessment continuation
  16B: durable learning and session history
  18D: calibration of any gap policy
  T6: device run

acceptance:
  - SESX-v0 is the accepted session state
  - vocabularies equal TRUX-v0 in its order
  - a checkpoint stores the ResumeContext plus its durable kind and nothing about time or result
  - the stored form is versioned and decoded strictly; undecodable is distinct from missing
  - one pause is one transaction and one append-only row; no attempt, evidence or projection
  - only a durable pause is written and shown as saved; a mid-segment pause has no stored form
  - a resume confirms only what the stored checkpoint proves; no gap threshold is invented
  - no checkpoint is offered on Today; re-entry is the planner's continue_learning need
  - the working session is emergent, unscored and not stored; it ends once with a TRUX-v0 reason
  - readTruth is a recorded port refinement; the port count stays four; the schema is unchanged
  - 20/20 mutations caught
  - nothing is claimed that was not run; T6 was not run
  - independent 11C QA passes and Stage 6-11B regressions pass

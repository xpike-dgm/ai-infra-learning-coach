model: SESX-v0
stage_step: 11C
status: accepted_11c
decision: D-089
daily_working_flow: TRUX-v0
task_runner: RNRX-v0
recovery: SRR-v0
task_taxonomy: TASK_TAXONOMY_SPEC
persistence: LFPS-v0
data_model: DDM-v0
local_database: LDBX-v0
boundaries: MSBX-v0
purpose: what_a_pause_saves_what_a_resume_can_confirm_and_the_emergent_session

scope:
  session_state_only: true
  evidence_written: false
  planner_implemented: false
  content_implemented: false
  artifact_storage_implemented: false
  working_session_persisted: false
  resume_offered_on_today: false
  surface_semantics_changed: false
  boundaries_changed: false
  ports_added: false
  schema_changed: false
  migration_added: false
  gap_threshold_claim: null
  session_length_claim: null

session_question: When the learner stops, what is really kept, what can a later resume truthfully confirm, and what was the session?

primary_invariant: >-
  A pause saves where the work is, never how long it took or how well it went. Only a durable pause
  is written and only a written pause may be shown as saved; a resume confirms only what the stored
  checkpoint can prove; and a session is history, never a score.

found_before_11c:
  - id: resume_context_has_no_persisted_mark_for_high_stakes
    was: >-
      TRUX-v0 requires a high-stakes pause to be marked, but its ResumeContext field list does not
      carry the pause class; a mark that is not stored cannot be honoured on resume
    resolved_here: the stored context carries the durable pause kind; it is the mark TRUX-v0 requires, not a new field of meaning
  - id: no_truth_read_path
    was: >-
      PersistencePort could append truth and read projections but could not read a truth row back,
      so a resume had no way to read the checkpoint it resumes from
    resolved_here: readTruth(kind, id) as a recorded port refinement; the port count stays four
  - id: broken_turkish_words_on_main
    was: >-
      11A's sync (commit 1cbe4aa) left "çal" + doubled dotless i + "ştırılmadı" in AGENTS.md,
      MASTER_PLAN.md, START_HERE.md and STEP_STATUS.md, and "doğrulanmamı oturum" (a dropped ş) in
      STEP_STATUS.md; 11B's U+0307 guard could not see either, because neither contains the character
    fixed_here: both words restored
    guarded_by: the 11C validator fails if either exact broken form reappears in a living document
  - id: worktree_build_environment
    was: the worktree had no android/local.properties (gitignored), so assembleDebug could not find the SDK
    resolved_here: a local, ignored file; not a repository change

vocabularies:
  safe_checkpoint_conditions:
    source: TRUX-v0 checkpoint_model.safe_checkpoint_conditions
    order_is_source_order: true
  durable_pause_kinds:
    source: TRUX-v0 checkpoint_model.pause_classes where durable
    value: [checkpoint_pause, high_stakes_pause]
    mid_segment_pause_storable: false
  resume_context_fields:
    source: TRUX-v0 checkpoint_model.resume_context_fields
    stored_in: resume_checkpoint.context
    plus: [kind]
    plus_rationale: the high-stakes mark TRUX-v0 requires
  entry_sources:
    source: TRUX-v0 session_model.entry_sources
    order_is_source_order: true
  ended_reasons:
    source: TRUX-v0 session_model.ended_reasons
    order_is_source_order: true

checkpoint:
  stored_form:
    format: resume_context/1
    encoding: one key=value per line, fixed key order
    values: identity tokens only; a value that would need escaping is refused at construction
    decode: strict; missing, unknown, repeated or reordered keys and wrong versions decode to nothing
  stored_fields: [kind, learning_need_key, source_task_id, checkpoint_id, completed_segments, remaining_segments, artifact_state_ref]
  not_stored: [elapsed_time, attempt_count, score, progress_fraction, streak, remaining_minutes]
  completed_segments_nonempty: true
  remaining_segments_nonempty: true
  segment_both_completed_and_remaining: false
  checkpoint_id_is_content_identity_not_row_id: true
  one_pause_one_transaction_one_row: true
  pause_writes_attempt: false
  pause_writes_evidence: false
  pause_writes_projection: false
  append_only: true
  later_pause_appends_beside_earlier: true
  consumed_or_latest_flag_stored: false
  which_checkpoint_a_resume_uses: planner resume_context_ref (12)
  undecodable_distinct_from_missing: true

pause:
  high_stakes_work_pauses_durable_and_marked: true
  ordinary_pause_durable_only_when_all_four_confirmed: true
  unconfirmed_condition_named: unmet
  mid_segment_pause_written: false
  mid_segment_pause_changes_runner_state: false
  only_durable_pause_becomes_checkpoint_paused: true
  ordinary_pause_durable_today: false
  why_not_today: segment meaning and artifact persistability are content and artifact facts (11D)

resume:
  confirmable_from_checkpoint:
    runner_and_artifact_state_intact: context decodes exactly and references no artifact state
    high_stakes_gap_integrity_acceptable: ordinary checkpoint_pause only; TRUX-v0 scopes the condition to high-stakes work
  never_confirmed_from_checkpoint: [content_version_compatible, prerequisites_still_eligible, learning_need_still_open]
  referenced_artifact_state_assumed_intact: false
  high_stakes_gap_confirmed_without_accepted_policy: false
  gap_policy_owner: 13
  gap_policy_calibration: 18D
  resumable_today: false
  invalidated_resume_is_failure: false
  invalidated_resume_erases_checkpoint: false
  today_offers_checkpoint_directly: false
  reentry_owner: planner continue_learning need (12)

working_session:
  emergent_not_container: true
  persisted: false
  why_not_persisted: DDM-v0 names no working-session entity and 10D forbade inventing one; its effects are already truth
  durable_history_owner: 16B
  starts_on: the first run that actually starts
  blocked_entry_starts_session: false
  session_starts_today: false
  survives_process_death: false
  resume_after_process_death_starts_new_session_from: resume_entry
  ended_reason_by_event:
    learner_exited: user_stopped
    selection_recomputed_empty_capacity_verdict_reached: capacity_reached
    selection_recomputed_empty_otherwise: plan_exhausted
    selection_recomputed_non_empty: continues
    flow_left_without_exit: interrupted
    store_needs_recovery: recovery_required
  capacity_verdict_derived_here: false
  ends_once: true
  ended_session_grows: false
  fields: [session_id, started_at, entry_source, task_runs, remaining_capacity_context_ref, ended_reason]
  forbidden_fields: [score, grade, percentage, duration, elapsed, required_count, streak, success]
  task_run_holds: [source_task_id, last_state]
  ended_reason_has_tone_or_verdict: false
  producers_in_app_today: [user_stopped]
  no_producer_yet:
    plan_exhausted: 12
    capacity_reached: 12
    interrupted: the in-memory session is discarded with the process
    recovery_required: the shell and the session with it are replaced by the recovery surface

port_refinement:
  name: readTruth
  signature: readTruth(kind, id) -> TruthRecord?
  reason: a resume reads the checkpoint it resumes from
  mutation_path_added: false
  time_less_rows_readable_alone: false
  port_count: 4

wiring:
  session_started_from_today_start_action: true
  session_ended_on_exit: user_stopped
  resume_entry_point_in_app: false
  resume_entry_point_owner: 12
  runner_screen_new_states: [checkpoint_paused, resume_invalidated]


  owner_supplied_needs_allowed: [parallel_track_due, integration_opportunity]
  one_skill_once: true
  priority_from: PBR-v0
  holding_back_from: planner_trace/3 blocked candidates' related Skills
  gate_rerun_for_pool: false
  recent_since: previous blueprint study day
  exclusions: [remediation_open, not_taught_yet, not_active_since_last_cycle, measured_in_another_role, not_a_weekly_measurement]
  remediation_skill_measured: false
  new_learning_measured: false

item_selection:

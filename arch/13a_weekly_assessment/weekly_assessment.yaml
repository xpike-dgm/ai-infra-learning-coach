  indexed_facets_before_bound: [targets_skill, weekly_scope, selectable_lifecycle, role_declared]
  max_items_per_slot: 5
  bound_kind: engineering
  bound_owner: 18E
  order: [trusted_first, deterministic_first, stable_id]
  shortest_first: false
  refusals: [role_not_declared, not_usable_for_intent, prerequisite_waits, solution_exposed, already_seen, variant_family_in_use, dependency_group_in_use, expected_minutes_missing]
  trust_from: store_validation_record
  gate_fails_closed: true
  independence_mode: h0_required
  required_for_closure_bands: [P0, P1]
  no_valid_item_is_coverage: false

planning:
  slot_need_is_existing_need: true
  own_queue: false
  own_band: false
  own_minutes: false
  activity: assessment_session
  atomic_evidence_boundary: true
  served_slot_offered_again: false
  daily_budget_extended: false

session:

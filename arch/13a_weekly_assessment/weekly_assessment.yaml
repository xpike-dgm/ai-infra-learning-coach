weekly_question: What is worth measuring this week, and how is it measured with a trusted fresh item, inside the day's real time, without turning a missed week into debt?

primary_invariant: >-
  A week is an identity, not a quota and not a deadline. What is worth measuring comes from state, one Skill
  is measured once, a slot without a trusted fresh item is not coverage, the week adds no minutes and no queue
  of its own, and a week that passed without its assessment leaves nothing behind.

cycle:
  definition: iso_8601_week_of_recorded_study_day
  format: "YYYY-Www"
  source_column: occurred_on_study_day
  week_start: monday
  product_default: true
  scientific_value: false
  setting_owner: 16D
  user_confirmation: confirmed_by_user
  composed_once_per_cycle: true
  same_cycle_writes_nothing: true
  nothing_to_measure_writes_nothing: true
  earlier_cycle_offered: false
  stacking_possible: false

roles:
  source: WBA-v0 §7
  order: [recent_required_progress, weakness_or_verification, critical_prerequisite_confidence, retention_due, integration_or_transfer, parallel_english]
  selection_order: [weakness_or_verification, critical_prerequisite_confidence, recent_required_progress, retention_due, integration_or_transfer, parallel_english]
  quota: false
  intent:
    recent_required_progress: mastery_evidence
    weakness_or_verification: verification
    critical_prerequisite_confidence: verification
    retention_due: verification
    integration_or_transfer: integration_check
    parallel_english: mastery_evidence
  purpose:
    recent_required_progress: assess
    weakness_or_verification: assess
    critical_prerequisite_confidence: assess
    retention_due: retain
    integration_or_transfer: assess
    parallel_english: assess

pool:

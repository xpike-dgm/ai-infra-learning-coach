question: Bir kodun doğru olduğunu ne kanıtlar — ve kim söyleyebilir?

primary_invariant: >-
  Code is judged by running it, or it is only an opinion. A code task is verified only by the course's own tests,
  run on the learner's computer and read back strictly, and a test speaks only for the Objective it was written for.
  A test that did not run measured nothing, and nothing is held against the learner for it. Without tests, an AI may
  judge the code only where the task allows a provisional result, and never as more than provisional; a task that
  needs a verified result is never put to an AI. Passing tests show that the code does what was asked — not that the
  learner can explain why.

user_decisions:

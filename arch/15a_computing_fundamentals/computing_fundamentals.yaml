open_loops:
  multi_package_shipping: {owner: 15B, note: "one asset, and the store requires every entity of a package to carry the package's version; 15B decides how a second package ships"}
  requires_transfer_not_stored: {owner: 15H, note: "6C declares requires_transfer on every Objective, the store's Objective row has no such column, so GRE-v0's transfer gate is never applied; content already carries transfer items"}
  iteration_comparison_prerequisite: {owner: 15H, note: "while conditions need expression_boolean_reasoning; 6C makes it neither hard nor soft for iteration_reasoning; 15A declares it at task and item level"}
  runner_presents_tasks: {owner: 16D, note: "a task names the explanations and items it presents; the runner choosing unseen items from that pool and showing them is the app's"}
  estimate_calibration: {owner: 18B, note: "task and item minutes are authoring estimates"}
  t6_and_device_ingestion: {owner: 19, note: "T6 and the first SQLite ingestion of the shipped package happen on the device"}

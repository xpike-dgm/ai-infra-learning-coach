question: Sıfırdan başlayan bir öğrenci için ilk gerçek içerik nasıl yazılır — ve yapay zekâ tarafından yazılmış bir sorunun doğru olduğuna neye dayanarak güvenilir?

primary_invariant: >-
  Content is only as trustworthy as what checked it. Every answer key is checked against what really happens — the
  code is run, every option of a choice is run, a lesson's own example outputs are run — or, where nothing can be run,
  against a cited authoritative source; and every item, run or cited, needs an independent reviewer's pass before it is
  validated. Nothing AI-written is ever trusted by itself, nothing a lesson has not taught is read in an item, and a
  task serves only a need the planner already opened, about its own Skill, for a purpose that may serve it.


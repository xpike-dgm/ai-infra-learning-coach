question: İlk açılışta öğrenci kendi süresini ve bildiğini düşündüğü alanları, hiçbir şeyi kanıt saymadan ve zorunlu kılmadan söyleyebiliyor mu; ve bir koşunun sonu, geçmişin ve gün özetinin söylediği değişikliği söylüyor mu?

primary_invariant: >-
  The first-run setup is shown once, before Today and before any plan, on a store no one has used; it records the
  learner's normal day as a 16D preference and, only for the areas the learner ticks, one diagnostic whose source is the
  entry placement — "I know this" names the scope and is never evidence, nothing is waived by it, and nothing is
  mandatory; skipping records only that the setup was done. Today is planned after it, by the planner, from what it
  recorded. A run's end report reads a state no engine had written the way the learning history reads it, so the report,
  the history and the day summary say the same change on a single-answer run (the report is the run's net change).


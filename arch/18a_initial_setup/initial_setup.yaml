schema_migration: {from: 12, to: 13, owner: 18A, tables: [setup_record], truth_altered: false, decision: D-139}

setup:
  surface: initial_setup_flow (UXIA-v0 §7.4; pre-shell; Surface.InitialSetupFlow in setupFlows)
  shown_when: a curriculum is published, no setup_record exists and no plan was ever made (a store used before 18A, or a restored backup with work in it, is not asked)
  safe_exit: 'the "Şimdilik atla" button, first on the screen; it records skipped and nothing else'
  asks:
    - the normal day's minutes (a 16D preference; the preset until changed)
    - the areas the learner already knows something of (optional, nothing pre-ticked)
  areas: the curriculum's own grouping (topic.<area>.<name>), in Learn's order, each with its number of Topics
  placement: one diagnostic over the ticked areas' Skills, each only if new learning may start on it; source curriculum_entry_placement
  plans: false — Today is planned after it
  refresh_on_start_waits: true

assistant_defaults:
  - the model id ISTX-v0
  - areas, not Topics, as the unit of "I know this" — the curriculum's own grouping, one row each
  - the setup asks only the normal day; the short and intensive lengths stay presets, changeable in Profile
  - a store with a plan is a used store and is not asked
  - the setup record is appended last, so an interrupted setup is simply offered again
  - the run report's Skill names are the Turkish display names (17A's rule)

found:
  - id: no_setup_in_code
    what: UXIA-v0 §7.4's initial_setup_flow and VDW-v0's curriculum_entry_placement existed only in specs; a fresh install went straight to a plan made with the presets
    resolution: InitialSetup, SetupPresentation, SetupScreen, Surface.InitialSetupFlow, schema v13 setup_record
  - id: plan_before_setup_risk
    what: the activity refreshed Today on every start, so a plan could be made while the learner was still in the setup, ignoring what they were about to choose
    resolution: Today is refreshed only once the setup is settled
  - id: report_named_skills_in_english
    what: once a first run reported its change (D-139), the run's end named the Skill by its authored English name ("State Assignment Model"), against 17A's rule; seen on the emulator
    resolution: the report names Skills through CurriculumNames.skill, like every other surface
  - id: review_interrupted_setup_left_a_diagnostic
    what: the independent review found that a setup interrupted after its diagnostic was written but before its row (the coverage rebuild over many Skills is the slow part) is offered again, and a skip then left the earlier placement diagnostic open — holding every lesson of the ticked areas against "skipping records only that it was done"
    resolution: finish() first withdraws a leftover curriculum_entry_placement diagnostic when no setup row exists; a course test writes the diagnostic, skips, and finds it withdrawn and nothing held
  - id: review_copy_promised_today
    what: the independent review found that the copy promised short checks in today's plan, but a check joins the plan only when its Skill may start — on a fresh store 56 of 60 Skills wait, so ticking C, Git or the shell puts nothing in today's plan
    resolution: the copy says the checks join the plan as each Skill becomes startable and that those lessons are not skipped until then; a course test ticks C alone and finds no check today, and Linux and finds one
  - id: review_non_blocking_taken
    what: the review's suggestions — two taps in one frame ending the setup twice, the typed minutes and ticks lost on rotation or a theme change, what skipping does placed after the start button, no check that the placement source has only one call site
    resolution: the setup ends once; the inputs are saved state; the skip note sits under the skip button; the validator checks the single call site
  - id: audit_passed_with_one_screen
    what: a 100% run was cut short (the emulator under load; the setup never appeared and only Today was read) and the tool still printed PASS, because a run's result looked only at the screens it reached
    resolution: the tool fails a run that misses any expected screen (screens_missing) and waits out Android's own "System UI isn't responding"; the 100% run was made again with it (the 200% run, 17 screens, was made just before the guard and reached every screen)
  - id: block_comment_paired_with_a_file_pattern
    what: 16D's validator strips block comments with a pattern that took the restore picker's any-type string in MainActivity for a comment opener; a new block comment at the end of the file closed it, and the stripped text hid the restore confirmation (A16D-06)
    resolution: the new comment is a line comment and says why; the validator was not changed
  - id: audit_stopped_at_setup
    what: the accessibility audit clears the app's data, so it now meets the setup before the shell and waited for the shell forever
    resolution: the audit reads the setup as its own screen and leaves it by its safe exit

notes:
  - a first wrong answer on a fresh Skill now changes canonical state in the run's report (a weakness question), and a change replans today with new_evidence_recorded — 13E's own rule for a change, now reached on a first run too
  - the run's report is the net change from before the run to after it; the history speaks per row, so on a single-answer run they say the same change, while a run that moves a Skill and back may report less than the history lists
  - Surface.InitialSetupFlow registers the setup in the surface set the IA names; the activity draws it before the shell rather than through the shell's state
  - one open diagnostic at a time is 13F's rule: a later fast path on a Topic replaces the setup's diagnostic, and withdrawing it there withdraws all of it


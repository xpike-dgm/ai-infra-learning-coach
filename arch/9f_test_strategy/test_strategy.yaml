meta_rules:
  mutation_discipline_required: true
  mutation_rule: a_deliberate_violation_must_make_a_named_check_fail
  check_passing_against_broken_implementation_is_not_a_check: true
  values_recomputed_not_hand_asserted: [contrast, counts, orderings, hashes]
  fake_implements_guarantee_under_test: false
  fixed_clock_fake_allowed: true
  fixed_clock_rationale: the_clock_is_an_input_not_the_guarantee
  depends_on_wall_clock_locale_default_network_or_live_provider: false
  failing_check_disabled_to_unblock_release: false
  spec_validators_and_product_suite_are_separate_systems: true
  sweep_is_full_validate_glob: true

tooling_capabilities_required:
  - jvm_unit_test_runner_without_device
  - real_storage_engine_execution_path_with_real_schema_and_migrations
  - static_checker_failing_build_on_forbidden_dependency_or_platform_type_in_port
  - ui_harness_inspecting_semantics_target_size_and_text_scaling
  - instrumented_device_runner
  - build_configuration_producing_product_without_ai_adapter
  - recorded_ai_response_fixtures_covering_all_seven_outcomes
  - populated_database_fixtures_per_prior_schema_version
concrete_libraries_named: false
library_selection_owner: 10A
currency_reverification_required: true
currency_precedent: AMTS-v0_currency_is_verified_not_asserted

distribution_scope_effects:
  decision: D-080
  store_release_verification: out_of_scope
  device_matrix: single_target_device
  target_device_recorded_in_repo: false
  target_device_required_by: [10A, T6]

forbidden_test_patterns:
  - coverage_percentage_as_release_gate
  - invariant_with_no_owning_check
  - verifying_only_the_allowed_path_for_a_prohibition
  - append_only_check_that_never_attempts_update_or_delete
  - migrating_only_an_empty_database
  - fake_implementing_the_guarantee_under_test
  - calling_a_live_ai_provider_from_a_check
  - parsing_a_verdict_out_of_free_text_in_a_fixture
  - treating_a_refusal_fixture_as_a_wrong_answer
  - asserting_per_call_timeout_as_end_to_end_budget
  - reading_the_system_clock_inside_a_check
  - retrying_a_flaky_check_until_green
  - disabling_or_quarantining_a_failing_check_to_unblock_a_release
  - asserting_a_hand_computed_value_that_could_be_recomputed
  - presenting_a_passing_suite_as_learning_quality_evidence
  - running_a_hand_maintained_subset_of_validate_scripts_as_the_sweep
  - substituting_product_suite_for_spec_validators_or_the_reverse
  - device_only_verification_of_something_verifiable_off_device
  - introducing_new_product_semantics_in_the_test_strategy

future_stage_boundaries:
  10A: concrete_libraries_versions_build_files_ci_jobs_and_di_wiring
  11_to_18: individual_test_bodies_for_features_as_they_are_built
  18: evaluator_calibration_against_human_judgement
  18E: performance_budget_calibration_on_the_real_device

closes_stage_9: true

acceptance:
  required_previous_models:
    - MSBX-v0
    - LFPS-v0
    - DDM-v0
    - AIAX-v0
    - AMTS-v0
    - SPWX-v0
    - VDSX-v0
    - WFPX-v0
    - PBR-v0
  independent_qa_required: true
  stage6_regression_required: true
  stage7_regression_required: true
  stage8_regression_required: true
  stage9a_regression_required: true
  stage9b_regression_required: true
  stage9c_regression_required: true
  stage9d_regression_required: true
  stage9e_regression_required: true

future_stage_boundaries:
  12E: user-facing reason text and Today reading the plan
  12F: the 3H virtual-user scenarios against this code
  13: skill_state assembly under one watermark, retention and weakness needs
  15: the recompute chain after an attempt, and a stored attempt-to-planned-task link
  16D: calling the planner from the app, the capacity setting and the focus preference
  18C: starvation thresholds
  18E: reverse invalidation of dependents and candidate caps
  T6: device run

acceptance:
  - RPLX-v0 is the accepted replan
  - initial, replan and re-entry are told apart by whether a plan exists and which study day it belongs to
  - a new plan version always has a reason; the same day with no event writes nothing
  - only the unstarted remainder is solved again; kept work is first, unchanged and never served twice
  - kept work is reported by the caller and checked against the previous plan, or the replan is refused
  - the remainder follows D-033; it is never negative and never grows the day by itself
  - re-entry replays nothing, keeps nothing and records what the return looked like, with no score or debt
  - a safe pause makes its need P2 paused work without selecting it; a high-stakes pause is not continued
  - every trigger code is PDT-v0's, and no code is invented for an event that has none
  - planner_trace/2 records the replan; /1 still decodes strictly
  - the schema is unchanged, no migration was added and the port count stays four
  - nothing is claimed that was not run; T6 was not run
  - independent 12D QA passes and Stage 6-12C regressions pass

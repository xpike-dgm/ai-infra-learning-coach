model: RPLX-v0
stage_step: 12D
status: accepted_12d
decision: D-095
planner_engine: PLNX-v0
explainability_contract: PDT-v0
capacity_contract: D-033
reentry_contract: SRR-v0
priority_contract: PBR-v0
prerequisite_contract: PRG-v0
working_flow_contract: TRUX-v0
session_state: SESX-v0
data_model: DDM-v0
persistence: LFPS-v0
boundaries: MSBX-v0
purpose: plan_versions_replaced_with_a_reason_and_reentry_without_debt

scope:
  replan_implemented: true
  reentry_implemented: true
  paused_continuation_implemented: true
  skill_state_assembled: false
  recompute_after_attempt_implemented: false
  planner_called_from_app: false
  reverse_invalidation_implemented: false
  focus_preference_implemented: false
  reason_text_implemented: false
  schema_changed: false
  migration_added: false
  interfaces_added: false
  boundaries_changed: false
  absence_penalty_claim: null
  backlog_claim: null

replan_question: When a plan is replaced, what is kept, what is solved again, and why?

primary_invariant: >-
  A plan is replaced by a new version with a reason, never edited. What the learner started is kept,
  only the unstarted remainder is solved again, the day never grows by itself, and a return after
  absence replays nothing — absence is not debt, failure or decay.

found_before_12d:
  - id: attempt_has_no_planned_task_link
    was: DDM-v0 gives attempt no link to planned_task, so the store cannot say which planned task was started or finished
    resolved_here: >-
      the caller that owns in-flight state reports the positions it kept; each must exist in the plan being
      replaced or the replan is refused; the trace records them as kept
    owner: 15
  - id: same_day_build_wrote_a_second_initial_plan
    was: 12C's build() appended an unexplained new version when called again on the same day
    resolved_here: same day with no event returns the plan already there and writes nothing
  - id: trace_format_had_no_room_for_a_replan
    was: planner_trace/1 has no kept flag, replan record or re-entry context
    resolved_here: planner_trace/2 carries them; /1 still decodes strictly and cannot claim what it never had
  - id: handoff_items_that_cannot_be_built_yet
    was: skill_state assembly, recompute after an attempt, calling the planner from the app and reverse invalidation were handed to 12D
    resolved_here: each is re-pointed to the step that can build it, with the reason
  - id: focus_event_has_nothing_to_act_on
    was: PBR-v0 §17 lists USER_FOCUS_CHANGED but the planner takes no focus preference
    resolved_here: the event is not accepted; the preference is 16D's

generation_kinds:
  source: PDT-v0 §4
  values: [initial, replan, reentry]
  initial_when: no_plan_exists
  reentry_when: newest_plan_belongs_to_another_study_day
  replan_when: newest_plan_is_today_and_an_event_arrived
  same_day_without_event: returns_existing_plan_and_writes_nothing
  new_version_without_reason: false

triggers:
  source: [D-033 §16, PBR-v0 §17, PRG-v0 §19]
  codes_from: PDT-v0 §8.10
  code_invented_for_an_uncoded_event: false
  uncoded_events: [task_completed]
  not_accepted: [user_focus_changed]
  sets_remaining_time: [session_remaining_time_changed, user_requested_extra_time]

remaining_budget:
  source: D-033 §8
  capacity_change: new_day_budget_minus_kept
  declared_remaining_time: is_the_remainder
  any_other_event: day_budget_minus_kept
  remainder_negative: false
  replanning_grows_the_day: false
  remainder_rule: same_as_a_whole_day
  kept_work_undone_by_less_time: false

kept_work:
  source: TRUX-v0 §10.1
  reported_by: caller_owning_in_flight_state
  checked_against_previous_plan: true
  unknown_position: refused
  kept_first_and_unchanged: true
  kept_need_served_twice: false
  unstarted_recorded_as_invalidated: true

reentry:
  source: SRR-v0
  old_plan_replayed: false
  kept_on_a_new_day: false
  absence_is_failure: false
  absence_is_debt: false
  absence_decays_mastery: false
  absence_feeds_starvation: false
  day_budget_applies: true
  context_fields: [previous_plan_version_id, last_planned_study_day, returned_study_day, absence_study_days,
                   stale_planned_task_count, paused_checkpoint_need_keys, high_stakes_pauses_not_resumed,
                   open_need_count_by_trigger, due_skill_count_by_retention, p0_p1_need_count,
                   resolved_daily_capacity_minutes]
  codes: [replan.return_after_absence, reentry.return_after_absence, reentry.absence_not_failure,
          reentry.absence_not_task_debt, reentry.stale_plan_not_replayed, reentry.current_state_regenerated,
          reentry.paused_checkpoint_candidate, reentry.incomplete_high_stakes_attempt_not_scored,
          reentry.due_inventory_not_daily_plan]

paused_work:
  source: SRR-v0 §5, PBR-v0 §7
  safe_pause_band: P2
  selected_automatically: false
  high_stakes_pause_continued_as_independent: false
  latest_pause_per_need: true
  closed_need_reopened_by_a_pause: false
  undecodable_pause_resumable: false

trace:
  format: planner_trace/2
  previous_format_still_decodes: planner_trace/1
  v1_may_claim_v2_fields: false
  records: [kept_flag, replan_record, reentry_context]

persistence:
  tables: [plan_version, planned_task, planner_decision_trace]
  region: truth
  one_transaction: true
  edited_in_place: false
  refused_replan_writes: false

port_refinements:
  interfaces_added: 0
  port_count: 4
  refinements:
    - name: latestPlan
      port: PersistencePort
      signature: latestPlan() -> StoredPlan?
      reason: a replan must know what it replaces and re-entry which day that plan belonged to
      returns_raw_trace_text: true
      writes: false
    - name: resumeCheckpointRows
      port: PersistencePort
      signature: resumeCheckpointRows() -> List<StoredTruth>
      reason: a stored pause is a continuation signal for the need it names
      writes: false

re_pointed:
  skill_state_assembly_under_one_watermark:
    to: 13
    why: only 12A writes skill_state today; the watermark problem appears when 13 becomes the second writer
  recompute_chain_after_an_attempt:
    to: 15
    why: rebuilding mastery needs Objective gate profiles, which are authored content
  calling_the_planner_from_the_app:
    to: 16D
    why: the planner needs a stored capacity and the app has none; a default would be a number the learner never chose
  reverse_invalidation_of_dependents:
    to: 18E
    why: a replan already regenerates from bounded current state; invalidating only dependents is an optimisation
  attempt_to_planned_task_link:
    to: 15
    why: DDM-v0 names no such column; until tasks can be started, the caller reports kept work

living_gates_narrowed:
  - check: E12C-02_planning_budget_exact / E12C-02_relaxed_only_below_block
    validator: tools/validate_planner_engine.py
    was: the D-033 rule read inside resolveCapacity
    now: the same rule read in capacityOf, with resolveCapacity applying it
    why: 12D shares the rule so a replan's remainder uses exactly the day's rule
    guarantee_weakened: false
  - check: E12C-07_trace_format / E12C-07_unknown_format_refused
    validator: tools/validate_planner_engine.py
    was: the format is planner_trace/1 and only it decodes
    now: a versioned planner_trace format whose /1 still decodes, planner and codec naming the same version
    why: 12D moved the written format to /2
    guarantee_weakened: false

wiring:
  reachable_in_app_today: false
  why_not: nothing calls the planner (16D) and no task can be started, so no event is ever raised
  caller_owner: 16D


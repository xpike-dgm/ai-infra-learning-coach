assistant_defaults:
  - the audit drives the real app with adb and reads every screen with uiautomator dump, the tree an accessibility service reads; no instrumented-test dependency was added
  - eight rules R1-R8 (name, 48dp, no identifier, no image-only control, checkable named, field named by its label, no shared spoken name across the whole screen, reading order)
  - a node cut by a scrolling container's edge is judged on the screen where it is fully visible
  - every audit clears the app's data first and runs at 100% and 200% text
  - a button's spoken name contains its visible word (label in name)
  - an input error is its field's supporting text in the body colour, never the fault tone (17A: a mistyped number is not a fault), so isError is not used
  - a state chip is one leaf whose spoken name is its label, so its state is spoken once and a caller's heading or live region is on a focusable node
  - the reminder time's label gives an example ("Hatırlatma saati (ör. 19:00)"), not a pattern a screen reader spells
  - live regions are polite only

audit:
  tool: tools/audit_a11y_emulator.py
  reports: [arch/17d_accessibility/a11y_emulator_report.yaml, arch/17d_accessibility/a11y_emulator_report_text_200.yaml]
  screens: [today_overview, today_capacity_dialog, planner_explanation, learn_overview, topic_detail, progress_overview,
            learning_history, assessment_report, technical_english_profile, profile_overview, task_runner_orientation,
            task_runner_lesson, task_runner_question, task_runner_help]
  method: every screen is read whole — scrolled in steps shorter than its viewport until two readings are the same (read_to_end must be true, and every pair of consecutive readings must share an anchor text, or the swipe may have skipped content); a node cut by the viewport must be judged on a reading where it is whole (clipped_never_judged must be empty); R7 runs over all of a screen's readings; reaching a screen is shown by a marker (text it shows in some reading, and the screen before it does not show at its top)
  tree_carries: names, classes, clickability, checkability, bounds and order
  checked_in_code_only: headings, state descriptions, live regions, roles and errors (the tree uiautomator writes does not carry them)
  not_reached: the end-of-day view (needs recorded work), the assessment interior (no screen calls it) and the AI settings sub-screen; the static checks cover their code

found:
  - id: same_name_three_times
    what: Profile's three daily-length rows each had a field labelled "dk" and a button "Kaydet"; a screen reader could not tell them apart
    resolution: SettingsCopy.lengthField and SettingsCopy.saveLength name each row's day; the spoken name keeps "Kaydet"
  - id: row_named_like_its_tab
    what: Today's contextual row to Progress was named "İlerleme", the same as the shell's tab; the new R7 rule caught the two controls with one spoken name
    resolution: the row says its action, "İlerlemeyi aç"; the validator keeps Today's rows apart from the tab names
  - id: explanation_drawn_twice
    what: Today drew "Bu plan neden böyle?" beside the selected task and again among the supporting rows; R7 over the whole screen caught one control heard twice
    resolution: drawn once, beside the task; 11A's region-order check narrowed ("Narrowed at 17D")
  - id: loose_error_text
    what: the minutes error was loose text below the field, not the field's own error
    resolution: supportingText on the field, in the row and in the today dialog (isError dropped, see is_error_is_the_fault_tone)
  - id: below_the_fold_at_200
    what: at 200% text the run's orientation choices and start button fall below the fold; the first audit stopped there because it did not scroll
    resolution: reached by scrolling (as a learner does); the audit scrolls to tap
  - id: dump_bounds_clipped_to_window
    what: uiautomator clips bounds to the window, not to the scroll viewport, so a node cut by the scroll edge looked smaller than 48dp
    resolution: a node at the same place in every reading is fixed (the tabs, a focused flow's exit bar) and judged where it is; any other node not well inside the viewport is cut — even a row whose visible part lies only outside it — and is matched to a reading where a whole node contains it and, when the cut part still has a name, carries that name
  - id: review_reminder_error_loose
    what: the independent review found the reminder time's error still loose text below its field, and the validator only looked at the minutes error
    resolution: the reminder error is the field's supporting text; the validator fails on any loose *_INVALID text in app-ui
  - id: is_error_is_the_fault_tone
    what: the first fix used isError, which draws the field in Material's error colour; 17A's check (a mistyped number is not a fault, VDSX-v0) caught it
    resolution: supporting text in the body colour only; the validator forbids isError in app-ui
  - id: review_chip_spoken_twice
    what: the state chip carried stateDescription beside the same visible text, so inside a row it could be spoken twice, and a heading or live region a caller put on it sat on a node a screen reader does not focus
    resolution: the chip is one leaf (clearAndSetSemantics with its label as the spoken name); three earlier checks narrowed ("Narrowed at 17D")
  - id: review_codes_in_unwired_screen
    what: the unwired assessment interior showed "H1 yardım iste" through ${level.id} and raw tool ids; the validator only scanned string literals
    resolution: help levels in words, tools through ToolWords; the validator fails on ${...id} in UI templates
  - id: review_audit_holes
    what: the independent review found that a clipped node was never re-judged, a text field was named by its own value (so R7 could not have caught the "dk" fields), R7 compared one reading only, and reaching a screen was assumed from a tap
    resolution: every screen is read whole with overlapping readings, clipped_never_judged must be empty, fields are named by their label, R7 runs over all readings, markers prove each screen was reached, R8 reading order was added, the today dialog is audited
  - id: validator_regex_corrupted
    what: validator mutation found that a shell heredoc had turned a regex's word-boundary escape into a backspace character, so the loose-error check matched nothing and passed
    resolution: the regex was rewritten with the editor, every 17D file was scanned for stray control characters, and the mutant now fails the check
  - id: talkback_not_on_image
    what: the emulator image has no TalkBack; an APK from outside the Play store is an untrusted download and was not fetched
    resolution: names, sizes, order and clickability were audited from the tree; headings, state, live regions, roles and errors were checked in the code; what TalkBack says is heard on the device (19)


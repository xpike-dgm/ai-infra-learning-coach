question: Ekran okuyucu, büyük metin ya da anahtarla kullanan biri her ekrana ve her kontrole ulaşabiliyor, her birinin ne olduğunu ve hangi durumda olduğunu duyabiliyor mu?

primary_invariant: >-
  Every control has a name, a role and its state for a screen reader; no two different controls on a screen share a
  spoken name, and a spoken name contains the visible word; every target is at least 48dp at 100% and 200% text; no
  identifier or help code reaches the screen; every surface has a heading; a field's error is its own; no live region
  interrupts. The real app is audited through the accessibility tree on an emulator, not only read from the code.


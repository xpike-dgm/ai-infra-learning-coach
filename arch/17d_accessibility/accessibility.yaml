  talkback_heard: false
  talkback_reason: TalkBack is not installed on the emulator image and an APK from outside the Play store was not downloaded
  independent_review: a separate agent; the first pass found 6 blocking problems (reminder error loose, chip spoken twice, codes in the unwired assessment interior, three audit holes), all fixed; its re-review found none blocking, and three of its suggestions were taken (a reading with no shared anchor is not read whole, a cut node must match a whole node's name as well as its place, Profile's marker is text only Profile shows)
  t6_run: false

acceptance_criteria:
  - the emulator audit ran at 100% and 200% text over every named screen, read each whole, reached each, judged every cut node, with R1-R8, and passed
  - every icon declares its description; every surface has a heading
  - every button is at least 48dp; a choice is one group; the shell and the state chip say their state
  - every field is labelled and a field's error is its own
  - repeated controls have distinct spoken names that contain the visible word
  - no live region is assertive; no help code is in the UI
  - TalkBack is not claimed as heard; the unchosen items and 17E are named
  - earlier gates still pass

mutation_results_kotlin:
  scope: one change per mutant to each length's field and save names (the day dropped, a bare "Kaydet", the visible word lost, "dk", the word moved first), two days given one label, a tool shown as its id, a repeated unnamed tool, a tool word that is an id and a tool with no word; then AccessibleNamesTest
  total: 10
  detected: 10
  detection: Gradle reached the tests and a test failed (a test-results file with failures)
  crash_is_detection: false
  runner: the hardened runner — a baseline that is not exit 0, or a run that writes no test results, is refused; every mutant is checked to have changed its file (CRLF-safe)
  negative_control: N00 changes a comment in SettingsPresentation.kt
  negative_control_result: survived_as_expected
  earlier_runs: "the first run had six mutants (SettingsCopy only); ToolWords was added after the independent review, and the whole set was run again"
  final_run_is_a_single_clean_run: true

mutation_results_validator:
  scope: one change per mutant to what the validator exists to catch — a field named "dk", the save names, titles and section headers not headings, a decorative icon without its declaration, a button and a hand-made target under 48dp, the chip's state description back, an input error in the fault tone or loose, a help-level or tool id on screen, a radio choice not grouped, an unlabelled field, an assertive live region, a help code, a failed or partial report (passed, screens, rules, font scale, reached, cut nodes judged, read to the end, a reading with no shared anchor), TalkBack claimed, an unchosen item dropped, the audit tool's floor, data reset, field naming and result rule, a lost word in the spoken name, a back arrow without its word, a row named like a tab and a test removed
  total: 35
  detected: 35
  detection: the validator fails and names the expected check (only the living-record checks A17D-11 may fail in the baseline before POST)
  negative_controls: [V00 changes a comment in SettingsPresentation.kt, V01 changes a comment in ProfileScreen.kt]
  negative_control_result: survived_as_expected
  earlier_runs: "the first full run detected 32/34: V27 (a loose error) survived because a shell heredoc had turned the regex's word-boundary escape into a backspace character, so the check matched nothing; V24 (a test removed) survived because the check asked for two tests of three. The regex was rewritten, the window widened for a longer condition, the test count raised; after the re-review a mutant for a reading with no shared anchor was added and the whole set was run again"
  final_run_is_a_single_clean_run: true


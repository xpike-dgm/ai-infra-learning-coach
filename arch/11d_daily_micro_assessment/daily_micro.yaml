    source: ASUX-v0 session_model.assessment_scopes
    value: [daily_micro, weekly_blueprint, monthly_capability]
    scope_is_displayed_context_only: true
  assessment_intents:
    source: ASUX-v0 session_model.assessment_intents
    value: [checkpoint, mastery_evidence, verification, integration_check]
  semantic_states:
    source: ASUX-v0 semantic_states
    count: 19
    order_is_source_order: true
  result_families:
    source: ASUX-v0 result_presentation.semantic_families
    count: 6
  not_reliably_measured_sources:
    source: ASUX-v0 result_presentation.not_reliably_measured_sources
    count: 6
  recomposition_conditions:
    source: ASUX-v0 pause_resume_recomposition.recomposition_conditions
    count: 5
  lifecycle_status:
    source: QAB-v0 §5
    value: [draft, candidate, validated, trusted, deprecated, invalidated, retired]

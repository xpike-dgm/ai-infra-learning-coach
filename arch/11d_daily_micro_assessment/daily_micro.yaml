future_stage_boundaries:
  12: planner selection of assessment tasks, evidence pipeline, prerequisite gate facts, plan changes in the result
  13: weekly and monthly blueprint composition, high-stakes gap policy, remediation
  14: AI evaluator behaviour, rubric content and final microcopy
  15: authored curriculum and item content
  16B: assessment_report and longitudinal history
  18D: evaluator and item calibration
  T6: device run

acceptance:
  - DMAX-v0 is the accepted daily micro assessment implementation
  - vocabularies equal ASUX-v0, DMA-v0, QAB-v0 and AIV-v0 in their order
  - curriculum publishing is the single write path, one transaction, and never overwrites a published version
  - the authored package parses strictly or not at all, and a failed parse serves nothing
  - trust comes from the store's validation record, never from the item's own claim
  - the effective use ceiling is the most restrictive applicable rule and never exceeds the declared one
  - the Objective's evidence profile decides fit; mastery needs its direct type
  - exposure is recorded when an item is served and when a solution is revealed, never otherwise
  - one interior serves all scopes; submitted boundaries freeze; skipping is not incorrect
  - assistance is never blocked, its consequence is disclosed and conversion is explicit
  - the result is semantic, not_reliably_measured is first class, and no change is claimed without canonical change
  - an artifact body is carried inline or refused, never truncated
  - the schema is unchanged, no migration was added and the port count stays four
  - nothing is claimed that was not run; T6 was not run
  - independent 11D QA passes and Stage 6-11C regressions pass

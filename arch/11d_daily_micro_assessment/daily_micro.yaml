    T26's refusal was asserted to happen without asserting that the parser names the rule rather than
    throwing an index error. The tests were strengthened and all three are now caught.

validator_mutation:
  total: 27
  detected: 27
  negative_control: forbidden words named only in a comment must not fail the validator
  negative_control_result: no_false_positive
  invalid_mutants_replaced:
    - id: W11
      was: renaming an enum constant while keeping its id, which would not compile
      replaced_with: the fit branch that names an unknown Objective profile is removed
    - id: W27
      was: an elvis on a nullable that changed no behaviour
      replaced_with: a failed parse is re-parsed and served anyway
  helper_defect_found: >-
    six checks read an empty string, because the brace-body reader cannot see Kotlin's
    expression-bodied functions; the validator now reads either form and those checks really run

corrections:
  11c_mutation_record:
    was: "20/20 caught, recorded in SESX-v0, its contract and D-089"
    why_invalid: >-
      the harness invoked cmd /c gradlew.bat with a working directory, which Windows does not
      resolve, so Gradle never started; every mutant returned a non-zero exit code for the wrong
      reason and was recorded as caught
    corrected_to: >-
      re-run against the fixed harness: 20/20, every one caught by a failing test. The number stands
      and is now actually verified, which it was not before
    harness_fix: >-
      the wrapper is invoked by absolute path and a run whose output carries no Gradle build result
      is refused rather than classified
  11a_stale_living_gate:
    was: >-
      validate_today_interior.py pinned the literal body "ContentDocument? = null", which 11D's real
      content adapter no longer has
    corrected_to: >-
      narrowed to the guarantee 11A owns — the resource lookup returns a nullable document, throws
      nothing and contains no TODO — following the E7A-15 precedent for stale living gates
  11c_sync_duplication:
    was: >-
      11C's POST sync inserted PROJECT_CONTEXT.md section 12.15 four times, because the replacement
      text contained its own anchor and the idempotency guard therefore never matched
    corrected_to: the three duplicates were removed and the 11D validator fails if a 12.x heading repeats


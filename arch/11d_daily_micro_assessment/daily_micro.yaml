curriculum_ingestion:
  single_write_path: publishCurriculum
  one_transaction: true
  published_version_overwritten: false
  correction_is_a_new_version: true
  refusal_decided_before_any_write: true
  refuses:
    - unresolved_reference_in_package_and_store
    - row_carrying_another_version_than_the_package
    - evidence_type_that_is_not_a_single_token
  writes_into_user_regions: false
  authored_package_format: curriculum_package/1
  parser_is_strict: true
  parser_refuses:
    - unknown_section
    - unknown_key
    - repeated_key
    - missing_required_key
    - unpinned_reference
    - unknown_enum_value
    - line_that_is_not_section_or_key_value
  half_loaded_package_served: false
  content_ships_with_app_today: false
  content_author_owner: 15

item_trust:
  trust_source: store_validation_record
  document_may_promote_itself: false
  unvalidated_candidate_ceiling: practice_only
  ai_generated_without_trusted_status_max: standard_mastery_eligible
  no_deterministic_verification_with_provisional_evaluator_max: low_stakes_assessment
  deterministic_required_but_absent_max: practice_only
  evaluator_unavailable_without_deterministic_max: practice_only
  ceiling_can_exceed_declared: false
  intent_requirements:
    checkpoint: low_stakes_assessment
    integration_check: low_stakes_assessment
    mastery_evidence: standard_mastery_eligible
    verification: standard_mastery_eligible
  evidence_fit_decided_by: objective_profile
  mastery_requires_objective_direct_type: true
  unknown_objective_profile_assumed_compatible: false
  unfit_item_is_negative_evidence: false

exposure:
  recorded_when_item_is_served: item_version_seen
  recorded_when_solution_revealed: solution_exposure
  recorded_for_unusable_item: false
  permanent: true
  carries_variant_family: true

session_interior:
  one_interior_for_all_scopes: true
  submission_unit: atomic_evidence_boundary
  item_boundary_holds_one_item: true
  testlet_split: false
  submitted_boundary_frozen: true
  submitted_boundary_revisitable: false
  unsubmitted_boundary_navigable: true
  free_order_answering: true
  skipping_is_incorrect: false
  skipping_is_penalty: false
  assistance_blocked: false
  h1_h2_consequence: assisted
  h3_h4_consequence: practice_only_solution_exposed
  independent_mastery_evidence_from_assisted_attempt: false
  mode_conversion_explicit: true
  session_schedules_recheck: false
  recomposition_deletes_frozen_boundary: false
  recomposed_slot_is_fresh_measurement: true
  dispute_auto_invalidates_item: false
  dispute_harms_user_state: false
  contested_evidence_held: true
  result_is_semantic: true
  result_has_score_or_grade_field: false
  raw_counts_are_informational_only: true
  not_reliably_measured_first_class: true
  state_change_claimed_without_canonical_change: false
  incomplete_session_is_partial_not_failure: true
  independence_and_tools_disclosed_before_response: true

artifact_body:
  inline_format: rfc2397_data_uri
  max_body_chars: 4096
  oversized_body_truncated: false
  oversized_body_written_elsewhere: false
  commits_in_the_attempt_transaction: true
  included_in_existing_export: true
  blob_store_owner: [14, 15]

port_refinements:
  interfaces_added: 0
  port_count: 4
  refinements:
  - name: publishCurriculum
    reason: the immutable curriculum region had no writer
  - name: resourceVersion
    reason: a pinned published row is what makes content compatibility checkable
  - name: latestValidation
    reason: trust is the store's answer, not the document's claim
  - name: objectiveProfile
    reason: the Objective decides what counts as evidence for it
  - name: assessmentItem
    reason: item metadata DDM-v0 does not name is authored content, parsed by the content adapter
  - name: curriculumPackage
    reason: ingestion reads the authored package through the same content port

wiring:

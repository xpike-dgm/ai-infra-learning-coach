assessment_question: How does one honest measurement run end to end — and what may an item be used for at all?

primary_invariant: >-
  An assessment session is an evidence-collection workflow. It never becomes a gradebook, a
  score-based mastery authority, a pass/fail verdict or a second state engine; and an item may only
  carry what its validation, its evaluator and the Objective's own evidence profile allow.

found_before_11d:
  - id: no_write_path_into_the_curriculum_region
    was: >-
      the store could read curriculum and report whether anything was published, but nothing could
      publish it; the immutable region had no writer at all, so its rules were untested in practice
    resolved_here: publishCurriculum as the single write path, one transaction, refusal decided before any write
  - id: item_metadata_ddm_does_not_name
    was: >-
      DDM-v0's assessment_resource_version names content_ref, evidence_type, allowed_tools_policy,
      variant_family_id, dependency_group_id and content_origin only, while QAB-v0's item carries
      targets, use ceiling, scope eligibility, evaluator requirement, difficulty and independence mode
    resolved_here: >-
      the rest travels in the authored content document, not in invented columns; 10D forbade
      inventing fields the data model does not name
  - id: artifact_body_had_nowhere_to_live
    was: 11B recorded artifact body storage as 11D's, and DDM-v0 says only that an artifact has a content_ref
    resolved_here: >-
      a short response is carried inside the reference as an RFC 2397 data: URI, so it commits in the
      attempt's own transaction and is already inside 10E's verified export; anything larger is
      refused rather than truncated, and a real blob store belongs to 14/15
  - id: revalidation_would_have_been_unpublishable
    was: >-
      the first reference resolver only looked inside the package being published, so a later version
      carrying only a revalidation of an already-published resource was refused
    found_by: the T2 publishing check, not review
    resolved_here: references resolve against the package or the store; both sides stay version-pinned

vocabularies:

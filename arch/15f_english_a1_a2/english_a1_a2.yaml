mutation_results:
  total: 8
  detected: 8
  scope: the checking 15F adds to the builder (english_words and the lexicon check, including declared Skills); 15F changes no Kotlin main code
  tests: the real 15F build (must stay clean) and two fault fixtures, each one Skill file with a planted vocabulary error that the unmutated builder must catch — a word no lesson teaches (F1) and a word from a lesson the item may not rely on (F2)
  detection: the real build reports a failure, or a fixture's planted error adds no failure beyond the same file built clean under the same mutant
  crash_is_detection: false
  harness_verified: the unmutated baseline must be clean and catch both fixtures before any mutant runs; files are read and written as bytes and restored
  negative_control: a comment-only change in the builder
  negative_control_result: survived_as_expected
  not_counted_as_mutants: removing the backtick stripping in english_words is equivalent for this content (a backticked token always carries a backtick or a non-letter and is skipped anyway); the validator checks the line statically (E15F-06_literals_are_not_words)
  final_run_is_a_single_clean_run: true
  mutants:
    - {id: B01, mutant: quoted_names_counted_as_words, result: detected}
    - {id: B02, mutant: mixed_case_identifiers_counted, result: detected}
    - {id: B03, mutant: non_letter_tokens_counted, result: detected}
    - {id: B04, mutant: words_not_lowered, result: detected}
    - {id: B05, mutant: unknown_words_allowed, result: detected}
    - {id: B06, mutant: word_scope_not_checked, result: detected}
    - {id: B07, mutant: lexicon_not_read, result: detected}
    - {id: B08, mutant: declared_skills_ignored, result: detected}


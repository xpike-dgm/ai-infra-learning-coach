model: MSTX-v0
stage_step: 12A
status: accepted_12a
decision: D-092
mastery_contract: GRE-v0
evidence_contract: GRE-v0
assistance_contract: AI_assistance_2D_contract
skill_presentation: SPWX-v0
data_model: DDM-v0
local_database: LDBX-v0
persistence: LFPS-v0
boundaries: MSBX-v0
ai_integration: AIAX-v0
purpose: evidence_interpreted_and_mastery_projected_from_it

scope:
  mastery_engine_only: true
  retention_engine_implemented: false
  prerequisite_engine_implemented: false
  planner_implemented: false
  topic_state_implemented: false
  weakness_engine_implemented: false
  rubrics_implemented: false
  threshold_calibrated: false
  schema_changed: false
  migration_added: false
  ports_added: false
  boundaries_changed: false
  surface_semantics_changed: false
  mastery_percentage_claim: null
  probability_or_confidence_claim: null

mastery_question: What does this attempt actually prove — and what does it refuse to prove?

primary_invariant: >-
  Mastery asks one question: can the learner do it without help? Assisted work, exposed solutions,
  unverified evaluations, contested items and work done on a contaminated prerequisite are all kept
  out of the score, and none of that is a penalty — they are answers to a different question.

found_before_12a:
  - id: evidence_had_no_writer
    was: >-
      11B and 11D deliberately wrote no evidence, so nothing in the product turned a recorded attempt
      into the four axes DDM-v0 stores; mastery had nothing to read
    resolved_here: RecordEvidence, one transaction per attempt, one row per targeted Objective
  - id: objective_gate_metadata_not_in_the_schema
    was: >-
      GRE-v0's per-Objective gate profile (min_independent_groups, min_variant_families,
      requires_non_basic/user_authored/transfer) has no column in DDM-v0
    resolved_here: >-
      it travels as authored content exactly as 11D's item metadata does, and falls back to GRE-v0's
      declared defaults rather than to a number invented here
  - id: group_rubric_does_not_exist_yet
    was: GRE-v0 §4 asks for an objective-specific rubric to produce a testlet's group quality
    resolved_here: >-
      the mean of the group's rows is the stand-in until rubrics exist (14); it can never raise the
      group count, which is the guard that actually matters

declared_constants:
  source: GRE-v0
  calibrated_at: 18C
  recent_window_max_groups_v0: 5
  objective_mastery_threshold_v0: 0.80
  min_independent_groups_standard: 2
  min_independent_groups_critical: 3
  min_variant_families_standard: 2
  min_variant_families_critical: 2
  is_probability: false
  is_confidence: false
  is_ability_estimate: false
  shown_to_learner_as_percentage: false

eligibility:
  source: GRE-v0 §3.1
  excluded_kinds:
    - not_direct_evidence_for_objective
    - not_independent
    - evaluator_not_verified
    - outcome_invalid
    - contested
    - prerequisite_contaminated
    - solution_exposed
    - no_group_result
  assisted_evidence_is_penalty: false
  assisted_evidence_kept_as_formative: true
  contextual_signals_produce_score: false

grouping:
  source: GRE-v0 §4
  dependency_group_is_one_group: true
  same_item_repeated_inflates_groups: false
  group_quality_from_rubric: false
  group_quality_stand_in: mean_of_group_rows
  rubric_owner: 14

scoring:
  window: last_5_eligible_independent_direct_groups
  aggregation: equal_weighted_mean
  assistance_multiplier: false
  evaluator_multiplier: false
  difficulty_multiplier: false
  recency_multiplier: false

objective_gates:
  source: GRE-v0 §8, §9
  standard: [recent_direct_score, min_independent_groups, min_variant_families, required_direct_type,
             no_unresolved_recheck, no_unresolved_verification]
  critical_adds: [non_basic_evidence]
  profile_may_add: [user_authored_artifact, transfer_evidence]
  compensatory: false

skill_aggregation:
  source: GRE-v0 §14
  rule: all_required_and_critical_objectives_pass
  average_of_objectives: false
  unresolved_critical_recheck_blocks: true
  optional_objective_gates_skill: false

hysteresis:
  source: GRE-v0 §16.2
  first_contradiction_opens_verification: true
  first_contradiction_unmasters: false
  failed_recheck_resolves_verification_and_lets_gates_decide: true
  verification_stays_open_forever: false

support_band:
  source: GRE-v0 §17
  values: [low, medium, high]
  is_statistical_confidence: false
  failing_objective_is_low: true

evidence_pipeline:
  writes_one_row_per_targeted_objective: true
  one_transaction_per_attempt: true
  pending_evaluation_writes_evidence: false
  axes_written_separately: true
  not_reliably_measured_is_invalid_not_negative: true
  not_reliably_measured_scored_zero: false
  independence_inferred_from_the_answer: false
  evaluator_recorded_on_every_ai_derived_row: true

projection:
  rebuilt_not_edited: true
  same_evidence_same_row: true
  writes_truth: false
  writes_only_mastery_axis: true
  other_axes_carried: true
  presentation_state_derived_from_one_axis_and_claimed_as_whole_truth: false
  presentation_state_owner: [12B, 13, SPWX-v0 precedence]
  provenance: [policy_version, truth_watermark, built_at_instant, input_curriculum_version]
  watermark_read_before_evidence: true
  written_without_a_published_curriculum: false

port_refinements:
  interfaces_added: 0
  port_count: 4
  refinements:
    - name: evidenceFor
      signature: evidenceFor(objective) -> List<EvidenceRow>
      reason: mastery is a projection of evidence and must be recomputable from all of it
      version_pinned: true
      writes: false
    - name: truthWatermark
      signature: truthWatermark() -> Long
      reason: a projection without a watermark is indistinguishable from a stale one
    - name: latestCurriculumVersion
      signature: latestCurriculumVersion() -> Int?
      reason: a projection is pinned to the curriculum version it was computed against

wiring:
  reachable_in_app_today: false
  why_not: >-
    no path in the app produces an evaluation yet: nothing is startable, no content ships and no
    planner selects work, so no attempt reaches the pipeline
  trigger_owner: 12C


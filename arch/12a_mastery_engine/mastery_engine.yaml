  survived_at_first: [G26, G33]
  survivors_note: >-
    both survivors were gaps in the tests rather than in the rules, and both were the same kind of
    gap: a rule that only shows up in a case the tests never built. G26's version pin is invisible
    while every Objective in the fixtures is version 1, and G33's range check had no test that tried
    to construct a row outside it. A second Objective version and a core-model invariant check close
    them.

validator_mutation:
  total: 37
  detected: 37
  negative_control: forbidden words named only in a comment must not fail the validator
  negative_control_result: no_false_positive
  missed_at_first:
    - id: V13
      why: the check looked for the token `recheckAlsoFailed` rather than how it is computed, so a
        mutant that set it to a constant still passed; it now asserts the expression
    - id: V21
      why: no check covered the group-result range invariant at all; one was added
  helper_defect_found: >-
    the declaration reader stopped at the first `=` after a signature, which a default parameter
    value contains, so nine checks silently read an empty string and passed; the reader now balances
    the parameter list first. 11D hit the same class of defect in its own reader


  target_device: Poco M6 Pro
  device_connected: false
  t6_run: false
  claimed: false

not_verified:
  - any mastery decision in the real app; nothing produces an evaluation there yet
  - the threshold, window size and group minimums against real learner data (18C)
  - a testlet's group quality against a real rubric (14)

forbidden_mastery_patterns:
  - assisted_work_counted_as_independent_mastery
  - provisional_evaluation_settling_a_gate
  - exposed_solution_counted_as_fresh_evidence
  - contaminated_prerequisite_counted_against_the_learner
  - same_item_repeated_inflating_independent_groups
  - compensatory_average_across_objectives
  - instant_unmastery_on_one_contradiction
  - verification_left_open_forever
  - unmeasurable_answer_scored_zero
  - pending_evaluation_written_as_evidence
  - mastery_percentage_or_probability
  - engine_writing_another_engines_axis
  - projection_written_without_provenance

future_stage_boundaries:
  12B: prerequisite readiness, the axis this engine leaves untouched
  12C: the planner that triggers recomputation and selects what to measure next
  12D: replan after a mastery change
  12E: user-facing reason codes built from the decision trace
  13: retention, remediation and the weakness axis
  14: rubrics, evaluator behaviour and the AI evaluator policy
  15: authored Objective gate profiles
  18C: calibration of the threshold, window and minimums
  T6: device run

acceptance:
  - MSTX-v0 is the accepted mastery engine
  - eligibility, grouping, window, gates, aggregation, hysteresis and support band equal GRE-v0
  - every declared constant is GRE-v0's and is recorded as an uncalibrated cold-start heuristic
  - assisted, exposed, unverified, contested and contaminated evidence never enters a score
  - a dependency group is one group, and a repeated item cannot inflate independent evidence
  - a Skill is mastered only when every required and critical Objective passes on its own
  - the first clean contradiction opens verification; a failed recheck lets the gates decide again
  - a pending evaluation writes no evidence and an unmeasurable answer is not a zero
  - the projection is rebuilt from evidence, carries full provenance and writes only its own axis
  - no percentage, probability or confidence is produced anywhere
  - the schema is unchanged, no migration was added and the port count stays four
  - nothing is claimed that was not run; T6 was not run
  - independent 12A QA passes and Stage 6-11E regressions pass

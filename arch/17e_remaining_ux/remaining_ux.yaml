added_by: D-136
implements: [EODX-v0, LHRX-v0, PCRX-v0, RSNX-v0, UXIA-v0, PWPX-v0, PRVX-v0, AIAX-v0, VDSX-v0, WFPX-v0, MOTX-v0, A11X-v0]

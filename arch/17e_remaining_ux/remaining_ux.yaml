mutation_results_kotlin:
  scope: one change per mutant — the day's changes from any day, unread changes not named, a change not in 13E's sentence; a Skill's plan with other Skills' tasks, needs or plan-wide reasons; the English edge dropped; reduced motion that does not add (two); digits grouped wrong, unreported tokens shown, the month not filtered, the motion note not naming Android; a negative token count accepted, a failing listener failing the call, input and output swapped, attempts not counted, the connection check counted as help, a rejected key not named; an unreported count written as zero; the day's replay from every day; the day's changes dropped — each against its own module's tests
  total: 22
  detected: 22
  detection: Gradle reached the tests and a test failed (a test-results file with failures)
  crash_is_detection: false
  runner: the hardened runner — a baseline that is not exit 0, or a run that writes no test results, is refused; every mutant is checked to have changed its file (CRLF-safe)
  negative_control: N00 changes a comment in EndOfDay.kt
  negative_control_result: survived_as_expected
  earlier_runs: "the first run detected 19/22: K15 and K17 pointed at code the review fix had renamed (attempt -> sent), and K20 (an unreported input count written as zero) survived because the test's call reported its input; the test now records a call that reported nothing, and the whole set was run again"
  final_run_is_a_single_clean_run: true

mutation_results_validator:
  scope: one change per mutant to what the validator exists to catch — a day change not in 13E's sentence, from another day, unread changes not named or said as nothing changed, the day not refreshed after a run, the replay from every day, the day's facts without the replay; an edge dropped, a reverse edge, the IA contract without the edge, the edge not asked of the graph, a Skill's plan not narrowed or with plan-wide reasons, nothing-recorded unsaid; a content column, a negative token count, a call counted when nothing left (twice), an end not counted, a zero for an unreported count (twice), a money field, a currency on screen, the count written on another thread; motion that does not add, bars from the system, the theme choice not a group; the ring off the targets, on the target's edge, while not focused, unseen by NavRow, off the tabs; a table not guarded; T6 claimed; a failed or partial audit report
  total: 36
  detected: 36
  detection: the validator fails and names the expected check (only the living-record checks A17E-11 may fail in the baseline before POST)
  negative_controls: [V00 changes a comment in EndOfDay.kt, V01 changes a comment in ProfileScreen.kt]
  negative_control_result: survived_as_expected
  earlier_runs: "the first full run detected 34/34; the two checks the review added (the tabs' ring, a request that never left) got mutants and the whole set was run again"
  final_run_is_a_single_clean_run: true

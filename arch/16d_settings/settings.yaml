  - the tutor panel, the alternative-explanation menu and the comprehension check
  - the fast path's entry and its use cases; entry placement as a diagnostic source
  - weekly and monthly slots carrying the session id; dispositions recorded from the app and the disposition reason in traces; assessment_opportunity


  presets_v0: {short: 30, normal: 60, intensive: 90}
  presets_source: docs/ADAPTIVE_PLANNER_SPEC.md §3
  minutes_range: [0, 1440]
  resolution: [today_minutes, today_profile, normal_profile]
  today_choice_scope: its_own_study_day
  today_choice_carries_over: false
  replan_trigger: today_capacity_changed
  replan_only_when_budget_changes: true
  is_a_target: false
  is_a_progress_measure: false

schema_migration: {from: 8, to: 9, owner: 16D, tables: [preference_record], truth_altered: false, decision: D-126}

preference_storage:
  table: preference_record
  append_only: true
  keys: [capacity.short_minutes, capacity.normal_minutes, capacity.intensive_minutes, capacity.today]
  today_key_has_a_day: true
  standing_keys_have_no_day: true
  newest_row_wins: true
  in_the_export: true

backup:
  export: {user_initiated: true, destination_chosen_by_learner: true, verified_before_handed_over: true, uploaded: false}
  restore: {explicit_confirmation: true, replaced_profile_kept: true, verified_before_replacing: true, atomic: true, merge: false}
  refusals: [INTEGRITY_CHECK_FAILED, NOT_A_PROFILE_ARCHIVE, NEWER_SCHEMA, MIGRATION_INCOMPLETE]
  refusal_changes_nothing: true


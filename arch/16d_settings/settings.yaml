primary_invariant: >-
  A preference is the learner's decision, appended and never edited, and it lives in the store so a backup carries it.
  Today's plan is made by the planner from those preferences — the normal profile unless today has its own choice,
  which applies to today only and leaves no debt — and a change replans today only if today's budget changed. Time is
  a ceiling, never a target or a measure. A backup goes only where the learner puts it, a restore replaces nothing
  until the learner confirms, and the replaced profile is always kept.

user_decisions:
  approval: explicit_user_approval_2026-10-25
  scope: settings_and_today_s_plan_from_the_app_rest_of_the_end_to_end_wiring_in_new_step_16f
  new_step: 16F_uctan_uca_gunluk_dongu_added_like_d_099_no_renumbering
  capacity_presets: short_30_normal_60_intensive_90_from_adaptive_planner_spec_3_editable_and_a_today_only_choice
  backup_controls: in_16d_restore_confirmed_explicitly_replaced_profile_kept_aside
  cycles: fixed_iso_week_from_monday_and_calendar_month_no_setting
  focus_preference: 18B

assistant_defaults:
  - preferences are a new append-only table in the store (schema v9), not platform settings, because LFPS-v0 §11 exports preferences and the export is the database
  - a profile length and today's minutes are whole minutes from 0 to 1440; an unreadable stored row is skipped, never guessed
  - a profile chosen for today and minutes for today are both "today's choice"; the newest one for today wins and clearing it is a row too
  - the app plans on open and when a new study day is seen; this week's and this month's blueprints are composed first, once per cycle
  - a capacity change replans with today_capacity_changed only when today's hard budget differs from the plan's; nothing the learner started is reported kept, because nothing can be started from Today yet (16F)
  - the replaced profile is a verified copy written before anything is replaced; if it cannot be made, nothing is replaced; a refused backup leaves no copy behind
  - the backup state lives above the shell, so a restore's outcome survives the store being closed and reopened
  - working Turkish microcopy; 17 owns the polish

declared_extensions:
  - {what: "preference_record, an append-only table in the user region (schema v9)", extends: "DDM-v0's thirteen truth tables (precedent: D-104's diagnostic_coverage)", why: "LFPS-v0 §11 puts preferences in the export; the export is the database"}
  - {what: "PersistencePort.preferenceRecords, defaulted", extends: "16C's attemptedResources (port refinements, port count unchanged)", default_answer: "nothing — the accepted presets hold"}
  - {what: "StoreStartup.replace", extends: "APHX-v0's StoreStartup: close the open store, run the work, reopen it — the store is never read while it is replaced"}
  - {what: "ProfileReplacement in data-persistence", extends: "10E's Backup mechanism with the control 10E left to 16D"}
  - {what: "CapacityPreferences and TodayCapacityChoice in core-model", why: "core-application writes and reads them; core-presentation shows them"}


primary_invariant: >-
  A program is judged by what it does, on the learner's own computer, against tests that can tell a right solution from
  a plausible wrong one. Every code item's reference solution passes the course's own tests through the runner the
  learner uses, and at least two plausible wrong solutions each fail one; a test that a correct solution could fail for
  reasons the prompt does not state is a defect of the test. A later package only adds: what is published is never
  carried again or overwritten, and a Skill is published only with everything it needs to become ready.


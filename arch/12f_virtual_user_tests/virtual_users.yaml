found_in_12f:
  - id: due_inventory_listed_row_by_row
    was: a returning learner's seventy-eight due Skills were seventy-eight not-today entries on planner_explanation (SRR-v0 §9.1)
    resolved_here: needs that did not come for the same recorded reason are one entry that keeps every need and Skill; the screen names three Skills and counts the rest
  - id: s07_example_day_is_illustrative
    was: 3H's S07 example includes new learning; with authored reviews for every due Skill PBR-v0 urgency fills the day and new learning waits for time
    resolved_here: both days are tested; no rule changed; the guard is starvation/track balance, thresholds 18C
  - id: diagnostic_waiver_unowned
    was: VDW-v0 has no implementation and no step owned it, so 3H S06 and PDT-v0 invariant 12 had no owner
    resolved_here: named not runnable and re-pointed to 13
  - id: test_fixtures_read_as_a_self_cycle
    was: verifyModuleBoundaries (RUN-03) failed with ':core-engines -> :core-engines' — java-test-fixtures makes a module's own tests depend on its own fixtures, and the check read that as an edge
    resolved_here: the check drops only a module's reference to itself; a real cycle (core-model -> core-engines -> core-model) was introduced, failed the build, and was reverted
  - id: scenario_tests_weaker_than_they_looked
    was: F01 and F06 survived the first mutation run
    resolved_here: a critical verification holding nothing back is checked to stay P1; S05 gained a lesson short enough to fit, which is still not taught

boundary_check_refined:
  file: android/build.gradle.kts
  change: a module's dependency on its own test fixtures is not read as an edge
  filter: it != sub.path
  edges_to_other_modules_dropped: false
  real_cycle_still_fails: true
  negative_verification: core-model -> core-engines added, the build failed with the cycle, and the change was reverted


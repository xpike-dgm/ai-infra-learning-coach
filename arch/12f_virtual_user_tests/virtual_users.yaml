virtual_user_question: When the 3H virtual users go through the real gate, planner, replan, store and explanation, does the day the contracts describe come out?

primary_invariant: >-
  A virtual user is state, never an answer. Needs come from state the way the planner opens them,
  eligibility from the real gate, bands and selection from the real planner, and the explanation from the
  trace it wrote. A scenario that cannot be run against real code is named not runnable with its owner and
  is never simulated by hand again.


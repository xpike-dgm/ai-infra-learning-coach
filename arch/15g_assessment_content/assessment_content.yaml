purpose: unseen_items_for_every_published_objective_without_overwriting_anything_published

question: Yayımlanmış bir Objective'e, yayımlanmış hiçbir şeyi değiştirmeden, öğrencinin görmediği ve gerçekten aynı yeteneği ölçen yeni item'lar nasıl eklenir?

primary_invariant: >-
  An added item measures its Objective in a structure the learner has not seen, in a form that can produce the evidence
  the Objective requires, and ships only after an independent reviewer passed it. A supplement adds items, grown task
  versions, transfer items and wrong-option misconception keys and never overwrites anything published. A transfer claim
  is checked, never assumed, and a transfer item is reserved for the month's transfer slot. A wrong option names a
  misconception only where it follows from exactly that misconception of the key's own Objective.


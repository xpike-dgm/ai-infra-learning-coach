assistant_defaults:
  - the type scale follows Material 3's baseline sizes (nothing below 12sp, body 16sp) with heavier titles; a declared product default and a calibration input for 18 (VDSX-v0 §6.2)
  - mono is the platform monospace face; no font file is shipped
  - the chip is outlined, with the tone's own tone_* colour as label, mark and border on the surface beneath; every tone colour measured as text on surface and surface_variant in both themes (lowest 5.45:1, light pending on surface_variant)
  - one mark per tone — info neutral, play active, check positive_confirmed, look attention (not an alarm), refresh pending_unresolved, warning system_fault only
  - navigation icons — Learn a map pin, Progress a list; the star read as a rating or a reward (VDSX-v0 §11.1)
  - Topic and Skill display names are presentation copy keyed by logical id and follow the lessons' own terms; a Topic keeps its canonical scope even where only part of it is published; an Objective is named by its newest teach task's own title, or by its Skill, on every surface that names it
  - Learn groups Topics by the area in their logical id (topic.<area>.<name>) in a declared order, with the parallel-English note (UXIA-v0 §13)
  - the selected navigation item uses the active pair (secondaryContainer)
  - every screen pads itself to WindowInsets.safeDrawing and the activity asks for edge to edge on every level (Android 15+ enforces it for target SDK 35+)

found:
  - id: first_launch_crash
    what: the store reported Ready a moment before the opened store and today's facts reached the activity, so HealthBlockingSurface was asked to render with nothing blocking (requireNotNull) and the app crashed on its first launch
    resolution: AppHealth.atStartup keeps the app opening until the store and today's facts are both in hand
  - id: focused_flow_without_surface
    what: the task runner drew dark text straight on the launch theme's dark window background (android:Theme.Material), about 1.4:1
    resolution: CoachTheme wraps every screen in a Surface of the measured background; the launch theme is Theme.Material.Light with the light surface token, and values-night the dark one
  - id: material_baseline_purple
    what: the navigation bar and its indicator wore Material's baseline colours, close to the violet attention tone
    resolution: MaterialColorRoles maps all 36 Material colour roles to measured tokens and the theme copies the map
  - id: code_in_body_font
    what: VDSX-v0's mono role was used nowhere; lessons and prompts drew code in the body font
    resolution: TextBlocks finds code paragraphs (no markup ships) and AuthoredText draws them in mono; code and report fields are mono
  - id: chip_reads_as_button
    what: a filled rounded chip of an action's weight
    resolution: an outlined compact chip with a mark per tone
  - id: identifiers_on_screen
    what: content_explanation on Today, "learn_overview · study day 2026-10-26" as the Learn tab, Topics as "Expressions Io", Skills as "Standard Io Basic", Objectives as "explain pipeline", the study day as 2026-10-26
    resolution: DisplayCopy, CurriculumNames, ContentPort.lessonTitleFor, LearnScreen
  - id: off_rhythm_spacing
    what: 2dp and 6dp, and lists of blue text buttons
    resolution: Spacing steps only; NavRow
  - id: edge_to_edge_on_api_36
    what: the target device (API 36) enforces edge to edge for this target SDK while the emulator (API 34) did not, so the device would draw under the status bar
    resolution: enableEdgeToEdge on every level and ScreenColumn pads to the safe drawing area
  - id: identifiers_left_after_the_first_pass
    what: the independent review found the study day raw in the learning history and the assessment report, Objectives named by identifier on Skill detail, in the history, on the fast path and in a run's result, and Topics by English name on Skill detail
    resolution: HistoryDay.label and SessionReportView.dayLabel (DisplayCopy), SkillDetailFacts.objectiveTitles and HistoryFacts.objectiveTitles (ProgressQuery, LearningHistoryQuery with the content port), CoachApplication.objectiveName (lessonTitleFor), CurriculumNames.topic on Skill detail
  - id: fault_colour_on_input_validation
    what: Profile's minute and time fields painted Material's error colour (the fault tone) on a mistyped number, which is not a technical fault
    resolution: isError removed; the hint below the field already says what is wrong
  - id: gates_pinned_what_17a_changed
    what: three explanation tests asserted the English name of a shipped Skill, two tests the identifier label "trace loop", and one 16B check the history query's exact constructor
    resolution: narrowed, each marked "Narrowed at 17A"

code_paragraph_rule:
  paragraph: a run of non-blank lines; blank lines separate paragraphs and are not returned
  code_line: indented, starts with "$ " or ">>>", or has a code character (= ( ) { } [ ] ; < > | $ # * + / " ' `)
  prose_line: a multiple-choice option "A) ", four or more words of letters in a row, or a sentence ending (. ? !) with three or more words
  code_paragraph: at least one code line and at most half as many prose lines
  text_preserved: every non-blank line returned exactly as authored, in order
  prototype: 1481 shipped prompts and explanations; 56 paragraphs a first version called code were sentences about code and the sentence-ending rule moved all 56 to prose

theme:
  material_colour_roles: 36
  text_pairs_recomputed: 19
  non_text_pairs_recomputed: 4
  chip_pairs_recomputed: 6 tones x 2 surfaces x 2 themes
  fault_tone_roles: [error, errorContainer]
  material_type_slots: 15
  type_roles: [display, title_large, title, body_large, body, label, caption, mono]
  spacing_steps_dp: [4, 8, 12, 16, 24, 32, 48]
  only_other_dp_literal: the chip's 1dp hairline border (HAIRLINE)
  dynamic_colour: never consulted

learn:
  surface: learn_overview
  edge: learn -> topic_detail
  chip: TopicPresentation.chip, the very chip Progress shows
  grouping: area from the Topic's logical id, declared order python, c, linux, shell, git, english; an unknown area is "Diğer"
  forbidden: [count, ratio, n_of_m, percentage, area_state, completion, prerequisite_claim]

ports_and_facts:
  ContentPort.lessonTitleFor: a refinement of the content port with a default (null); FileContentSource reads the newest teach task's title
  TopicDetailFacts.objectiveTitles: defaulted; TopicQuery.detail fills it
  SkillDetailFacts.objectiveTitles: defaulted; ProgressQuery.detail fills it
  HistoryFacts.objectiveTitles: defaulted; LearningHistoryQuery fills it when given the content port


question: Uygulama, kabul edilmiş tasarım sisteminin söylediği gibi görünüyor mu — ölçülmüş renkler, rollerine göre yazı, kod için mono, düzenli aralık, durumu düğmeyle karıştırmayan çipler, kimlik değil kelime — ve Öğren sekmesi bana öğrenme haritasını gösteriyor mu, hiçbir görünüm bir durum, bir anlam ya da bir ilerleme iddiası eklemeden?

primary_invariant: >-
  The design system is applied and adds no meaning. Every Material colour role is a measured token and every Material
  type slot one of VDSX-v0's eight roles; no Material default reaches the screen. A paragraph that reads as code is
  drawn in the mono role and every authored line comes back exactly as written. A state chip is outlined, carries its
  tone's colour as label, mark and border, and one mark per tone says it without colour; it never reads as a button.
  Activity kinds, tracks, study days, Topics, Skills and Objectives are said in Turkish or left out — never an
  identifier, never a guess. Learn is the learning map: areas and Topics with the very chip Progress shows, each opening
  topic_detail; its order is orientation, never a prerequisite chain.


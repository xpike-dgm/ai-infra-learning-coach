acceptance_criteria:
  - every Material colour role is a measured token in both themes and the fault tone is Material's error role alone
  - every drawn Material pair and every chip colour is recomputed against the WCAG anchor in both themes
  - every Material type slot is one of VDSX-v0's eight roles, in sp; mono is the code role
  - code paragraphs are drawn in mono and no authored line changes
  - a state chip is outlined, has its tone's mark and states its label as text; only the fault tone has the warning mark
  - no identifier reaches the screen where 17A found one; an unknown value is left out or falls back to the authored name
  - Learn shows areas and Topics with Progress's chips, opens topic_detail through the accepted edge and claims no order, count or completion
  - the app does not crash on first launch; a shell-less health always has something blocking
  - every screen sits on a measured surface and the safe drawing area; edge to edge is asked for on every level
  - nothing adds a state, a severity, a percentage, a progress bar, a rank or a streak
  - earlier gates still pass, narrowed only where 17A changed what they pinned



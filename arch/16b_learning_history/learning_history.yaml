  gates:
    - {file: tools/validate_mastery_engine.py, checks: [E12A-05_gate_no_unresolved_verification, E12A-07_first_contradiction_keeps_mastery, E12A-07_failed_recheck_resolves, E12A-07_contradiction_needs_eligible_evidence, E12A-10_watermark_before_evidence], added: [E12A-07_positive_recheck_keeps_mastery]}
    - {file: tools/validate_retention.py, checks: [E13C-08_replay_mirrors, E13C-08_mastery_rebuild_same_rule]}
    - {file: tools/validate_remediation.py, checks: [E13D-09_timeline_mirrors]}
    - {file: tools/validate_replan.py, checks: [E12D-09_latest_body_read, E12D-09_newest_by_sequence, E12D-09_count_is_the_plans_own], why: "the plan reading moved into planOf so planVersions reads every version the same way"}
    - {file: tools/validate_reason_codes.py, checks: [E12E-04_latest_body_read, E12E-04_rows_in_position_order]}

open_loops:
  replay_cost: {owner: 18E, note: "the history replays three engines per evidence row (quadratic in a Skill's rows, the mastery replay inside is quadratic too); fine for one learner's months, to be measured on the device"}
  recheck_spread_before_mastery: {owner: 18C, note: "a contradiction recorded before mastery but still in the window can be named among the ones a later verification opened by"}
  weekly_slot_session_id: {owner: 16D, note: "a slot counts as answered only by evidence carrying the session's id; the app path that serves weekly slots must pass it"}
  rules_change_retroactively: {owner: recorded, note: "the history is read under today's engine rules and today's dispositions (user decision); an older wording is not kept"}
  topic_weakness_english_views: {owner: 16C}
  t6_and_device: {owner: 19}


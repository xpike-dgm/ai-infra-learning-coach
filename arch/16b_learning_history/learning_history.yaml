model: LHRX-v0
stage_step: 16B
status: accepted_16b
decision: D-123
implements: [SPWX-v0, ASUX-v0, GRE-v0, LFPS-v0]
engines_read: [MSTX-v0, RVRX-v0, WLRX-v0, PCRX-v0]
persistence: [LFPS-v0, DDM-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: what_happened_and_what_it_changed_across_time_read_from_evidence_never_a_streak_or_a_grade

question: Zaman içinde ne oldu ve neyi değiştirdi — saklanan kanıttan, motorların kendi kararlarıyla, hiçbir günü kaçırılmış ya da hiçbir oturumu not almış saymadan?

primary_invariant: >-
  The learning history is the stored evidence in recording order, each row with what the canonical engines — replayed
  over exactly the evidence up to it, on its own study day — say it changed, in the program change report's own words.
  The assessment report is each session's ASUX-v0 families: the changes its own rows caused, what it could not measure,
  and the plan version its recompute wrote. Nothing is written, nothing is scored, a day without an entry is not drawn,
  and a change no engine made cannot be said. Rebuilding mastery from the same evidence gives the same answer.

user_decisions:
  approval: explicit_user_approval_2026-10-17
  what_changed_source: replay_engines_over_stored_evidence_no_new_table
  scope: learning_history_and_longitudinal_assessment_report
  stored_text: no_tutor_or_learner_text_assistance_levels_only_working_session_unstored
  delivery: core_and_real_compose_screen
  engine_fix: fix_mastery_recheck_inside_16b_declared_2026-10-18

assistant_defaults:
  - a history entry is one evidence row; families are assessment (inside a session), remediation (while open or the row that closed it), review (the Skill was mastered before the row), learning (otherwise), the first that applies
  - a session's state changes are the changes its own rows caused, each named once — a net diff would credit a session whose slots spread over days with the other work in between
  - the plan version a session wrote is the first replan whose trace watermark covers the session's last row, before the next evidence, on the same study day; without one no plan change is claimed
  - a ready blueprint slot counts as answered only by evidence carrying that session's id
  - outcomes are worded as what happened (beklenen sonuç / beklenen sonuç değil / kısmen / ölçülemedi), never as a verdict

declared_extensions:
  - {what: "MasteryEngine.VerificationState and MasteryEngine.replay; RebuildMastery and MasteryTimeline decide mastery from the evidence in recording order", corrects: "12A's MSTX-v0 hysteresis", why: "a rebuild continued from the stored axis treated the contradiction that opened a verification as a failed recheck: a second rebuild of the same evidence, or a passed fresh recheck, took mastery away (GRE-v0 §16.2 says a positive recheck keeps it)"}
  - {what: "EvidenceRow.attemptId and EvidenceRow.assistanceLevels, read by the adapter", extends: "12A EvidenceRow (precedent: 13F assessmentSessionId, 14A solutionExposed)"}
  - {what: "PersistencePort.planVersions() and PersistencePort.assessmentSessions(), defaulted", extends: "12D latestPlan, 13A latestAssessmentSession (port refinements, port count unchanged)"}

mastery_fix:
  rule:
    - only evidence recorded after the contradiction that opened a verification is a fresh recheck
    - no fresh check — mastery is held and the verification stays open, however often it is rebuilt
    - a fresh clean contradiction — the verification resolves negatively and the gates decide on the evidence as it is
    - a fresh clean positive — the verification closes, the opening contradiction leaves the score window as noise, mastery is kept
    - assisted, provisional, contested, contaminated or solution-exposed work is never a recheck
  idempotent: true
  previous_axis_read: false
  found_by: the 16B replay — a session's per-row replay disagreed with the batch recompute, and two recomputes of the same evidence disagreed
  tests_corrected: ["MasteryEngineTest: a failed recheck resolves the verification and lets the gates decide again (it had no fresh recheck in its input)"]

scope:
  schema_changed: false
  migration_added: false
  new_truth_table: false
  ports_changed: refinements_only
  boundaries_changed: false
  mastery_rule_changed: corrected_to_gre_v0_16_2
  retention_rule_changed: false
  weakness_rule_changed: false
  planner_rule_changed: false
  conversation_text_stored: false
  working_session_stored: false
  screen_drawn: true

history:
  families: [assessment, remediation, review, learning]
  entry_fields: [sequence, study_day, skill, objective, family, evidence_kind, outcome, assistance_levels, attempt, assessment_session, changes]
  changes_vocabulary: StateChangeKind (PCRX-v0)
  change_sentences: ProgramChangeCopy.stateTemplates (13E)
  replay: {writes_truth: false, writes_projections_to_store: false, empty_prefix_is_a_known_start: true, day_is_the_row_s_own: true}
  days_without_entries_drawn: false
  streak_or_attendance: false

assessment_report:
  families: [confirmed_capabilities, verification_needed, persistent_targeted_gaps, retention_revalidated, not_reliably_measured, plan_changes]
  not_reliably_measured_reasons: [invalid_item, provisional_evaluation, assisted_attempt, solution_exposed_attempt, contested_item, unsubmitted_slot]
  grade_or_score: false
  trend_line: false
  nothing_changed_said_plainly: true
  unfound_plan_claimed_unchanged: false

found:

environment:
  learner: wsl_ubuntu
  compiler: gcc 15.2
  standard: c11
  warnings: [-Wall, -Wextra]
  sanitizers: [-g, "-fsanitize=address,undefined", -fno-omit-frame-pointer, -fno-sanitize-recover=all]
  run_options: "ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=0"
  stack_use_after_return_default: >-
    gcc 15.2's libasan already detects it by default (ASAN_OPTIONS=help=1 shows true), unlike Google's wiki; the option
    is set explicitly so the result does not depend on the runtime's default
  leaks: off — not an Objective of 15D, and a leak report would fail a correct basic program that does not free
  installed_by: user (15C); nothing new installed


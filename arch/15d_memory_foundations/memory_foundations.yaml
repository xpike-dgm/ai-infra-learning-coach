question: Bir erişimin geçerli olup olmadığı nasıl doğrulanır — tanımsız bir programın çıktısı hiçbir şey kanıtlamazken?

primary_invariant: >-
  A key about memory is what the program really does, and a use of memory that no longer exists is judged by what
  AddressSanitizer reports, never by what an undefined program happens to print. The learner's build is the checked
  build — the same sanitizers, the same run options, a clean exit required — so a solution that reads dead memory
  fails even when its output was right. Every suite tells a right solution from a plausible wrong one, and no earlier
  package reads differently.


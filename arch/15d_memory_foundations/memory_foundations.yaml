clean_exit_rule: >-
  Every suite test expects exit code 0. It is defensive: a sanitizer report aborts the program before buffered stdout
  is written, so a solution that reads dead memory already fails on its output; no shipped wrong solution can tell the
  rule apart, so it is checked statically by the validator (E15D-05) and not counted as a mutant.


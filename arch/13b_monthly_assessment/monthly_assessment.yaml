monthly_question: What, beyond what the week can see, is worth measuring again this month, and how is it measured without the monthly label adding weight, extending a day or turning a missed month into debt?

primary_invariant: >-
  A month is a wider window, not a heavier exam. What is worth measuring still comes from state, one Skill is
  measured once, a critical Skill is revalidated only for a reason, a monthly label adds no evidence weight, the
  month adds no minutes and no queue of its own, and a month that passed without its assessment leaves nothing
  behind.


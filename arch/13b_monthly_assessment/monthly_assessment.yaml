living_gates_narrowed:
  - {check: E13A-00_exists, to: reads BlueprintCodec.kt, BlueprintAssessment.kt, BlueprintAssessmentSession.kt, AssessmentBlueprint.kt and BlueprintComposer.kt}
  - {check: E13A-04_statuses_and_result, to: common BlueprintSessionStatus, common data classes and the composer's result, with codes bound to the weekly constants}
  - {check: E13A-06_pool, to: onePerSkill in the composer called with the weekly selection order; BlueprintExclusion names}
  - {check: E13A-06_exclusions_equal_contract, to: the five weekly exclusions still first and unchanged}
  - {check: E13A-07_item_selection, to: the composer's scope-parametric slotFor, plus the weekly engine passing WEEKLY_BLUEPRINT}
  - {check: E13A-08_planning, to: the composer's slotCandidates and BlueprintSlots, plus weekly cycle bound to WeeklyCycle.of}
  - {check: E13A-09_composition, to: ComposeAssessmentBlueprint's scope-generic text, plus codes bound to the weekly constants}
  - {check: E13A-11_schema_version_3, to: version 3 still 13A's and every later version owned by its contract}
  - {check: E13A-11_codec_strict, to: the shared strict reader, plus the weekly codec calling it with its own format}
  - {check: E13A-12_engine_core_only, to: core.model or the same module's composer}
  - {check: E13A-13_item_fields, to: Set<SlotRole>}
  - {check: E13A-14_one_interior, to: the view taking the blueprint's own scope}


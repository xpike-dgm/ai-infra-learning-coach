open_loops:
  disposition_staleness: {owner: 16D, note: "a correction appended after the row was built is not seen as newer evidence; the app path that records a disposition recomputes"}
  reverse_invalidation: {owner: 18E, note: "a prerequisite Skill that changes does not re-assemble its dependents' stored rows; the read asks the gate again"}
  assessment_opportunity_producer: {owner: 16D, note: "nothing composes a session for a Skill in the app yet"}
  topic_weakness_english_views: {owner: 16C}
  history_and_assessment_report: {owner: 16B}
  skill_detail_to_planner_explanation: {owner: 17, note: "not an accepted IA edge"}
  offline_state: {owner: recorded, note: "Progress needs no network, so offline_local_capable is never produced"}
  objective_labels: {owner: 17, note: "Objectives carry no statement in the store; the label is the id's action"}
  t6_and_device: {owner: 19}


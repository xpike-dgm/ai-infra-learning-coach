derivation:
  owner: core-model/src/main/kotlin/coach/SkillPresentationFacts.kt
  function: SkillPresentationProjection.derive
  states: [remediation_required, confirmation_verification_due, confirmed_review_due, confirmed_current, prerequisite_unresolved, developing_independent, developing_with_support, not_yet_evidenced]
  precedence_is_enum_order: true
  rules:
    - {rule: 1, when: "weakness_axis_state == remediation_required", state: remediation_required}
    - {rule: 2, when: "mastery == confirmation_verification_due, or mastery == confirmed_current and retention == verification_due", state: confirmation_verification_due}
    - {rule: 3, when: "mastery == confirmed_current and retention == review_due", state: confirmed_review_due}
    - {rule: 4, when: "mastery == confirmed_current and retention in fresh|stable|at_risk", state: confirmed_current}
    - {rule: 5, when: "mastery in not_yet_evidenced|developing_with_support and the gate says new work waits", state: prerequisite_unresolved}
    - {rule: 6, when: "mastery == developing_independent", state: developing_independent}
    - {rule: 7, when: "mastery == developing_with_support", state: developing_with_support}
    - {rule: 8, when: otherwise, state: not_yet_evidenced}
  recomputing_when:
    - evidence was recorded after the stored row was built (projection stale)
    - evidence exists and the mastery axis is unwritten
    - evidence exists and the weakness axis is unwritten
    - mastery is confirmed_current and retention is untracked or not_yet_evaluated
    - a rule-5 Skill and no gate answer
  no_evidence_reads_as: {mastery: not_yet_evidenced, weakness: none}
  stored_value_when_recomputing: not_yet_evaluated
  ninth_state: false
  qualifiers: [retention_at_risk, requires_independent_recheck, contested_evidence_present, provisional_evaluation_present]
  at_risk_is_a_state: false

evidence_kinds:
  order: [not_counted, provisional, assisted, independent]
  not_counted: "outcome invalid, evaluator invalid, contested, or prerequisite contaminated"
  provisional: "evaluator provisional"
  assisted: "independence assisted, practice_only or requires_independent_recheck, or a solution shown before the attempt"
  independent: otherwise
  merged_into_one_count: false

progress_states: [loading_projection, recomputing_projection, ready_with_evidence, empty_no_evidence_yet, empty_no_attention_needed, partial_projection_available, offline_local_capable, ai_unavailable_full_state_available, error_recoverable, data_recovery_required]
attention_groups: [remediation_open, verification_due, review_due, retention_at_risk, prerequisite_blocked, assessment_opportunity]
attention_group_without_producer: assessment_opportunity

skill_detail:
  present: [skill_ref, display_name, primary_presentation_state, attention_qualifiers, mastery_axis_state, retention_axis_state, prerequisite_axis_state, weakness_axis_state, objective_level_breakdown, evidence_summary, prerequisite_context, related_topic_placements]
  deferred:
    evidence_history_entry: 16B
    remediation_context: 16C
    integration_or_english_context: 16C
    planner_explanation_entry: "the IA has no skill_detail -> planner_explanation edge (17)"

counting:
  inventory_counts_skills_per_state: true
  ratio: false
  percentage: false
  bar_or_gauge: false
  per_group_count: false
  recomputing_counted_apart: true


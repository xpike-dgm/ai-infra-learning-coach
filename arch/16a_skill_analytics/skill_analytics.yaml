model: SKAX-v0
stage_step: 16A
status: accepted_16a
decision: D-122
implements: [SPWX-v0, TEPM-v0, VDSX-v0, WFPX-v0]
engines_read: [MSTX-v0, RVRX-v0, WLRX-v0, PRQX-v0]
persistence: [LFPS-v0, DDM-v0, LDBX-v0]
boundaries: MSBX-v0
purpose: what_the_learner_has_demonstrated_and_what_needs_attention_per_skill_from_canonical_state

question: Gerçekte neyi kanıtladım ve neye dikkat etmem gerekiyor — her Skill için, motorların yazdığından fazlasını iddia etmeden?

primary_invariant: >-
  A Skill's learner-facing state is SPWX-v0's one precedence over the four axes their own engines wrote, decided by
  one function that both the stored row and the screen use. Where an axis a rule needs is unwritten, or evidence is
  newer than the row, the Skill is recomputing — never a guessed state and never a ninth one. Progress counts current
  state as an inventory and never divides it, and only the engines decide what happens next.

user_decisions:
  approval: explicit_user_approval_2026-10-17
  scope: skill_projection_detail_and_overview_topic_weakness_english_in_16c_history_in_16b
  delivery: core_and_real_compose_screen_reading_the_store
  unevaluated_axis: recomputing_never_guessed

assistant_defaults:
  - at_risk on a confirmed Skill keeps confirmed_current and rides as a qualifier (RVR-v0 §2; TEPM-v0 §4.1 rule 4 lists fresh|stable)
  - prerequisite_axis_state is the gate's eligibility for new work on the Skill from the graph alone (PRG-v0 §7); invalid prerequisite metadata also waits and is named as a metadata problem, not as a blocker Skill
  - the Progress read asks the gate again rather than trusting the stored prerequisite axis (dependents are not re-assembled, 18E)
  - Skills are grouped by their id namespace for orientation, with no per-group count
  - a blocker opened from skill_detail replaces the shown Skill on the same surface (no new navigation edge)
  - working Turkish microcopy for axis values, evidence kinds and attention groups (17 owns the polish); the eight state labels are SPWX-v0 §4.3's

declared_extensions:
  - {what: "SkillPresentationState and its derivation (SkillPresentationProjection) live in core-model", why: "core-application writes the stored column and core-presentation projects the screen; MSBX-v0 lets neither depend on the other, and two copies would be two answers", precedent: "WeaknessAxis.of in core-model (13D)"}
  - {what: "AssembleSkillState writes prerequisite_axis_state and primary_presentation_state at the end of RecomputeSkillState", extends: "12B's 'assembling that row belongs where recomputation is orchestrated'; closes 16C's prerequisite_axis_state loop"}
  - {what: "every skill_state writer derives primary_presentation_state from the axes the row now has", replaces: "12A's mastery value in the presentation column and 13C/13D's carried presentation"}


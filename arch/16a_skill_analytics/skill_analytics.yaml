forbidden_patterns:
  - a percentage, ratio, bar, gauge, level, rank or score of competence
  - a ninth Skill state, or at_risk as one
  - a state guessed for a Skill whose axes do not determine one
  - a stale row shown as current
  - a second derivation of the eight states
  - assisted, provisional or contaminated evidence shown as independent
  - a domain score or a per-group count
  - Progress deciding what to do next

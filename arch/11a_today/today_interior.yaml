device_verification:
  target_device: Poco M6 Pro
  device_connected: false
  t6_run: false
  claimed: false
  note: >-
    the phone was not connected during 11A either; nothing is claimed about how Today renders,
    announces its state or scrolls on the device.

not_verified:
  - Today rendering on the device, including TalkBack traversal order and the announced state change
  - the screen at 200% text scale on a real display
  - any Today state other than the empty and loading ones on a real store, because no planner writes plans yet
  - that the refresh on resume actually re-reads after a real midnight rollover on the device

known_limits:
  - {limit: no plan can be read until the planner writes rows whose columns exist, owner: 12}
  - {limit: capacity has no storage and no settings surface, owner: 16D}
  - {limit: curriculum ingestion is not implemented; the store reports nothing published, owner: 11D}
  - {limit: starting a task does nothing yet; the Task Runner entry is the next step, owner: 11B}
  - {limit: supporting navigation routes are rendered but open nothing yet, owner: 11B-11E}
  - {limit: Turkish text is working microcopy, owner: 14}

forbidden_today_patterns:
  - rendering_a_plan_from_another_study_day
  - offering_a_blocked_task_as_startable
  - listing_blocked_work_as_a_permanent_backlog
  - showing_the_previous_plan_while_replanning
  - rendering_plan_rows_while_the_store_needs_recovery
  - resuming_a_session_that_was_not_revalidated
  - showing_a_reason_the_planner_never_recorded
  - free_text_reason_field
  - deriving_a_capacity_verdict_in_the_presentation
  - letting_ai_absence_supersede_a_valid_local_plan
  - repeating_the_primary_task_as_a_competing_attention_entry
  - implying_mastery_or_readiness_from_an_empty_day
  - a_mastery_percentage_score_streak_or_rank_field_on_a_row
  - inventing_a_capacity_the_learner_never_chose
  - inventing_a_plan_the_planner_never_produced

future_stage_boundaries:
  11B: task_runner_entry_and_start_action
  11C: resume_checkpoint_content_and_session_state
  11D: curriculum_ingestion_and_daily_micro_quiz
  12: planner_and_mastery_engines_writing_plans_traces_and_capacity_summaries
  13: assessment_session_interior
  14: final_microcopy_and_offline_state
  16D: capacity_settings_and_profile_controls
  17: accessibility_polish_on_device


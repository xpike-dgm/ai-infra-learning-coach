model: PRVX-v0
stage_step: 14G
status: accepted_14g
decision: D-111
implements: [AIAX-v0, LEARNING_BEHAVIOR_RULES, MSBX-v0, TVSX-v0]
builds_on: [TUTX-v0, CDEX-v0, ACCX-v0, OREX-v0, APHX-v0]
boundaries: MSBX-v0
purpose: the_first_real_provider_call_behind_the_ports

scope:
  provider_client: true
  router_by_task_class: true
  key_on_device_encrypted: true
  settings_screen: true
  connection_check: true
  code_evaluation_instructions_in_core: true
  schema_changed: false
  core_names_a_model: false
  developer_key_shipped: false
  backend_proxy: false
  second_provider_or_model: false
  background_retry: false
  live_call_in_any_check: false
  live_call_run_by_claude: false

question: AI gerçekten nasıl çağrılır — ve ürünün hiçbir şeyi ona bağlı kalmadan nasıl çalışır?

primary_invariant: >-
  The provider is a replaceable detail behind the ports. Only the learner's own key, kept encrypted on this device,
  can make a call; without it nothing leaves the device and nothing in the product stops working. What is sent is
  exactly what core built — its instructions, its message, its schema — and nothing the provider says becomes an
  answer unless it is one schema-exact object; a refusal is a refusal, a timeout ends the call, and nothing is retried
  behind the learner's back.

user_decisions:
  date: "2026-10-02"
  provider: openai
  fallback: single_provider_uniform_degradation
  key_entry: small_settings_screen_in_14g

provider:
  name: openai
  api: responses
  endpoint: https://api.openai.com/v1/responses
  reply_format: json_schema_strict
  store: false
  refusal_shape: output_message_content_type_refusal
  incomplete_content_filter: refused
  reference_checked_on: "2026-10-02"
  reference: [developers.openai.com/api/reference/resources/responses/methods/create, developers.openai.com/api/docs/guides/structured-outputs, developers.openai.com/api/docs/models]

router:
  task_classes: [tutor_help, open_response_evaluation, code_evaluation]
  default_model: gpt-6-astra
  why_default: "AIAX-v0 §8.1 puts open-response evaluation and explanation/hint/feedback in the quality tier; the reference names gpt-6-astra the flagship"
  model_lives_in: ProviderConfig

budget:
  end_to_end: true
  default_millis: 60000
  max_attempts: 2
  retried: [io_failure, http_408, http_429, http_5xx]
  never_retried: [refusal, invalid_response, key_rejected, http_4xx_other, timeout]
  background_retry: false

taxonomy:
  no_key: unavailable
  http_401_403: unavailable_key_rejected
  timeout_or_budget_spent: timed_out
  io_408_429_5xx_after_attempts: transport_error
  other_4xx: transport_error
  refusal_or_content_filter: refused
  not_exactly_one_json_object: invalid_response
  schema_mismatch_in_reply: invalid_response

key:
  storage: android_keystore_aes_gcm_ciphertext_in_no_backup_dir
  plain_storage: false
  shown_after_entry: false
  logged: false
  backed_up: false
  in_export: false
  removed_returns_null_path: true
  read_on_main_thread: false

network_permission:
  ai_build: internet
  no_ai_build: none

renamed_tests:
  - {gate: E10E-12_test, before: "an adapter without call sites degrades to evaluation pending instead of throwing", after: "without a client or a key the evaluator is unavailable, never a crash and never a verdict"}
  - {gate: E14A-12_adapter, before: "an adapter without a call site is unavailable, never a crash and never a reply", after: "without a client the tutor is unavailable, never a crash and never a reply"}

port_count: 5
port_refinements: []
schema_version: 8


  client: {file: android/ai-adapter/src/test/kotlin/coach/ai/OpenAiResponsesTest.kt}
  tutor: {file: android/ai-adapter/src/test/kotlin/coach/ai/AiTutorTest.kt}
  evaluator: {file: android/ai-adapter/src/test/kotlin/coach/ai/AiEvaluatorTest.kt}

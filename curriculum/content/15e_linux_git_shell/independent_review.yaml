reviewer: independent_15e_content_review
date: "2026-10-03"
method: >-
  Read package.yaml, notation.yaml and all 5 Skill files in full (5 Objectives, 41 items = 40 keyed shell items + 1
  rubric, 35 explanation forms, 15 misconceptions, 23 lesson checks), the 15D and 15C independent_review.yaml files
  for format and rule, 15C's terminal Skill (pwd, cd, ls, mkdir, mkdir -p), FBB-v0 §6.4, the 17 hard/soft edges of
  6c_foundations/prerequisite_edges.yaml that touch the five Skills (all draft, review_status reviewed; the package
  publishes the 6 internal hard ones), and the builder's run_shell, SHELL_PRELUDE, the shell verify mode (code +
  optional probe, last_line, outcomes) and constructs_used. The build was run once with --report to a scratch path
  only (no --out; nothing but this file was changed): all 40 keys, 23 lesson checks and the construct scan pass there,
  0/41 items validated for lack of this review. Environment: WSL Ubuntu 26.04.1 LTS x86_64, bash 5.3.9, git 2.53.0,
  GNU grep 3.12; the default coreutils on this Ubuntu are uutils 0.8.0 (ls, cat, wc, head, tail, sort, uniq, mkdir are
  Rust), GNU coreutils 9.7 is installed as gnu*; installed locales are only C, C.UTF-8 and POSIX (LANG=C.UTF-8); this
  WSL has no ~/.gitconfig. Every keyed item was solved by hand first, then its shown commands were run by my own
  driver (not the author's verify blocks or probes) in fresh mktemp directories, capturing stdout, stderr and the last
  status separately, followed by my own probes (file contents, porcelain codes with cat -A, git show HEAD:file,
  existence tests, separate stdout/stderr runs) in four environments: (1) the package prelude; (2) the prelude with
  GNU coreutils first on PATH; (3) a learner shell with no prelude, a fresh HOME where git config --global
  user.name/user.email was set as the repository_status_diff lesson asks, LC_ALL unset; (4) a learner who skipped that
  step. Keys hold identically in (1)-(3); hashes differ only. What a learner sees in a terminal (colours, pager, ls
  columns, git init's hint, git log decoration) was observed with script(1) in a pseudo-terminal. Every multiple-
  choice item was checked for exactly one true option against the observed facts. The same-second, same-size Git cases
  (repository f03, f08; stage f04, f06) were repeated 30 times on ext4 and 8 times on /mnt/c (drvfs): stable. All 23
  lesson checks were re-run in environments (1)-(3) and print what they claim (stdout). Every claim in the 35
  explanations was re-run with uutils and with GNU coreutils (exit statuses of ls on a missing file 2, mkdir on an
  existing dir 1, grep with no match 1, git commit with nothing staged 1; stdout vs stderr; sort text order and sort
  -n; wc -l format; uniq adjacency; '> f 2>&1' vs '2>&1 > f'; pipeline status; git status --short codes A_, M_, _M,
  MM, ??; git diff and git diff --staged; git init output with and without -q). Constructs were scanned with the
  notation.yaml patterns twice: with the build's mask (double-quoted text emptied, then the strip list) and with a
  strict mask (only hazırlık lines and comments removed), allowed set = own Skill + transitive hard-prerequisite
  closure (15A program_execution_model, 15C terminal Skill) + declared required_skills (plus closures); items, all
  options (including scan_options false ones, for information), lesson checks and the $-lines of the lesson texts were
  scanned, and each item was judged for semantic prerequisites the patterns cannot see. Each item was compared with
  its own Skill's canonical, prerequisite_refresh, state_trace, worked_example, contrast texts and lesson checks under
  the 15A-15D leakage rule. Misconception open_questions were read for neutral wording, and the shipped asset
  curriculum_package_v5.txt was read for the item prompts (commands, '# hazırlık' lines and option texts shown
  exactly; no stray backslash escapes; 41 items, 40 answer keys, 1 rubric with 4 criteria, 35 explanations, 15
  misconceptions, 6 prerequisite edges).

  Second pass (same day): the author made process_exit f07 a zero/non-zero outcome item (shown code unchanged) and
  removed 'mkdir zaten var olan bir klasör için 1 döner' from the process canonical; changed r1's prompt ('Arkadaşın
  bunu ne zaman ve nasıl kontrol etmeli, neden?') and gave it evidence_type: explanation; rewrote parts of the
  repository_status_diff canonical (git init's hint lines and -q, optional init.defaultBranch main, 'Author identity
  unknown', the ' M' wording, run in bash, identity needed for commits) and its new_file_is_tracked contrast; added an
  identity reminder to repository f03's prompt; and added the identity setup, the (HEAD -> master) label and 'gibi bir
  mesaj' to the stage_commit canonical. The asset was regenerated with --out (it carries the first-pass verdicts: 39
  validated, f07 and r1 candidate). My driver was re-run on all 40 keyed items in the prelude, prelude + GNU coreutils
  and learner-with-identity environments and diffed against the first pass: the only change is f07's key (A); all
  other output is identical except commit hashes. All 23 lesson checks were re-run in the three environments (69/69
  print what they claim), and the construct scan was repeated (no hidden construct; same lesson notes). Every changed
  claim was re-run in WSL with an empty HOME: git init without -q (Initialized line on stdout, 13 'hint:' lines on
  stderr), git init -q (nothing), init.defaultBranch main (no hint; 'On branch main', '(HEAD -> main)'), git commit
  without identity (status 128, 'Author identity unknown' ... 'fatal: empty ident name'), ' M' after add-then-change
  (MM), git add making a new file tracked ('A  n.txt', git ls-files), f07 in a pseudo-terminal (stderr line, then 1)
  and with GNU mkdir (1), stage f05 with init.defaultBranch main (key 1 unchanged). The asset was read again for the
  changed prompts, options, evidence types and texts. All other entries are unchanged from the first pass except notes
  made stale by the fixes.
items:
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f01: {verdict: pass, note: "in_lesson; key 1 verified (bash 5.3; last stdout line). Same as lesson check 2."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f02: {verdict: pass, note: "Key 5 verified. Isomorph of the state_trace's bash -c 'exit 6' with a new value; fine at basic."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f03: {verdict: pass, note: "Key A verified: stdout empty, stderr is exactly the quoted line (same text from uutils 0.8 ls and GNU 9.7 ls), status 2. Exactly one option true. My probe (separate stdout/stderr files and the status) and the author's probe agree; it measures exactly the two asked facts. The canonical states both facts for this very case ('No such file or directory' goes to stderr; ls returns 2 for a missing file): named-instance isomorph, acceptable at basic."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f04: {verdict: pass, note: "Key 0 verified. A new combination: a failing status is replaced by the next (successful) command's status before echo $? looks (status_stays). Declares the terminal Skill for mkdir."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f05: {verdict: pass, note: "Key A verified (stdout yazdim, status 7). Exactly one option true (B and C share the outcome 'basarili 7', which cannot occur; harmless). Isomorph of the worked_example (echo yarisi bitti; exit 9) and the canonical's selam/exit 4 example with new values: the authentic_application label is generous."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f06: {verdict: pass, note: "Key 0 verified (mkdir is silent and ends with 0 in uutils and GNU). It is the canonical's own example ('mkdir yeni_klasor sessizce 0 ile biter') with the folder renamed, and the prompt adds 'mkdir ekrana hiçbir şey yazmadı': a renamed isomorph that passes at basic, but the authentic_application label is not earned (f04 already covers this level). Relabel basic or replace with a structurally new case."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f07: {verdict: pass, note: "First pass failed: a no-terminal item keyed with the exact number 1 that only the canonical stated for this case ('mkdir zaten var olan bir klasör için 1 döner'), contradicting the lesson's own '0 başarı, 0'dan farklısı başarısızlık' and labelled transfer. Second pass: the shown code is unchanged, the question is now 'echo $? ne gösterir?' with outcome options (A non-zero because the folder exists; B 0, mkdir silent on an existing folder; C 0 because $? shows the first mkdir; D nothing), and the canonical's mkdir-1 sentence is gone (only ls's 2 remains as the example of program-defined numbers). Key A verified: the shown echo $? prints 1 (uutils and GNU; stderr 'mkdir: dosyalar: File exists' / 'cannot create directory'); exactly one option true (D is false: echo $? always prints). No leakage: no lesson text or check of this Skill shows mkdir on an existing folder; the learner needs 15C's 'mkdir -p ... varsa hata vermez' (plain mkdir fails), the zero/non-zero rule and status_stays (distractor C): an integration, transfer label acceptable. Note: the probe does not read the shown echo $? line but re-runs both mkdirs in a fresh subfolder after an && chain (a failure of mkdir -p tekrar or cd would also print sifirdan_farkli); it measures the same fact and I verified the shown line directly, but reading the shown output (e.g. a probe on the previous stdout line) would be tighter."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.f08: {verdict: pass, note: "Key A verified (stdout bitti, stderr uyari, status 0). Exactly one option true; D (writing to stderr makes the status 1) is a good distractor. Near isomorph of lesson check 5 (echo duz; echo hata >&2) plus exit 0: the transfer label is generous. The >&2 inside the single-quoted program is removed by the notation's quote strip (redirect_stderr is pipeline_redirection's), but the process canonical teaches reading '>&2' inside quotes, so nothing is hidden."}
  item.linux.process_exit_stdout_stderr_basic.classify_process_outputs.r1: {verdict: pass, note: "First pass failed: criterion check_right_after asked for a reason ($? changes after every command) that the prompt did not ask, and the item was filed as system_observation evidence. Second pass: the prompt now asks 'Arkadaşın bunu ne zaman ve nasıl kontrol etmeli, neden?', which is exactly what check_right_after judges, and the item declares evidence_type: explanation (the asset now carries evidence_type=explanation; the Objective accepts it). The scenario (silent failure with status 3) is the reverse of the canonical's silent-success example; four content criteria, each matching one question of the prompt. Minor, unchanged: output_is_separate holds two judgements, and the criteria restate the output_means_success and status_stays contrasts closely (a new scenario, so it passes under the rule)."}
  item.shell.command_options_redirection_basic.construct_simple_command.f01: {verdict: pass, note: "in_lesson; key 'merhaba dunya' verified (cat prints merhaba and dunya on two lines; the prompt asks for them joined by one space, which the probe reproduces). Same as lesson check 1."}
  item.shell.command_options_redirection_basic.construct_simple_command.f02: {verdict: pass, note: "Key silgi verified. Isomorph of lesson check 2 (uc/dort) and the canonical's ay.txt example with new values; fine at basic."}
  item.shell.command_options_redirection_basic.construct_simple_command.f03: {verdict: pass, note: "Key '3 gun.txt' verified (uutils and GNU wc print no padding for one file). Isomorph of lesson check 3 with three lines; basic."}
  item.shell.command_options_redirection_basic.construct_simple_command.f04: {verdict: pass, note: "Key 100 verified (text order 100, 12, 9; identical with uutils sort, GNU sort and in the learner's default locale). Applies the canonical's 40/5 paragraph and the sort_is_numeric contrast with new values plus a redirect and head: named-rule application, fine at authentic_application."}
  item.shell.command_options_redirection_basic.construct_simple_command.f05: {verdict: pass, note: "Key '3 hepsi.txt' verified. Semantic gap: cat with two file arguments (concatenation) is not taught in this Skill ('cat dosya → dosyanın içeriğini yazar'); pipeline_redirection's worked example is the first text that says it. Hands-on, so the learner sees 3, but a learner who predicts could say 1 or 2. Add one clause to the canonical ('cat a.txt b.txt iki dosyayı arka arkaya yazar')."}
  item.shell.command_options_redirection_basic.construct_simple_command.f06: {verdict: pass, note: "Key mart verified. tail then head through a file: a new combination."}
  item.shell.command_options_redirection_basic.construct_simple_command.f07: {verdict: pass, note: "Key '3 icerik.txt' verified (also on /mnt/c). In a terminal 'ls kutu' shows 'a  b  c' on one line (15C taught the columns), but into a file ls writes one name per line; no lesson says so. Hands-on, so the learner observes 3, but a predicting learner would answer '1 icerik.txt': the untaught fact is what makes it look like transfer. Name it in the canonical (ls bir dosyaya ya da boruya yazarken her adı ayrı satıra yazar) or note it in the item."}
  item.shell.command_options_redirection_basic.construct_simple_command.f08: {verdict: pass, note: "Key A verified (bash: 'yok_klasor/dosya.txt: No such file or directory', status 1, neither yok_klasor nor dosya.txt exists afterwards). Exactly one option true. It asks back the canonical's sentence '> ... klasörü kendisi oluşturmaz' (a named rule without a command example): passes as named-rule application, transfer label generous."}
  item.shell.pipeline_redirection.demonstrate_capability.f01: {verdict: pass, note: "in_lesson; key 2 verified (lesson check 1 plus wc -l)."}
  item.shell.pipeline_redirection.demonstrate_capability.f02: {verdict: pass, note: "Key 2 verified. grep piped into wc -l as in the canonical and lesson checks 2-3 with new data; basic."}
  item.shell.pipeline_redirection.demonstrate_capability.f03: {verdict: pass, note: "Key 1 verified; basic."}
  item.shell.pipeline_redirection.demonstrate_capability.f04: {verdict: pass, note: "Key 1 verified: stdout is only wc's '1'; cat's 'cat: rapor.txt: No such file or directory' is the other screen line, on stderr. Near isomorph of the canonical's 'ls yok | wc -l' and the worked example's cat with a missing file; fine at authentic_application."}
  item.shell.pipeline_redirection.demonstrate_capability.f05: {verdict: pass, note: "Key 2 verified (uutils and GNU ls both exit 2 for a missing operand). Needs the process canonical's 'ls olmayan bir dosya için 2' (process_exit is a hard prerequisite) and that 2>/dev/null does not change the status: good integration; hands-on, so the learner also sees it."}
  item.shell.pipeline_redirection.demonstrate_capability.f06: {verdict: pass, note: "Key A verified (hepsi.txt: alfa; hata.txt: 'cat: yok.txt: No such file or directory'). Exactly one option true; the line counts (1 1) separate all four options."}
  item.shell.pipeline_redirection.demonstrate_capability.f07: {verdict: pass, note: "Key '0 tum.txt' verified: ls's error stays on the screen, tum.txt is empty (same with GNU ls). The canonical's order paragraph and the order_does_not_matter contrast state the rule ('önce 2>&1 gelirse stderr ekrana bağlanmış olur ve orada kalır'); the item applies it to ls plus wc -l and lesson check 5 is the opposite order: named-rule application, transfer label generous."}
  item.shell.pipeline_redirection.demonstrate_capability.f08: {verdict: pass, note: "Key 0 verified (grep with no match exits 1, the pipeline's status is wc's 0; bash default, no pipefail). The canonical's 'false | true' rule and lesson check 6 with new commands: named-rule isomorph, transfer label generous. The wc line above is also 0, so 'son satır' must be read carefully; harmless."}
  item.git.repository_status_diff.inspect_change_state.f01: {verdict: pass, note: "in_lesson; key '?? liste.txt' verified. Same as lesson check 1."}
  item.git.repository_status_diff.inspect_change_state.f02: {verdict: pass, note: "Key 'atis.txt deste.txt' verified (status --short already lists them alphabetically)."}
  item.git.repository_status_diff.inspect_change_state.f03: {verdict: pass, note: "Key A verified (' M sayac.txt'; the change is same size and in the same second as the commit, and Git's racy-clean check caught it in 30/30 runs on ext4 and 8/8 on /mnt/c). Exactly one option true. Isomorph of the state_trace (append → ' M cicek.txt') with an overwrite; fine at basic. Second pass: the prompt now reminds the learner that the commit needs the lesson's one-time git config identity (without it the observed status is 'AM sayac.txt'; see findings); key and options unchanged and re-verified."}
  item.git.repository_status_diff.inspect_change_state.f04: {verdict: pass, note: "Key '+armut' verified (full diff '@@ -1 +1 @@ / -elma / +armut'). It is the canonical's own diff example (one line replaced: -eski / +yeni) renamed: isomorph, so the authentic_application label is generous. The accepted answer is only '+armut'; the prompt asks for the line, but consider accepting 'armut' too."}
  item.git.repository_status_diff.inspect_change_state.f05: {verdict: pass, note: "Key A verified (no output, status 0, also with no commit yet). Exactly one option true (B and D share an outcome that does not occur; harmless); C (an error because there is no commit) is a good distractor. Applies the canonical's 'git diff takip edilmeyen (??) dosyaları göstermez' (and the diff_shows_everything contrast) under a new condition."}
  item.git.repository_status_diff.inspect_change_state.f06: {verdict: pass, note: "Key '1 1' verified (' M plan.txt', '?? notlar.txt')."}
  item.git.repository_status_diff.inspect_change_state.f07: {verdict: pass, note: "Key '-ikinci' verified (hunk '@@ -1,2 +1 @@', context ' birinci'). A deletion-only diff is new relative to the canonical (replacement) and the worked example (addition): genuine transfer."}
  item.git.repository_status_diff.inspect_change_state.f08: {verdict: pass, note: "Key A verified (no output in 30/30 runs on ext4 and 8/8 on /mnt/c). Exactly one option true. Applies the canonical's 'Git, şimdiki içeriği son kayıttaki içerikle karşılaştırır' to a write-then-restore sequence: genuine transfer."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f01: {verdict: pass, note: "in_lesson; key 'notlar eklendi' verified. Same as lesson check 1."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f02: {verdict: pass, note: "Key 3 verified. In a terminal git log --oneline goes through the pager (less -FRX, exits at once) and the newest line also shows '(HEAD -> master)'; still 3 lines."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f03: {verdict: pass, note: "Key A verified ('A  yeni.txt'). Exactly one option true. Lesson check 2 (git add b.txt → 'A  b.txt') renamed: isomorph, acceptable at basic."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f04: {verdict: pass, note: "Key b.txt verified (' M b.txt'; 30/30 runs). Partial staging across two commits; fine at authentic_application."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f05: {verdict: pass, note: "Key 1 verified (stdout 'On branch master / nothing to commit, working tree clean' then 1; git prints that refusal on stdout, not stderr). The canonical says only 'non-zero'; hands-on, so the learner reads 1 on the screen. Declares process_exit for $?."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f06: {verdict: pass, note: "Key A verified (' M not.txt'; the commit holds v1 (git show HEAD:not.txt); 30/30 runs). Exactly one option true. The canonical's 'en önemli kural' and the add_tracks_future_changes contrast state the rule; add, change, commit is a new sequence: named-rule application, fine at authentic_application."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f07: {verdict: pass, note: "Key 2 verified: 'bos deneme' fails (nothing to commit), 'sali unutuldu' fails (no changes added to commit; -q does not silence these stdout messages), 'sali' commits. Good integration of failed_commit_counts and the staging rule; the prompt's 'Bazıları başarısız olabilir' is fair."}
  item.git.stage_commit_history_basic.commit_and_verify_history.f08: {verdict: pass, note: "Key A verified (git diff empty, git diff --staged shows +sonuc). Exactly one option true. The canonical defines both commands directly ('git diff → hazırlanmamış', '--staged → hazırlanmış'): named-rule application, transfer label generous."}
explanations:
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.canonical: {verdict: pass, note: "Verified (uutils and GNU): echo writes to stdout; ls on a missing file writes 'No such file or directory' to stderr and exits 2; mkdir of a new folder is silent with 0, of an existing one exits 1; true 0, false 1; bash -c 'echo selam; exit 4' prints selam and leaves 4; false; echo $?; echo $? prints 1 then 0; >&2 inside bash -c goes to stderr. First pass: it contained f07's solution (mkdir on an existing folder → 1). Second pass: that example is removed; the paragraph now gives only 'örneğin ls olmayan bir dosya için 2 döner' (verified 2) before '0 başarı, 0'dan farklısı başarısızlık'. It still contains f06's case (mkdir new → silent 0; see f06)."}
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.prerequisite_refresh: {verdict: pass, note: ""}
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.state_trace: {verdict: pass, note: "6, then 0 after echo, true 0, false 1, echo 1 verified."}
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.worked_example: {verdict: pass, note: "'yarisi bitti' then 9 verified."}
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.contrast_output_means_success: {verdict: pass, note: "Correct. r1's criteria restate it (see r1)."}
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.contrast_status_stays: {verdict: pass, note: "Correct (verified false; echo $?; echo $? → 1, 0)."}
  explanation.linux.process_exit_stdout_stderr_basic.classify_process_outputs.contrast_error_text_is_stdout: {verdict: pass, note: "Correct as the convention. Note: learners meet a counterexample in stage_commit_history_basic (git commit's 'nothing to commit' refusal is printed on stdout with exit 1); one clause ('çoğu program') would keep the rule honest."}
  explanation.shell.command_options_redirection_basic.construct_simple_command.canonical: {verdict: pass, note: "Verified (uutils and GNU): 'wc -l dosya' prints 'N dosya' without padding; head -n / tail -n; sort leaves the file unchanged; '40' before '5' and sort -n gives 5, 40; the ay.txt sequence; '> yok/dosya' fails with status 1 and creates nothing; false && echo skips the echo. It relies on stdout and exit status (&&: 'çıkış durumu 0'), which process_exit_stdout_stderr_basic teaches and which is not a hard prerequisite of this Skill (see findings, graph). Its '> ... klasörü kendisi oluşturmaz' sentence is f08's answer (named rule, passed with a note)."}
  explanation.shell.command_options_redirection_basic.construct_simple_command.prerequisite_refresh: {verdict: pass, note: ""}
  explanation.shell.command_options_redirection_basic.construct_simple_command.state_trace: {verdict: pass, note: "'2 renk.txt', s.txt kirmizi/mavi and head kirmizi verified."}
  explanation.shell.command_options_redirection_basic.construct_simple_command.worked_example: {verdict: pass, note: "'2 not.txt' verified."}
  explanation.shell.command_options_redirection_basic.construct_simple_command.contrast_overwrite_appends: {verdict: pass, note: ""}
  explanation.shell.command_options_redirection_basic.construct_simple_command.contrast_redirect_still_shows: {verdict: pass, note: "Correct for stdout (stderr still shows, which pipeline_redirection teaches)."}
  explanation.shell.command_options_redirection_basic.construct_simple_command.contrast_sort_is_numeric: {verdict: pass, note: "Verified: 7, 30, 200 sort as 200, 30, 7."}
  explanation.shell.pipeline_redirection.demonstrate_capability.canonical: {verdict: pass, note: "All claims verified (uutils and GNU): cat x.txt | wc -l → 2 with no file name; grep elma also matches elmas, with a file or from a pipe; uniq removes only adjacent duplicates (b a b stays, sort | uniq → a b); ls yok | wc -l shows the error on the screen and 0; 2> file, 2>/dev/null; '> f 2>&1' puts both in the file ('1 tum.txt'); '2>&1 > f' leaves the error on the screen and the file empty; 2>&1 | carries the error into the pipe; false | true → 0 (no pipefail in default bash)."}
  explanation.shell.pipeline_redirection.demonstrate_capability.prerequisite_refresh: {verdict: pass, note: ""}
  explanation.shell.pipeline_redirection.demonstrate_capability.state_trace: {verdict: pass, note: "mor pembe pembe / mor pembe / pembe pembe / error only in h.txt verified."}
  explanation.shell.pipeline_redirection.demonstrate_capability.worked_example: {verdict: pass, note: "badem with no error on the screen verified."}
  explanation.shell.pipeline_redirection.demonstrate_capability.contrast_pipe_carries_errors: {verdict: pass, note: "Verified: ls yok | wc -l → 0, ls yok 2>&1 | wc -l → 1."}
  explanation.shell.pipeline_redirection.demonstrate_capability.contrast_order_does_not_matter: {verdict: pass, note: "Verified both orders (1 line vs 0 lines in the file)."}
  explanation.shell.pipeline_redirection.demonstrate_capability.contrast_pipeline_status_first_failure: {verdict: pass, note: "Verified (false | true → 0; grep no-match | wc -l → 0)."}
  explanation.git.repository_status_diff.inspect_change_state.canonical: {verdict: pass, note: "First pass failed: it said git init prints one line, but with git 2.53 and no init.defaultBranch (this WSL has no ~/.gitconfig) it also prints a 13-line 'hint:' block on stderr. Second pass, every changed claim re-run in WSL with an empty HOME: git init proje prints 'Initialized empty Git repository in ...' on stdout and 13 'hint:' lines on stderr (first 'hint: Using 'master' as the name for the initial branch...'); git init -q prints nothing at all; after git config --global init.defaultBranch main the hint is gone (0 stderr lines) and later output says 'On branch main' and '(HEAD -> main)', which no key reads; without user.name/user.email, git commit fails with status 128, stderr starting 'Author identity unknown' and ending 'fatal: empty ident name ... not allowed'. ' M' is now 'dosyada henüz kayda hazırlanmamış bir değişiklik var (bu derste: son kayıttan beri değişti)': exact (verified: after add-then-change the right column is still M, 'MM'). The setup-line paragraph now says '#' is a comment in bash, to run the commands in WSL Ubuntu's default bash, and that the identity setup is needed for the commits: correct and closes the zsh and identity remarks. Other claims as in the first pass (.git created; '??', clean repo prints nothing; the replacement diff; git diff ignores untracked files). Cosmetic: the optional line '$ git config --global init.defaultBranch main      (isteğe bağlı: ...)' keeps the 15C convention of a parenthetical after a command; pasted whole into bash, '(' is a syntax error, so learners must copy only the command (as in 15C)."}

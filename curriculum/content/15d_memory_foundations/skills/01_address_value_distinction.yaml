          }
        required_skills: [skill.c.functions_basic]
        answer: "108 8"
        verify: {mode: c_stdout}
      - slug: r1
        difficulty: authentic_application
        independence: guided
        prompt: |
          Bir arkadaşın şu üç satırı yazıyor ve "eski = fiyat dediğim için eski artık fiyatı takip eder" diyor:
          int fiyat = 40;
          int eski = fiyat;
          fiyat = fiyat - 5;
          Kendi cümlelerinle anlat: üç satırdan sonra eski'nin değeri nedir ve neden? &fiyat == &eski ifadesi ne verir? Arkadaşının düşüncesi neden yanlış? (3–5 cümle yeterli.)
        required_skills: [skill.c.expression_evaluation]
        answer: "-"
        rubric:
          - id: eski_stays
            statement: Üçüncü satırdan sonra eski'nin 40 olarak kaldığını söyler (fiyat 35 olur).
          - id: copied_at_assignment
            statement: eski = fiyat satırının fiyatın o andaki değerini eski'nin yerine kopyaladığını açıklar.
          - id: separate_places
            statement: "&fiyat == &eski ifadesinin 0 verdiğini, çünkü iki değişkenin bellekte ayrı yerlerde durduğunu söyler."
          - id: no_link
            statement: Atamanın iki değişken arasında bir bağ kurmadığını, fiyat'ı değiştirmenin yalnız fiyat'ın kendi yerini değiştirdiğini söyleyerek arkadaşının düşüncesini düzeltir.
        verify:
          mode: rubric

  - id: objective.memory.address_value_distinction.trace_simple_memory_example
    statement: >-
      Basit bir programda her adımda hangi değerin hangi değişkenin yerinde durduğunu izleyebilmek: atama zincirlerini,
      geçici değişkenle yer değiştirmeyi ve bir fonksiyona değer kopyalanmasını bir bellek tablosu üzerinde adım adım
      takip edip programın sonunda her yerdeki değeri söyleyebilmek.
    observable_behavior: >-
      Birkaç atama ve bir fonksiyon çağrısı içeren programların sonunda her değişkenin değerini doğru verir; bir bellek
      tablosunu doğru doldurur.
    acceptable_evidence_types: [explanation, code_reading]
    direct_evidence_types: [explanation, code_reading]
    required_direct_type: explanation
    reconciliation: >-
      6C'nin şablon cümlesi bu Objective'in eylem adına (trace_simple_memory_example) göre özgülleştirildi; kimlik
      korundu. Direct type explanation; item'ların anahtarları programlar gcc ile Linux'ta çalıştırılarak doğrulanır ve
      bir rubric item'ı izlemenin anlatımını değerlendirir. 15A'nın state_assignment_model'i durumu izlemeyi Python ile
      öğretti; bu Objective aynı izlemeyi her değişkenin ayrı bir bellek yeri olduğu bilgisiyle yaptırır.
    checks:
      - prints: "3 8 3"
        code: |
          #include <stdio.h>

          int main(void) {
              int p = 3;
              int q = 8;
              int r = p;
              p = q;
              q = r;
              printf("%d %d %d\n", q, p, r);
              return 0;
          }
    explanations:
      canonical: |
        Bir programı izlerken her değişkeni bir kutu olarak çiz: kutunun adı değişkenin adı, kutunun yeri adresi, içindeki sayı değeri.

        int p = 3;    p: [3]
        int q = 8;    p: [3]  q: [8]
        int r = p;    p: [3]  q: [8]  r: [3]   (r'nin kendi kutusu var; p'nin değeri kopyalandı)
        p = q;        p: [8]  q: [8]  r: [3]   (yalnız p'nin kutusu değişti)
        q = r;        p: [8]  q: [3]  r: [3]

        Kurallar:
        - Bir bildirim (int r = ...) yeni bir kutu açar.
        - Bir atama (p = q) yalnız sol taraftaki kutunun içini değiştirir; sağ taraftaki kutuya dokunmaz.
        - Bir fonksiyon çağrılınca parametreler için yeni kutular açılır ve argümanların değerleri oraya kopyalanır; fonksiyon bitince bu kutular kaldırılır. Fonksiyonun kendi kutularına yaptığı değişiklik çağıranın kutularına ulaşmaz.

        Yöntem: her satırdan sonra tablonun yeni bir satırını yaz; sonunda istenen kutuların içini oku.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (değer ve adres): her değişkenin kendi yeri vardır ve atama değeri o yere kopyalar; iki değişken aynı değeri taşısa da ayrı yerlerdedir.
      state_trace:
        level: H2
        text: |
          Adım adım izleme — başka bir örnek üzerinde.

          int a = 1;          a:[1]
          int b = a + 1;      a:[1] b:[2]
          a = b * 5;          a:[10] b:[2]
          b = a - b;          a:[10] b:[8]

          Sonunda a 10, b 8.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          int karesi(int s) {
              s = s * s;
              return s;
          }
          ...
          int k = 6;
          int m = karesi(k);

          - Çağrıda s için yeni bir kutu açılır: s:[6].
          - s = s * s; → s:[36]; k'nin kutusu hâlâ [6].
          - return 36 → m:[36]; fonksiyon bitince s'nin kutusu kaldırılır.
          Sonunda k 6, m 36.
    misconceptions:
      - slug: swap_without_third_box
        name: İki değişken üçüncü bir kutu olmadan yer değiştirir
        open_question: x = y; y = x; satırlarının iki değeri yer değiştirdiğini mi düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Önce x'e y'yi, sonra y'ye x'i koydum."

            x = y; x'in kutusundaki eski değeri siler; artık iki kutuda da y'nin değeri vardır ve y = x; bunu geri kopyalar. Değerleri korumak için önce birini üçüncü bir kutuya (geçici değişkene) kopyalarsın.
      - slug: parameter_shares_box
        name: Fonksiyon parametresi çağıranın kutusunu kullanır
        open_question: Bir fonksiyon parametresine yeni değer atayınca çağıranın değişkeninin kutusunun da değiştiğini mi düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Değişkeni fonksiyona verdim, aynı kutu."

            Parametre, çağrı sırasında açılan yeni bir kutudur ve argümanın değerinin bir kopyasını tutar. Fonksiyon kendi kutusunu değiştirir; çağıranın kutusu aynı kalır.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |

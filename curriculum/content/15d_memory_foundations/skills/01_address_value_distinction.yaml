skill: skill.memory.address_value_distinction
activity: code_reading_trace
tasks:
  teach: {title: "Değer ve adres: bir değişkenin içi ve yeri", minutes: 16}
  practice: {title: "Değer ve adres alıştırması", minutes: 10}
  check: {title: "Değer ve adres kontrolü", minutes: 8}
  review: {title: "Değer ve adres tekrarı", minutes: 6}
  repair: {title: "Değeri ve adresi yeniden ayırmak: kopya, yer ve boyut", minutes: 14}

objectives:
  - id: objective.memory.address_value_distinction.explain_address_vs_value
    statement: >-
      Bir değişkenin değeri (içinde tuttuğu şey) ile adresini (bellekte durduğu yer) ayırt edebilmek: &x'in x'in
      adresini verdiğini, iki farklı değişkenin aynı değeri taşısa da farklı adreslerde durduğunu, atamanın değeri
      kopyalayıp hiçbir adresi değiştirmediğini ve sizeof'un bir türün bellekte kaç bayt yer kapladığını söylediğini
      açıklayabilmek.
    observable_behavior: >-
      Değerleri ve adresleri karşılaştıran kısa programların yazdırdığını doğru verir; bir değerin bir değişkenden ötekine
      kopyalandığını ama yerlerin ayrı kaldığını kendi cümleleriyle açıklar.
    acceptable_evidence_types: [explanation, code_reading]
    direct_evidence_types: [explanation, code_reading]
    required_direct_type: explanation
    reconciliation: >-
      6C'de bu Skill'in iki Objective'i aynı şablon cümleyi taşıyordu; kimlikler korundu ve cümleler eylem adlarına göre
      ayrıldı: bu Objective adresi değerden ayırıp açıklamak, diğeri basit bir örnekte değerleri yerleriyle izlemek.
      Direct type 6C'deki gibi explanation: anahtarlı item'lar (açıklamanın sonucu doğru mu) ve bir rubric item'ı
      (açıklamanın kendisi). Adresler her çalıştırmada değişebildiği için hiçbir item bir adresin kendisini yazdırmaz;
      adresler == ile karşılaştırılır. İşaretçi değişkenleri pointer_formation'ındır ve burada kullanılmaz. sizeof
      değerleri Linux x86_64 ve gcc içindir (char 1, int 4, double 8), ders bunu açıkça söyler.
    checks:
      - prints: "1 0"
        code: |
          #include <stdio.h>

          int main(void) {
              int a = 9;
              int b = 9;
              printf("%d %d\n", a == b, &a == &b);
              return 0;
          }
      - prints: "1 4 8"
        code: |
          #include <stdio.h>

          int main(void) {
              printf("%zu %zu %zu\n", sizeof(char), sizeof(int), sizeof(double));
              return 0;
          }
      - prints: "1"
        code: |
          #include <stdio.h>

          int main(void) {
              int k = 3;
              printf("%d\n", &k == &k);
              return 0;
          }
    explanations:
      canonical: |
        Her değişkenin iki yüzü vardır:
        - değeri: içinde tuttuğu şey (örneğin 9),
        - adresi: bellekte durduğu yer.

        Belleği numaralı kutulardan oluşan uzun bir raf gibi düşünebilirsin. int a = 9; satırı rafta a için bir yer ayırır ve oraya 9 koyar. &a ("a'nın adresi") o yerin numarasıdır.

        Aynı değer, farklı yerler:
        int a = 9;
        int b = 9;
        a == b  → 1 (değerler eşit)
        &a == &b → 0 (iki ayrı değişken, iki ayrı yer)

        Atama değeri kopyalar, yeri değil:
        b = a; satırından sonra b'nin içinde a'nın değerinin bir kopyası vardır. a ve b hâlâ ayrı yerlerdedir; sonradan a'yı değiştirmek b'yi değiştirmez. Bir değişkenin adresi o değişken var oldukça hiç değişmez.

        Bir fonksiyona argüman verdiğinde de değer kopyalanır (değerle geçirme): parametre, kendi yeri olan yeni bir değişkendir.

        Boyut: sizeof bir türün (ya da değişkenin) kaç bayt yer kapladığını verir; sonucu %zu ile yazdırılır. Bu kursun ortamında (Linux, x86_64, gcc): sizeof(int) 4, sizeof(double) 8. sizeof(char) C standardına göre her zaman 1'dir; int ve double'ın boyutları ise makineye ve derleyiciye bağlıdır, başka bir sistemde farklı olabilir.

        Adresi yazdırabilirsin (printf("%p", (void *) &a)), ama her çalıştırmada farklı bir sayı görebilirsin: işletim sistemi programı her seferinde başka bir yere yerleştirebilir. Bu yüzden adresleri yazdırmak yerine karşılaştırırız.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (C'de bildirim ve türler): int a = 9; a adında, int türünde bir değişken oluşturur ve ona 9 değerini verir; türler bir değerin nasıl saklandığını belirler.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          int x = 4;
          int y = x;
          x = 10;
          printf("%d %d %d\n", x == y, &x == &y, y);

          - y = x; 4 değerini y'nin kendi yerine kopyaladı.
          - x = 10; yalnız x'in yerini değiştirdi; y hâlâ 4.
          - x == y → 0, &x == &y → 0 (iki ayrı yer), y → 4.
          Ekranda: 0 0 4
    misconceptions:
      - slug: same_value_same_place
        name: Aynı değeri taşıyan iki değişken aynı yerde durur
        open_question: İki değişken aynı değeri taşıyorsa bellekte aynı yeri paylaştıklarını mı düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "a da 9, b de 9; o halde aynı 9."

            Her değişkenin kendi yeri vardır. a ve b'nin değerleri eşit olsa bile &a ile &b farklıdır; birini değiştirmek ötekini etkilemez.
      - slug: assignment_links_variables
        name: b = a; satırı b'yi a'ya bağlar
        open_question: b = a; satırından sonra a'yı değiştirince b'nin de değişeceğini mi düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "b artık a'yı gösteriyor."

            C'de atama değeri kopyalar: b = a; a'nın o anki değerini b'nin kendi yerine yazar. Sonra a'ya ne olursa olsun b etkilenmez. Bir değişkenin başka bir yeri "göstermesi" için işaretçi gerekir — bir sonraki Skill.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>

          int main(void) {
              int m = 12;
              int n = 12;
              printf("%d %d\n", m == n, &m == &n);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        answer: "1 0"
        verify: {mode: c_stdout}
      - slug: f02
        difficulty: basic
        independence: guided
        prompt: |
          Bu programda u = t; satırından sonra hangisi doğrudur?
        code: |
          #include <stdio.h>

          int main(void) {
              int t = 30;
              int u = 0;
              u = t;
              printf("%d %d\n", u == t, &u == &t);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        options:
          A: "u ile t'nin değerleri eşittir, ama ikisi bellekte ayrı yerlerdedir"
          B: "u artık t ile aynı yerdedir"
          C: "u ile t'nin değerleri de yerleri de farklıdır"
          D: "u, t'nin yerine taşınmıştır ve t artık 0'dır"
        scan_options: false
        answer: A
        verify:
          mode: c_stdout
          outcomes: {A: "1 0", B: "1 1", C: "0 0", D: "0 1"}
      - slug: f03
        difficulty: authentic_application
        prompt: |
          Bu program bu kursun ortamında (Linux, x86_64, gcc) çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>

          int main(void) {
              char c = 'A';
              int n = 'A';
              printf("%d %d %zu %zu\n", c == n, c, sizeof c, sizeof n);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        answer: "1 65 1 4"
        verify: {mode: c_stdout}
      - slug: f04
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>

          int main(void) {
              int ilk = 5;
              int ikinci = ilk;
              ilk = ilk + 1;
              ikinci = ikinci * 3;
              printf("%d %d %d\n", ilk, ikinci, &ilk == &ikinci);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        answer: "6 15 0"
        verify: {mode: c_stdout}
      - slug: f05
        difficulty: transfer_integration
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>

          void ekle(int deger) {
              deger = deger + 100;
              printf("%d ", deger);
          }

          int main(void) {

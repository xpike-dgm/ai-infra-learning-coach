          int ucle(int n) {
              n = n * 3;
              return n;
          }

          int main(void) {
              int x = 4;
              int y = ucle(x);
              x = x + y;
              printf("%d %d\n", x, y);
              return 0;
          }
        required_skills: [skill.c.functions_basic]
        answer: "16 12"
        verify: {mode: c_stdout}
      - slug: r1
        difficulty: authentic_application
        independence: guided
        prompt: |
          Aşağıdaki satırlar çalışırken her adımda hangi değişkenin kutusunda ne olduğunu anlat ve sonunda m ile n'nin değerlerini söyle (bir tablo ya da 3–5 cümle yeterli):

          int m = 2;
          int n = m + 4;
          m = n;
          n = n - m + 1;
        answer: "-"
        rubric:
          - id: new_boxes
            statement: Her bildirimin (int m, int n) yeni bir kutu açtığını ya da her değişkenin ayrı bir yeri olduğunu belirtir.
          - id: step_values
            statement: Ara değerleri doğru izler (m 2, n 6; sonra m 6).
          - id: assignment_changes_left_only
            statement: Bir atamanın yalnız sol taraftaki değişkeni değiştirdiğini söyler.
          - id: final_values
            statement: Sonuçta m'nin 6, n'nin 1 olduğunu söyler.
        verify:
          mode: rubric

findings:
  - "Result: first pass 29/34 items and 30/33 explanations passed (5 item fails, 3 explanation fails). Second pass: all 5 failed items (pointer_formation f05, modify f04, modify f05, explain_address_vs_value r1, storage r1) and all 3 failed explanations (address_value, pointer_formation and read_pointed_value canonicals) pass after the fixes, and the other changed entries (pointer_formation f04, read f01, read f05, modify canonical) still pass. Final: 34/34 items and 33/33 explanations pass. All 14 keyed answers are correct (10 c_stdout, 4 c_sanitize; every choice item has exactly one true option), all 15 lesson checks print and report what they claim, all 15 regenerated suites (52 tests) match the YAML, every reference passes, all 32 authored wrong solutions fail. Of my 66 adversarial solutions in the second pass, all 37 wrong ones fail; 27 of the 29 correct-logic ones pass, the two that fail are a pointer_formation f03 function without any #include (NULL undeclared, now covered by the lesson) and a pointer_formation f05 variant that writes through *a, *b only when both numbers were read (which the follow-up prompt sentence now rules out)."
  - "Suites that cannot tell (first pass, 2 items failed; both fixed in the second pass): pointer_formation f05 (fixed output that the prompt printed; a literal printf passed) is now a harness item that a literal output cannot satisfy; modify_value_via_pointer f05 now tests orders where b is the minimum or maximum and the else-if chain and the b-blind maximum fail. The two weaker spots noted in the first pass are closed by added tests (pointer_formation f04: 2.25 2.5 catches int truncation; read_pointed_value f05: 1.5 2 6 catches an int accumulator). pointer_formation f05's prompt now also states that a number that can be read is stored when the other cannot (follow-up), so its partial-read tests are fully specified. The c_harness items enforce the asked function: a main-only program fails to link, a learner main beside the function is renamed and passes."
  - "Leakage (first pass, 3 items failed; second pass: all three resolved): modify f04 was the canonical's own bol (the canonical now uses toplam_fark), explain_address_vs_value r1 reused the canonical's a = 9 scenario (now fiyat/eski with a claim to correct and an address comparison), storage r1 asked back the 'Güvenli kalıplar' paragraph (now a concrete program to diagnose and repair twice). The rewritten pointer_formation f05 is not in any pointer_formation lesson text or check. Near isomorphs with new values, passed with notes: pointer_formation f02 (worked_example body renamed), read f02 (topla with *), modify f03 (degistir in an if), modify f04 (toplam_fark with / and %), storage f02-f05 (lesson checks 2-4 and the worked_example), trace f03 and f05, address f02 and f04, and the two rubric rewrites. As in 15A-15C, keep structurally new items per Objective."
  - "Explanations (first pass, 3 failed; all three corrected and verified in the second pass): the address_value canonical now says sizeof(char) is 1 by the standard; the pointer_formation canonical now teaches NULL's header; the pointer_formation and read_pointed_value canonicals now say the sanitizer catches many invalid accesses but not all (an uninitialised pointer read ran clean in both passes). All other technical sentences checked correct (pointer is a variable whose value is an address, * in a declaration vs an expression, NULL points nowhere and reading it is undefined, static locals initialised once and live for the program, automatic locals die on return, malloc'd memory lives until free, free does not change p)."
  - "Hidden prerequisites: no item uses a construct outside its reachable set (build mask and escape-aware mask; harness code not scanned; scan_options false options also clean; repeated in the second pass; the rubric prompts' code uses only what their declared Skills teach). Lesson checks (which declare nothing) use constructs outside their Skill's closure: address_value checks 1 and 3 and pointer_formation checks 1-2 and read check 1 use == (expression_evaluation), read check 2 and both modify checks define functions (functions_basic), storage checks 1-2 use ++ and checks 3-4 use int *, *p, & and sizeof (pointer_formation, pointer_dereference, address_value). Semantic gaps: NULL's header is closed in the second pass; 'sizeof x' without parentheses is first shown in pointer_formation's check 3 but used in address_value f03; the address_value canonical shows a (void *) cast before pointer types are taught (illustrative only)."
  - "Coverage after the second pass (non-in_lesson, passing): every one of the 6 Objectives has at least one passing item at basic, authentic_application and transfer_integration. explain_address_vs_value basic f02, authentic f03/f04/r1 (its required direct type explanation has a passing rubric item again), transfer f05 (generous); trace_simple_memory_example basic f02, authentic f03/f04/r1, transfer f05 (generous); pointer_formation basic f02, authentic f03/f04, transfer f05 (now a genuine transfer); read_pointed_value basic f02, authentic f03/f04, transfer f05; modify_value_via_pointer basic f02, authentic f03/f04, transfer f05; identify_simple_lifetime_boundary basic f02, authentic f03/f04/r1, transfer f06 (f05 is a worked-example isomorph). Difficulty: storage f05, trace f05 and address f05 are labelled transfer_integration but apply or copy a lesson example."
  - "Graph (decide in 15H, not per item; all 13 edges touching these Skills are 6C draft and this package publishes the 5 internal ones): storage_lifetime_intuition's only hard prerequisite is functions_basic, yet its canonical, worked example, prerequisite_refresh, both rubric and keyed items f03-f06 and lesson checks 3-4 are built on int *, &x returned from functions, *p and sizeof; the planner could schedule its lesson before any pointer Skill. A hard edge pointer_dereference -> storage_lifetime_intuition (or a package-level ratification) would match the content. Also: address_value_distinction's items declare expression_evaluation (== on addresses is its method), pointer_formation's and pointer_dereference's lessons and every code item use functions_basic (and conditionals), and the rewritten pointer_formation f05 declares standard_io_basic; none of these is in their closures."
  - "Platform and undefined behaviour: sizeof values (char 1 by the standard, int 4, double 8, pointers 8 on x86_64/gcc) are stated where items need them (address f03; the old pointer_formation f05 that printed sizes is gone); the c_sanitize keys rely on gcc's ASan, which reported both findings deterministically here (stack-use-after-return also without ASAN_OPTIONS in gcc 15.2). Without the sanitizer, storage f03 prints 36, f04 prints 0.25 then 0.00 (glibc tcache), storage r1's program prints 5 and read f01's third wrong prints 42, i.e. the plausible observations — the keys and tests are about validity, not output. An ASan abort loses buffered stdout on a pipe, so a test's expected_stdout never matches after a finding (consistent with expect_clean_exit). pointer_formation f05's partial-read expectations rely on scanf storing the first conversion before a matching failure, which C requires. address_value check 3 (&k == &k) draws -Wtautological-compare; harmless."
  - "Process: the second pass ran against the regenerated suites in curriculum/content/15d_memory_foundations/suites/ and the regenerated asset (its 15 suites and 52 test ids match the suite JSON). The asset was regenerated before this review's pass verdicts existed, so it must be built again with --out now that independent_review.yaml records them. Runner build time with the sanitizer harness stayed about 1 s per suite, inside the 5 s timeout."

  item.c.pointer_formation.demonstrate_capability.f05: {verdict: pass, note: "Second pass (rewritten; first pass failed because a literal printf of the output passed the fixed-output test). Now int iki_sayi_oku(int *a, int *b): read two ints into the pointed variables, return 1 if both were read, else 0; the harness passes &x, &y and prints the result and both variables. Five tests (two numbers, negative and zero, second not a number, only one, empty input) match the YAML; expected outputs verified (on '7 x' and '12' scanf stores the first value and leaves y at -1). Reference passes; all 3 wrongs fail (&a/&b draws -Wformat int ** and leaves both at -1; returning scanf's count prints 2; two unchecked scanf calls return 1 on partial input). Adversarial: != 2, a stored count == 2, two separately checked scanf calls and a ternary with a learner main pass; > 0, != EOF, == 1, swapped targets, locals never stored and a file without #include <stdio.h> fail. Genuine transfer: the learner must see that a pointer parameter already is the address scanf needs (15C taught scanf with &x), which no pointer_formation lesson text or check shows; no leakage. Follow-up (same day): the prompt now adds 'okunabilen sayı, diğeri okunamasa bile yerine yazılır — scanf'in yaptığı gibi', so the partial-read expectations (7 x -> 0 7 -1, 12 -> 0 12 -1) are stated and the item is fully specified; the write-only-on-success variant now contradicts the prompt rather than an unstated choice. The sentence names scanf only as the model for partial reads (the task already says to read from standard input, and 15C taught scanf); it does not say that a and b are passed without &, so the transfer insight is not given away. Suite JSON unchanged and still matching the YAML."}

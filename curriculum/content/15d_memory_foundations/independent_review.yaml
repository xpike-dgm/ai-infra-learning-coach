  item.memory.storage_lifetime_intuition.identify_simple_lifetime_boundary.f04: {verdict: pass, note: "Key A verified: heap-use-after-free (gcc 15 also warns -Wuse-after-free). Exactly one option true. Without the sanitizer this glibc prints 0.25 then 0.00, i.e. exactly what option C claims, a strong distractor whose reason (free zeroes memory) is false. Under ASan the first 0.25 is lost when stdout is a pipe (abort before flush); in a terminal the learner sees it. Isomorph of lesson check 4."}

reviewer: independent_15d_content_review
date: "2026-10-03"
method: >-
  Read package.yaml, notation.yaml and all 4 Skill files in full (6 Objectives, 34 items, 33 explanation forms, 13
  misconceptions, 15 lesson checks), the 15C independent_review.yaml for format and rule (and the 15A review for the
  leakage rule as first written), the 13 hard edges of 6c_foundations/prerequisite_edges.yaml that touch the 4 Skills
  (all still lifecycle draft, review_status reviewed), tools/code_test_runner.py, and the build's c_sanitized, the
  c_sanitize verify mode, c_harness_build, constructs_used and in_linux. Environment: WSL Ubuntu 26.04.1, x86_64, gcc
  15.2.0, Python 3.14.4, C.UTF-8 locale. Every answer item (10 c_stdout, 4 c_sanitize; 3 of them multiple choice plus
  the 4 c_sanitize choices) was solved by hand first and then built and run with my own driver in fresh temp
  directories, not the author's verify blocks: once with plain gcc -std=c11 -Wall -Wextra and once with the course's
  sanitizer build (-g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all, run under
  env ASAN_OPTIONS=detect_stack_use_after_return=1:detect_leaks=0), keeping stdout, exit code, gcc's diagnostics and
  the first ERROR / runtime error line. Every option was checked for exactly one true answer (the c_sanitize options
  against the real finding and the printed text). For the 15 code items the shipped suite JSON was compared field by
  field with the YAML (tests, implicit expected_exit_code 0, run command, timeout 5 s, trim_trailing_whitespace, the
  harness text inside the bash build script and the sanitizer flags on both compiles and the link): 15/15 match. The
  course runner was then run inside Linux as the learner does (wsl.exe --cd DIR -e python3 tools/code_test_runner.py
  suite.json --dir .) on every reference (15/15 pass every test), every authored wrong solution (30/30 fail at least
  one test) and 59 adversarial solutions of my own (34 plausible wrong, 25 correct-logic alternatives; see the
  items). Each runner call including the three-command sanitizer harness build took about 1 s, well inside the 5 s
  build timeout. For the two suites that could not tell, the proposed extra tests were added to a scratch copy and
  re-run against all solutions (they catch every passing wrong one and keep every correct one). All 15 lesson checks
  were re-run plain and sanitized, and every code claim in the 33 explanations was re-run (a == b vs &a == &b, %p
  differing between runs, sizeof values, incompatible-pointer and int-to-pointer errors in gcc 15, pointer size 8,
  NULL read under ASan/UBSan, uninitialised pointer read under ASan/UBSan, printf %d with a pointer, *p = ..., the
  swap, bol, sinirla, static and automatic counters, the static address returned twice, free keeping p's bits,
  stack-use-after-return with and without the ASAN_OPTIONS setting, return &x directly, malloc inside a function,
  write after free). Constructs were scanned with the notation.yaml patterns after masking C string literals (both
  the build's mask and an escape-aware mask), allowed set = own Skill + transitive hard-prerequisite closure (15A, 15B
  and 15C Skills included) + declared required_skills (plus closures); items, options (also the scan_options false
  ones, for information), references and all 15 lesson checks were scanned, and each item was judged for semantic
  prerequisites the patterns cannot see. Each item was compared with its own Skill's canonical, prerequisite_refresh,
  state_trace, worked_example, contrast texts and lesson checks under the 15A/15B/15C leakage rule. Misconception
  open_questions were read for neutral wording. The shipped asset curriculum_package_v4.txt was checked for its code
  test ids (15 suites, 43 tests, all match the suite JSON); it was built before this review, so every item and task
  in it is still candidate.

  Second pass (same day): the author rewrote pointer_formation f05 (now a c_harness transfer item int
  iki_sayi_oku(int *a, int *b), 5 tests, 3 wrongs), explain_address_vs_value r1 (fiyat/eski scenario, 4 new criteria)
  and identify_simple_lifetime_boundary r1 (concrete toplam_adresi program, two repairs, 4 new criteria); added tests
  to pointer_formation f04 (2.25 2.5), read_pointed_value f05 (1.5 2 6 0 0 0) and modify_value_via_pointer f05
  (descending, ascending, middle_largest); added a third wrong solution to read_pointed_value f01; replaced the
  modify canonical's bol example with toplam_fark; corrected the address_value canonical's sizeof sentence; added the
  NULL header sentence to the pointer_formation canonical; and narrowed the sanitizer claim in the pointer_formation and
  read_pointed_value canonicals. The asset and all 15 suites were regenerated with --out. All 15 suite JSON files were
  compared with the YAML again (all match; 52 tests, and the asset's code test ids match them), and the course runner
  was re-run in WSL on every reference (15/15 pass every test), every authored wrong solution (32/32 fail at least one
  test) and 66 adversarial solutions (the 55 still applicable from the first pass plus 11 new ones for f05: != 2, a
  stored count == 2, two separately checked scanf calls, a ternary with a learner main, a copy via locals written only
  on success, > 0, != EOF, == 1, swapped targets, locals never stored, no #include). Every changed claim was re-run:
  NULL compiles with stdio.h, stdlib.h or stddef.h alone and is undeclared without a header; the uninitialised-pointer
  read again ran clean under the sanitizer build (printed a number, exit 0); toplam_fark(9, 4) gives 13 5; the
  fiyat/eski lines give eski 40, fiyat 35, &fiyat == &eski 0; the toplam_adresi program prints 5 plain and is a
  stack-use-after-return under the sanitizer, while its three repairs (return the value, static t, malloc plus free)
  run clean and print 5; read f01's third wrong prints 42 plain and is a stack-use-after-return under the sanitizer;
  f05's &a/&b wrong draws -Wformat (int ** for %d) and leaves both variables -1. The construct scan was repeated (no
  hidden construct in any item; the rubric items' code is in the prompt and uses only what their declared Skills
  teach), and each rewrite was re-compared with its own Skill's lesson texts and checks under the same leakage rule.
  All other entries are unchanged from the first pass except notes made stale by the fixes.
  Follow-up (same day): the coordinator added one sentence to pointer_formation f05's prompt stating that a number that
  can be read is stored even when the other cannot (as scanf does); only that item was re-judged (prompt re-read,
  suite JSON re-compared with the YAML, unchanged) and its note updated.

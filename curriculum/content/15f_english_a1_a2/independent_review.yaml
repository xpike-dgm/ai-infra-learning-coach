  item.english.read_simple_terminal_error_fragments.extract_known_signal.f01: {verdict: pass, note: "in_lesson; key notes.txt. Verified verbatim (stderr, status 2) with uutils ls and GNU ls, with LC_ALL=C.UTF-8, LANG=C.UTF-8 and LANG=C. The quoted_name_is_english open_question shows this exact line."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f02: {verdict: pass, note: "Key A verified ('cat: report.txt: No such file or directory', identical with uutils and GNU cat, all locales). Exactly one option true. Pattern named in the canonical; basic."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f03: {verdict: pass, note: "Key total verified (Python 3.14 last line; the form is unchanged since 3.x and no 'Did you mean' suggestion exists for 'total', so 3.12 in CI prints the same)."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f04: {verdict: pass, note: "Key 2 verified (gcc 15.2: 'a.c:2:12: error: ‘count’ undeclared (first use in this function)', column 12 = after 4 spaces + 'return '; same with -std=c99..c23). The curly quotes appear only in a UTF-8 locale: with LANG=C (or an uninstalled locale) gcc prints 'count' in ASCII quotes and the verify grep fails; the prelude and WSL's default LANG=C.UTF-8 make it stable. This message form is long-standing (gcc 13 in CI expected identical; not runnable here). Isomorph of the canonical's 'a.c:5:3' reading: authentic label generous."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f05: {verdict: pass, note: "Key data.txt verified (Python 3.14; stable)."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f06: {verdict: pass, note: "First pass failed: 'pyhton3: command not found' was a substring of bash's 'bash: line 1: ...' (checked with -qF), and the learner's WSL Ubuntu terminal prints command-not-found's 'Command 'pyhton3' not found, did you mean:' instead. Second pass: replaced by 'ModuleNotFoundError: No module named 'numpyy'' (prompt: the program stopped, which module was not found, write only its name), key numpyy, verified by python3 -c 'import numpyy' | tail -n 1 | grep -qxF. Re-run in WSL (Python 3.14.4) under LC_ALL=C.UTF-8, LANG=C.UTF-8 and LANG=C: status 1, the last stderr line is exactly the shown line, the script prints numpyy; unchanged when a module named numpy is importable (no 'Did you mean' for modules in 3.14) and the same form for a stdlib typo; the line has had this form since Python 3.6, so 3.12 in CI prints the same. Words: no (taught), module and named added to the lexicon with meanings in the canonical; ModuleNotFoundError is an identifier. The canonical names the pattern ('No module named ... → bu adda bir modül yok'); the task is to extract the quoted name, as in f03/f05: authentic label generous."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f07: {verdict: pass, note: "Key A verified ('IsADirectoryError: [Errno 21] Is a directory: 'logs'', logs is a directory). Exactly one option true. Second pass: the canonical now gives is (-dir) and a (bir), so 'Is a directory' uses only glossed words (first-pass vocabulary note resolved). Remaining notes: the prompt ('logs adlı şeyi bir dosya gibi açmaya çalıştı') restates the second half of option A, a strong cue; on Windows Python raises PermissionError for this case (the course runs Python in Linux). Transfer label generous; a neutral prompt ('Bir Python programı bu son satırla durdu') would measure more."}
  item.english.read_simple_terminal_error_fragments.extract_known_signal.f08: {verdict: pass, note: "Key A verified: gcc 15.2 reports 'b.c:3:5: error: expected ‘,’ or ‘;’ before ‘return’' at the return token in every -std (c99-c23, gnu89); the C front end has long reported this at the next token (gcc 13 expected identical; not runnable here); ASCII quotes under LANG=C as in f04. Exactly one option true. The real omission is at the end of line 2; the canonical's '(çoğu zaman eksik ;)' could add 'bir önceki satırın sonunda'. Named-pattern application: transfer label generous."}
  item.english.documentation_navigation.demonstrate_capability.f01: {verdict: pass, note: "in_lesson. Key A correct (man-pages(7) EXAMPLES)."}
  item.english.documentation_navigation.demonstrate_capability.f02: {verdict: pass, note: "Key A correct. The prompt's 'nasıl yazılacağını (biçimini)' is the canonical's gloss of SYNOPSIS verbatim: recall, fine at basic."}
  item.english.documentation_navigation.demonstrate_capability.f03: {verdict: pass, note: "Key -v (also --version) correct by matching version (label lesson). Second pass: show is now glossed, and the canonical warns that letters differ between tools ('birçok araçta -v verbose, -V version ... Harfi değil açıklamayı oku'), so this fictional tool's -v for version now exercises exactly that advice."}
  item.english.documentation_navigation.demonstrate_capability.f04: {verdict: pass, note: "First pass failed: sort, by, number, reverse, order, only, unique, show were in the lexicon but never given a meaning, so the key ('sort by number' = sayıya göre sırala) rested on the number/numara cognate. Second pass: the canonical glosses every lexicon word (sort = sırala, by = -e göre, number = sayı, reverse = ters çevir, order = sıra, unique = tekrarsız, only = yalnız, show = göster). The item is unchanged; key -n (also --number) correct; teaching the words is the lesson's job under the vocabulary interpretation, and the option list and the 'sıralamak' task are not in the lesson."}
  item.english.documentation_navigation.demonstrate_capability.f05: {verdict: pass, note: "Key A correct (man-pages(7): SEE ALSO lists related pages). Option A is the canonical's gloss 'ilgili başka komutlar' verbatim: recall; authentic label generous."}
  item.english.documentation_navigation.demonstrate_capability.f06: {verdict: pass, note: "Key 10 correct (default rule). Renamed isomorph of the canonical's '(default: 5) → 5': authentic label generous. Second pass: 'Yalnız sayıyı yaz.' added (note resolved)."}
  item.english.documentation_navigation.demonstrate_capability.f07: {verdict: pass, note: "Key -s (also --size) correct, reachable from size (label lesson) and the long option name. Declares the preposition Skill for 'in'/'of'. Second pass: each, of, show, sort, time, print, only are now glossed in the canonical; the DESCRIPTION line is still an imperative ('List the files ...') outside the closure, not needed for the key. The canonical's search method names size as an example keyword; choosing among four authentic-looking lines is still genuine transfer."}
  item.english.documentation_navigation.demonstrate_capability.f08: {verdict: pass, note: "Key A correct (man(1): arguments within [ ] are optional). It is the canonical's own line 'Usage: rapor-yaz [OPTION]... FILE' renamed (rapor-al) with one more bracketed element [NAME], and the brackets_required contrast says 'burada FILE zorunludur': renamed isomorph; the transfer label is not earned (f07 carries transfer). Make it structurally new (e.g. two required parts, or the required part first)."}
  item.english.write_command_result_note.demonstrate_capability.f01: {verdict: pass, note: "in_lesson. Key shows, also prints; both taught and correct. Nothing else in the closure fits."}
  item.english.write_command_result_note.demonstrate_capability.f02: {verdict: pass, note: "Key are, the only correct taught word. Isomorph of the canonical's 'The tests are done'; basic."}
  item.english.write_command_result_note.demonstrate_capability.f03: {verdict: pass, note: "First pass failed: only has was accepted. Second pass: also_accept [shows, prints]; all three are correct with a singular subject and taught; wrong forms (have, show, print) are refused."}
  item.english.write_command_result_note.demonstrate_capability.f04: {verdict: pass, note: "Key returns correct (return is this lesson's word; -s rule from be_and)."}
  item.english.write_command_result_note.demonstrate_capability.f05: {verdict: pass, note: "First pass failed: the teach title showed '`ls` shows three files.', this item's answer. Second pass: the title is now 'Kısa bir komut notu yazmak: komut + fiil + sonuç', the Objective statement shows 'shows five files', and the prompt no longer repeats the word list. Accept list (with/without backticks, with/without period) covers the correct orderings of the four parts; ASCII case folding covers 'Ls'. Note: the canonical's first example '`ls -a` shows five files.' is the same frame with another count, so this ordering task is a renamed isomorph; acceptable at authentic only because the learner must still order the parts."}
  item.english.write_command_result_note.demonstrate_capability.f06: {verdict: pass, note: "First pass failed: 'failed' (the label lesson's 'başarısız oldu', matching the past-tense Turkish prompt) was refused. Second pass: also_accept [failed]; fail/failing are still refused. Cosmetic: the stimulus 'The test ___ .' keeps a space before the period."}
  item.english.write_command_result_note.demonstrate_capability.f07: {verdict: pass, note: "First pass failed: digits and 'The `make` command ...' were refused, and the statement showed 'prints two warnings'. Second pass: full matrix of the bare, backticked and 'The ... command' subjects; the statement now says 'prints one warning'. Follow-up: the order 'The command `make` ...' / 'The command make ...' was added, so the list is the complete 48-form matrix (make or `make` x 'make' / 'The make command' / 'The command make' x prints/shows x two/2 x with or without the period; no duplicates). Every entry was matched against that correct pattern: none is wrong; print, show, warning after two and other wrong forms are refused."}
  item.english.write_command_result_note.demonstrate_capability.f08: {verdict: pass, note: "First pass failed like f07. Second pass: full matrix of the bare, backticked and 'The ... command' subjects. Follow-up: 'The command `git status` ...' / 'The command git status ...' added, so the list is the complete 36-form matrix (git status or `git status` x three subject frames x one/a/1 x with or without the period; no duplicates), all correct with shows; 'prints' is refused, consistent with the Turkish 'gösterir'; 'files' after one is refused."}
  item.english.write_command_result_note.demonstrate_capability.r1: {verdict: pass, note: "First pass failed: the teach title modelled this answer and taught_language_only penalised correct English. Second pass: the title no longer contains a note, and the fourth criterion is clear_and_correct ('Derste öğretilmemiş ama doğru bir kelime ya da yapı kullanmak eksik sayılmaz'). The canonical's '`ls -a` shows five files.' is close to the expected note (ls with three files): a new scenario of the taught pattern, passes as in 15E r1. verb_with_s still requires an -s verb (a correct 'There are three files.' would miss it); that is the construct being measured, fine for a controlled production task."}
  item.english.write_command_result_note.demonstrate_capability.r2: {verdict: pass, note: "First pass failed: taught_language_only could count the natural past tense ('Five tests passed. One test failed.') against the learner. Second pass: clear_and_correct says past tense (passed, failed) is also correct; agreement is only violable in present forms, so a past-tense note meets it. Criteria match the prompt's two counts."}

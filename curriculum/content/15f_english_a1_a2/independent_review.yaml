  item.english.preposition_function_word_comprehension.demonstrate_capability.f01: {verdict: pass, note: "in_lesson (the canonical's in example verbatim). Key A correct."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f02: {verdict: pass, note: "Key '12' correct. Isomorph of the canonical's 'The error is at line 7', fine at basic. Second pass: 'Yalnız sayıyı yaz.' added (note resolved)."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f03: {verdict: pass, note: "Key A correct. The canonical's reading hint says 'from the file → dosyadan', which is this item's key phrase and answer; the stimulus (reads the name) is new: named-instance isomorph, acceptable only at basic."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f04: {verdict: pass, note: "Key A correct (to = goal). Second pass: option B is now 'Çıktı dosyasından' (the from-direction distractor, parallel to the others)."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f05: {verdict: pass, note: "Key A correct (with = birlikte); -l is a literal."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f06: {verdict: pass, note: "Key A correct (inside)."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f07: {verdict: pass, note: "Key A correct. Same frame as the worked example (from the old folder into the new folder), but move vs copy (C 'İkisinde de') makes the learner integrate the be lesson's moves (taşır): acceptable transfer."}
  item.english.preposition_function_word_comprehension.demonstrate_capability.f08: {verdict: pass, note: "Key A correct (after the build, before the tests). 'the build' as a noun (see be_and f02)."}
  item.english.negation_question_comprehension.demonstrate_capability.f01: {verdict: pass, note: "in_lesson (canonical 'The program is not ready'). Key A correct."}
  item.english.negation_question_comprehension.demonstrate_capability.f02: {verdict: pass, note: "Key A correct; D is a negative imperative (not taught, but only a distractor)."}
  item.english.negation_question_comprehension.demonstrate_capability.f03: {verdict: pass, note: "Key A correct. Isomorph of the canonical's 'Is the file empty?'; basic."}
  item.english.negation_question_comprehension.demonstrate_capability.f04: {verdict: pass, note: "Key A correct. Isomorph of the canonical's 'The folder has no files' (→ hiç dosya yok): authentic label generous."}
  item.english.negation_question_comprehension.demonstrate_capability.f05: {verdict: pass, note: "Key A correct. Isomorph of the canonical's 'Where is the log?' and, since the second pass, of the worked example's 'Where is the size?': authentic label generous; the item still requires reading the where-question, which no option list in the lesson answers."}
  item.english.negation_question_comprehension.demonstrate_capability.f06: {verdict: pass, note: "Key A correct; B (yes/no reading) is a good distractor."}
  item.english.negation_question_comprehension.demonstrate_capability.f07: {verdict: pass, note: "Key A correct; declares the preposition Skill for 'in'. 'It' here is the file by meaning, not the previous subject (the tool) that be_and's worked example models; no option says 'the tool is not in the folder', so one option is true. A one-line note in a lesson that 'it' is the thing that makes sense, usually the last named thing, would cover both this and be_and f08."}
  item.english.negation_question_comprehension.demonstrate_capability.f08: {verdict: pass, note: "Key A correct (don't with a plural subject, isn't). Good integration."}
  item.english.follow_bilingual_technical_instruction.execute_known_instruction.f01: {verdict: pass, note: "in_lesson (canonical 'First, open the file. Then, edit it.'). Key A correct."}
  item.english.follow_bilingual_technical_instruction.execute_known_instruction.f02: {verdict: pass, note: "Key A correct."}
  item.english.follow_bilingual_technical_instruction.execute_known_instruction.f03: {verdict: pass, note: "Key A correct ('Finally, start it again'). The Türkçe destek (update) is a word already taught in the label lesson; harmless."}
  item.english.follow_bilingual_technical_instruction.execute_known_instruction.f04: {verdict: pass, note: "Key A correct. 'the copy' is a noun use the lessons never teach (copy = kopyala); the scaffold 'copy = kopya / kopyala' supplies it and preserves meaning (TEIP §10.1). The scaffold's 'kopya' is close to the answer word but the measured step (which object 'rename' takes) is still the learner's."}
  item.english.follow_bilingual_technical_instruction.execute_known_instruction.f05: {verdict: pass, note: "Key A correct. The scaffold glosses install and restart, both already taught (labels, imperative), and its 'restart = yeniden başlat' is option A's wording: the item reduces to 'Step 2 follows Step 1'. Drop the scaffold or gloss a different word."}

findings:
  - "Result: first pass 71/82 items and 46/50 explanations passed (11 item fails: labels f04; be_and f08; error_fragments f06; documentation f04; write_note f03, f05, f06, f07, f08, r1, r2; 4 explanation fails: imperative canonical; error_fragments canonical and contrast_permission_means_missing; documentation canonical). Second pass: every failed item and explanation passes after the fixes, and the other changed entries (labels f05, f06, f07; noun_phrase f06; be_and f07; imperative f02, f04, f06, f07; preposition f02, f04; negation f05 and worked example; error_fragments f07; documentation f03, f06, f07; and_order_free unchanged) still pass. Final: 82/82 items and 50/50 explanations pass. Every keyed item passes its own verify block in the build, both lesson checks pass, and the lexicon/construct scan finds no hidden prerequisite."
  - "Keys and translations: all 72 reference keys are correct English and every Turkish key option is an accurate translation; every multiple-choice item has exactly one true option (labels f04 now asks which button writes the changes to the file; be_and f08 no longer depends on resolving 'It'). Reference citations no longer credit a source with a claim it does not state (labels f07: the Help→About placement is named a convention; imperative f07: the and-order is the lesson's rule). Reference mode is not machine-checked; every key was checked by hand in both passes."
  - "Production accept lists (write_command_result_note), second pass: f03 accepts has/shows/prints; f06 fails/failed; f07 the full 32-form matrix and f08 the full 24-form matrix (command bare or in backticks, with or without 'The ... command', number as word or digit, with or without the period); f05's list covers the four parts in order. Enumerated against wrong forms (print, show, warning after two, files after one, prints for 'gösterir'): none is accepted. The follow-up added the rarer 'The command `make` ...' order, making f07 a 48-form and f08 a 36-form matrix. r1/r2's clear_and_correct criterion no longer penalises correct untaught English, and r2 says the past tense is correct. 'Yalnız sayıyı yaz.' is now on labels f05, preposition f02 and documentation f06."
  - "Vocabulary: direction (a) holds — every English token in every stimulus and English option (labels f06/f07 now scan theirs) is in the lexicon of the item's Skill, its hard-prerequisite closure or a declared Skill, and the production keys (which the builder does not scan) use only taught words. Direction (b) now holds for all ten lessons: documentation_navigation and read_simple_terminal_error_fragments give every listed word a meaning (module and named added), and imperative's gloss of the is corrected ('o, belirli şey'). Remaining minor notes: 'the build' as a noun (be_and f02, preposition f08, negation f08, write_note f03) while the label lesson glosses build only as a verb; note/notes/result listed but unglossed in write_note (no item needs them). Builder gaps worth closing: scan answer/also_accept of production items; a token in ASCII quotes is skipped as a name, so an untaught word could be hidden by quoting it."
  - "Grammar: no item needs an untaught structure for its key. No imperative in preposition, negation or be_and items (negation f02's D and documentation f07's DESCRIPTION line are imperatives, not needed); no preposition in follow_bilingual items; no '?' outside negation_question; plurals only after the label lesson's rule; past forms only as the labels passed/failed. Reference of 'it': be_and f04 and follow f01/f03/f04 resolve to the previous subject/object as taught; negation f07 resolves by meaning (one option fits). negation's worked example now uses only taught language ('Where is the size?'). documentation_navigation's option descriptions are imperatives with articles and prepositions while its only prerequisite is the label lesson; the canonical now glosses every word, so the items are answerable (graph remark below)."
  - "Leakage: the first-pass title leak (write_note teach title = f05/r1's answer) is fixed, and the Objective statements of imperative, noun_phrase and write_note no longer carry item stimuli or answers. Renamed isomorphs and named-rule applications pass with notes: preposition f02, f03 ('from the file → dosyadan' is in the canonical); be_and f03; imperative f04, f07; negation f03, f04, f05 (now also the worked example's frame); follow f07, f08; error_fragments f04, f06 (named pattern), f08; documentation f02, f05 (option A is the canonical's gloss), f06, f08 (the canonical's own Usage line renamed plus [NAME]); labels f08; write_note f05 and r1 (the canonical's '`ls -a` shows five files.' frame)."
  - "Explanations: the four first-pass errors are fixed and verified: the gloss of the; Permission denied no longer implies the file exists and the contrast says a missing file gives No such file or directory only when its folder is accessible; the documentation canonical glosses its lexicon and names the man-page layout, GNU's options-under-DESCRIPTION pages and the -v/-V difference. Remaining minor notes: error_fragments still teaches 'command not found' without mentioning that Ubuntu's own interactive terminal shows command-not-found's \"Command '...' not found\" text (no item uses it now); be_and's is_means_exists promises 'there is' later; the open_questions of and_order_free (file vs program) and preposition_after_noun (nothing precedes 'at line 7') still need a wording fix; all other open_questions are neutral."
  - "Coverage after the second pass (non-in_lesson, passing): every Objective has at least one passing item at basic, authentic_application and transfer_integration. write_command_result_note: basic f02/f03, authentic f04/f05/f06/r1, transfer f07/f08/r2. documentation_navigation: authentic f04 (now passing), f05 (recall), f06 (isomorph). Labels generous (isomorphs or named rules): labels f08; noun_phrase f06; imperative f04, f07; negation f04, f05; follow f07, f08; error_fragments f04, f06, f07, f08; documentation f05, f06, f08."
  - "Error-message stability: f01, f02 and lesson check 1 are identical with uutils 0.8 and GNU 9.7 ls/cat in every locale (uutils and GNU differ only on Permission denied wording, which no item quotes). Python lines (f03, f05, f06, f07, check 2) are stable 3.12-3.14; the new f06 line ('ModuleNotFoundError: No module named 'numpyy'') was re-run under three locales and with a module named numpy importable (no suggestion appended in 3.14). gcc lines (f04, f08) are identical for all -std values with gcc 15.2 and need a UTF-8 locale for the curly quotes (LANG=C prints ASCII quotes and the verify grep fails) — the prelude and WSL's LANG=C.UTF-8 cover this; gcc 13 in CI could not be run here, the forms are long-standing. The unstable first-pass f06 (bash's command-not-found line, which differs between non-interactive bash, interactive bash and Ubuntu's handler) is gone; every error-fragment verify script now uses grep -qxF on the shown line."
  - "Graph (decide in 15H; all 6C edges are draft, this package publishes the 9 internal hard ones): documentation_navigation depends only on recognize_core_technical_labels, yet authentic help text is imperative clauses with articles, prepositions and noun phrases; the canonical now glosses everything it shows, which makes the items fair, but soft edges from imperative_instruction_comprehension and preposition_function_word_comprehension (and noun_phrase) would match the content. read_simple_terminal_error_fragments depends only on the label lesson and treats 'is not defined', 'Is a directory', 'No module named', 'before', 'in this function' as glossed fixed patterns: acceptable. write_command_result_note (be_and only) is consistent with its items. negation f07 and documentation f07 correctly declare the preposition Skill."
  - "Authenticity of documentation excerpts: headings, order (EXAMPLES before SEE ALSO, man-pages(7)), the GNU 'Usage: x [OPTION]... FILE' form and man(1)'s '[ ] optional' rule are mirrored honestly; short/long option pairs and '(default: N)' are real --help conventions; the second-pass canonical names the deviations (description below the option in man pages, options under DESCRIPTION in some GNU pages, -v/-V differing between tools)."
  - "Process: the regenerated curriculum_package_v6.txt carries the first-pass verdicts (71 validated; the 11 first-pass fails are candidate), so it must be built again with --out now that this file records 82 passes. The asset shows every changed prompt, option, title and lesson text exactly (curly quotes intact, no literal backslash). Turkish is natural; be_and f07's options now match its dative question (follow-up); remaining cosmetic point: write_note f06's stimulus has a space before the period."

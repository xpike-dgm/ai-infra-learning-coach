reviewer: independent_15f_content_review
date: "2026-10-03"
method: >-
  Read package.yaml, notation.yaml (the per-Skill lexicon, the strip list and the question construct) and all 10 Skill
  files in full (10 Objectives, 82 items = 80 keyed + 2 rubric, 50 explanation forms, 20 misconceptions, 2 lesson
  checks), the 15E and 15D independent_review.yaml files for format and rule, docs/ENGLISH_FOUNDATION_RULES.md,
  TECHNICAL_ENGLISH_CEFR_PROGRESSION_SPEC.md §3 and §7-§9, TECHNICAL_ENGLISH_INTEGRATION_SPEC.md §10/§10.1,
  ENGLISH_ENTRY_DIAGNOSTIC_SPEC.md §8-§9 and §11, curriculum/english/7b_cefr_progression/alignment.yaml, the 16 edges of
  6c_foundations/prerequisite_edges.yaml that touch the ten Skills (the 9 internal hard edges are published; 6 hard
  edges point to B1 Skills; 1 soft edge from engineering.reproducible_run_notes is dropped), and the builder's
  english_words, the lexicon check in the item loop (unknown_word:/word:), closure/sources_of, verify_item modes
  reference and shell, constructs_used, and core-model OpenResponseFacts.accepts (trim both ends, ASCII case fold,
  nothing else normalised). The build was run once with --report to a scratch path only (no --out; nothing but this
  file was changed): every item passes its own verify block and the lexicon/construct scan reports no hidden
  prerequisite; 0/82 validated for lack of this review; both lesson checks PASS. Every one of the 72 reference-mode
  keys was checked by hand against the English (and the cited source where it states the claim), every multiple-choice
  item for exactly one true option, and every Turkish option and lesson gloss for translation integrity. The lexicon was
  audited in both directions: (a) every English token of every stimulus and every scan_options false option was traced
  to the lexicon of the item's own Skill, its hard-prerequisite closure or a declared required Skill (the builder's
  result reproduced; the keys of the 10 production items, which the builder does not scan, were traced by hand); (b)
  for each Skill, every lexicon word was looked up in its canonical/worked example for a stated meaning. Each item was
  then read for grammar the pattern list cannot see (imperative, plural, articles, it-reference, question inversion,
  past forms, noun use of verbs). Environment for the 8 error-fragment items: WSL Ubuntu 26.04.1 LTS, bash 5.3.9, gcc
  15.2.0, Python 3.14.4, default coreutils uutils 0.8.0, GNU coreutils 9.7 as gnu*, only C/C.UTF-8 locales, non-root
  user. My own driver ran each verify script and then the shown commands themselves (separate stdout/stderr, fresh
  mktemp directories) in five environments: the package prelude (LC_ALL=C.UTF-8), prelude with GNU ls/cat first on
  PATH, a plain learner environment (LANG=C.UTF-8, no LC_ALL), LANG=C, and LANG=en_US.UTF-8 (not installed, falls back
  to ASCII). The mistyped-command case was also run in an interactive bash in a pseudo-terminal (script(1)) with the
  distribution's /etc/bash.bashrc (command-not-found installed) and with --norc. gcc was also run with -std=c99, c11,
  c17, c23 and gnu89. The Permission denied claims were tested with a missing file inside a chmod 000 folder and with a
  chmod 000 file. CI's GNU coreutils on ubuntu-latest, its older gcc (13) and Python 3.12 are not installed here;
  stability across them is judged from the observed output and the long-standing form of these messages (noted per
  item). Each item was compared with its own Skill's canonical, prerequisite_refresh, worked_example, contrast texts and
  lesson checks under the 15A-15E leakage rule (for vocabulary recognition, the author's interpretation: the lesson
  teaches the word; the item's stimulus and context must not appear), and, because the planner explanation shows task
  titles to the learner, also with its Skill's task titles and Objective statement. Misconception open_questions were
  read for neutral wording. The shipped asset curriculum_package_v6.txt was read for the item prompts (stimulus, options
  and curly quotes shown exactly; no literal backslash anywhere; 82 items, 80 answer keys, 2 rubrics with 4 criteria
  each, 50 explanations, 20 misconceptions, 9 prerequisite edges).

  Second pass (same day): the author changed labels f04 (the prompt now asks which button writes the changes to the
  file; C 'İkisi de değişiklikleri dosyaya yazar', D 'Hiçbiri; ikisi de değişiklikleri siler'), added 'Yalnız sayıyı
  yaz.' to labels f05, preposition f02 and documentation f06, reworded the references of labels f07 and imperative f07
  (the Help→About convention and the and-order are no longer credited to Wiktionary/Wikipedia), rewrote be_and f08 ('The
  command takes a file name and prints the size.', no 'It'), replaced error_fragments f06 with a Python
  ModuleNotFoundError item (free answer numpyy; module/named added to the lexicon and the canonical), gave every word
  of the error_fragments and documentation lexicons a meaning in their canonicals, corrected the Permission denied line
  and the permission_means_missing contrast, added the man-page layout and -v/-V sentences to the documentation
  canonical, corrected imperative's gloss of 'the', replaced Objective-statement examples that were item stimuli or
  answers (imperative, noun_phrase, write_note), changed imperative f06's prompt, preposition f04's option B, be_and
  f07's prompt and negation's worked example ('Where is the size?'), and in write_command_result_note changed the teach
  title ('komut + fiil + sonuç'), f03 (has/shows/prints), f05 (prompt no longer repeats the list), f06 (fails/failed),
  f07/f08 (full accept matrices) and replaced r1/r2's taught_language_only with clear_and_correct (untaught but correct
  English is not penalised; past tense accepted). All ten Skill files and notation.yaml were re-read in full (07 is
  unchanged). The build was re-run with --report to a scratch path (no --out): every key and both lesson checks pass,
  no hidden prerequisite (labels f06/f07 now scan their English options, all taught). New f06 was run in WSL (python
  3.14.4) with LC_ALL=C.UTF-8, LANG=C.UTF-8 and LANG=C under env -i: stdout empty, status 1, last stderr line exactly
  'ModuleNotFoundError: No module named 'numpyy'', the verify script prints numpyy; the same line appears when a module
  named numpy is importable (no 'Did you mean' in 3.14), and a stdlib typo (jsonn) gives the same form. The corrected
  Permission denied claims were checked against the first pass's observations (missing file in a chmod 000 folder →
  Permission denied; missing file in an accessible folder → No such file or directory). The f07/f08 accept lists were
  enumerated: f07 = 2 command spellings x 2 'The ... command' choices x prints/shows x two/2 x period (32, all listed),
  f08 = 4 subject forms x one/a/1 x period (24, all listed); wrong forms (print, warning, files after one, prints for
  gösterir) are not accepted; ASCII case folding covers a capitalised first word. The regenerated asset
  curriculum_package_v6.txt was read for the changed prompts, options, titles and lesson texts (it carries the
  first-pass verdicts: 71 validated). All other entries are unchanged from the first pass except notes made stale by
  the fixes.

  Follow-up (same day): be_and f07's options were changed to the dative case to match 'hangi dosyaya yazar?' and the
  write_note f07/f08 accept lists gained the 'The command `x` ...' order; both were re-read, f07's options checked for
  exactly one true option and every accepted f07/f08 answer matched against the correct-form pattern (48 and 36 forms,
  complete matrices, none wrong).
items:
  item.english.recognize_core_technical_labels.match_term_meaning.f01: {verdict: pass, note: "in_lesson; key A (save = kaydet) correct; the canonical glosses save."}
  item.english.recognize_core_technical_labels.match_term_meaning.f02: {verdict: pass, note: "Key A correct (a warning is not an error; GCC manual §3.8 says warnings report constructs that are not inherently erroneous). Exactly one option true. Option A's 'program yine de derlenmiş olabilir' is a little technical knowledge beyond the word, hedged by 'olabilir'; fine at basic."}
  item.english.recognize_core_technical_labels.match_term_meaning.f03: {verdict: pass, note: "Key A correct; C is the close_deletes distractor reversed. Basic."}
  item.english.recognize_core_technical_labels.match_term_meaning.f04: {verdict: pass, note: "First pass failed: with 'Değişikliklerini korumak için', C 'İkisi de değişiklikleri korur' was defensible (Cancel in a close dialog keeps the unsaved changes in the editor). Second pass: the prompt asks which button writes the changes to the file and C/D are now 'İkisi de değişiklikleri dosyaya yazar' / 'Hiçbiri; ikisi de değişiklikleri siler': Cancel writes nothing, so exactly one option (A Save) is true. 'dosyaya yazmak' does not give away the gloss 'kaydet'; the learner still needs save. Claim updated accordingly."}
  item.english.recognize_core_technical_labels.match_term_meaning.f05: {verdict: pass, note: "Key '2' correct ('7 passed, 2 failed'). Second pass: the prompt now ends 'Yalnız sayıyı yaz.' (first-pass note resolved)."}
  item.english.recognize_core_technical_labels.match_term_meaning.f06: {verdict: pass, note: "Key A correct (Exit leaves the program; Close closes the document/window). Exactly one option true. The canonical contrasts close/delete and exit/output but not close/exit; the item applies exit's own gloss 'programdan çık': fine. Second pass: the English options are now scanned (scan_options removed); all are taught."}
  item.english.recognize_core_technical_labels.match_term_meaning.f07: {verdict: pass, note: "Key A is the best answer (desktop programs conventionally put About/version under Help). The convention is UI knowledge the lesson never states (only help = yardım); passes as 'büyük olasılıkla' reasoning modelled by the worked example (Settings under Tools). Second pass: the reference now says the Help→About placement is a convention, not a dictionary claim (first-pass citation note resolved); options now scanned, all taught. Stating the convention in the lesson would still remove the last bit of non-English knowledge (TECP §9)."}
  item.english.recognize_core_technical_labels.match_term_meaning.f08: {verdict: pass, note: "Key A correct. Applies the canonical's own gloss 'upload (yükle: senin bilgisayarından başka bir yere)' and the download_is_upload contrast to a page: named-rule application, transfer label generous."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f01: {verdict: pass, note: "in_lesson ('log file' is the canonical's first example). Key A correct; B is the head_is_first distractor."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f02: {verdict: pass, note: "Key A correct (head = data). Exactly one option true."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f03: {verdict: pass, note: "Key A correct; folder from the hard prerequisite. Note: 'Empty Folder' is also a real command label (verb reading = B 'Klasörü boşalt'); the prompt's 'Bu öbeğin' fixes the noun-phrase reading, so one option is true."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f04: {verdict: pass, note: "Key A correct (the source list is empty); B is the adjective_describes_last_only distractor. Good."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f05: {verdict: pass, note: "Key A correct (user name, both words taught)."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f06: {verdict: pass, note: "Key A correct under either bracketing (default [output file name] or [default output file] name): the field holds a name. Same shape as the worked example 'current project name' (modifier + noun + noun + name): authentic label generous. Second pass: the Objective statement no longer shows this stimulus (it now shows the worked example's phrase)."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f07: {verdict: pass, note: "Key A correct ('user list number' is a number; 'user number list' a list). Options contain English (scan_options false) but every word is taught. Genuine transfer (minimal pair)."}
  item.english.technical_noun_phrase_recognition.demonstrate_capability.f08: {verdict: pass, note: "Key A correct (head = page, four-word stack). Genuine transfer."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f01: {verdict: pass, note: "in_lesson (canonical 'The file is empty'). Key A correct; C is the is_means_exists distractor."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f02: {verdict: pass, note: "Key A correct. 'The build' is a noun here, while recognize_core glosses build only as a verb (derle / oluştur); the step to 'derleme' is small but untaught (also 05 f08, 06 f08, 10 f03 and the 10 canonical). Add 'build (derle; derleme)' to the label lesson."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f03: {verdict: pass, note: "Key A correct (ls in backticks is a literal). The s_means_plural_verb open_question shows 'The command shows the files' (the stimulus without ls) and the canonical 'This command shows the version': renamed isomorph, fine at basic."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f04: {verdict: pass, note: "Key A correct ('It' = the build, the previous subject, as the worked example teaches)."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f05: {verdict: pass, note: "Key A correct (stores = saklar, taught)."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f06: {verdict: pass, note: "Key A correct (these, two, are, the same: all taught)."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f07: {verdict: pass, note: "Key A correct. Second pass: the prompt is now 'Araç hangi dosyaya yazar?' (first-pass wording note resolved). Follow-up: the options now match the dative question ('Çıktı dosyasına (output file)', 'Girdi dosyasına (input file)', 'İkisine de', 'Hiçbirine; yalnız okur'); the sentence says the tool reads the input file and writes the output file, so only A is true (B is read, not written; C and D contradict 'writes the output file'). The read/write contrast is named in the Objective statement, not in the lesson texts: transfer acceptable."}
  item.english.be_and_simple_present_comprehension.demonstrate_capability.f08: {verdict: pass, note: "First pass failed: 'It takes a file name' was keyed with 'It' = the option, against the lesson's previous-subject reading. Second pass: rewritten as 'The command takes a file name and prints the size.' (one subject, two coordinated present verbs, all words taught: takes, prints, size, a, the, and) with the question 'Komuta ne verirsin ve komut ne yazdırır?'. Key A correct ('Bir dosya adı verirsin; komut boyutu yazdırır'); B swaps the roles, C drops the input, D prints the file: exactly one option true. No reference ambiguity remains. A coordinated predicate with two roles is new relative to the lesson's examples: transfer acceptable."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f01: {verdict: pass, note: "in_lesson (canonical 'Save the file and close the program'; task title). Key A correct; B is the imperative_is_description distractor."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f02: {verdict: pass, note: "Key A correct. Second pass: the Objective statement no longer shows this sentence (now 'Open the folder. Run the tests and close the program.')."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f03: {verdict: pass, note: "Key A correct; B exploits type (tür) vs type (yaz), both glossed. Good."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f04: {verdict: pass, note: "Key A correct. Same structure as the worked example ('Create a folder and move the file'): renamed isomorph, authentic label generous. Second pass: the sentence is no longer in the Objective statement."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f05: {verdict: pass, note: "Key A correct (rename = yeniden adlandır)."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f06: {verdict: pass, note: "Key A correct; B uses enter = gir. Second pass: the prompt is now 'Terminal sana bir soru sordu; hemen altında bu satır var.' (the soru/sorun ambiguity is gone)."}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f07: {verdict: pass, note: "Key A correct. The and-order rule is the canonical's and the and_order_free contrast's: named-rule isomorph, transfer label generous. Second pass: the reference no longer credits Wikipedia with the ordering claim; it cites Imperative mood for the form and the lesson for the order (first-pass citation note resolved)."}

          B: "backup (yedek) — verinin yedeği"
          C: "İkisi eşit; sıra fark etmez"
          D: "Öbek bir komuttur, isim değildir"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wikipedia — Noun adjunct; English noun phrases are head-final for noun premodifiers"
          claim: "backup data'da asıl isim data'dır."
      - slug: f03

        code: |
          The tests ___ ready.
        answer: "are"
        verify:
          mode: reference
          reference: "Wikipedia — Copula (linguistics): are with plural subjects"
          claim: "Çoğul özne (the tests) ile are."
      - slug: f03
        difficulty: basic

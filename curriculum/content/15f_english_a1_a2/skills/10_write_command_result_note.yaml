skill: skill.english.write_command_result_note
activity: explanation_justification
tasks:
  teach: {title: "Kısa bir komut notu yazmak: komut + fiil + sonuç", minutes: 15}
  practice: {title: "Komut ve sonuç notu yazma alıştırması", minutes: 10}
  check: {title: "Komut ve sonuç notu yazma kontrolü", minutes: 10}
  review: {title: "Komut ve sonuç notu yazma tekrarı", minutes: 8}
  repair: {title: "Notu yeniden kurmak: komut, fiil, sonuç", minutes: 12}

objectives:
  - id: objective.english.write_command_result_note.demonstrate_capability
    statement: >-
      Bir komutu ve sonucunu anlatan kısa, doğru bir İngilizce not yazabilmek: komutu adıyla vermek (`ls -a`), geniş
      zamanlı bir fiille ne yaptığını söylemek (shows, prints, returns, has) ve sonucu bir sayı ya da bir durumla vermek
      (shows five files, prints one warning, The build is ready); yalnız daha önce öğrenilmiş kelime ve dilbilgisiyle.
    observable_behavior: >-
      Boşluk doldurma, kelime sıralama ve kısa not yazma görevlerinde komutu, tekil özneye uygun -s'li fiili ve sonucu
      doğru biçimde yazar.
    acceptable_evidence_types: [written_or_spoken_production]
    direct_evidence_types: [written_or_spoken_production]
    required_direct_type: written_or_spoken_production
    reconciliation: >-
      6C'de Objective'in eylemi şablon adıyla kaldı (demonstrate_capability); kimlik korundu, gözlenebilir davranış
      adlandırıldı. Ön koşul be_and_simple_present_comprehension'dır (6C hard); 6C'nin engineering.reproducible_run_notes
      yumuşak kenarı yayımlanmamış bir Skill'e işaret ettiği için pakete girmez. ENGLISH_FOUNDATION_RULES'un tanıma →
      kontrollü üretim → serbest üretim sırası izlenir: anahtarlı item'lar kontrollü üretimdir (boşluk doldurma, sıralama,
      kalıpla not) ve kabul edilen cevap listesiyle değerlendirilir; serbest notlar rubric'le, en çok provisional
      olarak değerlendirilir (OREX-v0). Hiçbir görev öğretilmemiş bir yapıyı (geçmiş zaman, ilişki kelimeleri, olumsuzluk)
      gerektirmez.
    explanations:
      canonical: |
        Bir komut çalıştırdığında kısa bir not yazmak işini başkasına (ya da yarınki sana) anlatır. Kalıp:

        `komut` + fiil (-s) + sonuç.

        - `ls -a` shows five files. → ls -a beş dosya gösterir.
        - `gcc` prints one warning. → gcc bir uyarı yazdırır.
        - The build is ready. → Derleme hazır.

        Kurallar:
        - Komut tek bir şeydir: fiil -s alır (shows, prints, returns, has). show değil shows.
        - Komutu ters tırnak (`) içine yaz; böylece komut olduğu anlaşılır.
        - Sonuç bir sayı (one, two, three ya da 5) ve bir isimdir (files, lines, warnings, errors); birden çoksa isim de -s alır.
        - Durum için is / are: The tests are done.
        - Kısa tut: bir ya da iki cümle.

        Kullanabileceğin fiiller: shows (gösterir), prints (yazdırır), returns (döndürür), has (vardır), passes (geçer), fails (başarısız olur), is / are. Birden çok özneyle -s yok: the tests pass, two tests fail.

        Bu dersin kelimeleri: note, notes, pass, passes, fail, fails, result, return, returns.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (geniş zaman): tek bir özneyle fiil -s alır: the command shows, the test passes; is tek şey, are birden çok şey içindir.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          Terminal:
          $ cat errors.log
          (iki satır hata)

          Not: `cat errors.log` shows two errors.
          - Komut: `cat errors.log` (ters tırnak içinde).
          - Fiil: show → shows (komut tek bir şey).
          - Sonuç: two errors (iki tane, isim -s aldı).
    misconceptions:
      - slug: verb_without_s
        name: Tek bir özneyle de fiil yalın kalır
        open_question: '"`pwd` show one line" yazmanın doğru olduğunu mu düşünüyorsun?'
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Fiilin yalın hâli yeter."

            Komut tek bir şeydir; geniş zamanda tek özneyle fiil -s alır: `pwd` shows one line.
      - slug: number_without_plural
        name: Sayıdan sonra isim tekil kalır
        open_question: '"prints four line" yazmanın doğru olduğunu mu düşünüyorsun?'
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Türkçede 'dört satır' diyoruz, İngilizcede de öyle."

            İngilizcede birden fazla şeyi sayarken isim -s alır: four lines, six errors. Türkçede sayıdan sonra isim tekil kalır; İngilizcede kalmaz.

        answer: "has"
        also_accept: ["shows", "prints"]
        verify:
          mode: reference
          reference: "Wiktionary — have (verb): third-person singular simple present has"
          claim: "Tek özne (the build) ile have → has; shows ve prints de doğru, tek özneyle -s alır."

        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          Notu tamamla. Boşluğa tek bir fiil yaz (komut ekranda dosyaları gösteriyor).
        code: |
          `ls` ___ four files.
        answer: "shows"
        also_accept: ["prints"]
        verify:
          mode: reference
          reference: "Wikipedia — Simple present (third-person singular -s)"
          claim: "Tek özne (`ls`) ile geniş zaman fiili -s alır: shows."
      - slug: f02
        difficulty: basic
        independence: guided

# 15H — Content QA (CQAX-v0 / D-121). A supplement, like 15G's: it changes nothing published and adds what Stage 15's
# content QA found missing or wrong (LFPS-v0: a published version is never overwritten).
#
# What it adds, from the files beside this one:
# - graph.yaml: edges that make the graph say what the lessons and items already need (user decision 2026-10-10: hard
#   only where the lesson and every item outside it need the prerequisite, soft otherwise), and the lessons' needs their
#   teach tasks did not declare;
# - items/<directory>/<skill file>.yaml: new items for the three technical Objectives below 15 (user decision: technical
#   to 15, English keeps 15G's honest small pool), and revisions — the next version of a published item whose suite a
#   program that only prints the answer passes, or whose difficulty label the review found generous; the version it
#   replaces is retired by an appended validation record (user decision);
# - notation_overlay.yaml: reading constructs the notations did not name (in, is, pass, break / continue, as), applied to
#   what this supplement adds;
# - fixed_output.yaml: the Objectives and items where printing one fixed output is itself what is asked, so the
#   constant-output check does not apply.
# The audits that found all this, and that every finding is resolved, are tools/content_qa.py's.

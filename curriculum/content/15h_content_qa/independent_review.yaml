findings:
  python:
  - 'Resolved (t01): the required regex used to list three spellings of the last index and rejected correct programs such
    as sayilar[son_sira] and sayilar[n - 1]. The proposed pattern \bsayilar\[(?!\s*0\s*\])(?!\s*3\s*\])[^\]]+\] is applied,
    and t01_only.out shows both programs pass while the cheats still fail.'
  - 'All earlier findings are resolved. Round 1: import instead of run; .strip(); the constant program with named variables;
    prompt ambiguity; labels. Round 2: sys.exit losing the names; half-hand-computed assignment programs. I re-ran their probes
    against the current builder and every one now behaves as declared.'
  - 'Minor limits, not blocking: required blanks only one-line texts and comments, so a triple-quoted text that contains print(mesafe)
    would satisfy g04 (contrived). Before Python 3.12 an f-string is one STRING token and gets blanked, so print(f"{mesafe}")
    would fail g04 on an old Python. That is unnatural here, since the fix shown is print(mesafe), but it is worth knowing
    if a learner''s Python is older.'
  - 'Optional label note: run_repl_script g04 (fix a misspelled variable from a NameError) stays authentic_application. It
    is close to the canonical NameError example and the worked example, so basic would also be defensible. It is not part
    of any review decision.'
  - 'Residual cheats that pass are all contrived, and I accept them as the declared limit: recomputing the literal (80 + 7,
    0x57); f04 copy-then-overwrite; f05 doing one update per name.'
  c:
  - 'Method across three rounds: each item''s source_checks went through source_check_harness(''c'', ...) from tools/build_curriculum_package.py
    and were run with b.run_suite on the real runner in WSL gcc 15 (gcc -std=c11 -Wall -Wextra build). Final round: 102 programs,
    correct variants and cheats for every revision and new item. 97 behaved as a correct check should. The remaining 5 are
    accepted: ''_Bool'' (the prompt names bool) and four contrived cheats that pass the answer as a numeric printf argument
    or adjust one value asymmetrically (h01 x2, declaration g07, while g07).'
  - 'Fixed since round 1: comma-tolerant declaration regexes (\b<type>\s+(?:[^;{}]*,\s*)?<name>\b); required expressions for
    f03, g03, g07, g08 and g09; no unasked cast in f05; ''long long int'', ''double const'' and ''int const'' accepted; B
    and 3 forbidden in g06/g10; 4, 8, 12, 16 forbidden in while g07; -Werror=unused-but-set-variable; required patterns searched
    in string-blanked code (char literals untouched); two memory labels lowered to basic.'
  - 'Remaining gap class: a value given as a numeric printf argument while every declared variable is still read. A ban list
    that only scans strings cannot see it. Contrived; accepted.'
  - 'Compile exemptions (fixed_output.yaml), each read against its item: f01-f05, g01-g05, g07, g10 and g11 are escapes, line
    ends or compile fixes where printing the fixed text is the construct, so they are justified. g08 needs none (its exit-code
    test fails the constant program). g06 and g09 were the only computations and are now revised. Confirmed: the g01 reason
    now says the one-printf instruction is not checked and that a program printing the three lines is correct either way.
    That accurately describes the suite (three printf calls pass) and resolves my round-3 note.'
  - 'Style only (unchanged): the f03, g03, g07 and g08 prompts end with two consecutive ''Testler ... bakar.'' sentences;
    merging them would read better.'
  linux_english_15a:
  - 'Final result: 38/38 pass (36 revisions plus h01/h02); all 5 keeps agreed. Round 1 had 7 fails: five labels left one level
    too high by the ''one level down'' rule, h01''s label, and h02''s hidden prerequisite. All were resolved in round 2 by
    setting labels to the level the reviews describe and by fixing the prompts. The four review_fix items do what the earlier
    reviewers asked: follow_bilingual f05 without the scaffold, error_fragments f07 with the neutral prompt, the negation
    g04 claim, git f04 also_accept armut.'
  - label_decisions.yaml is complete and current for every Linux/English/15A entry. All 36 revisions have a matching revise
    entry with a reason and my round-2 note as review_15h. The two notes found cut off in round 3 (follow_bilingual f05, error_fragments
    f07) are now quoted whole. The five keeps carry their reasons.
  - 'Open loops (not 15H content work): imperative_instruction_comprehension has no transfer_integration item outside the
    lesson, and negation_question_comprehension has no authentic_application item. Neither blocks mastery: both are standard
    Objectives, with no requires_transfer, and their check tasks still have items. Also, git f07 (''-ikinci'') does not accept
    the bare ''ikinci'' the way f04 now accepts ''armut'', and the label lesson does not gloss the noun ''copy'' (kopya),
    which imperative g07 relies on. In round 3 I could not yet find the first three in vault/agent/OPEN_LOOPS.md; make sure
    they land there at POST-STEP.'
  graph:
  - 'All round-1 and round-2 points are resolved as applied: no redundant edges remain; the missing lesson needs are declared;
    the mapping and exception_handling scaffold misclassifications are removed; g01/g10 are revised so no placeholder is needed;
    the Objective-wide exemption is replaced by per-item reasons; g04/t01/g06/g09 are revised with source checks that ignore
    strings and comments; lesson_checks and lesson_text now use hard_after_15h(), and the two stale files_paths_basic ''imports''
    entries are gone (29 entries; lesson_checks 24 findings, 0 unresolved).'
  - 'Residual, low risk: C not_in_source is searched only inside string literals, so g06 can be satisfied by printf("Toplam:
    %d\n", 437) plus a bare ''19 * 23;'' statement (only -Wunused-value). Only deliberate gaming; optionally also search numeric
    literals outside texts, as the Python harness does.'
  - 'compile_and_run g01: the exemption reason is now honest, but the prompt still says ''YALNIZ BİR printf çağrısıyla'' and
    nothing checks it. Either add a one-printf source check or soften the prompt; neither blocks.'
  - exceptions_read_basic -> list_operations (teach) is the most expensive new wait, resting on one glossed IndexError example;
    accepted given the authored order and exception_handling's own list requirement.
  - 'No further missed lesson needs: re-scanned every 15A/15B lesson (canonical, alternatives, contrasts, numbered listings,
    return/import/pass lines) and every 15C/15D lesson with relaxed C line rules against the post-15H teach requirements.'

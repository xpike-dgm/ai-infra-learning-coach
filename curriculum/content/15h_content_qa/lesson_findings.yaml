  kind: accepted_device
  note: "as check2"
skill.git.repository_status_diff|inspect_change_state|worked_example|git_record:
  kind: accepted_device
  note: "git add program.txt   # hazırlık / git commit ...   # hazırlık — marked, and the canonical explains the lines"

# ---------------------------------------------------------------- recorded: declaring the need would make lessons wait for each other
skill.c.compile_link_run_basic|classify_compile_vs_runtime_failure|check3|function_definition:
  kind: recorded
  note: "a link error needs a function declared without a body; functions_basic itself requires compile_link_run_basic. The worked example says it: 'kare bildirilmiş ama gövdesi yazılmamış'"
skill.c.compile_link_run_basic|classify_compile_vs_runtime_failure|worked_example|function_definition:
  kind: recorded
  note: "as check3: int kare(int x); is glossed as declared without a body"
skill.c.declaration_type_model|write_basic_declarations|state_trace|division_remainder:
  kind: recorded
  note: "the trace divides a double by 2 and shows the result (b: 2.5); expression_evaluation, which teaches division, requires declaration_type_model"
skill.c.standard_io_basic|demonstrate_capability|canonical|if_else:
  kind: recorded
  note: "the one if checks scanf's return value and the lesson says what it is for ('okumanın başarılı olduğundan emin olmak için'); every conditionals item reads with scanf, so conditionals requires standard_io_basic"
skill.c.standard_io_basic|demonstrate_capability|worked_example|if_else:
  kind: recorded
  note: "as the canonical: the worked example prints Hata when scanf does not read a number"

# 15H (CQAX-v0 / D-121) — lesson code that uses a construct its teach task cannot reach, and why each may stand.
#
# tools/content_qa.py reads every lesson's checks (the code the build runs to verify what a lesson claims) and the code
# lines of its texts (canonical, alternatives, contrasts) against what the teach task reaches after 15H — its teach_requires and hard
# edges (graph.yaml). A need the lesson really has is declared there. What remains is listed here, keyed
# "<skill>|<objective action>|<check N or text form>|<construct>", with one of four kinds:
#
#   verification_scaffold  code a check uses only to print what the lesson claims (a loop over test values, try/except
#                          around an error the lesson shows as a traceback, a temporary file); the audit verifies that
#                          the construct is on no code line of the lesson's texts (canonical, alternatives, contrasts) —
#                          the code-line reading is heuristic, so this rests on the review as well;
#   notation_gap           the lesson does teach it, the notation attributes it elsewhere;
#   accepted_device        the course's "# hazırlık" lines (15E, D-118): a commit the next lesson teaches, made before it,
#                          marked on every line and explained in the lesson;
#   recorded               declaring the need would make two lessons wait for each other; the lesson says what the code
#                          does where it shows it.

# ---------------------------------------------------------------- lesson checks: verification scaffolds
skill.programming.test_case_basic|design_expected_case|check2|comparison:
  kind: verification_scaffold
  note: "the check compares the right and the faulty function's results to verify the lesson's claim; the lesson shows only the faulty return line"
skill.programming.code_reading_basic|demonstrate_capability|check2|for_range:
  kind: verification_scaffold
  note: "a loop runs the shown % and // lines on three values"
skill.programming.code_reading_basic|demonstrate_capability|check4|function_def:
  kind: verification_scaffold
  note: "the shown if/else is wrapped in a function to try three inputs"
skill.programming.input_validation_reasoning|demonstrate_capability|check1|for_range:

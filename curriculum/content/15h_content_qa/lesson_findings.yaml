# ---------------------------------------------------------------- notation
skill.python.value_type_behavior|demonstrate_capability|check1|boolean_logic:
  kind: notation_gap
  note: "type(True): True is a bool value value_type_behavior teaches; the notation files True / False with and / or / not under boolean_logic (15A's expression_boolean_reasoning, 15B's expression_evaluation)"

# ---------------------------------------------------------------- the "# hazırlık" device (15E, D-118)
skill.git.repository_status_diff|inspect_change_state|check2|git_record:
  kind: accepted_device
  note: "the starting commit is made with the marked preparation lines; git add and git commit are the next lesson's"

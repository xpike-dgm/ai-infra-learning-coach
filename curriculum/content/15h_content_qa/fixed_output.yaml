# 15H (CQAX-v0 / D-121) — where printing one fixed output is itself what is asked (open loop `fixed_output_items`).
#
# A code item's suite must fail the program that only prints the expected output; otherwise it cannot tell a program that
# does the work from one that prints the answer. tools/content_qa.py runs that program against every published suite, and
# the builder against every suite a supplement adds. A finding is resolved by revising the item (a new version whose
# suite reads how the output was produced) or, only where producing that output is the construct, by an exemption here —
# item by item: an Objective-wide exemption hid two items that ask for a computation (independent review, 15H).

items:
  item.python.run_repl_script.execute_and_classify_result.f01: '"Write a script that prints Merhaba, then Python": printing
    those two lines is the whole task.'
  item.python.run_repl_script.execute_and_classify_result.f04: The SyntaxError is a missing parenthesis in print("İki"; the
    corrected print statements are the fix.
  item.python.run_repl_script.execute_and_classify_result.g02: The NameError is Print written for print; the corrected print
    statement is the fix.
  item.python.run_repl_script.execute_and_classify_result.g03: The SyntaxError is an unclosed quote in print("Günaydın); the
    corrected print statements are the fix.
  item.python.run_repl_script.execute_and_classify_result.g06: The IndentationError is an indented print line; the realigned
    print statements are the fix.
  item.python.run_repl_script.execute_and_classify_result.g08: The difference is the text "ortalama:" printed for "Ortalama:";
    correcting that text is the fix.

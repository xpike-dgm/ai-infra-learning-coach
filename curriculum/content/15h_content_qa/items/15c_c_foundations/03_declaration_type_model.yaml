skill: skill.c.declaration_type_model
objectives:
- id: objective.c.declaration_type_model.write_basic_declarations
  items:
  - slug: h01
    difficulty: authentic_application
    prompt: 'C''de (int) dönüşümü ondalık kısmı atar; yuvarlamaz. Bunu kullanarak pozitif ondalıklı sayıları en yakın tam
      sayıya yuvarlayan bir program yaz: cozum.c adında; a adında bir double 7.6, b adında bir double 7.4 tutsun; yuvarlanmış
      değerleri ya ve yb adında iki int''e atasın ve printf ile tek satırda yazdırsın. Ekranda 8 7 görünmeli. Testler, istenen
      bildirimlerin ve (int) dönüşümünün kaynakta olduğuna, ekrana yazılacak değerlerin printf yazısının içine hazır yazılmadığına
      ve kullanılmayan bir değişken olmadığına da bakar.

      '
    source_checks:
      required:
      - \bdouble\s+(?:[^;{}]*,\s*)?a\b
      - \bdouble\s+(?:[^;{}]*,\s*)?b\b
      - \bint\s+(?:[^;{}]*,\s*)?ya\b
      - \bint\s+(?:[^;{}]*,\s*)?yb\b
      - \(\s*int\s*\)
      not_in_source:
      - '8'
      - '7'
    suite:
    - id: rounds_both_ways
      expected_stdout: |
        8 7
        istenen yapilar: tamam
        sonuc yazida: hayir
        kullanilmayan degisken: yok
    reference: |
      #include <stdio.h>

      int main(void) {
          double a = 7.6;
          double b = 7.4;
          int ya = (int) (a + 0.5);
          int yb = (int) (b + 0.5);
          printf("%d %d\n", ya, yb);
          return 0;
      }
    wrong:
    - |
      #include <stdio.h>

      int main(void) {
          double a = 7.6;
          double b = 7.4;
          int ya = (int) a;
          int yb = (int) b;
          printf("%d %d\n", ya, yb);
          return 0;
      }
    - |
      #include <stdio.h>

      int main(void) {
          double a = 7.6;
          double b = 7.4;
          int ya = (int) a + 1;
          int yb = (int) b + 1;
          printf("%d %d\n", ya, yb);
          return 0;
      }
  - slug: h02
    difficulty: authentic_application
    prompt: 'cozum.c adında bir program yaz: ilk adında bir char ''c'', son adında bir char ''h'' tutsun. c''den h''ye kadar
      (ikisi de dahil) kaç harf olduğunu bu iki değişkenden hesaplayıp sayi adında bir int''e atasın ve yazdırsın. Ekranda
      6 görünmeli. Testler, istenen bildirimlerin kaynakta olduğuna, ekrana yazılacak değerlerin printf yazısının içine hazır
      yazılmadığına ve kullanılmayan bir değişken olmadığına da bakar.

      '
    source_checks:
      required:
      - \bchar\s+(?:[^;{}]*,\s*)?ilk\b
      - \bchar\s+(?:[^;{}]*,\s*)?son\b
      - \bint\s+(?:[^;{}]*,\s*)?sayi\b
      not_in_source:
      - '6'
    suite:
    - id: letters_in_range
      expected_stdout: |
        6
        istenen yapilar: tamam
        sonuc yazida: hayir
        kullanilmayan degisken: yok
    reference: |
      #include <stdio.h>

      int main(void) {
          char ilk = 'c';
          char son = 'h';
          int sayi = son - ilk + 1;
          printf("%d\n", sayi);
          return 0;
      }
    wrong:
    - |
      #include <stdio.h>

      int main(void) {
          char ilk = 'c';
          char son = 'h';
          int sayi = son - ilk;
          printf("%d\n", sayi);
          return 0;
      }
    - |
      #include <stdio.h>

      int main(void) {
          char ilk = 'c';
          char son = 'h';
          char sayi = son - ilk + 1;
          printf("%c\n", sayi);
          return 0;
      }
  revisions:
  - revises: f01
    reason: fixed_output
    prompt: 'cozum.c adında bir program yaz: yas adında bir int değişkene 19, boy adında bir double değişkene 1.82 değer versin
      ve printf ile tek satırda 19 1.82 yazdırsın (boy iki ondalık basamakla). Testler, istenen bildirimlerin kaynakta olduğuna,
      ekrana yazılacak değerlerin printf yazısının içine hazır yazılmadığına ve kullanılmayan bir değişken olmadığına da bakar.

      '
    source_checks:
      required:
      - \bint\s+(?:[^;{}]*,\s*)?yas\b
      - \bdouble\s+(?:[^;{}]*,\s*)?boy\b
      not_in_source:
      - '19'
      - '1.82'
    suite:
    - id: prints_values
      expected_stdout: |
        19 1.82
        istenen yapilar: tamam
        sonuc yazida: hayir
        kullanilmayan degisken: yok

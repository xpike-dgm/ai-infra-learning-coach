      - \bchar\s+(?:[^;{}]*,\s*)?harf\b
      - harf\s*\+\s*1\b|\b1\s*\+\s*harf\b|\+\+\s*harf\b|\bharf\s*\+\+
      not_in_source:
      - '109'
    suite:
    - id: char_as_number
      expected_stdout: |
        m 109 n
        istenen yapilar: tamam
        sonuc yazida: hayir
        kullanilmayan degisken: yok
  - revises: f04

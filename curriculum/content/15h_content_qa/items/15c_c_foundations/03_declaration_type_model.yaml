        istenen yapilar: tamam
        sonuc yazida: hayir
        kullanilmayan degisken: yok
  - revises: f03
    reason: fixed_output
    prompt: 'cozum.c adında bir program yaz: harf adında bir char değişkene ''m'' değer versin; ekrana tek satırda önce harfin
      kendisini, sonra sayısal (ASCII) kodunu, sonra da alfabede kendisinden sonra gelen harfi yazdırsın: m 109 n. Testler,

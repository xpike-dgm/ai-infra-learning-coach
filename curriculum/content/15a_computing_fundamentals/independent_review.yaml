findings:
  - "First pass: all 94 keys were correct; 32 items failed (31 for reusing a problem already solved in the same Skill's lesson, one for self-containment/difficulty) and one contrast text had an arithmetic error. Second pass: all 32 rewrites pass (keys re-verified by execution) and the contrast is fixed. The new classify_artifacts.f07 failed once (it restated the worked_example's closing sentence) and passes after its rewrite. No item or explanation failures remain: 95/95 items and 79/79 explanations pass."
  - "Leakage pattern to watch in future authoring: the lesson `checks` blocks and the items had been drawn from one pool. Several rewrites are deliberate isomorphs of lesson examples (new names/values, same structure); they pass, but a pool built only from isomorphs measures near transfer, so keep some structurally new items per Objective."
  - "Graph: every while loop needs comparisons (expression_boolean_reasoning), but 6C makes only state_assignment_model hard and branching_reasoning soft for iteration_reasoning. The file works around this with lesson_requires and per-item required_skills; the missing hard edge expression_boolean_reasoning -> iteration_reasoning should be decided in the graph (15H), not per item."
  - "Construct check: with transitive hard-prerequisite closure plus declared required_skills, no item (all 95) uses a construct outside its reachable set. input_validation_reasoning, code_reading_basic, debug_localization_basic and test_case_basic depend on the closure being transitive (e.g. comparisons in input_validation come via branching -> expression)."
  - "Task placement: resolved. The build now presents in_lesson items only in the teach task (confirmed in tools/build_curriculum_package.py), so the three in_lesson items that restate the lesson (program_execution_model f01, source_runtime_artifact_distinction f01, code_reading_basic f01) no longer produce practice/check/review/repair evidence."
  - "Coverage after the second pass: every Objective has at least one passing non-in_lesson item at basic, authentic_application and transfer_integration, and every Objective whose required direct type is explanation keeps a passing rubric item (classify_artifacts r1 now passes). The earlier gaps (classify_artifacts transfer and explanation; authentic_application in predict_branch, detect_nontermination, define_io_responsibility and input_validation_reasoning) are closed. With in_lesson items out of the pools, each Objective has exactly one non-in_lesson basic item."
  - "No failure holds any task back: classify_artifacts.f07 now passes, so the classify_artifacts check, review and repair tasks are no longer kept candidate by it, and classify_artifacts has three passing transfer_integration items (f05, f06, f07)."

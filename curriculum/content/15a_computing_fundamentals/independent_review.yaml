reviewer: independent_15a_content_review
date: "2026-10-02"
method: >-
  Read package.yaml, notation.yaml, all 12 Skill files in full and the 11 computing/programming edges of
  6c_foundations/prerequisite_edges.yaml. Every item key was worked out by hand first and then confirmed by running the
  code independently with python (stdout items, probes upto line N, termination by inspection plus bounded runs,
  every fault item's proposed fix, every distractor of the which_input / functions / detects / behaviour items, and the
  disambiguating inputs of the code-reading distractors). The author's verify scripts were not trusted or reused. Each
  item's code and option text was scanned against the notation.yaml construct patterns, with the allowed set taken as
  the item's own Skill, the transitive closure of its hard prerequisites, and its declared required_skills (plus their
  closures); no hidden construct was found. Each item was compared line by line with its own Skill's canonical,
  worked_example, state_trace, prerequisite_refresh and contrast texts and with the lesson checks. Rule applied for
  leakage: an item fails when its problem instance (same code, same scenario, or the same rule with the same answer
  values) is already solved in its own Skill's lesson text; an isomorphic item with new surface values passes with a
  note; in_lesson items pass because they belong to the lesson, but see findings. Reference items were checked against
  the live GCC manual (3.2 Options Controlling the Kind of Output, 3.16 Options for Linking: quotes and section numbers
  are correct) and the Python glossary ('bytecode', 'interpreted': consistent with the claims); the unittest
  'test case' quote matches the library documentation. Rubric criteria were checked for being about content, one
  judgement each. Every explanation was checked for technical correctness (arithmetic re-done), Turkish clarity, and
  every misconception open_question for neutral, non-accusing wording. Second pass (same day): the 32 items failed in
  the first pass were rewritten by the author and the new classify_artifacts.f07 was added; each was re-solved by
  hand, re-executed independently (stdout, termination, distractors), re-scanned for constructs (none hidden across
  all 95 items) and re-compared against its own Skill's lesson texts with the same leakage rule. The fixed contrast
  text was re-checked, and the build change that keeps in_lesson items out of practice/check/review/repair pools was
  confirmed in tools/build_curriculum_package.py. All other entries are unchanged from the first pass.

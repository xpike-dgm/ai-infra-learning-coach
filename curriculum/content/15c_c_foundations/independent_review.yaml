  - "Result: first pass 46/51 items and 52/56 explanations passed (5 item fails, 4 explanation fails). Second pass: all 5 rewritten or re-judged items and all 6 changed explanations pass. Final: 51/51 items and 56/56 explanations pass. All 16 answer keys are correct (6 c_stdout, 5 c_stage, 5 shell, re-run independently), all 32 lesson checks (29 C, 3 shell) print and stop where they claim, all 35 regenerated suites match the YAML, every reference passes and all 70 wrong solutions fail."
  - "Suites that cannot tell (first pass, 2 items failed; both fixed in the second pass, see the items): conditionals f03 never tests the 80/70 boundaries or the C band (p > 80, p > 70 and a missing C branch all pass); compile_and_run f05 passes a naive printf of a bare percent sign because glibc prints unknown conversions literally (only a -Wformat warning). Unmeasured method requirements, noted not failed: declaration f02 cast, f04 const, conditionals f04 switch, for f03 long long (a double passes: 20! is exactly representable), standard_io f02 double (float passes); and the recorded fixed-output limit for every compile_and_run and declaration code item. The c_harness items do enforce the asked function (a main-only program fails to link)."

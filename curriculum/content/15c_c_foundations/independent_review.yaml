  item.c.compile_link_run_basic.classify_compile_vs_runtime_failure.f02: {verdict: pass, note: "Key B verified (undefined reference to yarim, collect2: ld returned 1 exit status). Isomorph of the worked_example (int kare(int x); kare(4)) and lesson check 3 with renamed identifiers; acceptable at basic but it is the lesson's only link scenario re-labelled. It declares functions_basic, a downstream Skill, so it cannot be served until functions_basic is ready (see findings)."}
  item.c.compile_link_run_basic.classify_compile_vs_runtime_failure.f03: {verdict: pass, note: "Key C verified: SIGFPE, 'Floating point exception', exit 136. The canonical names this exact cause ('bir tam sayıyı sıfıra bölmek') without code: near isomorph. Integer division by zero is undefined behaviour; the trap is x86 behaviour (verified on x86_64 WSL; on ARM64 the program would print 0 and end with 0). Consider making the zero come from an expression (e.g. 4 / 5) to make it a real application."}
  item.c.compile_link_run_basic.classify_compile_vs_runtime_failure.f04: {verdict: pass, note: "Key A verified ('adet' undeclared). The canonical names 'tanımlanmamış bir değişken adı' as a compile cause: near isomorph of a named rule."}
  item.c.compile_link_run_basic.classify_compile_vs_runtime_failure.f05: {verdict: pass, note: "Second pass (rewritten): prototype topla, call topla(2, 3), body defined as topl. Key B verified in WSL gcc 15 (compiles cleanly, no warning for the unused topl; link fails with undefined reference to topla). The canonical now gives only the rule 'declared but no body anywhere' and the mian example is gone; here a body exists under another name, so the learner must notice the mismatch rather than a missing body: a new scenario, not pre-solved. Exactly one option true; D (prints 5) is a plausible distractor. Transfer is moderate; it still declares functions_basic (see findings)."}

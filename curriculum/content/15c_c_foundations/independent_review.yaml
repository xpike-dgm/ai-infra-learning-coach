  - "Explanations (first pass, 4 failed; all four corrected and verified in the second pass): compile_and_run canonical says stdio.h brings printf's definition (it is the declaration; the body is linked), classify canonical gives a misspelled function name as a link cause (a misspelled call is a compile error in gcc 14+) and pre-solves f05, for canonical says the i > 0; i++ loop never ends (it ends after about 3 s at -O0 through undefined signed overflow), while canonical teaches a do-while input idiom that loops forever on non-numeric or empty input."
  - "Hidden prerequisites: no item uses a construct outside its reachable set (scanned with the build's mask and an escape-aware mask; harness code not scanned; repeated in the second pass). Semantic gaps found in the first pass are closed: the doubled percent sign is now taught in compile_and_run's canonical, and long long with %lld in declaration_type_model's canonical. %u appears only in an expression lesson check, not in items."
  - "Coverage after the second pass (non-in_lesson, passing): every one of the 10 Objectives has at least one passing item at basic, authentic_application and transfer_integration. The first-pass gaps (transfer in compile_and_run_small_program and classify_compile_vs_runtime_failure, basic in functions_basic) are closed by compile f05, classify f05 and the re-judged functions f02; standard_io_basic and conditionals now have two passing authentic_application items again (f03, f04). Difficulty: standard_io f05 is labelled transfer but only applies the canonical's space-before-%c rule; compile f05 and classify f05 are moderate transfers."
  - "Graph (decide in 15H, not per item; all 6C edges are draft): standard_io_basic is not a hard prerequisite of conditionals, for_iteration or while_iteration, yet every item there declares it and their lesson checks use scanf (conditionals checks 1-2, for check 1, while checks 1-2); conversely standard_io_basic's own canonical and worked example use if, which conditionals teaches later. classify_compile_vs_runtime_failure's items declare declaration_type_model, expression_evaluation and functions_basic, all downstream of compile_link_run_basic, so its only basic and transfer items cannot be served until functions_basic is ready, and its lesson check 3 and worked example use a prototype that functions_basic teaches. for_iteration items needing if declare conditionals (6C gives while_iteration that edge but not for_iteration). functions_basic's closure lacks expression_evaluation, conditionals and for_iteration; its items declare them."
  - "Platform and undefined behaviour: classify f03's key relies on x86 trapping integer division by zero (verified on x86_64 WSL; ARM64 would print 0 and exit 0); the course environment should stay x86_64 or the item should say so. while f03's reconciliation was reworded in the second pass (the unfixed program times out on the looping tests and cannot pass the suite). Runner timeouts are 5 s for the build too; the three-command harness build finished well inside it here."

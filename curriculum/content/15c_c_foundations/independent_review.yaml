reviewer: independent_15c_content_review
date: "2026-10-02"
method: >-
  Read package.yaml, notation.yaml and all 9 Skill files in full (10 Objectives, 51 items, 56 explanation forms), the
  15B independent_review.yaml for format and rule, the hard edges of 6c_foundations/prerequisite_edges.yaml that touch
  the 9 Skills (all 6C edges are still draft), tools/code_test_runner.py, and the build's c_stages, run_shell,
  c_harness_build and constructs_used. Environment: WSL Ubuntu, x86_64, gcc 15.2.0, Python 3.14.4, C.UTF-8 locale.
  Every answer item (6 c_stdout, 5 c_stage, 5 shell) was solved by hand first and then run with my own scripts, not the
  author's verify blocks: the C programs were written as program.c in a fresh directory, built with gcc -std=c11 -Wall
  -Wextra (one-shot and as separate compile and link steps to name the first failing stage), run with the exit code
  recorded, and gcc's real diagnostics were kept; the shell items were typed as the learner would in fresh mktemp
  directories under bash, with ls in column mode. Options were checked for exactly one true answer. For each of the 35
  code items the shipped suite JSON was compared with the YAML suite and harness (all 35 match; compare is
  trim_trailing_whitespace, timeout 5 s), then the course runner was run inside Linux exactly as the learner does
  (wsl.exe --cd DIR -e python3 tools/code_test_runner.py suite.json --dir .) on the reference (35/35 pass every test)
  and on each of the 70 wrong solutions (70/70 fail at least one test). Then 26 adversarial solutions were run through
  the runner: plausible wrong ones (boundary 81 and 71 and a missing C band in the grade item, the naive printf of a
  bare percent sign, a function that prints instead of returning, a primality test that only rejects 1, a double
  factorial) and plausible correct alternatives (ternary and greater-or-equal maximums, while instead of for, trial
  division to n, a break-based search, two separate scanf calls, %.2lf, a float reading, unsigned long long with %llu,
  an if-chain instead of switch, a learner main with argc/argv beside the asked function, implicit conversion instead
  of a cast). Every lesson check (28) was rebuilt and re-run (stage and printed text all as claimed), and every code
  claim in the explanations was re-run: C11 truncating division and remainder sign, (double) placement, ++ prefix and
  postfix, unsigned wrap to 4294967295, = in a condition and gcc's 'suggest parentheses' warning, implicit function
  declaration (an error in gcc 15), a misspelled call (compile error, not link), missing & in scanf (segfault, exit
  139), %f into a double, %d with a double, uninitialised use and missing return warnings, bool without stdbool.h under
  -std=c11 (error), the unknown-conversion behaviour of glibc printf, the 'for i > 0; i++' loop at -O0 and -O2, the
  lesson's do-while input idiom on non-numeric and empty input, and the shell claims (mkdir -p, cd into a missing
  folder, ls ordering). Constructs were scanned with the notation.yaml patterns after masking C string literals (both
  with an escape-aware mask and with the build's own mask), allowed set = own Skill + transitive hard-prerequisite
  closure (including 15A Skills) + declared required_skills (plus closures); items, options (unless scan_options is
  false), references and lesson checks were scanned, and each item was also judged for semantic prerequisites the
  pattern list cannot see. Each item was compared with its own Skill's canonical, prerequisite_refresh, state_trace,
  worked_example, contrast texts and lesson checks under the 15A/15B leakage rule. Misconception open_questions were
  read for neutral wording (all are neutral 'mı düşünüyorsun?' questions). (Lesson checks: 29 C checks plus 3 shell
  checks; all 32 were re-run.)

  Second pass (same day): the author rewrote compile_and_run_small_program f05, classify_compile_vs_runtime_failure
  f05, standard_io_basic f03 and conditionals f03 (tests added), changed the canonicals of compile_and_run_small_program,
  classify_compile_vs_runtime_failure, for_iteration, while_iteration, functions_basic (new oran example, so
  functions_basic f02 is unchanged but re-judged) and declaration_type_model (long long line), and regenerated the
  suites with --out. All 35 shipped suite JSON files were compared again with the YAML (all match), and the course
  runner was re-run in WSL on every reference (35/35 pass) and every wrong solution (70/70 fail), so the regeneration
  changed nothing else. The rewritten items were re-solved by hand; classify f05 was rebuilt in WSL gcc 15 (link
  stage, undefined reference to topla); 17 new adversarial solutions were run through the runner (single-printf and
  naive percent variants for compile f05; boundary shifts and a missing C band for conditionals f03; || of two scanf
  calls, a stored count < 2, an EOF-only check, b - a and a missing exit code for standard_io f03; cast placement for
  functions f02). Every new lesson claim was re-run (the doubled percent sign, long long with %lld, oran with and
  without the cast, the guarded do-while on non-numeric, empty and valid input), all 32 lesson checks were re-run, the
  construct scan was repeated (no hidden construct), and each rewrite was re-compared with its own Skill's lesson
  texts and checks under the same leakage rule. All other entries are unchanged from the first pass except three notes
  whose cross-references were made stale by the fixes (for f03, while f03, standard_io canonical).

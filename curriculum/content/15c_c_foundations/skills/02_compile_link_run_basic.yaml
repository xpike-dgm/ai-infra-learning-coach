        prompt: |
          Bu program gcc -std=c11 -Wall -Wextra -o program program.c ile derlenip ./program ile çalıştırılınca ne olur? İstersen kendin derleyip çalıştırarak gör.
        code: |
          #include <stdio.h>

          int main(void) {
              printf("Basla\n";
              return 0;
          }
        options:
          A: "Derleme hatası"
          B: "Bağlama hatası"
          C: "Çalışma zamanı hatası"
          D: "Hatasız çalışır"
        scan_options: false
        answer: A
        verify:
          mode: c_stage
          outcomes: {A: compile, B: link, C: run, D: ok}
      - slug: f02

reviewer: independent_15b_content_review
date: "2026-10-02"
method: >-
  Read package.yaml, notation.yaml and all 20 Skill files in full (21 Objectives, 109 items, 116 explanation forms),
  the 15A independent_review.yaml for format and rule, the hard and soft edges of
  6c_foundations/prerequisite_edges.yaml whose target is a 15B Skill, tools/code_test_runner.py, and the build's
  constructs_used and traceback verification. Every reading item (24) was solved by hand first and then run
  independently as program.py with Python 3.14.3 (-X utf8) in a fresh temporary directory; for the six traceback items
  the real stderr was compared line by line with the traceback in the prompt after removing caret lines and shortening
  the absolute script path; every option of the option items was checked for exactly one true answer. For each of the
  85 code items the generated suite JSON was compared with the YAML suite and harness, and the course runner
  (tools/code_test_runner.py SUITE --dir DIR) was run on the reference (all 85 pass every test) and on each of the 172
  wrong solutions (each fails at least one test), on Windows 11 with a cp1254 locale. Then about 45 adversarial
  solutions were written and run through the runner: plausible correct alternatives (other formulas, loops instead of
  slicing, manual median/gcd, print(..., file=f), readlines, as_posix comparison, single-quoted guards) and plausible
  wrong ones (print(b, a) without a swap, sentinel initialisation, broad except, no reuse of a helper, str(Path) on
  Windows, is_file pre-check, join-based writing, wrong boundaries). Every lesson check (59) was re-executed and its
  printed claim confirmed, and every code claim in the explanations was re-run (Turkish lower/upper incl.
  len('İ'.lower()) == 2, LEGB/UnboundLocalError, default-parameter SyntaxError, pathlib on Windows, bool of empty
  values, local math.py/random.py/statistics.py shadowing, default locale encoding). Constructs were scanned with the
  notation.yaml patterns after masking double-quoted string literals as the build does, with the allowed set = own
  Skill + transitive hard-prerequisite closure (including published 15A Skills) + declared required_skills and
  lesson_requires (plus closures); items, options and references were scanned, and lesson checks separately. Each item
  was compared with its own Skill's canonical, prerequisite_refresh, state_trace, worked_example, contrast texts and
  lesson checks with the 15A leakage rule: an item fails when its problem instance (same code, same scenario, or the
  same rule with the same answer values) is already solved in its own lesson; an isomorph with new surface values
  passes with a note; in_lesson items pass. The author's verify blocks were not used. Misconception open_questions
  were read for neutral wording (all are neutral 'mı düşünüyorsun?' questions).

  Second pass (same day): the 11 failed items and the 3 failed explanations were rewritten by the author (plus the
  zero_string_false contrast for consistency). The suite JSON files on disk were stale (written before the rewrites;
  the build writes suites only with --out), so the suites were regenerated in a scratch directory by calling the
  build's own build() function, and the build reported no construct or verification problem for the rewrites. Each
  rewritten item was re-solved by hand, re-run through tools/code_test_runner.py (every reference passes; all 22 wrong
  solutions of the 10 code items fail), the new reading item f04 was run as program.py, and 23 new adversarial
  solutions were run (tuple swap, hard-coded values, helper reuse via intermediate variables, get/in-check instead of
  try, try/except/else, strip-first, round instead of a format spec, both-replace and character-loop Turkish casing,
  guarded join). Each rewrite was re-compared with its own Skill's canonical, refresh, state_trace, worked_example,
  contrast texts and lesson checks under the same leakage rule, and the four edited explanation texts were re-read and
  their claims re-run (runner whitespace handling, bool of empty collections, local random.py/statistics.py
  shadowing). All other entries are unchanged from the first pass.

  Third pass (same day): exception_handling f02 (harness now accepts any propagated exception) and
  string_text_operations f02 (example name changed to Deniz) were rechecked against suites regenerated in scratch with
  the build's build() function (build reports no construct or verification problem); references, wrongs and
  adversarial solutions (get, in-check, except Exception, bare except, except (KeyError, TypeError), KeyError -> 0,
  round, concatenation) were re-run through the runner and both items were re-compared with their lessons.

skill: skill.python.modules_imports_basic
activity: coding_production
tasks:
  teach: {title: "Modüller: import ve __name__ kontrolü", minutes: 16}
  practice: {title: "Modül kullanma alıştırması", minutes: 15}
  check: {title: "Modül kullanma kontrolü", minutes: 15}
  review: {title: "Modül kullanma tekrarı", minutes: 12}
  repair: {title: "Modülleri yeniden kurmak: ad alanı ve giriş noktası", minutes: 16}

objectives:
  - id: objective.python.modules_imports_basic.import_and_use_module_member
    statement: >-
      Standart kütüphaneden bir modülü içe aktarıp (import modul, from modul import isim) üyesini doğru ad alanıyla
      kullanabilmek ve bir dosyanın hem içe aktarılabilen bir modül hem de çalıştırılabilen bir program olmasını
      if __name__ == "__main__": kontrolüyle kurabilmek.
    observable_behavior: >-
      math, statistics ve datetime gibi standart modüllerin üyelerini kullanan doğru fonksiyonlar yazar; içe
      aktarıldığında hiçbir şey yazdırmayan, doğrudan çalıştırıldığında çalışan bir dosya kurar.
    acceptable_evidence_types: [authored_code, deterministic_test]
    direct_evidence_types: [authored_code, deterministic_test]
    required_direct_type: authored_code
    reconciliation: >-
      6C metni korundu ve gözlenebilir davranışa çevrildi; direct type authored_code. Item'lar fonksiyon yazdırdığı
      için functions_parameters_return'ü beyan eder. Test düzeneği öğrencinin cozum.py dosyasını gerçekten içe
      aktarır; giriş noktası item'ında düzenek dosyayı bir de program olarak çalıştırır.
    checks:
      - prints: "5.0 3"
        code: |
          import math
          print(math.sqrt(25), math.floor(3.9))
      - prints: "2.5"
        code: |
          from statistics import mean
          print(mean([1, 2, 3, 4]))
      - prints: "__main__"
        code: |
          print(__name__)
    explanations:
      canonical: |
        Bir modül, başka programların kullanabileceği isimleri (fonksiyonlar, değerler) içeren bir Python dosyasıdır. Python'un standart kütüphanesi hazır modüllerle gelir: math, statistics, datetime, random, pathlib...

        İki içe aktarma biçimi:

        import math
        math.sqrt(25)        → 5.0   (üyeye modülün adıyla ulaşırsın: math.sqrt)

        from statistics import mean
        mean([1, 2, 3, 4])   → 2.5   (yalnız mean ismi senin dosyana gelir; statistics adı gelmez)

        Ad alanı (namespace): import math dosyana yalnız math ismini getirir; sqrt tek başına tanımlı değildir. Hangi biçimi seçersen seç, ismi o biçime uygun kullanmalısın.

        Kendi dosyan da bir modüldür. cozum.py adlı bir dosyayı başka bir dosya import cozum ile içe aktarabilir; o zaman cozum.py'nin en dış seviyesindeki her satır bir kez çalışır.

        Giriş noktası kontrolü:
        Bir dosya doğrudan çalıştırıldığında (python cozum.py) Python onun __name__ değişkenine "__main__" verir; içe aktarıldığında ise __name__ modülün adıdır ("cozum"). Bu yüzden yalnız program olarak çalışırken yapılacak işler şöyle korunur:

        def selam():
            return "Selam"

        if __name__ == "__main__":
            print(selam())

        Böylece dosya içe aktarıldığında ekrana bir şey yazmaz; yalnız fonksiyonlarını verir.

        Dikkat: kendi dosyana random.py ya da statistics.py gibi standart bir modülün adını verme; import o zaman senin dosyanı bulur.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (isim çözümleme ve çalıştırma): bir ismi Python önce yerel, sonra global, sonra yerleşik isimlerde arar; import satırı yeni bir global isim oluşturur. python dosya.py bir dosyayı baştan sona çalıştırır.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          Görev: cozum.py dosyasına daire_cevresi(r) fonksiyonunu yaz; sonucu iki basamağa yuvarla; dosya doğrudan çalışınca daire_cevresi(1) yazdırılsın, içe aktarılınca hiçbir şey yazdırılmasın.

          import math

          def daire_cevresi(r):
              return round(2 * math.pi * r, 2)

          if __name__ == "__main__":
              print(daire_cevresi(1))

          - math.pi, math modülünün bir değeridir.
          - python cozum.py → 6.28 yazar; import cozum → hiçbir şey yazmaz.
    misconceptions:
      - slug: import_brings_members
        name: import modul, modülün üyelerini doğrudan kullanılabilir yapar
        open_question: import math yazdıktan sonra sqrt(9) diye doğrudan yazabileceğini mi düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Modülü içe aktardım, içindeki her şey artık benim."

            import math yalnız math ismini getirir; üyesine math.sqrt(9) diye ulaşırsın. sqrt(9) yazmak için from math import sqrt gerekir.
      - slug: import_runs_nothing
        name: Bir dosyayı içe aktarmak onun kodunu çalıştırmaz
        open_question: Bir dosyayı import ettiğinde en dış seviyesindeki print satırlarının çalışmayacağını mı düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "import yalnız fonksiyonları alır."

            İçe aktarılan dosyanın en dış seviyesindeki her satır bir kez çalışır; orada bir print varsa yazdırılır. Yalnız program olarak çalışırken yapılacak işleri if __name__ == "__main__": altına koyarsın.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          cozum.py dosyasına math modülünü kullanarak alan(r) adında bir fonksiyon yaz: yarıçapı r olan dairenin alanını (pi × r × r) iki basamağa yuvarlanmış olarak döndürsün. Örnek: alan(1) → 3.14.
        required_skills: [skill.python.functions_parameters_return, skill.python.expression_evaluation]
        harness: |
          import sys, cozum
          print(cozum.alan(float(sys.argv[1])))
        suite:
          - {id: unit, args: ["1"], expected_stdout: "3.14\n"}
          - {id: two, args: ["2"], expected_stdout: "12.57\n"}
          - {id: half, args: ["0.5"], expected_stdout: "0.79\n"}
        reference: |
          import math

          def alan(r):
              return round(math.pi * r * r, 2)
        wrong:
          - |
            def alan(r):
                return round(3.14 * r * r, 2)
          - |
            import math

            def alan(r):
                return round(2 * math.pi * r, 2)
      - slug: f02
        difficulty: basic
        independence: guided
        prompt: |
          cozum.py dosyasına statistics modülünü kullanarak ortanca(sayilar) adında bir fonksiyon yaz: boş olmayan bir sayı listesinin ortancasını (median) döndürsün. Örnek: ortanca([5, 1, 3]) → 3; ortanca([4, 1, 3, 2]) → 2.5.
        required_skills: [skill.python.functions_parameters_return, skill.python.list_operations]
        harness: |
          import sys, cozum
          print(cozum.ortanca([int(x) for x in sys.argv[1:]]))
        suite:
          - {id: odd, args: ["9", "1", "2"], expected_stdout: "2\n"}
          - {id: even, args: ["4", "1", "3", "2"], expected_stdout: "2.5\n"}
          - {id: single, args: ["7"], expected_stdout: "7\n"}
        reference: |
          from statistics import median

          def ortanca(sayilar):
              return median(sayilar)
        wrong:
          - |
            def ortanca(sayilar):
                return sorted(sayilar)[len(sayilar) // 2]
          - |
            from statistics import mean

            def ortanca(sayilar):
                return mean(sayilar)
      - slug: f03
        difficulty: authentic_application
        prompt: |
          cozum.py dosyasına selamla(ad) adında bir fonksiyon yaz: "Merhaba, " + ad + "!" döndürsün. Dosya doğrudan çalıştırıldığında (python cozum.py) ekrana selamla("Dünya") sonucunu yazsın; başka bir dosya onu içe aktardığında ekrana hiçbir şey yazmasın.
        required_skills: [skill.python.functions_parameters_return, skill.python.conditionals]
        harness: |
          import sys, runpy
          if sys.argv[1] == "program":
              runpy.run_path("cozum.py", run_name="__main__")
          else:
              import cozum
              print(cozum.selamla(sys.argv[2]))
        suite:
          - {id: imported, args: ["import", "Ali"], expected_stdout: "Merhaba, Ali!\n"}
          - {id: run_as_program, args: ["program"], expected_stdout: "Merhaba, Dünya!\n"}
          - {id: imported_other, args: ["import", "Ece"], expected_stdout: "Merhaba, Ece!\n"}
        reference: |
          def selamla(ad):
              return "Merhaba, " + ad + "!"

          if __name__ == "__main__":
              print(selamla("Dünya"))
        wrong:
          - |
            def selamla(ad):
                return "Merhaba, " + ad + "!"

            print(selamla("Dünya"))
          - |
            def selamla(ad):
                return "Merhaba, " + ad + "!"
      - slug: f04
        difficulty: authentic_application
        prompt: |
          cozum.py dosyasına datetime modülünü kullanarak gun_farki(baslangic, bitis) adında bir fonksiyon yaz: "YYYY-AA-GG" biçimindeki iki tarih arasında kaç gün olduğunu döndürsün. Örnek: gun_farki("2026-01-01", "2026-03-01") → 59. İpucu: date.fromisoformat bir yazıdan tarih oluşturur; iki tarihin farkının days değeri gün sayısıdır.
        required_skills: [skill.python.functions_parameters_return]
        harness: |
          import sys, cozum
          print(cozum.gun_farki(sys.argv[1], sys.argv[2]))
        suite:
          - {id: two_months, args: ["2026-01-01", "2026-03-01"], expected_stdout: "59\n"}
          - {id: leap_year, args: ["2028-02-01", "2028-03-01"], expected_stdout: "29\n"}
          - {id: same_day, args: ["2026-10-02", "2026-10-02"], expected_stdout: "0\n"}
          - {id: across_year, args: ["2026-12-30", "2027-01-02"], expected_stdout: "3\n"}
        reference: |
          from datetime import date

          def gun_farki(baslangic, bitis):
              return (date.fromisoformat(bitis) - date.fromisoformat(baslangic)).days
        wrong:
          - |
            def gun_farki(baslangic, bitis):
                y1, a1, g1 = baslangic.split("-")
                y2, a2, g2 = bitis.split("-")
                return (int(y2) - int(y1)) * 365 + (int(a2) - int(a1)) * 30 + int(g2) - int(g1)
          - |
            from datetime import date

            def gun_farki(baslangic, bitis):
                return (date.fromisoformat(bitis) - date.fromisoformat(baslangic)).days + 1
      - slug: f05
        difficulty: transfer_integration
        prompt: |
          cozum.py dosyasına math modülünü kullanarak sadelestir(pay, payda) adında bir fonksiyon yaz: pozitif tam sayılardan oluşan bir kesri en sade haline getirip (pay, payda) çifti olarak döndürsün. Örnek: sadelestir(6, 8) → (3, 4). İpucu: math.gcd iki sayının en büyük ortak bölenini verir.
        required_skills: [skill.python.functions_parameters_return, skill.python.tuple_immutable_sequence, skill.python.expression_evaluation]
        harness: |
          import sys, cozum
          print(cozum.sadelestir(int(sys.argv[1]), int(sys.argv[2])))
        suite:
          - {id: halves, args: ["6", "8"], expected_stdout: "(3, 4)\n"}
          - {id: already_simple, args: ["5", "7"], expected_stdout: "(5, 7)\n"}
          - {id: whole, args: ["12", "4"], expected_stdout: "(3, 1)\n"}
          - {id: big, args: ["84", "36"], expected_stdout: "(7, 3)\n"}
        reference: |
          import math

          def sadelestir(pay, payda):
              ortak = math.gcd(pay, payda)
              return pay // ortak, payda // ortak
        wrong:
          - |
            def sadelestir(pay, payda):
                if pay % 2 == 0 and payda % 2 == 0:
                    return pay // 2, payda // 2
                return pay, payda
          - |
            import math

            def sadelestir(pay, payda):
                ortak = math.gcd(pay, payda)
                return pay / ortak, payda / ortak

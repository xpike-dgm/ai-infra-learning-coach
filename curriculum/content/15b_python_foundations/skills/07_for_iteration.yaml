skill: skill.python.for_iteration
activity: coding_production
tasks:
  teach: {title: "for döngüsü yazmak: range, yazı ve biriktirme", minutes: 15}
  practice: {title: "for döngüsü alıştırması", minutes: 15}
  check: {title: "for döngüsü kontrolü", minutes: 15}
  review: {title: "for döngüsü tekrarı", minutes: 12}
  repair: {title: "Döngüyü yeniden kurmak: sınırlar ve biriktirici", minutes: 15}

objectives:
  - id: objective.python.for_iteration.iterate_sequence
    statement: >-
      for döngüsüyle bir aralık (range) ya da bir yazının karakterleri üzerinde dolaşan, her turda bir biriktiriciyi
      (toplam, sayaç, en büyük) doğru güncelleyen ve sonucu yazdıran bir program yazabilmek; range'in başlangıç ve bitiş
      sınırlarını doğru kurabilmek.
    observable_behavior: >-
      Sıfır, bir ve birden çok tur gerektiren girdilerin hepsinde doğru sonucu üreten döngüyü yazar; biriktiriciyi
      döngüden önce doğru başlatır.
    acceptable_evidence_types: [authored_code, deterministic_test]
    direct_evidence_types: [authored_code, deterministic_test]
    required_direct_type: authored_code
    reconciliation: >-
      6C metni ("Iterable üzerinde for iteration kurup sonucu doğrulayabilmek") korundu ve gözlenebilir davranışa
      çevrildi; direct type authored_code. Koleksiyonlar (liste vb.) bu Skill'e bağlı olduğu için burada yinelenen şeyler
      range ve yazılardır. Girdi okuyan item'lar input_output_basic'i, koşul kullananlar conditionals'ı beyan eder.
    checks:
      - prints: "2\n3\n4"
        code: |
          for i in range(2, 5):
              print(i)
      - prints: "14"
        code: |
          kareler = 0
          for i in range(1, 4):
              kareler += i * i
          print(kareler)
      - prints: "3"
        code: |
          sayac = 0
          for harf in "kalem":
              if harf == "a" or harf == "e" or harf == "l":
                  sayac += 1
          print(sayac)
    explanations:
      canonical: |
        for döngüsü bir dizi değerin her biri için aynı satırları çalıştırır.

        for i in range(2, 5):
            print(i)

        range(2, 5) sırasıyla 2, 3, 4 üretir; bitiş (5) dahil değildir. range(n) ise 0'dan n-1'e kadar üretir. 1'den n'e kadar istiyorsan range(1, n + 1) yazarsın. n 0 ise range(1, 1) boştur ve döngü hiç dönmez.

        Bir yazının (str) karakterleri üzerinde de dolaşabilirsin:
        for harf in "kalem":
            print(harf)
        Her turda harf sıradaki karakter olur: k, a, l, e, m.

        Biriktirme: Döngüyle bir şey hesaplamak çoğu zaman bir biriktirici gerektirir:
        kareler = 0
        for i in range(1, 4):
            kareler += i * i
        print(kareler)
        Ekranda 14 görünür (1 + 4 + 9). Üç kural:
        1. Biriktiriciyi döngüden önce başlat (kareler = 0). Döngünün içinde başlatırsan her turda sıfırlanır.
        2. Döngünün içinde güncelle (kareler += i * i).
        3. Sonucu döngü bittikten sonra, döngünün dışında yazdır (girinti geri gelmiş satırda). İçeride yazdırırsan her turda bir satır yazılır.

        Sayaç: koşulu sağlayan elemanları saymak için sayac = 0 ile başla ve koşul sağlandığında sayac += 1 yap.

        Yazdıktan sonra programını üç tür girdiyle dene: döngünün hiç dönmediği (0 ya da boş yazı), bir kez döndüğü ve birçok kez döndüğü. Sınır hataları çoğu zaman ilk ikisinde ortaya çıkar.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (döngü izleme, 15A): range(a, b) a'dan başlar ve b'yi dahil etmez; bir döngüyü yazmadan önce birkaç turunu tur tablosuyla elle izle.
      state_trace:
        level: H2
        text: |
          Yazdığın döngüyü tur tablosuyla denemek — başka bir örnek üzerinde.

          carpim = 1
          for i in range(1, 4):
              carpim *= i
          print(carpim)

          başlangıç: carpim = 1
          tur 1: i=1 → carpim 1
          tur 2: i=2 → carpim 2
          tur 3: i=3 → carpim 6
          döngü bitti → ekrana 6

          Çarpım biriktiricisi 0 ile değil 1 ile başlar; 0 ile başlasaydı her şey 0 olurdu.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          Görev: bir n oku ve 1'den n'e kadar çift sayıların toplamını yaz.

          n = int(input())
          toplam = 0
          for i in range(2, n + 1, 2):
              toplam += i
          print(toplam)

          - range(2, n + 1, 2): 2'den başlar, 2'şer artar, n dahil.
          - n = 7 → 2 + 4 + 6 = 12; n = 1 → döngü hiç dönmez, 0.
          - toplam döngüden önce 0, yazdırma döngüden sonra.
    misconceptions:
      - slug: range_end_inclusive
        name: range(1, n) n'yi de içerir
        open_question: range(1, n)'nin 1'den n'e kadar, n dahil, saydığını mı düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "range(1, 5) 1, 2, 3, 4, 5 üretir."

            Bitiş değeri hiçbir zaman dahil değildir: range(1, 5) → 1, 2, 3, 4. n'yi dahil etmek için range(1, n + 1) yazılır.
      - slug: accumulator_inside_loop
        name: Biriktirici döngünün içinde başlatılabilir
        open_question: toplam = 0 satırını döngünün içine koymanın bir şey değiştirmeyeceğini mi düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "toplam = 0 nereye yazılsa aynı."

            Döngünün içindeki satırlar her turda çalışır; toplam = 0 içerideyse her turda sıfırlanır ve sonunda yalnız son tur kalır. Biriktirici döngüden önce, bir kez başlatılır.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          cozum.py adında bir program yaz: bir n tam sayısı okusun ve 1'den n'e kadar (n dahil) her sayıyı ayrı bir satıra yazsın. n 0 ise hiçbir şey yazmasın.
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: three, stdin: "3\n", expected_stdout: "1\n2\n3\n"}
          - {id: one, stdin: "1\n", expected_stdout: "1\n"}
          - {id: zero, stdin: "0\n", expected_stdout: ""}
        reference: |
          n = int(input())
          for i in range(1, n + 1):
              print(i)
        wrong:
          - |
            n = int(input())
            for i in range(n):
                print(i)
          - |
            n = int(input())
            for i in range(1, n):
                print(i)
      - slug: f02
        difficulty: basic
        independence: guided
        prompt: |
          cozum.py adında bir program yaz: bir n tam sayısı okusun ve 1'den n'e kadar (n dahil) sayıların toplamını yazsın. n 0 ise 0 yazsın.
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: four, stdin: "4\n", expected_stdout: "10\n"}
          - {id: one, stdin: "1\n", expected_stdout: "1\n"}
          - {id: zero, stdin: "0\n", expected_stdout: "0\n"}
          - {id: ten, stdin: "10\n", expected_stdout: "55\n"}
        reference: |
          n = int(input())
          toplam = 0
          for i in range(1, n + 1):
              toplam += i
          print(toplam)
        wrong:
          - |
            n = int(input())
            toplam = 0
            for i in range(n):
                toplam += i
            print(toplam)
          - |
            n = int(input())
            for i in range(1, n + 1):
                toplam = 0
                toplam += i
            print(toplam)
      - slug: f03
        difficulty: authentic_application
        prompt: |
          cozum.py adında bir program yaz: küçük harflerle yazılmış tek bir kelime okusun ve içindeki sesli harflerin (a, e, ı, i, o, ö, u, ü) sayısını yazsın. Örnek: merhaba → 3.
        required_skills: [skill.python.input_output_basic, skill.python.conditionals]
        suite:
          - {id: merhaba, stdin: "merhaba\n", expected_stdout: "3\n"}
          - {id: turkish_vowels, stdin: "gözlük\n", expected_stdout: "2\n"}
          - {id: dotless_i, stdin: "ılık\n", expected_stdout: "2\n"}
          - {id: none, stdin: "xyz\n", expected_stdout: "0\n"}
        reference: |
          kelime = input()
          sayac = 0
          for harf in kelime:
              if harf in "aeıioöuü":
                  sayac += 1
          print(sayac)
        wrong:
          - |
            kelime = input()
            sayac = 0
            for harf in kelime:
                if harf in "aeiou":
                    sayac += 1
            print(sayac)
          - |
            kelime = input()
            sayac = 0
            for harf in kelime:
                if harf not in "aeıioöuü":
                    sayac += 1
            print(sayac)
      - slug: f04
        difficulty: authentic_application
        prompt: |
          cozum.py adında bir program yaz: bir n tam sayısı okusun ve n'nin 1'den 5'e kadar çarpım tablosunu yazsın; her satır şu biçimde olsun: n x i = sonuç. Örnek: n = 3 için ilk satır 3 x 1 = 3, son satır 3 x 5 = 15.
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: three, stdin: "3\n", expected_stdout: "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n"}
          - {id: seven, stdin: "7\n", expected_stdout: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n"}
        reference: |
          n = int(input())
          for i in range(1, 6):
              print(n, "x", i, "=", n * i)
        wrong:
          - |
            n = int(input())
            for i in range(5):
                print(n, "x", i, "=", n * i)
          - |
            n = int(input())
            for i in range(1, 6):
                print(n, "x", i, "=", n + i)
      - slug: f05
        difficulty: transfer_integration
        prompt: |
          cozum.py adında bir program yaz: önce kaç sayı geleceğini (n, en az 1) okusun, sonra n satırda n tam sayı okusun ve bunların en büyüğünü yazsın. max() kullanma; en büyüğü döngüde kendin tut. Sayılar negatif de olabilir.
        required_skills: [skill.python.input_output_basic, skill.python.conditionals]
        suite:
          - {id: mixed, stdin: "4\n3\n9\n-2\n7\n", expected_stdout: "9\n"}
          - {id: all_negative, stdin: "3\n-8\n-3\n-5\n", expected_stdout: "-3\n"}
          - {id: single, stdin: "1\n42\n", expected_stdout: "42\n"}
          - {id: first_is_max, stdin: "3\n10\n4\n6\n", expected_stdout: "10\n"}
        reference: |
          n = int(input())
          en_buyuk = int(input())
          for i in range(n - 1):
              sayi = int(input())
              if sayi > en_buyuk:
                  en_buyuk = sayi
          print(en_buyuk)
        wrong:
          - |
            n = int(input())
            en_buyuk = 0
            for i in range(n):
                sayi = int(input())
                if sayi > en_buyuk:
                    en_buyuk = sayi
            print(en_buyuk)
          - |
            n = int(input())
            en_buyuk = int(input())
            for i in range(n - 1):
                sayi = int(input())
                if sayi < en_buyuk:
                    en_buyuk = sayi
            print(en_buyuk)

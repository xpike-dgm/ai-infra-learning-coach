skill: skill.python.path_handling
activity: coding_production
tasks:
  teach: {title: "Dosya yolları: pathlib ile göreli, mutlak ve platformdan bağımsız", minutes: 16}
  practice: {title: "Dosya yolu alıştırması", minutes: 15}
  check: {title: "Dosya yolu kontrolü", minutes: 15}
  review: {title: "Dosya yolu tekrarı", minutes: 12}
  repair: {title: "Dosya yollarını yeniden kurmak: yazı değil yol", minutes: 16}

objectives:
  - id: objective.python.path_handling.read_write_small_text_file
    statement: >-
      Dosya yollarını yazı birleştirmesiyle değil pathlib.Path ile güvenli kurabilmek: göreli ve mutlak yolu ayırt
      etmek, klasör ve dosya adını / işleciyle birleştirmek, bir yolun adını, uzantısını, gövdesini ve üst klasörünü
      almak, uzantıyı değiştirmek ve sonucu platformdan bağımsız biçimde (as_posix) vermek.
    observable_behavior: >-
      Yol parçalarını alan, birleştiren ve dönüştüren fonksiyonları pathlib ile yazar; ayraç, birden çok nokta ve
      uzantısız ad gibi durumlarda doğru sonuç verir.
    acceptable_evidence_types: [authored_code, deterministic_test]
    direct_evidence_types: [authored_code, deterministic_test]
    required_direct_type: authored_code
    reconciliation: >-
      6C'de bu Objective'in eylem adı read_write_small_text_file olarak kaldı ama metni yol işlemlerini anlatıyor; dosya
      okuma ve yazma files_paths_basic'in Objective'idir. Kimlik değiştirilmedi (kimlik asla değişmez); ölçülen davranış
      6C'nin metnidir: yol işlemleri. Item'lar pathlib'i içe aktardığı için modules_imports_basic'i, fonksiyon yazdırdığı
      için functions_parameters_return'ü beyan eder. Testler öğrencinin bilgisayarında (Windows ya da başka) koşar; bu
      yüzden her sonuç işletim sisteminden bağımsız bir biçimde (ad, uzantı ya da as_posix) karşılaştırılır.
    checks:
      - prints: "rapor.pdf rapor .pdf"
        code: |
          from pathlib import Path
          p = Path("belgeler/2026/rapor.pdf")
          print(p.name, p.stem, p.suffix)
      - prints: "belgeler/2026 2026"
        code: |
          from pathlib import Path
          p = Path("belgeler/2026/rapor.pdf")
          print(p.parent.as_posix(), p.parent.name)
      - prints: "veri/ocak/kayit.csv"
        code: |
          from pathlib import Path
          print((Path("veri") / "ocak" / "kayit.csv").as_posix())
      - prints: "notlar.md"
        code: |
          from pathlib import Path
          print(Path("notlar.txt").with_suffix(".md").name)
    explanations:
      canonical: |
        Bir dosya yolu, bir dosyanın klasörler içindeki yerini söyler: belgeler/2026/rapor.pdf.

        Göreli ve mutlak yol:
        - Göreli yol (belgeler/rapor.pdf) programın çalıştığı klasörden başlar.
        - Mutlak yol kökten başlar: Windows'ta C:\Users\..., Linux ve macOS'ta /home/...
        Aynı göreli yol, program başka bir klasörden çalıştırılınca başka bir dosyayı gösterir.

        Neden yazı birleştirme değil? Windows ters bölü, diğer sistemler düz bölü kullanır; "veri" + "/" + ad gibi birleştirmeler ayraçları karıştırır, fazladan ya da eksik ayraç bırakır. pathlib bunu senin yerine yapar:

        from pathlib import Path
        p = Path("belgeler") / "2026" / "rapor.pdf"     (/ işleci yolları birleştirir)

        Bir yolun parçaları:
        - p.name → "rapor.pdf"   (son parça)
        - p.stem → "rapor"       (uzantısız ad)
        - p.suffix → ".pdf"      (son uzantı; uzantı yoksa "")
        - p.parent → belgeler/2026 (bir üst klasör); p.parent.name → "2026"
        - p.with_suffix(".txt") → uzantısı değişmiş yeni bir yol
        - p.is_absolute() → mutlak mı?

        Birden çok nokta: Path("arsiv.tar.gz").suffix → ".gz", stem → "arsiv.tar".

        Platformdan bağımsız göstermek: str(p) Windows'ta ters bölü kullanır. Her sistemde aynı görünmesi gereken bir sonuç için p.as_posix() düz bölü verir.

        Path nesneleri de değiştirilemez: with_suffix yeni bir yol döndürür.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (metin işlemleri): bir yol yazı olarak da tutulabilir, ama split("/") ya da + ile kurmak ayraç ve nokta durumlarında kırılır; bu derste yolu bir Path nesnesine çevirip onun özelliklerini kullanacağız.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          Görev: yedek_yolu(yol) — aynı klasörde, adının sonuna "_yedek" eklenmiş ama uzantısı aynı kalan dosyanın yolunu düz bölüyle döndür.

          from pathlib import Path

          def yedek_yolu(yol):
              p = Path(yol)
              return (p.parent / (p.stem + "_yedek" + p.suffix)).as_posix()

          - yedek_yolu("veri/ocak.csv") → "veri/ocak_yedek.csv"
          - yedek_yolu("liste.txt") → "liste_yedek.txt" (parent burada ".", birleşince kaybolur)
    misconceptions:
      - slug: suffix_is_after_first_dot
        name: Uzantı ilk noktadan sonraki her şeydir
        open_question: '"arsiv.tar.gz" adlı dosyanın suffix değerinin ".tar.gz" olduğunu mu düşünüyorsun?'
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Uzantıyı split('.')[1] ile alırım."

            Path.suffix yalnız son noktadan sonrasını verir: "arsiv.tar.gz" → ".gz"; stem "arsiv.tar" olur. Noktası olmayan bir adın uzantısı boş yazıdır. split ile ilk noktadan bölmek bu durumların ikisinde de yanlış sonuç verir.
      - slug: string_join_is_portable
        name: Yolları + "/" + ile birleştirmek her sistemde aynı çalışır
        open_question: klasor + "/" + ad yazarak her durumda doğru bir yol kurduğunu mu düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Yol sadece bir yazıdır."

            klasör "veri/" ile bitiyorsa sonuç "veri//a.txt" olur; Windows'ta ayraçlar karışır. Path(klasor) / ad fazla ayraçları atar ve sistemin ayracını kullanır.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          cozum.py dosyasına pathlib kullanarak uzanti(yol) adında bir fonksiyon yaz: yoldaki dosyanın son uzantısını (noktasıyla) döndürsün; uzantı yoksa boş yazı döndürsün. Örnek: uzanti("belgeler/sunum.pptx") → ".pptx".
        required_skills: [skill.python.functions_parameters_return, skill.python.modules_imports_basic]
        harness: |
          import sys, cozum
          print(repr(cozum.uzanti(sys.argv[1])))
        suite:
          - {id: simple, args: ["belgeler/sunum.pptx"], expected_stdout: "'.pptx'\n"}
          - {id: two_dots, args: ["yedek/veri.tar.gz"], expected_stdout: "'.gz'\n"}
          - {id: no_extension, args: ["Makefile"], expected_stdout: "''\n"}
        reference: |
          from pathlib import Path

          def uzanti(yol):
              return Path(yol).suffix
        wrong:
          - |
            def uzanti(yol):
                return "." + yol.split(".")[1]
          - |
            def uzanti(yol):
                return yol[-5:]
      - slug: f02
        difficulty: basic
        independence: guided
        prompt: |
          cozum.py dosyasına pathlib kullanarak govde(yol) adında bir fonksiyon yaz: yoldaki dosyanın klasörsüz ve son uzantısız adını döndürsün. Örnek: govde("fotograflar/tatil.jpeg") → "tatil".
        required_skills: [skill.python.functions_parameters_return, skill.python.modules_imports_basic]
        harness: |
          import sys, cozum
          print(cozum.govde(sys.argv[1]))
        suite:
          - {id: simple, args: ["fotograflar/tatil.jpeg"], expected_stdout: "tatil\n"}
          - {id: two_dots, args: ["arsiv/kayit.2026.csv"], expected_stdout: "kayit.2026\n"}
          - {id: no_folder, args: ["okuBeni.md"], expected_stdout: "okuBeni\n"}
        reference: |
          from pathlib import Path

          def govde(yol):
              return Path(yol).stem
        wrong:
          - |
            from pathlib import Path

            def govde(yol):
                return Path(yol).name
          - |
            from pathlib import Path

            def govde(yol):
                return Path(yol).name.split(".")[0]
      - slug: f03
        difficulty: authentic_application
        prompt: |
          cozum.py dosyasına pathlib kullanarak birlestir(klasor, ad) adında bir fonksiyon yaz: klasör ile dosya adını birleştirip yolu düz bölü (/) ile yazılmış olarak döndürsün. Klasör adı / ile bitse de bitmese de sonuç doğru olsun. Örnek: birlestir("veri/", "ocak.csv") → "veri/ocak.csv".
        required_skills: [skill.python.functions_parameters_return, skill.python.modules_imports_basic]
        harness: |
          import sys, cozum
          print(cozum.birlestir(sys.argv[1], sys.argv[2]))
        suite:
          - {id: plain, args: ["veri", "ocak.csv"], expected_stdout: "veri/ocak.csv\n"}
          - {id: trailing_slash, args: ["veri/", "ocak.csv"], expected_stdout: "veri/ocak.csv\n"}
          - {id: nested, args: ["proje/kaynak", "ana.py"], expected_stdout: "proje/kaynak/ana.py\n"}
        reference: |
          from pathlib import Path

          def birlestir(klasor, ad):
              return (Path(klasor) / ad).as_posix()
        wrong:
          - |
            def birlestir(klasor, ad):
                return klasor + "/" + ad
          - |
            from pathlib import Path

            def birlestir(klasor, ad):
                return Path(klasor).as_posix() + ad
      - slug: f04
        difficulty: authentic_application
        prompt: |
          cozum.py dosyasına pathlib kullanarak uzanti_degistir(yol, yeni) adında bir fonksiyon yaz: yoldaki dosyanın yalnız son uzantısını yeni uzantıyla değiştirip yolu düz bölüyle döndürsün; klasör adlarına dokunmasın. Örnek: uzanti_degistir("notlar/ders.txt", ".md") → "notlar/ders.md".
        required_skills: [skill.python.functions_parameters_return, skill.python.modules_imports_basic]
        harness: |
          import sys, cozum
          print(cozum.uzanti_degistir(sys.argv[1], sys.argv[2]))
        suite:
          - {id: simple, args: ["notlar/ders.txt", ".md"], expected_stdout: "notlar/ders.md\n"}
          - {id: folder_has_dot, args: ["eski.txt/ders.txt", ".md"], expected_stdout: "eski.txt/ders.md\n"}
          - {id: two_dots, args: ["yedek/veri.tar.gz", ".zip"], expected_stdout: "yedek/veri.tar.zip\n"}
        reference: |
          from pathlib import Path

          def uzanti_degistir(yol, yeni):
              return Path(yol).with_suffix(yeni).as_posix()
        wrong:
          - |
            def uzanti_degistir(yol, yeni):
                return yol.replace(".txt", yeni)
          - |
            def uzanti_degistir(yol, yeni):
                return yol.split(".")[0] + yeni
      - slug: f05
        difficulty: transfer_integration
        prompt: |
          cozum.py dosyasına pathlib kullanarak ayni_klasorde(yol1, yol2) adında bir fonksiyon yaz: iki dosyanın aynı klasörde (aynı üst klasörde) olup olmadığını True ya da False olarak döndürsün. Örnek: ayni_klasorde("veri/a.txt", "veri/b.txt") → True; ayni_klasorde("veri/a.txt", "veri/alt/b.txt") → False.
        required_skills: [skill.python.functions_parameters_return, skill.python.modules_imports_basic, skill.python.expression_evaluation]
        harness: |
          import sys, cozum
          print(cozum.ayni_klasorde(sys.argv[1], sys.argv[2]))
        suite:
          - {id: same, args: ["veri/a.txt", "veri/b.txt"], expected_stdout: "True\n"}
          - {id: deeper, args: ["veri/a.txt", "veri/alt/b.txt"], expected_stdout: "False\n"}
          - {id: both_here, args: ["a.txt", "b.txt"], expected_stdout: "True\n"}
          - {id: same_name_other_folder, args: ["x/rapor.txt", "y/rapor.txt"], expected_stdout: "False\n"}
          - {id: same_folder_name_elsewhere, args: ["ev/veri/a.txt", "is/veri/b.txt"], expected_stdout: "False\n"}
        reference: |
          from pathlib import Path

          def ayni_klasorde(yol1, yol2):
              return Path(yol1).parent == Path(yol2).parent
        wrong:
          - |
            def ayni_klasorde(yol1, yol2):
                return yol1.split("/")[0] == yol2.split("/")[0]
          - |
            from pathlib import Path

            def ayni_klasorde(yol1, yol2):
                return Path(yol1).parent.name == Path(yol2).parent.name

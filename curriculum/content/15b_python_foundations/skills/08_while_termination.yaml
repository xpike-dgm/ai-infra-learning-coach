        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: four_digits, stdin: "4721\n", expected_stdout: "14\n"}
          - {id: one_digit, stdin: "7\n", expected_stdout: "7\n"}
          - {id: with_zeros, stdin: "1005\n", expected_stdout: "6\n"}
        reference: |
          n = int(input())
          toplam = 0
          while n > 0:
              toplam += n % 10
              n = n // 10
          print(toplam)
        wrong:
          - |
            n = int(input())
            toplam = 0
            while n > 0:
                n = n // 10
                toplam += n % 10
            print(toplam)
          - |
            n = int(input())
            toplam = 0
            while n > 0:

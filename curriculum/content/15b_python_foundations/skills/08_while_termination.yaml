skill: skill.python.while_termination
activity: coding_production
tasks:
  teach: {title: "while döngüsü: sonlanan döngü yazmak ve sonsuz döngüyü düzeltmek", minutes: 18}
  practice: {title: "while döngüsü alıştırması", minutes: 18}
  check: {title: "while döngüsü kontrolü", minutes: 18}
  review: {title: "while döngüsü tekrarı", minutes: 15}
  repair: {title: "Döngüyü yeniden kurmak: koşul, güncelleme ve sonlanma", minutes: 18}

objectives:
  - id: objective.python.while_termination.debug_infinite_loop
    statement: >-
      Sonlanmayan bir while döngüsünün nedenini (koşuldaki değişkenin hiç güncellenmemesi, yanlış yönde güncellenmesi,
      hedefin üzerinden atlanması ya da döngü içinde yeni girdinin okunmaması) bulup döngüyü, programın istenen çıktıyı
      verecek biçimde sonlanmasını sağlayarak düzeltebilmek.
    observable_behavior: >-
      Verilen sonsuz döngüyü düzeltir; düzeltilmiş program bütün test girdilerinde süre sınırı içinde sonlanır ve doğru
      çıktıyı üretir.
    acceptable_evidence_types: [authored_code, deterministic_test]
    direct_evidence_types: [authored_code, deterministic_test]
    required_direct_type: authored_code
    reconciliation: >-
      6C'de iki Objective'in metni aynı Skill cümlesinden türetilmişti; 15A'da sonlanmayı okumayı öğreten
      detect_nontermination'dan farklı olarak bu Objective düzeltmenin kendisini ister. Direct type authored_code.
    checks:
      - prints: "3\n2\n1\nBitti"
        code: |
          n = 3
          while n > 0:
              print(n)
              n -= 1
          print("Bitti")
    explanations:
      canonical: |
        while döngüsü, koşulu True olduğu sürece döner. Sonlanması için gövdedeki bir şeyin koşulu eninde sonunda False yapması gerekir. 15A'da bir döngünün sonlanıp sonlanmayacağını okuyarak söylemeyi öğrendin; şimdi sonlanmayanı düzeltiyorsun.

        Sonsuz döngüyü çalıştırınca program takılır; durdurmak için terminalde Ctrl+C'ye basarsın. Dersin testleri de bir süre sınırı (5 saniye) kullanır: süre içinde bitmeyen bir program o testten kalır.

        Düzeltme adımları:
        1. Koşulda hangi değişken var?
        2. Gövde o değişkeni değiştiriyor mu? Değiştirmiyorsa doğru güncellemeyi ekle.
        3. Değişiklik doğru yönde mi? Koşul n > 0 ise n azalmalı.
        4. Hedefin üzerinden atlanabilir mi? while i != hedef, i 2'şer artarken tek bir hedefe hiç eşit olmaz; < ya da <= kullan.
        5. Değişken kullanıcıdan mı geliyor? O zaman yeni değer döngünün içinde okunmalı; döngüden önce bir kez okumak yetmez.

        Örnek: geri sayım.
        n = int(input())
        while n > 0:
            print(n)
            n -= 1
        print("Bitti")
        n -= 1 satırı olmasaydı n hiç değişmez ve aynı sayı sonsuza kadar yazılırdı.

        Düzelttikten sonra programı döngünün hiç dönmediği (ör. n = 0), bir kez döndüğü ve birçok kez döndüğü girdilerle dene.
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (sonlanma, 15A): bir döngü, koşuldaki değişken gövdede koşulu False yapacak yönde değiştiğinde sonlanır; "her turda değişiyor" demek "sonlanır" demek değildir.
      state_trace:
        level: H2
        text: |
          Sonsuz döngüyü tur tablosuyla teşhis etmek — başka bir örnek üzerinde.

          i = 1
          while i != 10:
              i += 3

          tur 1: i = 4; tur 2: i = 7; tur 3: i = 10 → biter. Peki i = 2 ile başlasaydı? 5, 8, 11, 14, ... 10'u atlar ve hiç bitmez.

          Düzeltme: while i < 10. Artık 11 olduğunda koşul False olur.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          Görev: kullanıcı 0 yazana kadar sayı okuyup toplamlarını yazmak. Hatalı program:

          sayi = int(input())
          toplam = 0
          while sayi != 0:
              toplam += sayi
          print(toplam)

          - Koşuldaki değişken: sayi.
          - Gövde sayi'yi değiştirmiyor: yeni sayı hiç okunmuyor, döngü sonsuza kadar aynı sayıyı ekliyor.
          - Düzeltme: toplamı güncelledikten sonra yeni sayıyı oku.

          sayi = int(input())
          toplam = 0
          while sayi != 0:
              toplam += sayi
              sayi = int(input())
          print(toplam)

          Girdi 4, 6, 0 → 10. İlk girdi 0 ise döngü hiç dönmez ve 0 yazılır.
    misconceptions:
      - slug: read_once_enough
        name: Döngüden önce bir kez okunan girdi döngü içinde kendiliğinden yenilenir
        open_question: Döngüden önce input() ile okuduğun değerin, döngünün her turunda kendiliğinden yeniden okunacağını mı düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Kullanıcı yeni sayı yazınca sayi değişir."

            input() yalnızca çağrıldığı anda bir satır okur. Döngüden önce bir kez çağrıldıysa sayi bir daha değişmez. Her turda yeni bir değer istiyorsan input()'u döngünün içinde çağırmalısın.
      - slug: crash_stops_infinite
        name: Sonsuz döngü bir süre sonra kendiliğinden hata verir
        open_question: Sonsuz bir döngünün bir süre sonra kendiliğinden hata verip duracağını mı düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Döngü bitmezse Python bir hata verir."

            Sonsuz döngü kendiliğinden durmaz; program takılı kalır ve onu Ctrl+C ile sen durdurursun. Dersin testleri bu yüzden bir süre sınırı kullanır: süre dolarsa test kalır. Sonlanmayı, kodu okuyup koşuldaki değişkenin nasıl değiştiğine bakarak güvenceye alırsın.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          Aşağıdaki program bir n okuyup n'den 1'e kadar geri sayıp sonra Bitti yazmalı, ama hiç bitmiyor. Döngüyü düzelt ve düzeltilmiş programı cozum.py olarak kaydet.

          n = int(input())
          while n > 0:
              print(n)
          print("Bitti")
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: three, stdin: "3\n", expected_stdout: "3\n2\n1\nBitti\n"}
          - {id: zero, stdin: "0\n", expected_stdout: "Bitti\n"}
        reference: |
          n = int(input())
          while n > 0:
              print(n)
              n -= 1
          print("Bitti")
        wrong:
          - |
            n = int(input())
            while n > 0:
                n -= 1
                print(n)
            print("Bitti")
          - |
            n = int(input())
            while n >= 0:
                print(n)
                n -= 1
            print("Bitti")
      - slug: f02
        difficulty: basic
        independence: guided
        prompt: |
          Aşağıdaki program bir n okuyup 1'den n'e kadar sayıların toplamını yazmalı, ama n 1 ya da daha büyük olunca hiç bitmiyor. Döngüyü düzelt ve düzeltilmiş programı cozum.py olarak kaydet.

          n = int(input())
          i = 1
          toplam = 0
          while i <= n:
              toplam += i
              i -= 1
          print(toplam)
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: four, stdin: "4\n", expected_stdout: "10\n"}
          - {id: zero, stdin: "0\n", expected_stdout: "0\n"}
          - {id: one, stdin: "1\n", expected_stdout: "1\n"}
        reference: |
          n = int(input())
          i = 1
          toplam = 0
          while i <= n:
              toplam += i
              i += 1
          print(toplam)
        wrong:
          - |
            n = int(input())
            i = 1
            toplam = 0
            while i < n:
                toplam += i
                i += 1
            print(toplam)
          - |
            n = int(input())
            i = 1
            toplam = 0
            while i <= n:
                i += 1
                toplam += i
            print(toplam)
      - slug: f03
        difficulty: authentic_application
        prompt: |
          Aşağıdaki program bir n okuyup 0'dan başlayarak n'den küçük bütün çift sayıları yazmalı. n çift olunca çalışıyor ama n tek olunca hiç bitmiyor. Döngüyü düzelt ve düzeltilmiş programı cozum.py olarak kaydet.

          n = int(input())
          i = 0
          while i != n:
              print(i)
              i += 2
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: even_bound, stdin: "6\n", expected_stdout: "0\n2\n4\n"}
          - {id: odd_bound, stdin: "7\n", expected_stdout: "0\n2\n4\n6\n"}
          - {id: one, stdin: "1\n", expected_stdout: "0\n"}
        reference: |
          n = int(input())
          i = 0
          while i < n:
              print(i)
              i += 2
        wrong:
          - |
            n = int(input())
            i = 0
            while i <= n:
                print(i)
                i += 2
          - |
            n = int(input())
            i = 0
            while i < n:

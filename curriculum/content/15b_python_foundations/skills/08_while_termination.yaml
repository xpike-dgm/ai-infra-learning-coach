          Aşağıdaki program, kullanıcı 0 yazana kadar sayı okuyup kaç tane pozitif sayı girildiğini yazmalı (0 sayılmaz), ama ilk sayı 0 değilse hiç bitmiyor. Döngüyü düzelt ve düzeltilmiş programı cozum.py olarak kaydet.

          sayi = int(input())
          adet = 0
          while sayi != 0:
              if sayi > 0:
                  adet += 1
          print(adet)
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: mixed, stdin: "5\n-2\n8\n0\n", expected_stdout: "2\n"}
          - {id: zero_first, stdin: "0\n", expected_stdout: "0\n"}
          - {id: all_positive, stdin: "1\n2\n3\n0\n", expected_stdout: "3\n"}
        reference: |
          sayi = int(input())
          adet = 0
          while sayi != 0:
              if sayi > 0:
                  adet += 1
              sayi = int(input())
          print(adet)
        wrong:
          - |
            sayi = int(input())
            adet = 0
            while sayi != 0:
                sayi = int(input())
                if sayi > 0:
                    adet += 1
            print(adet)
          - |
            sayi = int(input())
            adet = 0
            while sayi != 0:
                adet += 1
                sayi = int(input())
            print(adet)

  - id: objective.python.while_termination.write_terminating_loop
    statement: >-
      Kaç tur döneceği önceden bilinmeyen bir işi while döngüsüyle yazabilmek: koşulu ve gövdedeki güncellemeyi, döngü her
      girdi için sonlanacak ve doğru sonucu verecek biçimde kurabilmek (sayaçla, bir sınır değeriyle ya da bir bitiş
      işaretiyle).
    observable_behavior: >-
      Sıfır tur, bir tur ve birçok tur gerektiren girdilerin hepsinde süre içinde sonlanan ve doğru sonucu yazan while
      döngüsünü yazar.
    acceptable_evidence_types: [authored_code, deterministic_test]
    direct_evidence_types: [authored_code, deterministic_test]
    required_direct_type: authored_code
    reconciliation: >-
      6C'de iki Objective'in metni aynı Skill cümlesinden türetilmişti; 15B bu Objective'i baştan sonlanan döngü
      yazmaya ayırdı. Direct type authored_code.
    checks:
      - prints: "3"
        code: |
          n = 8
          adim = 0
          while n > 1:
              n = n // 2
              adim += 1
          print(adim)
    explanations:
      canonical: |
        for döngüsü kaç tur döneceğini önceden bildiğinde kullanılır (range(1, n + 1) gibi). Kaç tur gerektiğini bilmiyorsan — "1'e inene kadar", "kullanıcı 0 yazana kadar", "bakiye hedefe ulaşana kadar" — while kullanırsın.

        Bir while döngüsünü yazarken üç parçayı birlikte düşün:
        1. Başlangıç: koşuldaki değişkenler döngüden önce bir değere sahip olmalı.
        2. Koşul: döngü ne zaman devam etmeli? ("Hedefe ulaşana kadar" demek, "ulaşmadığı sürece" koşulu demektir.)
        3. Güncelleme: her turda koşuldaki değişkeni sona doğru götüren satır.

        Örnek: n'yi kaç kez ikiye bölersen 1'e inersin?
        n = int(input())
        adim = 0
        while n > 1:
            n = n // 2
            adim += 1
        print(adim)
        Girdi 8 → 4, 2, 1 → 3 adım. Girdi 1 → döngü hiç dönmez → 0.

        Bitiş işareti (sentinel): kullanıcı özel bir değer (ör. -1) yazana kadar oku:
        sayi = int(input())
        while sayi != -1:
            ...
            sayi = int(input())
        İlk okuma döngüden önce, sonrakiler döngünün sonunda yapılır; böylece bitiş işareti hiçbir zaman işlenmez.

        Yazdıktan sonra: döngü sıfır kez, bir kez ve birçok kez döndüğünde doğru sonucu veriyor mu? Ve her girdide gerçekten sonlanıyor mu?
      prerequisite_refresh:
        level: H1
        text: |
          Kısa bir hatırlatma (koşullar): while koşulu da bir if koşulu gibi her turun başında True ya da False'a çevrilir; and / or ile birden çok şartı birleştirebilirsin.
      worked_example:
        level: H3
        text: |
          Çözülmüş bir örnek.

          Görev: bir sayı oku; sayı 100'ü geçene kadar her turda 3 katına çıkar; kaç tur gerektiğini yaz.

          sayi = int(input())
          tur = 0
          while sayi <= 100:
              sayi = sayi * 3
              tur += 1
          print(tur)

          - "100'ü geçene kadar" = "100'ü geçmediği sürece" = sayi <= 100.
          - Güncelleme sayıyı büyütüyor; pozitif bir başlangıçta koşul bir gün False olur.
          - Girdi 5 → 15, 45, 135 → 3 tur. Girdi 150 → 0 tur.
    misconceptions:
      - slug: until_written_as_while
        name: '"…olana kadar" koşulu while içine olduğu gibi yazılır'
        open_question: '"Bakiye 300 olana kadar" bir işi while bakiye >= 300 diye yazmanın doğru olduğunu mu düşünüyorsun?'
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "…olana kadar dönsün, o halde koşul …olmak."

            while, koşul True olduğu SÜRECE döner. "300 olana kadar" demek "300'ün altında kaldığı sürece" demektir: while bakiye < 300. Koşulu ters yazarsan döngü ya hiç dönmez ya da hiç durmaz.
      - slug: sentinel_counted
        name: Bitiş işareti de bir veri gibi işlenir
        open_question: Bitiş için yazılan -1'in de toplama ya da sayıma katılacağını mı düşünüyorsun?
        contrast:
          level: H2
          text: |
            Sık yapılan bir karışıklık: "Son okunan -1 de bir sayı, onu da sayarım."

            Bitiş işareti veri değildir. Okumayı döngünün sonuna koyarsan, -1 okunduğu anda koşul sınanır ve döngü biter; -1 hiçbir zaman gövdede işlenmez.
    items:
      - slug: f01
        difficulty: basic
        independence: guided
        in_lesson: true
        prompt: |
          cozum.py adında bir program yaz: pozitif bir n okusun ve n'yi her adımda tam sayı bölmesiyle (//) ikiye bölerek 1'e inmek için kaç adım gerektiğini yazsın. Örnek: 8 → 3 (8, 4, 2, 1). n 1 ise 0 yazsın.
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: eight, stdin: "8\n", expected_stdout: "3\n"}
          - {id: one, stdin: "1\n", expected_stdout: "0\n"}
          - {id: ten, stdin: "10\n", expected_stdout: "3\n"}
        reference: |
          n = int(input())
          adim = 0
          while n > 1:
              n = n // 2
              adim += 1
          print(adim)
        wrong:
          - |
            n = int(input())
            adim = 0
            while n > 0:
                n = n // 2
                adim += 1
            print(adim)
          - |
            n = int(input())
            adim = 0
            while n > 1:
                n = n - 2
                adim += 1
            print(adim)
      - slug: f02
        difficulty: basic
        independence: guided
        prompt: |
          cozum.py adında bir program yaz: kullanıcı -1 yazana kadar satır satır tam sayı okusun ve -1'den önce kaç sayı girildiğini yazsın (-1 sayılmaz).
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: three_numbers, stdin: "4\n9\n2\n-1\n", expected_stdout: "3\n"}
          - {id: none, stdin: "-1\n", expected_stdout: "0\n"}
          - {id: zero_is_data, stdin: "0\n0\n-1\n", expected_stdout: "2\n"}
        reference: |
          sayi = int(input())
          adet = 0
          while sayi != -1:
              adet += 1
              sayi = int(input())
          print(adet)
        wrong:
          - |
            sayi = int(input())
            adet = 0
            while sayi != -1:
                sayi = int(input())
                adet += 1
            print(adet + 1)
          - |
            sayi = int(input())
            adet = 0
            while sayi > 0:
                adet += 1
                sayi = int(input())
            print(adet)
      - slug: f03
        difficulty: authentic_application
        prompt: |
          cozum.py adında bir program yaz: pozitif bir n okusun ve şu kuralla 1'e inene kadar kaç adım attığını yazsın: n çiftse ikiye böl (//), tekse 3n + 1 yap. Örnek: 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1, yani 8 adım. n 1 ise 0 yazsın.
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: six, stdin: "6\n", expected_stdout: "8\n"}
          - {id: one, stdin: "1\n", expected_stdout: "0\n"}
          - {id: seven, stdin: "7\n", expected_stdout: "16\n"}
          - {id: power_of_two, stdin: "16\n", expected_stdout: "4\n"}
        reference: |
          n = int(input())
          adim = 0
          while n != 1:
              if n % 2 == 0:
                  n = n // 2
              else:
                  n = 3 * n + 1
              adim += 1
          print(adim)
        wrong:
          - |
            n = int(input())
            adim = 0
            while n != 1:
                if n % 2 == 0:
                    n = n // 2
                n = 3 * n + 1
                adim += 1
                if adim > 1000:
                    break
            print(adim)
          - |
            n = int(input())
            adim = 1
            while n != 1:
                if n % 2 == 0:
                    n = n // 2
                else:
                    n = 3 * n + 1
                adim += 1
            print(adim)
      - slug: f04
        difficulty: authentic_application
        prompt: |
          cozum.py adında bir program yaz: pozitif bir tam sayı (en az 1) okusun ve kaç basamaklı olduğunu while döngüsüyle hesaplayıp yazsın. Örnek: 4721 → 4.
        required_skills: [skill.python.input_output_basic]
        suite:
          - {id: four_digits, stdin: "4721\n", expected_stdout: "4\n"}
          - {id: one_digit, stdin: "7\n", expected_stdout: "1\n"}
          - {id: round_number, stdin: "100\n", expected_stdout: "3\n"}
        reference: |
          n = int(input())
          basamak = 0
          while n > 0:
              n = n // 10
              basamak += 1
          print(basamak)
        wrong:
          - |
            n = int(input())
            basamak = 0
            while n > 9:
                n = n // 10
                basamak += 1
            print(basamak)
          - |
            n = int(input())
            basamak = 0
            while n > 10:
                n = n // 10
                basamak += 1
            print(basamak + 1)
      - slug: f05
        difficulty: transfer_integration
        prompt: |
          cozum.py adında bir program yaz: üç satırda başlangıç bakiyesi, her ay eklenen para ve hedef tutarı (üçü de tam sayı, eklenen para pozitif) okusun ve bakiyenin hedefe ulaşması (hedefe eşit ya da büyük olması) için kaç ay gerektiğini yazsın. Bakiye zaten hedefteyse 0 yazsın.
        required_skills: [skill.python.input_output_basic]
        suite:

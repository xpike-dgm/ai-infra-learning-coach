      - slug: f04
        difficulty: authentic_application
        prompt: |
          Aşağıdaki program pozitif bir tam sayının basamaklarının toplamını yazmalı (ör. 4721 → 14), ama hiç bitmiyor. Döngüyü düzelt ve düzeltilmiş programı cozum.py olarak kaydet.

          n = int(input())
          toplam = 0
          while n > 0:
              toplam += n % 10

skill: skill.english.documentation_navigation
objectives:
  - id: objective.english.documentation_navigation.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          Bir yardım sayfasının başlıkları bunlar. Komutun ne yaptığını hangi başlık anlatır?
        code: |
          NAME
          SYNOPSIS
          DESCRIPTION
          EXAMPLES
          SEE ALSO
        options:
          A: "DESCRIPTION"
          B: "NAME"
          C: "EXAMPLES"
          D: "SEE ALSO"
        answer: A
        verify:
          mode: reference
          reference: "man-pages(7), Sections within a manual page — DESCRIPTION: an explanation of what the program does"
          claim: "Komutun ne yaptığını DESCRIPTION anlatır."
      - slug: g02
        difficulty: basic
        prompt: |
          `liste-al` adlı bir aracın biçim satırı bu. Komutu çalıştırırken hangisini MUTLAKA vermen gerekir?
        code: |
          Usage: liste-al [OPTION]... [FILE]...
        options:
          A: "Hiçbirini; ikisi de isteğe bağlı"
          B: "OPTION"
          C: "FILE"
          D: "İkisini de"
        scan_options: false
        answer: A
        misconception_options: {C: brackets_required, D: brackets_required}
        verify:
          mode: reference
          reference: "man(1) — 'any or all arguments within [ ] are optional'"
          claim: "OPTION da FILE da köşeli parantez içinde; ikisi de isteğe bağlıdır."
      - slug: g03
        difficulty: basic
        prompt: |
          `dosya-gor` adlı bir aracın seçenek listesi bu. Gizli dosyaları da görmek için hangi seçeneği kullanırsın? Kısa biçimini yaz.
        code: |
          OPTIONS
            -a, --all         show hidden files
            -s, --size        sort by size
            -t, --time        sort by time
        answer: "-a"
        also_accept: ["--all"]
        verify:
          mode: reference
          reference: "man-pages(7) — OPTIONS lists each option with its description; Wiktionary — hidden (adjective)"
          claim: "show hidden files satırının seçeneği -a'dır."
      - slug: g04
        difficulty: authentic_application
        prompt: |
          `rapor-yap` adlı bir aracın seçenek listesi bu. Aracın sürümünü yazdırmak için hangi seçeneği kullanırsın?
        code: |
          OPTIONS
            -v, --verbose     print more information
            -V, --version     print the version
            -q, --quiet       print only the number of errors
        options:
          A: "-V"
          B: "-v"
          C: "-q"
          D: "-v ya da -V; ikisi aynı seçenek"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "man-pages(7) — OPTIONS; GNU Coding Standards, --version and --verbose are distinct long options"
          claim: "print the version satırının seçeneği -V'dir; -v burada verbose'dur (daha çok bilgi)."
      - slug: g05
        difficulty: authentic_application
        prompt: |
          `dosya-sirala` adlı bir aracın seçenek satırı bu. --sort seçeneğini vermezsen dosyalar neye göre sıralanır?
        code: |
          --sort=name|size|time   sort the files by name, size or time (default: name)
        options:
          A: "Ada göre"
          B: "Boyuta göre"
          C: "Zamana göre"
          D: "Hiçbir şeye göre; sıralanmaz"
        scan_options: false
        answer: A
        required_skills: [skill.english.read_simple_terminal_error_fragments]
        verify:
          mode: reference
          reference: "Wiktionary — default (noun, computing): a value used when none is given"
          claim: "(default: name): seçenek verilmezse ada göre sıralanır."
      - slug: g06
        difficulty: authentic_application
        prompt: |
          `dosya-say` adlı bir aracın yardım sayfasından bir parça bu. Bir klasördeki dosyaları saymak için hangi örnek komutu kullanırsın?
        code: |
          EXAMPLES
            dosya-say -h
                show the help
            dosya-say -c src/
                count the files of the folder src/
            dosya-say -V
                print the version
        options:
          A: "dosya-say -c src/"
          B: "dosya-say -h"
          C: "dosya-say -V"
          D: "Hiçbiri; örneklerde dosya sayan bir komut yok"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "man-pages(7), Sections within a manual page — EXAMPLES: one or more examples demonstrating how the command is used"
          claim: "count the files of the folder src/ açıklaması dosya-say -c src/ örneğinindir."
      - slug: g07
        difficulty: transfer_integration
        prompt: |
          `liste-yap` adlı bir aracın seçenek listesi bu. Gizli dosyalar dahil bütün dosyaları ters sırayla görmek için hangi seçenekleri birlikte verirsin?
        code: |
          OPTIONS
            -a, --all         show all files, also hidden files
            -r, --reverse     reverse the order
            -s, --size        show the size of each file
            -q, --quiet       print only the number of files
        options:
          A: "-a -r"
          B: "-a -s"
          C: "-q -r"
          D: "-r"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "man-pages(7) — OPTIONS; each option is found by its description"
          claim: "Gizli dosyalar dahil hepsi -a, ters sıra -r'dir."
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bir aracın yardım sayfası çok uzun ve başlıkları bunlar. Yalnız sürümü gösteren seçeneği arıyorsun. En iyi yol hangisi?
        code: |
          NAME
          SYNOPSIS
          DESCRIPTION
          OPTIONS
          EXAMPLES
          SEE ALSO
        options:
          A: "OPTIONS başlığına git ve sağ sütundaki açıklamalarda version kelimesini ara."
          B: "Sayfanın her satırını baştan sona çevir; bütün kelimeleri anlamadan seçeneği bulamazsın."
          C: "SEE ALSO başlığına git; seçenekler orada."
          D: "Yalnız NAME satırını oku; sürüm seçeneği orada yazar."
        scan_options: false
        answer: A
        misconception_options: {B: read_everything}
        verify:
          mode: reference
          reference: "man-pages(7), Sections within a manual page — OPTIONS: a description of the command-line options"
          claim: "Bir seçenek OPTIONS başlığında, açıklamasıyla aranır; sayfanın tamamını okumak gerekmez."

# Published items: a wrong option written to follow from one misconception of the item's own Objective (D-120).
misconception_options:
  item.english.documentation_navigation.demonstrate_capability.f08: {B: brackets_required, C: brackets_required}

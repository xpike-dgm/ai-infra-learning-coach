skill: skill.english.imperative_instruction_comprehension
objectives:
  - id: objective.english.imperative_instruction_comprehension.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          Bu talimat senden ne istiyor?
        code: |
          Open the folder.
        options:
          A: "Klasörü aç."
          B: "Klasör açıldı."
          C: "Klasörü kapat."
          D: "Klasör açık mı?"
        scan_options: false
        answer: A
        misconception_options: {B: imperative_is_description}
        verify:
          mode: reference
          reference: "Wikipedia — Imperative mood (English: base verb, no subject); Wiktionary — open (verb)"
          claim: "Open the folder, klasörü açmanı isteyen bir emirdir."
      - slug: g02
        difficulty: basic
        prompt: |
          Bu talimat senden ne istiyor?
        code: |
          Remove the file.
        options:
          A: "Dosyayı kaldır."
          B: "Dosyayı yeniden adlandır."
          C: "Dosya kaldırıldı."
          D: "Dosyayı kopyala."
        scan_options: false
        answer: A
        misconception_options: {C: imperative_is_description}
        verify:
          mode: reference
          reference: "Wiktionary — remove (verb): to take away; Wikipedia — Imperative mood"
          claim: "Remove the file, dosyayı kaldırmanı ister."
      - slug: g03
        difficulty: basic
        prompt: |
          Bir kutunun üstünde bu yazıyor. Ne yapmalısın?
        code: |
          Enter your name.
        options:
          A: "Adını gir (yaz)."
          B: "Enter tuşuna bas."
          C: "Adın girildi."
          D: "Adını sil."
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — enter (verb, computing): to input data; your (determiner)"
          claim: "Enter your name, adını yazıp girmeni ister."
      - slug: g04
        difficulty: authentic_application
        prompt: |
          Bu talimata göre hangi sırayla ne yaparsın?
        code: |
          Click Save and close the program.
        options:
          A: "Önce Save'e tıklarım, sonra programı kapatırım."
          B: "Önce programı kapatırım, sonra Save'e tıklarım."
          C: "Sıra önemli değil; ikisini istediğim sırayla yaparım."
          D: "Yalnız programı kapatırım."
        scan_options: false
        answer: A
        misconception_options: {B: and_order_free, C: and_order_free}
        verify:
          mode: reference
          reference: "Wikipedia — Imperative mood; in a sequence of commands joined by 'and', the actions are read in the order written (Wiktionary — and: used to connect clauses, often in sequence)"
          claim: "Önce kaydet, sonra kapat; kapattıktan sonra kaydetmek değişiklikleri kaybettirebilir."
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bu satır bir durumu mu anlatıyor, bir şey yapmanı mı istiyor?
        code: |
          Create a new folder.
        options:
          A: "Bir şey yapmamı istiyor: yeni bir klasör oluştur."
          B: "Bir durumu anlatıyor: yeni bir klasör oluşturuldu."
          C: "Bir soru soruyor: yeni klasör var mı?"
          D: "Bir uyarı veriyor: klasör yeni."
        scan_options: false
        answer: A
        misconception_options: {B: imperative_is_description}
        verify:
          mode: reference
          reference: "Wikipedia — Imperative mood (English imperatives begin with the base verb and have no subject); Wiktionary — create (verb)"
          claim: "Create a new folder özne olmadan fiille başlar; bir emirdir."
      - slug: g06
        difficulty: authentic_application
        prompt: |
          Bu talimatı izlersen dosyada ne değişir?
        code: |
          Change the name and save the file.
        options:
          A: "Dosyanın adı değişir ve dosya kaydedilir."
          B: "Dosyanın içeriği silinir."
          C: "Hiçbir şey değişmez; yalnız dosya açılır."
          D: "Dosyanın bir kopyası oluşur."
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — change (verb); name (noun); save (verb, computing)"
          claim: "Talimat adı değiştirmeyi ve dosyayı kaydetmeyi ister."
      - slug: g07
        difficulty: transfer_integration
        prompt: |
          Bu talimatı izledikten sonra hangisi kalır?
        code: |
          Keep the file and remove the copy.
        options:
          A: "Asıl dosya"
          B: "Kopya"
          C: "İkisi de"
          D: "Hiçbiri"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — keep (verb): to continue to have; remove (verb): to take away; copy (noun)"
          claim: "Dosya tutulur, kopya kaldırılır; geriye asıl dosya kalır."
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bu talimatta again kelimesi ne anlatıyor?
        code: |
          Set the version and run the tests again.
        options:
          A: "Testlerin daha önce çalıştırıldığını ve şimdi bir kez daha çalıştırılacağını"
          B: "Testlerin ilk kez çalıştırılacağını"
          C: "Sürümün iki kez ayarlanacağını"
          D: "Testlerin artık çalıştırılmayacağını"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — again (adverb): another time, once more; set (verb): to adjust"
          claim: "run the tests again, testleri bir kez daha çalıştır demektir."
      - slug: t01
        difficulty: transfer_integration
        transfer_profile: cross_topic_context
        context_family: terminal_pwd_instruction
        required_skills: [skill.linux.terminal_filesystem_navigation]
        prompt: |
          Bir Linux kılavuzunda bu talimat var. Talimatı izlersen terminal ne gösterir?
        code: |
          Type `pwd` and press Enter.
        options:
          A: "İçinde bulunduğun klasörün tam yolunu"
          B: "Klasördeki dosyaların listesini"
          C: "Hiçbir şey; talimat yalnız pwd'nin ne olduğunu anlatıyor"
          D: "Bir önceki klasöre döner"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wikipedia — Imperative mood (Type ... and press ...: commands to the reader); pwd(1) — print name of current/working directory"
          claim: "Talimat pwd yazıp Enter'a basmanı ister; pwd içinde bulunulan klasörün tam yolunu yazar."

# Published items: a wrong option written to follow from one misconception of the item's own Objective (D-120).
misconception_options:
  item.english.imperative_instruction_comprehension.demonstrate_capability.f01: {B: imperative_is_description}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f02: {B: imperative_is_description}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f03: {C: imperative_is_description}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f04: {B: and_order_free, C: imperative_is_description}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f06: {C: imperative_is_description}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f07: {B: and_order_free, C: and_order_free}
  item.english.imperative_instruction_comprehension.demonstrate_capability.f08: {C: imperative_is_description}

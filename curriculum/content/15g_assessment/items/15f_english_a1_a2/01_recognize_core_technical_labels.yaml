skill: skill.english.recognize_core_technical_labels
objectives:
  - id: objective.english.recognize_core_technical_labels.match_term_meaning
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          Bir düzenleme menüsünde bu komut var. Ne yapar?
        code: |
          Paste
        options:
          A: "Daha önce kopyaladığın şeyi buraya yapıştırır"
          B: "Seçili şeyi kopyalar"
          C: "Seçili şeyi siler"
          D: "Dosyayı kaydeder"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — paste (verb, computing): to insert a piece of data previously copied or cut"
          claim: "Paste, daha önce kopyalanan ya da kesilen bir şeyi yapıştırır."
      - slug: g02
        difficulty: basic
        prompt: |
          Bir programın üst köşesinde bu düğme var. Ne işe yarar?
        code: |
          Search
        options:
          A: "Bir şey aramak"
          B: "Bir şeyi silmek"
          C: "Programı kapatmak"
          D: "Ayarları açmak"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — search (verb): to look in some place in order to find something"
          claim: "Search aramaktır."
      - slug: g03
        difficulty: basic
        prompt: |
          Bir programı indirdikten sonra bu düğmeyi görüyorsun. Basarsan ne olur?
        code: |
          Install
        options:
          A: "Program bilgisayara kurulur"
          B: "Program silinir"
          C: "Program kapatılır"
          D: "Program güncellenmeden açılır"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — install (verb, computing): to set up a program for use on a computer"
          claim: "Install programı kullanılmak üzere kurar."
      - slug: g04
        difficulty: authentic_application
        prompt: |
          Bir geliştirme aracının üstünde bu üç düğme var. Yazdığın programı çalıştırmak için hangisine basarsın?
        code: |
          Build   Run   Test
        options:
          A: "Run"
          B: "Build"
          C: "Test"
          D: "Hiçbiri; programı çalıştıran bir düğme yok"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — run (verb, computing): to execute a program; build (verb, computing): to compile source into a program; test (verb): to check"
          claim: "Programı çalıştıran Run'dır; Build derler, Test sınar."
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bir dosya yöneticisinde bir dosya seçiliyken önce bu düğmeye, sonra aynı klasörde ikinci düğmeye bastın. Sonunda klasörde ne olur?
        code: |
          Copy   Paste
        options:
          A: Seçili dosyanın bir kopyası oluşur; klasörde iki dosya olur
          B: Seçili dosya silinir
          C: Seçili dosya kapanır, başka bir şey olmaz
          D: Seçili dosya başka bir bilgisayara gönderilir
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — copy (verb, computing): to duplicate data into a temporary store; paste (verb, computing): to insert data previously copied"
          claim: "Copy dosyayı kopyalar, Paste kopyalananı yapıştırır: sonunda dosyanın bir kopyası oluşur."
      - slug: g06
        difficulty: authentic_application
        prompt: |
          Bir programın üst satırı bu. Programın seçeneklerini (dil, tema gibi) değiştirmek için hangisini açarsın?
        code: |
          File   Edit   Settings   Help
        options:
          A: "Settings"
          B: "File"
          C: "Edit"
          D: "Help"
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — settings (noun, plural; computing): the options that can be chosen to configure a program; edit (verb): to change a text or file"
          claim: "Programın seçenekleri Settings'tedir; Edit belgenin içeriğini değiştirmek içindir."
      - slug: g07
        difficulty: authentic_application
        prompt: |
          Derleyici işini bitirince son satırda bu yazdı. Hangisi doğrudur?
        code: |
          Build done: 0 errors, 2 warnings
        options:
          A: Derleme bitti ve hata yok; yalnız iki uyarı var
          B: Derleme iki hata yüzünden durdu
          C: Derleme başlamadı
          D: Derleme bitti ama 2 test başarısız oldu
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "Wiktionary — build (noun, computing): the process of compiling; done (adjective): finished; error (noun); warning (noun): a notice of a possible problem"
          claim: "Build done derlemenin bittiğini, 0 errors hata olmadığını, 2 warnings iki uyarı olduğunu söyler."
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bir metin düzenleyicide açık bir dosyanın sekmesinde bu düğme var. Kaydettiğin bir dosyada buna basarsan dosyaya ne olur?
        code: |
          Close
        options:
          A: "Dosya kapanır; bilgisayarda olduğu gibi durur"
          B: "Dosya bilgisayardan silinir"
          C: "Dosyanın bir kopyası oluşur"
          D: "Dosya yeniden açılır"
        scan_options: false
        answer: A
        misconception_options: {B: close_deletes}
        verify:
          mode: reference
          reference: "Wiktionary — close (verb, computing): to terminate access to a file or window; delete (verb, computing): to remove"
          claim: "Close dosyayı yalnız kapatır; silmez."

# Published items: a wrong option written to follow from one misconception of the item's own Objective (D-120).
misconception_options:
  item.english.recognize_core_technical_labels.match_term_meaning.f08: {B: download_is_upload}

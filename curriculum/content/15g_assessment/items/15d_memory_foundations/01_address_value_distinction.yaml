skill: skill.memory.address_value_distinction
objectives:
  - id: objective.memory.address_value_distinction.explain_address_vs_value
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          Bu program çalışınca ekrana ne yazılır?
        code: |
          #include <stdio.h>
          int main(void) {
              int a = 3;
              int b = a;
              printf("%d\n", &a == &b);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        options:
          A: "0"
          B: "1"
          C: "3"
          D: Program derlenmez.
        scan_options: false
        answer: A
        misconception_options: {B: assignment_links_variables}
        verify:
          mode: c_stdout
          outcomes: {A: "0", B: "1", C: "3", D: "derlenmez"}
      - slug: g02
        difficulty: basic
        prompt: |
          Bu program bu kursun ortamında (Linux, x86_64, gcc) çalışınca ekrana ne yazılır?
        code: |
          #include <stdio.h>
          int main(void) {
              printf("%zu\n", sizeof(double));
              return 0;
          }
        answer: "8"
        verify: {mode: c_stdout}
      - slug: g03
        difficulty: basic
        prompt: |
          scanf("%d", &n); satırında scanf'e neden n değil de &n verilir?
        options:
          A: scanf okuduğu değeri bir yere yazmalıdır; &n ona n'nin bellekteki yerini verir. Yalnız n verilseydi scanf n'nin o anki değerinin bir kopyasını alırdı ve n'yi değiştiremezdi.
          B: "& işareti n'yi bir tam sayıya çevirir; scanf yalnız tam sayı kabul eder."
          C: "& işareti n'nin değerini iki katına çıkarır."
          D: "Hiçbir farkı yoktur; & yalnız alışkanlıktan yazılır."
        scan_options: false
        answer: A
        verify:
          mode: reference
          reference: "cppreference, scanf: 'receiving arguments' are pointers to the objects where the converted values are stored; C11 §7.21.6.2 The fscanf function — 'the corresponding argument shall be a pointer to signed integer' for %d"
          claim: "scanf %d için okunan değerin yazılacağı nesnenin adresini (bir işaretçi) ister; &n bu adresi verir."
      - slug: g04
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır?
        code: |
          #include <stdio.h>
          void sifirla(int x) {
              x = 0;
          }
          int main(void) {
              int s = 7;
              sifirla(s);
              printf("%d\n", s);
              return 0;
          }
        required_skills: [skill.c.functions_basic]
        options:
          A: "7"
          B: "0"
          C: Program derlenmez; x değiştirilemez.
          D: "Rastgele bir sayı"
        scan_options: false
        answer: A
        verify:
          mode: c_stdout
          outcomes: {A: "7", B: "0", C: "derlenmez", D: "rastgele"}
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int a = 1;
              int b = a;
              a = 2;
              b = b + a;
              printf("%d %d\n", a, b);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        answer: "2 3"
        verify: {mode: c_stdout}
      - slug: g06
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır?
        code: |
          #include <stdio.h>
          void degistir(int a, int b) {
              int t = a;
              a = b;
              b = t;
          }
          int main(void) {
              int x = 1;
              int y = 2;
              degistir(x, y);
              printf("%d %d\n", x, y);
              return 0;
          }
        required_skills: [skill.c.functions_basic]
        options:
          A: "1 2"
          B: "2 1"
          C: "2 2"
          D: "1 1"
        scan_options: false
        answer: A
        verify: {mode: c_stdout}
      - slug: g07
        difficulty: authentic_application
        prompt: |
          Bu program bu kursun ortamında (Linux, x86_64, gcc) çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int i = 65;
              char c = 'A';
              printf("%d %d\n", i == c, sizeof i == sizeof c);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        answer: "1 0"
        verify: {mode: c_stdout}
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bu program bu kursun ortamında (Linux, x86_64, gcc) çalışınca ekrana ne yazılır? (İpucu: bir char ile bir int'i topladığında sonucun türü nedir?)
        code: |
          #include <stdio.h>
          int main(void) {
              char c = 100;
              printf("%zu %zu\n", sizeof c, sizeof (c + 1));
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        options:
          A: "1 4"
          B: "1 1"
          C: "4 4"
          D: "1 2"
        scan_options: false
        answer: A
        verify: {mode: c_stdout}
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int a = 5;
              int b = 5;
              printf("%d %d %d\n", a == b, &a != &b, sizeof a == sizeof b);
              return 0;
          }
        required_skills: [skill.c.expression_evaluation]
        answer: "1 1 1"
        verify: {mode: c_stdout}
      - slug: g10
        difficulty: authentic_application
        independence: guided
        prompt: |
          Bir arkadaşın şu kodu yazıyor ve "artir fonksiyonu n'yi bir artırdığı için sayac 6 olur" diyor:
          void artir(int n) { n = n + 1; }
          int sayac = 5;
          artir(sayac);
          Kendi cümlelerinle anlat: çağrıdan sonra sayac kaçtır ve neden? n ile sayac bellekte aynı yerde mi? Fonksiyonun sayac'ı gerçekten artırması için ne değişmeli (bir yol söylemen yeterli)? (3–5 cümle yeterli.)
        required_skills: [skill.c.functions_basic]
        answer: "-"
        rubric:
          - id: sayac_stays
            statement: Çağrıdan sonra sayac'ın 5 olarak kaldığını söyler.
          - id: value_copied
            statement: Çağrıda sayac'ın değerinin n adlı yeni bir değişkene kopyalandığını (değerle geçirme) açıklar.
          - id: separate_places
            statement: n ile sayac'ın bellekte ayrı yerlerde durduğunu, n'yi değiştirmenin yalnız n'nin yerini değiştirdiğini söyler.
          - id: a_working_fix
            statement: Çalışan bir yol önerir — örneğin fonksiyonun yeni değeri döndürüp çağıranın sayac = artir(sayac); yazması ya da fonksiyona sayac'ın adresinin verilmesi.
        verify:
          mode: rubric
  - id: objective.memory.address_value_distinction.trace_simple_memory_example
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int p = 2;
              int q = p * 3;
              p = q - p;
              printf("%d %d\n", p, q);
              return 0;
          }
        answer: "4 6"
        verify: {mode: c_stdout}
      - slug: g02
        difficulty: basic
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int a = 1;
              int b = 2;
              a = b;
              b = 5;
              printf("%d %d\n", a, b);
              return 0;
          }
        answer: "2 5"
        verify: {mode: c_stdout}
      - slug: g03
        difficulty: basic
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int ikiyle(int x) {
              return x * 2;
          }
          int main(void) {
              int s = 3;
              int t = ikiyle(s);
              printf("%d %d\n", s, t);
              return 0;
          }
        required_skills: [skill.c.functions_basic]
        answer: "3 6"
        verify: {mode: c_stdout}
      - slug: g04
        difficulty: authentic_application
        prompt: |
          Bu program x ile y'nin değerlerini takas etmeye çalışıyor. Ekrana ne yazılır?
        code: |
          #include <stdio.h>
          int main(void) {
              int x = 7;
              int y = 9;
              x = y;
              y = x;
              printf("%d %d\n", x, y);
              return 0;
          }
        options:
          A: "9 9"
          B: "9 7"
          C: "7 7"
          D: "7 9"
        scan_options: false
        answer: A
        misconception_options: {B: swap_without_third_box}
        verify: {mode: c_stdout}
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int a = 1;
              int b = a + 1;
              int c = b + a;
              a = c;
              b = a + c;
              printf("%d %d %d\n", a, b, c);
              return 0;
          }
        answer: "3 6 3"
        verify: {mode: c_stdout}
      - slug: g06
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int degistir(int n) {
              n = n + 10;
              return n * 2;
          }
          int main(void) {
              int k = 1;
              int m = degistir(k);
              printf("%d %d\n", k, m);
              return 0;
          }
        required_skills: [skill.c.functions_basic]
        answer: "1 22"
        verify: {mode: c_stdout}
      - slug: g07
        difficulty: authentic_application
        prompt: |
          Bu program çalışınca ekrana ne yazılır?
        code: |
          #include <stdio.h>
          int main(void) {
              int x = 1;
              for (int i = 0; i < 3; i++) {
                  x = x * 2 + i;
              }
              printf("%d\n", x);
              return 0;
          }
        required_skills: [skill.c.for_iteration]
        answer: "12"
        verify: {mode: c_stdout}
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int f(int a) {
              a = a + 1;
              return a;
          }
          int g(int a) {
              return f(a) + a;
          }
          int main(void) {
              int v = 5;
              printf("%d %d\n", g(v), v);
              return 0;
          }
        required_skills: [skill.c.functions_basic]
        answer: "11 5"
        verify: {mode: c_stdout}
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          Bu program girdi olarak 8 verilerek çalıştırılınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int n = 0;
              int kopya = n;
              scanf("%d", &n);
              printf("%d %d\n", n, kopya);
              return 0;
          }
        required_skills: [skill.c.standard_io_basic]
        answer: "8 0"
        verify: {mode: c_stdout, stdin: "8\n"}
      - slug: g10
        difficulty: transfer_integration
        prompt: |
          Bu program çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          #include <stdio.h>
          int main(void) {
              int a = 3;
              int b = 8;
              int t = a;
              a = b;
              b = t;
              a = a + b;
              printf("%d %d %d\n", a, b, t);
              return 0;
          }
        answer: "11 3 3"
        verify: {mode: c_stdout}
      - slug: t01
        difficulty: transfer_integration
        transfer_profile: cross_topic_context
        context_family: copy_then_loop
        required_skills: [skill.c.for_iteration]
        prompt: |
          Bu program çalışınca ekrana ne yazılır? (İki sayı, aralarında bir boşluk.)
        code: |
          #include <stdio.h>

          int main(void) {
              int a = 1;
              int b = a;
              for (int i = 0; i < 3; i++) {
                  b = b * 2;
              }
              printf("%d %d\n", a, b);
              return 0;
          }
        answer: "1 8"
        verify: {mode: c_stdout}

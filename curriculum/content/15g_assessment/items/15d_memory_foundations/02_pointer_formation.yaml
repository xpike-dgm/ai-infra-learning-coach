skill: skill.c.pointer_formation
objectives:
  - id: objective.c.pointer_formation.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          cozum.c dosyasına int *bos_isaretci(void) fonksiyonunu yaz: hiçbir yeri göstermeyen işaretçiyi (NULL) döndürsün. Hiçbir başlık eklemiyorsan NULL için #include <stddef.h> ekle. Dersin testleri dönen işaretçinin NULL olup olmadığına bakar.
        required_skills: [skill.c.functions_basic]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int *bos_isaretci(void);

          int main(void) {
              printf("%d\n", bos_isaretci() == NULL);
              return 0;
          }
        suite:
          - {id: is_null, expected_stdout: "1\n"}
        reference: |
          #include <stddef.h>

          int *bos_isaretci(void) {
              return NULL;
          }
        wrong:
          - |
            int *bos_isaretci(void) {
                static int x = 0;
                return &x;
            }
          - |
            int *bos_isaretci(void) {
                static int bos = 0;
                return &bos;
            }
      - slug: g02
        difficulty: basic
        prompt: |
          cozum.c dosyasına int ayni_yer_mi(int *a, int *b) fonksiyonunu yaz: iki işaretçi aynı yeri gösteriyorsa 1, değilse 0 döndürsün. Gösterilen değerlere bakma; yerleri karşılaştır. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>

          int ayni_yer_mi(int *a, int *b);

          int main(void) {
              int x = 4, y = 4;
              printf("%d %d %d\n", ayni_yer_mi(&x, &x), ayni_yer_mi(&x, &y), ayni_yer_mi(&y, &x));
              return 0;
          }
        suite:
          - {id: same_and_different, expected_stdout: "1 0 0\n"}
        reference: |
          int ayni_yer_mi(int *a, int *b) {
              return a == b;
          }
        wrong:
          - |
            int ayni_yer_mi(int *a, int *b) {
                return *a == *b;
            }
          - |
            int ayni_yer_mi(int *a, int *b) {
                return a != b;
            }
      - slug: g03
        difficulty: basic
        prompt: |
          cozum.c dosyasına int bos_mu(int *p) fonksiyonunu yaz: p NULL ise 1, değilse 0 döndürsün. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int bos_mu(int *p);

          int main(void) {
              int x = 0;
              printf("%d %d\n", bos_mu(NULL), bos_mu(&x));
              return 0;
          }
        suite:
          - {id: null_and_valid, expected_stdout: "1 0\n"}
        reference: |
          #include <stddef.h>

          int bos_mu(int *p) {
              return p == NULL;
          }
        wrong:
          - |
            #include <stddef.h>

            int bos_mu(int *p) {
                return p != NULL;
            }
          - |
            int bos_mu(int *p) {
                return 0;
            }
      - slug: g04
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int *diger(int *a, int *b, int *mevcut) fonksiyonunu yaz: mevcut a'yı gösteriyorsa b'yi, değilse a'yı döndürsün (iki değişken arasında sıra değiştirme). Dersin testleri bu fonksiyonu kendi main'iyle çağırır ve dönen adresi karşılaştırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int *diger(int *a, int *b, int *mevcut);

          int main(void) {
              int x = 1, y = 1;
              int *s = &x;
              s = diger(&x, &y, s);
              printf("%d ", s == &y);
              s = diger(&x, &y, s);
              printf("%d ", s == &x);
              s = diger(&x, &y, s);
              printf("%d\n", s == &y);
              return 0;
          }
        suite:
          - {id: toggles, expected_stdout: "1 1 1\n"}
        reference: |
          int *diger(int *a, int *b, int *mevcut) {
              if (mevcut == a) {
                  return b;
              }
              return a;
          }
        wrong:
          - |
            int *diger(int *a, int *b, int *mevcut) {
                return b;
            }
          - |
            int *diger(int *a, int *b, int *mevcut) {
                if (mevcut == a) {
                    return a;
                }
                return b;
            }
      - slug: g05
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int oku_bir(int *hedef) fonksiyonunu yaz: standart girdiden bir tam sayıyı scanf ile doğrudan hedef'in gösterdiği değişkene okusun ve scanf'in döndürdüğü değeri döndürsün. Dersin testleri bir değişkenin adresini verir, sonra dönen değeri ve değişkeni yazdırır.
        required_skills: [skill.c.functions_basic, skill.c.standard_io_basic]
        c_harness: |
          #include <stdio.h>

          int oku_bir(int *hedef);

          int main(void) {
              int x = -99;
              int r = oku_bir(&x);
              printf("%d %d\n", r, x);
              return 0;
          }
        suite:
          - {id: number, stdin: "42\n", expected_stdout: "1 42\n"}
          - {id: not_number, stdin: "abc\n", expected_stdout: "0 -99\n"}
          - {id: negative, stdin: "-7\n", expected_stdout: "1 -7\n"}
        reference: |
          #include <stdio.h>

          int oku_bir(int *hedef) {
              return scanf("%d", hedef);
          }
        wrong:
          - |
            #include <stdio.h>

            int oku_bir(int *hedef) {
                int x = 0;
                return scanf("%d", &x);
            }
          - |
            #include <stdio.h>

            int oku_bir(int *hedef) {
                scanf("%d", hedef);
                return 1;
            }
      - slug: g06
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int oku_ondalik(double *d) fonksiyonunu yaz: standart girdiden bir ondalıklı sayıyı scanf ile d'nin gösterdiği double'a okusun ve scanf'in döndürdüğü değeri döndürsün. Dersin testleri dönen değeri ve sayıyı iki ondalık basamakla yazdırır.
        required_skills: [skill.c.functions_basic, skill.c.standard_io_basic]
        c_harness: |
          #include <stdio.h>

          int oku_ondalik(double *d);

          int main(void) {
              double x = 0;
              int r = oku_ondalik(&x);
              printf("%d %.2f\n", r, x);
              return 0;
          }
        suite:
          - {id: decimal, stdin: "3.75\n", expected_stdout: "1 3.75\n"}
          - {id: whole, stdin: "10\n", expected_stdout: "1 10.00\n"}
        reference: |
          #include <stdio.h>

          int oku_ondalik(double *d) {
              return scanf("%lf", d);
          }
        wrong:
          - |
            #include <stdio.h>

            int oku_ondalik(double *d) {
                int n = 0;
                int r = scanf("%d", &n);
                return r;
            }
          - |
            #include <stdio.h>

            int oku_ondalik(double *d) {
                double kopya = 0;
                return scanf("%lf", &kopya);
            }
      - slug: g07
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int oku_harf_sayi(char *c, int *n) fonksiyonunu yaz: standart girdiden önce bir harfi (önündeki boşlukları atlayarak), sonra bir tam sayıyı tek bir scanf çağrısıyla c ve n'nin gösterdiği değişkenlere okusun ve scanf'in döndürdüğü değeri döndürsün.
        required_skills: [skill.c.functions_basic, skill.c.standard_io_basic]
        c_harness: |
          #include <stdio.h>

          int oku_harf_sayi(char *c, int *n);

          int main(void) {
              char h = '?';
              int s = -1;
              int r = oku_harf_sayi(&h, &s);
              printf("%d %c %d\n", r, h, s);
              return 0;
          }
        suite:
          - {id: both, stdin: "B 85\n", expected_stdout: "2 B 85\n"}
          - {id: leading_space, stdin: "  A\n90\n", expected_stdout: "2 A 90\n"}
          - {id: missing_number, stdin: "C x\n", expected_stdout: "1 C -1\n"}
        reference: |
          #include <stdio.h>

          int oku_harf_sayi(char *c, int *n) {
              return scanf(" %c %d", c, n);
          }
        wrong:
          - |
            #include <stdio.h>

            int oku_harf_sayi(char *c, int *n) {
                return scanf("%c %d", c, n);
            }
          - |
            #include <stdio.h>

            int oku_harf_sayi(char *c, int *n) {
                return scanf(" %c %d", c, n) - 1;
            }
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int *daha_yakin(int *a, int a_deger, int *b, int b_deger, int hedef) fonksiyonunu yaz: a_deger ile b_deger'den hedefe daha yakın olanın işaretçisini döndürsün (uzaklıklar eşitse a'yı). Değerler parametre olarak geliyor; işaretçilerin gösterdiği yerleri okumana gerek yok. Dersin testleri dönen adresi karşılaştırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int *daha_yakin(int *a, int a_deger, int *b, int b_deger, int hedef);

          int main(void) {
              int x = 0, y = 0;
              int av = 0, bv = 0, h = 0;
              while (scanf("%d %d %d", &av, &bv, &h) == 3) {
                  int *r = daha_yakin(&x, av, &y, bv, h);
                  printf("%c\n", r == &x ? 'a' : (r == &y ? 'b' : '?'));
              }
              return 0;
          }
        suite:
          - {id: cases, stdin: "3 10 5\n3 10 9\n2 8 5\n-4 6 0\n", expected_stdout: "a\nb\na\na\n"}
          - {id: b_below, stdin: "20 1 3\n", expected_stdout: "b\n"}
        reference: |
          int *daha_yakin(int *a, int a_deger, int *b, int b_deger, int hedef) {
              int da = a_deger - hedef;
              int db = b_deger - hedef;
              if (da < 0) {
                  da = -da;
              }
              if (db < 0) {
                  db = -db;
              }
              if (db < da) {
                  return b;
              }
              return a;
          }
        wrong:
          - |
            int *daha_yakin(int *a, int a_deger, int *b, int b_deger, int hedef) {
                if (b_deger - hedef < a_deger - hedef) {
                    return b;
                }
                return a;
            }
          - |
            int *daha_yakin(int *a, int a_deger, int *b, int b_deger, int hedef) {
                int da = a_deger - hedef;
                int db = b_deger - hedef;
                if (da < 0) {
                    da = -da;
                }
                if (db < 0) {
                    db = -db;
                }
                if (db <= da) {
                    return b;
                }
                return a;
            }
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int *uc_secim(int *a, int *b, int *c, int kod) fonksiyonunu yaz: kod 0 ise a'yı, 1 ise b'yi, 2 ise c'yi, başka bir değerse NULL döndürsün. Dersin testleri dönen adresi karşılaştırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int *uc_secim(int *a, int *b, int *c, int kod);

          int main(void) {
              int x = 0, y = 0, z = 0;
              int kod = 0;
              while (scanf("%d", &kod) == 1) {
                  int *r = uc_secim(&x, &y, &z, kod);
                  printf("%c\n", r == &x ? 'a' : r == &y ? 'b' : r == &z ? 'c' : r == NULL ? 'N' : '?');
              }
              return 0;
          }
        suite:
          - {id: all_codes, stdin: "0 1 2 3 -1\n", expected_stdout: "a\nb\nc\nN\nN\n"}
        reference: |
          #include <stddef.h>

          int *uc_secim(int *a, int *b, int *c, int kod) {
              switch (kod) {
                  case 0:
                      return a;
                  case 1:
                      return b;
                  case 2:
                      return c;
                  default:
                      return NULL;
              }
          }
        wrong:
          - |
            #include <stddef.h>

            int *uc_secim(int *a, int *b, int *c, int kod) {
                switch (kod) {
                    case 0:
                        return a;
                    case 1:
                        return b;
                    default:
                        return c;
                }
            }
          - |
            #include <stddef.h>

            int *uc_secim(int *a, int *b, int *c, int kod) {
                switch (kod) {
                    case 1:
                        return a;
                    case 2:
                        return b;
                    case 3:
                        return c;
                    default:
                        return NULL;
                }
            }
      - slug: g10
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int bayrakla_oku(int *a, int *b) fonksiyonunu yaz: standart girdiden önce bir bayrak (tam sayı), sonra bir değer okusun; bayrak 0 ise değeri a'nın, değilse b'nin gösterdiği değişkene okusun. Okuma için değeri önce başka bir değişkene almak yerine scanf'e doğrudan doğru işaretçiyi ver. Başarıyla okunan değer sayısını (bayrakla birlikte) döndürsün.
        required_skills: [skill.c.functions_basic, skill.c.standard_io_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int bayrakla_oku(int *a, int *b);

          int main(void) {
              int x = 0, y = 0;
              int r1 = bayrakla_oku(&x, &y);
              int r2 = bayrakla_oku(&x, &y);
              printf("%d %d %d %d\n", r1, r2, x, y);
              return 0;
          }
        suite:
          - {id: one_each, stdin: "0 5\n1 9\n", expected_stdout: "2 2 5 9\n"}
          - {id: both_to_b, stdin: "7 3\n2 4\n", expected_stdout: "2 2 0 4\n"}
          - {id: overwrite_a, stdin: "0 1\n0 8\n", expected_stdout: "2 2 8 0\n"}
        reference: |
          #include <stdio.h>

          int bayrakla_oku(int *a, int *b) {
              int bayrak = 0;
              if (scanf("%d", &bayrak) != 1) {
                  return 0;
              }
              return 1 + scanf("%d", bayrak == 0 ? a : b);
          }
        wrong:
          - |
            #include <stdio.h>

            int bayrakla_oku(int *a, int *b) {
                int bayrak = 0;
                if (scanf("%d", &bayrak) != 1) {
                    return 0;
                }
                return 1 + scanf("%d", bayrak == 0 ? b : a);
            }
          - |
            #include <stdio.h>

            int bayrakla_oku(int *a, int *b) {
                int bayrak = 0;
                if (scanf("%d", &bayrak) != 1) {
                    return 0;
                }
                return 1 + scanf("%d", bayrak == 1 ? b : a);
            }
      - slug: g11
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int ikisi_de_gecerli(int *a, int *b) fonksiyonunu yaz: iki işaretçi de NULL değilse ve aynı yeri göstermiyorlarsa 1, aksi hâlde 0 döndürsün. Dersin testleri bu fonksiyonu kendi main'iyle farklı işaretçilerle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int ikisi_de_gecerli(int *a, int *b);

          int main(void) {
              int x = 0, y = 0;
              printf("%d %d %d %d %d\n", ikisi_de_gecerli(&x, &y), ikisi_de_gecerli(&x, &x), ikisi_de_gecerli(NULL, &y),
                     ikisi_de_gecerli(&x, NULL), ikisi_de_gecerli(NULL, NULL));
              return 0;
          }
        suite:
          - {id: combinations, expected_stdout: "1 0 0 0 0\n"}
        reference: |
          #include <stddef.h>

          int ikisi_de_gecerli(int *a, int *b) {
              return a != NULL && b != NULL && a != b;
          }
        wrong:
          - |
            #include <stddef.h>

            int ikisi_de_gecerli(int *a, int *b) {
                return a != NULL && b != NULL;
            }
          - |
            #include <stddef.h>

            int ikisi_de_gecerli(int *a, int *b) {
                return (a != NULL || b != NULL) && a != b;
            }

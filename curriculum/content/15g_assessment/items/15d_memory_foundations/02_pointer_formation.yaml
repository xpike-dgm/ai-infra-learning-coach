skill: skill.c.pointer_formation
objectives:
  - id: objective.c.pointer_formation.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          cozum.c dosyasına int bos_sayisi(int *a, int *b, int *c) fonksiyonunu yaz: üç işaretçiden kaçının hiçbir yeri göstermediğini (NULL olduğunu) döndürsün. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int bos_sayisi(int *a, int *b, int *c);

          int main(void) {
              int x = 0, y = 0;
              printf("%d %d %d %d\n", bos_sayisi(&x, &y, &x), bos_sayisi(NULL, &y, NULL),
                     bos_sayisi(NULL, NULL, NULL), bos_sayisi(&x, NULL, &y));
              return 0;
          }
        suite:
          - {id: counts, expected_stdout: "0 2 3 1\n"}
        reference: |
          #include <stddef.h>

          int bos_sayisi(int *a, int *b, int *c) {
              return (a == NULL) + (b == NULL) + (c == NULL);
          }
        wrong:
          - |
            #include <stddef.h>

            int bos_sayisi(int *a, int *b, int *c) {
                return (a != NULL) + (b != NULL) + (c != NULL);
            }
          - |
            #include <stddef.h>

            int bos_sayisi(int *a, int *b, int *c) {
                return (a == NULL) + (b == NULL);
            }
      - slug: g02
        difficulty: basic
        prompt: |
          cozum.c dosyasına int ayni_yer_mi(int *a, int *b) fonksiyonunu yaz: iki işaretçi aynı yeri gösteriyorsa 1, değilse 0 döndürsün. Gösterilen değerlere bakma; yerleri karşılaştır. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>

          int ayni_yer_mi(int *a, int *b);

          int main(void) {
              int x = 4, y = 4;
              printf("%d %d %d\n", ayni_yer_mi(&x, &x), ayni_yer_mi(&x, &y), ayni_yer_mi(&y, &x));
              return 0;
          }
        suite:
          - {id: same_and_different, expected_stdout: "1 0 0\n"}
        reference: |
          int ayni_yer_mi(int *a, int *b) {
              return a == b;
          }
        wrong:
          - |
            int ayni_yer_mi(int *a, int *b) {
                return *a == *b;
            }
          - |
            int ayni_yer_mi(int *a, int *b) {
                return a != b;
            }
      - slug: g03
        difficulty: basic
        prompt: |
          cozum.c dosyasına int bos_mu(int *p) fonksiyonunu yaz: p NULL ise 1, değilse 0 döndürsün. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int bos_mu(int *p);

          int main(void) {
              int x = 0;
              printf("%d %d\n", bos_mu(NULL), bos_mu(&x));
              return 0;
          }
        suite:
          - {id: null_and_valid, expected_stdout: "1 0\n"}
        reference: |
          #include <stddef.h>

          int bos_mu(int *p) {
              return p == NULL;
          }
        wrong:
          - |
            #include <stddef.h>

            int bos_mu(int *p) {
                return p != NULL;
            }
          - |
            int bos_mu(int *p) {
                return 0;
            }
      - slug: g04
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int *diger(int *a, int *b, int *mevcut) fonksiyonunu yaz: mevcut a'yı gösteriyorsa b'yi, değilse a'yı döndürsün (iki değişken arasında sıra değiştirme). Dersin testleri bu fonksiyonu kendi main'iyle çağırır ve dönen adresi karşılaştırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int *diger(int *a, int *b, int *mevcut);

          int main(void) {
              int x = 1, y = 1;
              int *s = &x;
              s = diger(&x, &y, s);
              printf("%d ", s == &y);
              s = diger(&x, &y, s);
              printf("%d ", s == &x);
              s = diger(&x, &y, s);
              printf("%d\n", s == &y);
              return 0;
          }
        suite:
          - {id: toggles, expected_stdout: "1 1 1\n"}
        reference: |
          int *diger(int *a, int *b, int *mevcut) {
              if (mevcut == a) {
                  return b;
              }
              return a;
          }
        wrong:
          - |
            int *diger(int *a, int *b, int *mevcut) {
                return b;
            }
          - |
            int *diger(int *a, int *b, int *mevcut) {
                if (mevcut == a) {
                    return a;
                }
                return b;
            }
      - slug: g05
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int hangisi(int *a, int *b, int *aranan) fonksiyonunu yaz: aranan a ile aynı yeri gösteriyorsa 1, b ile aynı yeri gösteriyorsa 2, ikisiyle de aynı yeri göstermiyorsa 0 döndürsün (a ve b farklı yerlerdir). Gösterilen değerlere bakma. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int hangisi(int *a, int *b, int *aranan);

          int main(void) {
              int x = 5, y = 5, z = 5;
              printf("%d %d %d\n", hangisi(&x, &y, &x), hangisi(&x, &y, &y), hangisi(&x, &y, &z));
              return 0;
          }
        suite:
          - {id: identities, expected_stdout: "1 2 0\n"}
        reference: |
          int hangisi(int *a, int *b, int *aranan) {
              if (aranan == a) {
                  return 1;
              }
              if (aranan == b) {
                  return 2;
              }
              return 0;
          }
        wrong:
          - |
            int hangisi(int *a, int *b, int *aranan) {
                if (*aranan == *a) {
                    return 1;
                }
                if (*aranan == *b) {
                    return 2;
                }
                return 0;
            }
          - |
            int hangisi(int *a, int *b, int *aranan) {
                if (aranan == a) {
                    return 1;
                }
                return 2;
            }
      - slug: g06
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int *tekrar_eden(int *a, int *b, int *c) fonksiyonunu yaz: üç işaretçiden en az ikisi aynı yeri gösteriyorsa o yeri döndürsün; üçü de farklı yerleri gösteriyorsa NULL döndürsün. Gösterilen değerlere bakma. Dersin testleri bu fonksiyonu kendi main'iyle çağırır ve dönen adresi değişkenlerin adresleriyle karşılaştırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int *tekrar_eden(int *a, int *b, int *c);

          static const char *ad(int *p, int *x, int *y, int *z) {
              if (p == NULL) {
                  return "NULL";
              }
              if (p == x) {
                  return "x";
              }
              if (p == y) {
                  return "y";
              }
              if (p == z) {
                  return "z";
              }
              return "?";
          }

          int main(void) {
              int x = 1, y = 1, z = 1;
              printf("%s ", ad(tekrar_eden(&x, &y, &x), &x, &y, &z));
              printf("%s ", ad(tekrar_eden(&x, &y, &y), &x, &y, &z));
              printf("%s ", ad(tekrar_eden(&z, &z, &y), &x, &y, &z));
              printf("%s ", ad(tekrar_eden(&y, &y, &y), &x, &y, &z));
              printf("%s\n", ad(tekrar_eden(&x, &y, &z), &x, &y, &z));
              return 0;
          }
        suite:
          - {id: pairs_and_none, expected_stdout: "x y z y NULL\n"}
        reference: |
          #include <stddef.h>

          int *tekrar_eden(int *a, int *b, int *c) {
              if (a == b || a == c) {
                  return a;
              }
              if (b == c) {
                  return b;
              }
              return NULL;
          }
        wrong:
          - |
            #include <stddef.h>

            int *tekrar_eden(int *a, int *b, int *c) {
                if (*a == *b || *a == *c) {
                    return a;
                }
                if (*b == *c) {
                    return b;
                }
                return NULL;
            }
          - |
            #include <stddef.h>

            int *tekrar_eden(int *a, int *b, int *c) {
                if (a == b || a == c) {
                    return a;
                }
                return NULL;
            }
      - slug: g07
        difficulty: authentic_application
        prompt: |
          cozum.c dosyasına int kac_farkli(int *a, int *b, int *c) fonksiyonunu yaz: üç işaretçinin (hiçbiri NULL değil) kaç FARKLI yeri gösterdiğini (1, 2 ya da 3) döndürsün. Gösterilen değerlere bakma; yerleri karşılaştır. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int kac_farkli(int *a, int *b, int *c);

          int main(void) {
              int x = 7, y = 7, z = 7;
              printf("%d %d %d %d %d\n", kac_farkli(&x, &y, &z), kac_farkli(&x, &x, &x), kac_farkli(&x, &x, &y),
                     kac_farkli(&x, &y, &x), kac_farkli(&y, &x, &x));
              return 0;
          }
        suite:
          - {id: distinct_places, expected_stdout: "3 1 2 2 2\n"}
        reference: |
          int kac_farkli(int *a, int *b, int *c) {
              int sayi = 1;
              if (b != a) {
                  sayi++;
              }
              if (c != a && c != b) {
                  sayi++;
              }
              return sayi;
          }
        wrong:
          - |
            int kac_farkli(int *a, int *b, int *c) {
                int sayi = 1;
                if (*b != *a) {
                    sayi++;
                }
                if (*c != *a && *c != *b) {
                    sayi++;
                }
                return sayi;
            }
          - |
            int kac_farkli(int *a, int *b, int *c) {
                return (a != b) + (b != c) + 1;
            }
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int ayni_cift(int *a, int *b, int *c, int *d) fonksiyonunu yaz: (a, b) çiftinin gösterdiği iki yer ile (c, d) çiftinin gösterdiği iki yer, sıraları farklı olsa bile aynı iki yerse 1, değilse 0 döndürsün. Gösterilen değerlere bakma. Dersin testleri bu fonksiyonu kendi main'iyle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>

          int ayni_cift(int *a, int *b, int *c, int *d);

          int main(void) {
              int x = 2, y = 2, z = 2;
              printf("%d %d %d %d\n",
                     ayni_cift(&x, &y, &x, &y),
                     ayni_cift(&x, &y, &y, &x),
                     ayni_cift(&x, &y, &x, &z),
                     ayni_cift(&x, &x, &x, &y));
              return 0;
          }
        suite:
          - {id: unordered_pairs, expected_stdout: "1 1 0 0\n"}
        reference: |
          int ayni_cift(int *a, int *b, int *c, int *d) {
              return (a == c && b == d) || (a == d && b == c);
          }
        wrong:
          - |
            int ayni_cift(int *a, int *b, int *c, int *d) {
                return a == c && b == d;
            }
          - |
            int ayni_cift(int *a, int *b, int *c, int *d) {
                return (*a == *c && *b == *d) || (*a == *d && *b == *c);
            }
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int *uc_secim(int *a, int *b, int *c, int kod) fonksiyonunu yaz: kod 0 ise a'yı, 1 ise b'yi, 2 ise c'yi, başka bir değerse NULL döndürsün. Dersin testleri dönen adresi karşılaştırır.
        required_skills: [skill.c.functions_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int *uc_secim(int *a, int *b, int *c, int kod);

          int main(void) {
              int x = 0, y = 0, z = 0;
              int kod = 0;
              while (scanf("%d", &kod) == 1) {
                  int *r = uc_secim(&x, &y, &z, kod);
                  printf("%c\n", r == &x ? 'a' : r == &y ? 'b' : r == &z ? 'c' : r == NULL ? 'N' : '?');
              }
              return 0;
          }
        suite:
          - {id: all_codes, stdin: "0 1 2 3 -1\n", expected_stdout: "a\nb\nc\nN\nN\n"}
        reference: |
          #include <stddef.h>

          int *uc_secim(int *a, int *b, int *c, int kod) {
              switch (kod) {
                  case 0:
                      return a;
                  case 1:
                      return b;
                  case 2:
                      return c;
                  default:
                      return NULL;
              }
          }
        wrong:
          - |
            #include <stddef.h>

            int *uc_secim(int *a, int *b, int *c, int kod) {
                switch (kod) {
                    case 0:
                        return a;
                    case 1:
                        return b;
                    default:
                        return c;
                }
            }
          - |
            #include <stddef.h>

            int *uc_secim(int *a, int *b, int *c, int kod) {
                switch (kod) {
                    case 1:
                        return a;
                    case 2:
                        return b;
                    case 3:
                        return c;
                    default:
                        return NULL;
                }
            }
      - slug: g10
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int bayrakla_oku(int *a, int *b) fonksiyonunu yaz: standart girdiden önce bir bayrak (tam sayı), sonra bir değer okusun; bayrak 0 ise değeri a'nın, değilse b'nin gösterdiği değişkene okusun. Okuma için değeri önce başka bir değişkene almak yerine scanf'e doğrudan doğru işaretçiyi ver. Başarıyla okunan değer sayısını (bayrakla birlikte) döndürsün.
        required_skills: [skill.c.functions_basic, skill.c.standard_io_basic, skill.c.conditionals]
        c_harness: |
          #include <stdio.h>

          int bayrakla_oku(int *a, int *b);

          int main(void) {
              int x = 0, y = 0;
              int r1 = bayrakla_oku(&x, &y);
              int r2 = bayrakla_oku(&x, &y);
              printf("%d %d %d %d\n", r1, r2, x, y);
              return 0;
          }
        suite:
          - {id: one_each, stdin: "0 5\n1 9\n", expected_stdout: "2 2 5 9\n"}
          - {id: both_to_b, stdin: "7 3\n2 4\n", expected_stdout: "2 2 0 4\n"}
          - {id: overwrite_a, stdin: "0 1\n0 8\n", expected_stdout: "2 2 8 0\n"}
        reference: |
          #include <stdio.h>

          int bayrakla_oku(int *a, int *b) {
              int bayrak = 0;
              if (scanf("%d", &bayrak) != 1) {
                  return 0;
              }
              return 1 + scanf("%d", bayrak == 0 ? a : b);
          }
        wrong:
          - |
            #include <stdio.h>

            int bayrakla_oku(int *a, int *b) {
                int bayrak = 0;
                if (scanf("%d", &bayrak) != 1) {
                    return 0;
                }
                return 1 + scanf("%d", bayrak == 0 ? b : a);
            }
          - |
            #include <stdio.h>

            int bayrakla_oku(int *a, int *b) {
                int bayrak = 0;
                if (scanf("%d", &bayrak) != 1) {
                    return 0;
                }
                return 1 + scanf("%d", bayrak == 1 ? b : a);
            }
      - slug: g11
        difficulty: transfer_integration
        prompt: |
          cozum.c dosyasına int ikisi_de_gecerli(int *a, int *b) fonksiyonunu yaz: iki işaretçi de NULL değilse ve aynı yeri göstermiyorlarsa 1, aksi hâlde 0 döndürsün. Dersin testleri bu fonksiyonu kendi main'iyle farklı işaretçilerle çağırır.
        required_skills: [skill.c.functions_basic, skill.c.expression_evaluation]
        c_harness: |
          #include <stdio.h>
          #include <stddef.h>

          int ikisi_de_gecerli(int *a, int *b);

          int main(void) {
              int x = 0, y = 0;
              printf("%d %d %d %d %d\n", ikisi_de_gecerli(&x, &y), ikisi_de_gecerli(&x, &x), ikisi_de_gecerli(NULL, &y),
                     ikisi_de_gecerli(&x, NULL), ikisi_de_gecerli(NULL, NULL));
              return 0;
          }
        suite:
          - {id: combinations, expected_stdout: "1 0 0 0 0\n"}
        reference: |
          #include <stddef.h>

          int ikisi_de_gecerli(int *a, int *b) {
              return a != NULL && b != NULL && a != b;
          }
        wrong:
          - |
            #include <stddef.h>

            int ikisi_de_gecerli(int *a, int *b) {
                return a != NULL && b != NULL;
            }
          - |
            #include <stddef.h>

            int ikisi_de_gecerli(int *a, int *b) {
                return (a != NULL || b != NULL) && a != b;
            }

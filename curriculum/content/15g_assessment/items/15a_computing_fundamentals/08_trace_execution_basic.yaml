skill: skill.programming.trace_execution_basic
objectives:
  - id: objective.programming.trace_execution_basic.produce_trace
    items:
      - slug: g01
        difficulty: authentic_application
        prompt: |
          Bu kodun 3. satırı silinmiş. Kodun izleme tablosu ise elimizde:

          1. satırdan sonra: a=4
          2. satırdan sonra: a=4, b=1
          3. satırdan sonra: a=4, b=5
          4. satırdan sonra: a=-1, b=5

          Silinen 3. satır hangisi olabilir?
        code: |
          a = 4
          b = 1
          ...
          a = a - b
        options:
          A: b = a + b
          B: b = a * b
          C: a = a + b
          D: b = b * 4
        scan_options: false
        answer: A
        verify:
          mode: script
          outcomes: {A: "A", B: "B", C: "C", D: "D"}
          script: |
            secenekler = {"A": "b = a + b", "B": "b = a * b", "C": "a = a + b", "D": "b = b * 4"}
            beklenen = [{"a": 4, "b": 5}, {"a": -1, "b": 5}]
            uyan = []
            for harf, satir in secenekler.items():
                d = {"a": 4, "b": 1}
                exec(satir, {}, d)
                ucuncu = dict(d)
                exec("a = a - b", {}, d)
                if [ucuncu, dict(d)] == beklenen:
                    uyan.append(harf)
            print(",".join(uyan))
      - slug: g02
        difficulty: basic
        prompt: |
          Bu kod çalışınca ekrana ne yazılır?
        code: |
          x = 2
          y = x
          print(x, y)
          x = x + 5
          print(x, y)
        options:
          A: "2 2 ve 7 2 (alt alta)"
          B: "7 2 ve 7 2 (alt alta)"
          C: "2 2 ve 7 7 (alt alta)"
          D: "Yalnızca 7 2"
        scan_options: false
        answer: A
        misconception_options: {B: print_shows_final_value}
        verify:
          mode: stdout
          outcomes: {A: "2 2\n7 2", B: "7 2\n7 2", C: "2 2\n7 7", D: "7 2"}
      - slug: g03
        difficulty: authentic_application
        prompt: |
          Bir öğrenci bu kodun izleme tablosunu çıkarmış. Tablodaki ilk hatalı satır hangisi?
          satır 1: a=4
          satır 2: a=4, b=6
          satır 3: a=2, b=6
          satır 4: a=2, b=8
        code: |
          a = 4
          b = a * 2
          a = b - a
          b = a + b
        options:
          A: Satır 2
          B: Satır 3
          C: Satır 4
          D: Tabloda hata yok
        scan_options: false
        answer: A
        verify:
          mode: script
          outcomes: {A: "2", B: "3", C: "4", D: "yok"}
          script: |
            lines = ["a = 4", "b = a * 2", "a = b - a", "b = a + b"]
            given = [{"a": 4}, {"a": 4, "b": 6}, {"a": 2, "b": 6}, {"a": 2, "b": 8}]
            first = "yok"
            for n in range(1, len(lines) + 1):
                env = {}
                exec("\n".join(lines[:n]), env)
                if {k: env[k] for k in given[n - 1]} != given[n - 1]:
                    first = str(n)
                    break
            print(first)
      - slug: g04
        difficulty: authentic_application
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi, satır satır yaz.
        code: |
          for i in range(4):
              if i % 2 == 0:
                  print(i * 10)
        required_skills: [skill.programming.iteration_reasoning, skill.programming.branching_reasoning]
        answer: "0\n20"
        also_accept: ["0 20"]
        verify: {mode: stdout}
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi, satır satır yaz.
        code: |
          a = 1
          b = a + 1
          print(a, b)
          a = b * 3
          print(a, b)
          b = a - b
          print(a, b)
        answer: "1 2\n6 2\n6 4"
        verify: {mode: stdout}
      - slug: g06
        difficulty: authentic_application
        prompt: |
          İzleme tablosunda bu kodun 4. satırından sonra c'nin değeri nedir?
        code: |
          a = 3
          b = 4
          c = a + b
          a = c - a
          c = a * b
        options:
          A: "7"
          B: "16"
          C: "4"
          D: "12"
        answer: A
        verify:
          mode: probe
          upto: 4
          probe: print(c)
      - slug: g07
        difficulty: transfer_integration
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          a = 1
          b = 0
          for i in range(3):
              b = b + a
              a = a * 2
          print(a, b)
        answer: "8 7"
        required_skills: [skill.programming.iteration_reasoning]
        verify: {mode: stdout}
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi, satır satır yaz.
        code: |
          a = 10
          b = 1
          while a > b:
              a = a - 3
              b = b + 1
              print(a, b)
        required_skills: [skill.programming.iteration_reasoning, skill.programming.expression_boolean_reasoning]
        answer: "7 2\n4 3\n1 4"
        also_accept: ["7 2 4 3 1 4"]
        verify: {mode: stdout}
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          Bu kodun 3., 4., 5. ve 6. satırlarından kaç tanesi çalıştığında en az bir değişkenin değerini gerçekten değiştirir (değeri önceki değerinden farklı yapar)?
        code: |
          a = 5
          b = 2
          a = a * 1
          b = a - 3
          a = b + 3
          b = b * b
        options:
          A: "1"
          B: "4"
          C: "0"
          D: "2"
        scan_options: false
        answer: A
        verify:
          mode: script
          outcomes: {A: "1", B: "4", C: "0", D: "2"}
          script: |
            d = {"a": 5, "b": 2}
            degisen = 0
            for satir in ["a = a * 1", "b = a - 3", "a = b + 3", "b = b * b"]:
                once = dict(d)
                exec(satir, {}, d)
                if d != once:
                    degisen = degisen + 1
            print(degisen)
      - slug: t01
        difficulty: transfer_integration
        transfer_profile: cross_topic_context
        context_family: call_trace
        required_skills: [skill.programming.function_decomposition]
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi, satır satır yaz.
        code: |
          def iki_kat(n):
              print("cagri", n)
              return n * 2

          a = iki_kat(3)
          b = iki_kat(a)
          print(a + b)
        answer: "cagri 3\ncagri 6\n18"
        also_accept: ["cagri 3 cagri 6 18"]
        verify: {mode: stdout}

# Published items: a wrong option written to follow from one misconception of the item's own Objective (D-120).
misconception_options:
  item.programming.trace_execution_basic.produce_trace.f02: {A: print_shows_final_value}

skill: skill.programming.trace_execution_basic
objectives:
  - id: objective.programming.trace_execution_basic.produce_trace
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          İzleme tablosunda bu kodun 2. satırından sonraki durum hangisidir?
        code: |
          m = 4
          n = m * 3
          m = n - m
          print(m, n)
        options:
          A: m=4, n=12
          B: m=8, n=12
          C: m=4, n=7
          D: m=12, n=12
        answer: A
        verify:
          mode: probe
          upto: 2
          probe: print(m, n)
          outcomes: {A: "4 12", B: "8 12", C: "4 7", D: "12 12"}
      - slug: g02
        difficulty: basic
        prompt: |
          Bu kod çalışınca ekrana ne yazılır?
        code: |
          s = 10
          print(s)
          s -= 4
          s = s * 3
          print(s)
        options:
          A: 18, 18 (alt alta)
          B: 10, 18 (alt alta)
          C: 10, 6 (alt alta)
          D: Yalnızca 18
        scan_options: false
        answer: B
        misconception_options: {A: print_shows_final_value}
        verify:
          mode: stdout
          outcomes: {A: "18\n18", B: "10\n18", C: "10\n6", D: "18"}
      - slug: g03
        difficulty: authentic_application
        prompt: |
          Bir öğrenci bu kodun izleme tablosunu çıkarmış. Tablodaki ilk hatalı satır hangisi?
          satır 1: a=4
          satır 2: a=4, b=6
          satır 3: a=2, b=6
          satır 4: a=2, b=8
        code: |
          a = 4
          b = a * 2
          a = b - a
          b = a + b
        options:
          A: Satır 2
          B: Satır 3
          C: Satır 4
          D: Tabloda hata yok
        scan_options: false
        answer: A
        verify:
          mode: script
          outcomes: {A: "2", B: "3", C: "4", D: "yok"}
          script: |
            lines = ["a = 4", "b = a * 2", "a = b - a", "b = a + b"]
            given = [{"a": 4}, {"a": 4, "b": 6}, {"a": 2, "b": 6}, {"a": 2, "b": 8}]
            first = "yok"
            for n in range(1, len(lines) + 1):
                env = {}
                exec("\n".join(lines[:n]), env)
                if {k: env[k] for k in given[n - 1]} != given[n - 1]:
                    first = str(n)
                    break
            print(first)
      - slug: g04
        difficulty: authentic_application
        prompt: |
          Bu kod satır satır izleniyor. Hangi satır çalıştıktan hemen sonra x ile y ilk kez eşit olur?
        code: |
          x = 2
          y = 9
          x = x * 3
          y = y - x
          x = x - 3
        options:
          A: 3. satır
          B: 4. satır
          C: 5. satır
          D: Hiçbir satırdan sonra eşit olmazlar.
        scan_options: false
        answer: C
        verify:
          mode: script
          outcomes: {A: "3", B: "4", C: "5", D: "None"}
          script: |
            lines = ["x = 2", "y = 9", "x = x * 3", "y = y - x", "x = x - 3"]
            first = None
            for n in range(2, len(lines) + 1):
                env = {}
                exec("\n".join(lines[:n]), env)
                if first is None and env["x"] == env["y"]:
                    first = n
            print(first)
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi, satır satır yaz.
        code: |
          a = 1
          b = a + 1
          print(a, b)
          a = b * 3
          print(a, b)
          b = a - b
          print(a, b)
        answer: "1 2\n6 2\n6 4"
        verify: {mode: stdout}
      - slug: g06
        difficulty: authentic_application
        prompt: |
          İzleme tablosunda bu kodun 4. satırından sonra c'nin değeri nedir?
        code: |
          a = 3
          b = 4
          c = a + b
          a = c - a
          c = a * b
        options:
          A: "7"
          B: "16"
          C: "4"
          D: "12"
        answer: A
        misconception_options: {B: print_shows_final_value}
        verify:
          mode: probe
          upto: 4
          probe: print(c)
      - slug: g07
        difficulty: transfer_integration
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi yaz.
        code: |
          a = 1
          b = 0
          for i in range(3):
              b = b + a
              a = a * 2
          print(a, b)
        answer: "8 7"
        required_skills: [skill.programming.iteration_reasoning]
        verify: {mode: stdout}
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          Bu kod çalışınca ekrana ne yazılır?
        code: |
          x = 5
          if x > 3:
              x = x - 4
          print(x)
          if x > 3:
              x = x + 10
          print(x)
        options:
          A: 1, 1 (alt alta)
          B: 1, 11 (alt alta)
          C: 5, 15 (alt alta)
          D: 11, 11 (alt alta)
        scan_options: false
        answer: A
        required_skills: [skill.programming.expression_boolean_reasoning, skill.programming.branching_reasoning]
        verify:
          mode: stdout
          outcomes: {A: "1\n1", B: "1\n11", C: "5\n15", D: "11\n11"}
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          Bu kodda üç print satırı var. Hangisi ekrana 6 yazar?
        code: |
          n = 2
          print(n)
          n = n * n
          print(n)
          n = n + 2
          print(n)
        options:
          A: 2. satır
          B: 4. satır
          C: 6. satır
          D: Üçü de; n'nin son değeri 6'dır.
        scan_options: false
        answer: C
        misconception_options: {D: print_shows_final_value}
        verify:
          mode: script
          outcomes: {A: "2", B: "4", C: "6", D: "2,4,6"}
          script: |
            lines = ["n = 2", "print(n)", "n = n * n", "print(n)", "n = n + 2", "print(n)"]
            env = {"printed": []}
            body = "\n".join(line.replace("print(n)", f"printed.append(({i + 1}, n))") for i, line in enumerate(lines))
            exec(body, env)
            print(",".join(str(no) for no, value in env["printed"] if value == 6))
      - slug: t01
        difficulty: transfer_integration
        transfer_profile: cross_topic_context
        context_family: call_trace
        required_skills: [skill.programming.function_decomposition]
        prompt: |
          Bu kod çalışınca ekrana ne yazılır? Cevabını ekranda göründüğü gibi, satır satır yaz.
        code: |
          def iki_kat(n):
              print("cagri", n)
              return n * 2

          a = iki_kat(3)
          b = iki_kat(a)
          print(a + b)
        answer: "cagri 3\ncagri 6\n18"
        also_accept: ["cagri 3 cagri 6 18"]
        verify: {mode: stdout}

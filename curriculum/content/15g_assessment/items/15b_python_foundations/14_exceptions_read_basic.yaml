          print(kodlar[1])
        required_skills: [skill.python.mapping_collections_basic, skill.python.list_operations]
        options:
          A: "KeyError"
          B: "IndexError"
          C: "TypeError"
          D: Hata vermez, ekrana 2 yazar.
        scan_options: false
        answer: A
        verify: {mode: traceback, ask: type, shown: false}


        code: |
          toplam = 10
          print(toplm)
        required_skills: [skill.python.assignment_binding]
        answer: "NameError"
        verify: {mode: traceback, ask: type}
      - slug: g02
        difficulty: basic
        prompt: |
          program.py çalıştırılınca aşağıdaki hata mesajı görünüyor. Hatanın türü nedir?

          Traceback (most recent call last):
            File "program.py", line 2, in <module>
              print(adet + " adet")

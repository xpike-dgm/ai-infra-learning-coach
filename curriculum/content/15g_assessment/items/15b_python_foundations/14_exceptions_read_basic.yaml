        code: |
          adet = 3
          print(adet + " adet")
        required_skills: [skill.python.assignment_binding, skill.python.value_type_behavior]
        options:
          A: "TypeError"
          B: "ValueError"
          C: "NameError"
          D: "SyntaxError"
        scan_options: false
        answer: A
        verify: {mode: traceback, ask: type}
      - slug: g03
        difficulty: basic
        prompt: |
          program.py çalıştırılınca önce 12 yazılıyor, sonra aşağıdaki hata mesajı görünüyor. Hata programın kaçıncı satırında çıktı? Yalnız sayıyı yaz.

          Traceback (most recent call last):
            File "program.py", line 3, in <module>
              b = int("12a")
          ValueError: invalid literal for int() with base 10: '12a'
        code: |
          a = int("12")
          print(a)
          b = int("12a")
          print(a + b)
        required_skills: [skill.python.assignment_binding, skill.python.value_type_behavior]
        answer: "3"
        verify: {mode: traceback, ask: line}
      - slug: g04
        difficulty: authentic_application
        prompt: |
          program.py çalıştırılınca aşağıdaki hata mesajı görünüyor. Hata gerçekte nerede çıktı?

          Traceback (most recent call last):
            File "program.py", line 5, in <module>
              print(son(sayilar))
            File "program.py", line 2, in son
              return liste[len(liste)]
          IndexError: list index out of range
        code: |
          def son(liste):
              return liste[len(liste)]

          sayilar = [4, 8, 15]
          print(son(sayilar))
        required_skills: [skill.python.functions_parameters_return, skill.python.list_operations]
        options:
          A: "2. satırda, son fonksiyonunun içinde"
          B: "5. satırda, programın ana kodunda"
          C: "4. satırda, programın ana kodunda"
          D: "1. satırda, fonksiyonun tanımında"
        scan_options: false
        answer: A
        misconception_options: {B: read_traceback_top_down}
        verify:
          mode: traceback
          ask: function_line
          outcomes: {A: "son 2", B: "<module> 5", C: "<module> 4", D: "son 1"}
      - slug: g05
        difficulty: authentic_application
        prompt: |
          Bu program (program.py) çalıştırılınca hangi türde bir hatayla durur? Çalıştırmadan, kodu okuyarak karar ver.

          - {id: two_sorted, args: ["elma=3", "armut=1"], expected_stdout: "armut=1\nelma=3\n#\n"}
          - {id: one, args: ["kiraz=7"], expected_stdout: "kiraz=7\n#\n"}
          - {id: empty, args: [], expected_stdout: "#\n"}
        reference: |
          def sayac_yaz(yol, sayac):
              with open(yol, "w", encoding="utf-8") as f:
                  for ad in sorted(sayac):
                      f.write(ad + "=" + str(sayac[ad]) + "\n")
        wrong:

          cozum.py dosyasına sayaci_artir(yol) adında bir fonksiyon yaz: dosyada tek bir tam sayı yazılıdır; dosya yoksa sayı 0 kabul edilsin. Sayıyı 1 artırıp dosyaya (eski içeriğin yerine) yazsın ve yeni sayıyı döndürsün. Testler fonksiyonu iki kez arka arkaya çağırır.

      - slug: t01
        difficulty: transfer_integration
        transfer_profile: cross_topic_context
        context_family: counts_to_file
        required_skills: [skill.python.mapping_collections_basic]
        prompt: |
          cozum.py dosyasına sayac_yaz(yol, sayac) adında bir fonksiyon yaz: sayac sözlüğündeki her anahtar için dosyaya ad=adet biçiminde bir satır yazsın; satırlar anahtarların alfabetik sırasında olsun ve her satır bir satır sonuyla bitsin (UTF-8). Dosya önceden varsa içeriği silinip yeniden yazılsın.
        harness: |
          import sys, tempfile, cozum
          from pathlib import Path
          sayac = {}
          for parca in sys.argv[1:]:
              ad, adet = parca.split("=")
              sayac[ad] = int(adet)
          with tempfile.TemporaryDirectory() as d:
              yol = Path(d) / "sayac.txt"
              yol.write_text("eski\n", encoding="utf-8")
              cozum.sayac_yaz(yol, sayac)
              print(yol.read_text(encoding="utf-8"), end="")
              print("#")

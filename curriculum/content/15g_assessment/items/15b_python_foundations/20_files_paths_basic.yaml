      - slug: g05
        difficulty: authentic_application
        prompt: |
          cozum.py dosyasına satir_numaralari(yol, kelime) adında bir fonksiyon yaz: UTF-8 metin dosyasında içinde kelime geçen satırların numaralarını (1'den başlayarak) bir liste olarak döndürsün.
        required_skills: [skill.python.functions_parameters_return, skill.python.list_operations, skill.python.for_iteration, skill.python.conditionals]
        harness: |
          import sys, tempfile, cozum
          from pathlib import Path
          icerik = sys.argv[1].replace("|", chr(10))
          with tempfile.TemporaryDirectory() as d:
              yol = Path(d) / "veri.txt"
              yol.write_bytes(icerik.encode("utf-8"))
              print(cozum.satir_numaralari(yol, sys.argv[2]))
        suite:
          - {id: two_hits, args: ["hata var|her şey yolunda|yine hata|", "hata"], expected_stdout: "[1, 3]\n"}
          - {id: none, args: ["a|b", "c"], expected_stdout: "[]\n"}
          - {id: last_line, args: ["x|y|son", "son"], expected_stdout: "[3]\n"}
        reference: |
          def satir_numaralari(yol, kelime):
              sonuc = []
              with open(yol, encoding="utf-8") as f:
                  satirlar = f.read().splitlines()
              for i in range(len(satirlar)):
                  if kelime in satirlar[i]:
                      sonuc.append(i + 1)
              return sonuc
        wrong:
          - |
            def satir_numaralari(yol, kelime):
                sonuc = []
                with open(yol, encoding="utf-8") as f:
                    satirlar = f.read().splitlines()
                for i in range(len(satirlar)):
                    if kelime in satirlar[i]:
                        sonuc.append(i)
                return sonuc
          - |
            def satir_numaralari(yol, kelime):
                sonuc = []
                with open(yol, encoding="utf-8") as f:
                    satirlar = f.read().splitlines()
                for i in range(len(satirlar)):
                    if kelime == satirlar[i]:
                        sonuc.append(i + 1)
                return sonuc
      - slug: g06

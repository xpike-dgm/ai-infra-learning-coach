skill: skill.python.files_paths_basic
objectives:
  - id: objective.python.files_paths_basic.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          cozum.py dosyasına ilk_satir(yol) adında bir fonksiyon yaz: UTF-8 metin dosyasının ilk satırını satır sonu olmadan döndürsün; dosya boşsa boş yazı ("") döndürsün.
        required_skills: [skill.python.functions_parameters_return, skill.python.list_operations, skill.python.conditionals]
        harness: |
          import sys, tempfile, cozum
          from pathlib import Path
          icerik = sys.argv[1].replace("|", chr(10))
          with tempfile.TemporaryDirectory() as d:
              yol = Path(d) / "veri.txt"
              yol.write_bytes(icerik.encode("utf-8"))
              print("[" + cozum.ilk_satir(yol) + "]")
        suite:
          - {id: two_lines, args: ["başlık|gövde|"], expected_stdout: "[başlık]\n"}
          - {id: single_no_newline, args: ["tek"], expected_stdout: "[tek]\n"}
          - {id: empty, args: [""], expected_stdout: "[]\n"}
        reference: |
          def ilk_satir(yol):
              with open(yol, encoding="utf-8") as f:
                  satirlar = f.read().splitlines()
              if len(satirlar) == 0:
                  return ""
              return satirlar[0]
        wrong:
          - |
            def ilk_satir(yol):
                with open(yol, encoding="utf-8") as f:
                    return f.readline()
          - |
            def ilk_satir(yol):
                with open(yol, encoding="utf-8") as f:
                    return f.read()

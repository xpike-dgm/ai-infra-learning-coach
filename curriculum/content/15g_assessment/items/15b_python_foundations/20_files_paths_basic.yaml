      - slug: g03
        difficulty: basic
        prompt: |
          cozum.py dosyasına dosyaya_yaz(yol, metin) adında bir fonksiyon yaz: metni dosyaya tam olarak yazsın (başka bir şey eklemeden); dosya önceden varsa eski içeriği tamamen silinsin. UTF-8 kullan. Testler dosyayı önce başka bir içerikle oluşturur.
        required_skills: [skill.python.functions_parameters_return]
        harness: |
          import sys, tempfile, cozum
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              yol = Path(d) / "cikti.txt"
              yol.write_bytes("eski içerik burada".encode("utf-8"))
              cozum.dosyaya_yaz(yol, sys.argv[1])
              with open(yol, encoding="utf-8") as f:
                  print("[" + f.read() + "]")
        suite:
          - {id: replaces, args: ["yeni"], expected_stdout: "[yeni]\n"}
          - {id: turkish, args: ["ığüşöç"], expected_stdout: "[ığüşöç]\n"}
          - {id: empty, args: [""], expected_stdout: "[]\n"}
        reference: |
          def dosyaya_yaz(yol, metin):
              with open(yol, "w", encoding="utf-8") as f:
                  f.write(metin)
        wrong:
          - |
            def dosyaya_yaz(yol, metin):
                with open(yol, "a", encoding="utf-8") as f:
                    f.write(metin)
          - |
            def dosyaya_yaz(yol, metin):
                with open(yol, "w", encoding="utf-8") as f:
                    f.write(metin + "\n")
      - slug: g04
        difficulty: authentic_application
        prompt: |
          cozum.py dosyasına en_uzun_satir(yol) adında bir fonksiyon yaz: UTF-8 metin dosyasındaki en uzun satırı satır sonu olmadan döndürsün; aynı uzunlukta birden çok satır varsa önce geleni. Dosyada en az bir satır vardır.
        required_skills: [skill.python.functions_parameters_return, skill.python.list_operations, skill.python.for_iteration, skill.python.conditionals]
        harness: |
          import sys, tempfile, cozum
          from pathlib import Path
          icerik = sys.argv[1].replace("|", chr(10))
          with tempfile.TemporaryDirectory() as d:
              yol = Path(d) / "veri.txt"
              yol.write_bytes(icerik.encode("utf-8"))
              print("[" + cozum.en_uzun_satir(yol) + "]")
        suite:
          - {id: middle, args: ["kısa|en uzun satır|orta|"], expected_stdout: "[en uzun satır]\n"}
          - {id: tie, args: ["abc|xyz"], expected_stdout: "[abc]\n"}
          - {id: last_no_newline, args: ["a|bb|ccc"], expected_stdout: "[ccc]\n"}
        reference: |
          def en_uzun_satir(yol):
              with open(yol, encoding="utf-8") as f:
                  satirlar = f.read().splitlines()

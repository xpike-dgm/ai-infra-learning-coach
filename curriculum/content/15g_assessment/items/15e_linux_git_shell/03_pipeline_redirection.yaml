skill: skill.shell.pipeline_redirection
objectives:
  - id: objective.shell.pipeline_redirection.demonstrate_capability
    items:
      - slug: g01
        difficulty: authentic_application
        hands_on: true
        prompt: |
          Boş bir klasörde (yok.txt yokken) bu komutları çalıştır. 2>&1 stderr'i stdout'un o anda gittiği yere, yani boruya bağlar. Son komut ne yazar?
        code: |
          echo deniz > a.txt
          cat a.txt yok.txt 2>&1 | wc -l
        answer: "2"
        verify: {mode: shell, last_line: true}
      - slug: g02
        difficulty: basic
        hands_on: true
        prompt: |
          Boş bir klasörde (bos adında bir şey yokken) bu komutu çalıştır. Ekranda kaç satır görünür ve bu satır(lar) nereden gelir?
        code: |
          ls bos | sort
        options:
          A: Bir satır; ls'in stderr'e yazdığı hata mesajı. sort hiçbir satır almadığı için bir şey yazmaz.
          B: Hiçbir satır; boru hata mesajını sort'a verdi ve sort onu sildi.
          C: İki satır; hata mesajı ve sort'un sıraladığı hâli.
          D: Bir satır; sort'un sıraladığı hata mesajı.
        scan_options: false
        answer: A
        misconception_options: {B: pipe_carries_errors, D: pipe_carries_errors}
        verify:
          mode: shell
          outcomes: {A: "A", B: "B", C: "C", D: "D"}
          script: |
            ekran=$(ls bos 2>&1 | sort 2>/dev/null)
            stdout=$(ls bos 2>/dev/null | sort)
            if [ -z "$stdout" ] && [ "$(printf '%s\n' "$ekran" | wc -l)" = "1" ]; then echo A; else echo C; fi
      - slug: g03
        difficulty: authentic_application
        hands_on: true
        prompt: |
          Boş bir klasörde bu komutları çalıştır. Son komut ne yazar?
        code: |
          echo 4 > n.txt
          echo 9 >> n.txt
          echo 6 >> n.txt
          echo 1 >> n.txt
          sort n.txt | tail -n 2 | head -n 1
        answer: "6"
        verify: {mode: shell, last_line: true}
      - slug: g04
        difficulty: authentic_application
        hands_on: true
        prompt: |
          Boş bir klasörde bu komutları çalıştır. Son komut ne yazar? (uniq'in nasıl çalıştığını düşün.)
        code: |
          echo b > l.txt
          echo a >> l.txt
          echo b >> l.txt
          uniq l.txt | wc -l
        options:
          A: "3; uniq yalnız art arda gelen aynı satırları birleştirir, buradaki iki b yan yana değil"
          B: "2; uniq dosyadaki bütün tekrarları atar"
          C: "1"
          D: "0"
        scan_options: false
        answer: A
        verify:
          mode: shell
          last_line: true
          outcomes: {A: "3", B: "2", C: "1", D: "0"}
      - slug: g05
        difficulty: authentic_application
        hands_on: true
        prompt: |
          Boş bir klasörde bu komutları çalıştır. Üçüncü satır ekranda bir şey yazar mı? Son komut ne yazar?
        code: |
          echo a > m.txt
          echo b >> m.txt
          cat m.txt | wc -l > sayi.txt
          cat sayi.txt
        answer: "2"
        verify: {mode: shell, last_line: true}
      - slug: g06
        difficulty: transfer_integration
        hands_on: true
        prompt: |
          Boş bir klasörde bu komutları çalıştır. Son komut ne yazar?
        code: |
          echo 3 > s.txt
          echo 10 >> s.txt
          echo 2 >> s.txt
          sort s.txt | head -n 1
        required_skills: [skill.shell.command_options_redirection_basic]
        answer: "10"
        verify: {mode: shell, last_line: true}
      - slug: g07
        difficulty: transfer_integration
        hands_on: true
        prompt: |
          Boş bir klasörde bu komutları çalıştır. Son komut ne yazar?
        code: |
          echo hata disk > log.txt
          echo bilgi ag >> log.txt
          echo hata bellek >> log.txt
          cat log.txt | grep hata | sort | tail -n 1
        answer: "hata disk"
        verify: {mode: shell, last_line: true}
      - slug: g08
        difficulty: transfer_integration
        hands_on: true
        prompt: |
          Boş bir klasörde bu komutları çalıştır (yok.txt yok). Ekranda hangi iki satır görünür? Satırları aralarında bir boşlukla yaz.
        code: |
          echo tek > a.txt
          cat a.txt yok.txt 2> hata.txt | wc -l
          wc -l hata.txt
        answer: "1 1 hata.txt"
        verify: {mode: shell, script: "echo tek > a.txt\necho $(cat a.txt yok.txt 2> hata.txt | wc -l; wc -l hata.txt)\n"}

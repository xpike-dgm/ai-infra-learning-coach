skill: skill.c.standard_io_basic
objectives:
  - id: objective.c.standard_io_basic.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          cozum.c adında bir program yaz: girdiden iki tam sayı okusun ve a + b = toplam biçiminde yazsın. Örnek: girdi 4 9 → çıktı 4 + 9 = 13.
        suite:
          - {id: small, stdin: "4 9\n", expected_stdout: "4 + 9 = 13\n"}
          - {id: lines, stdin: "10\n-3\n", expected_stdout: "10 + -3 = 7\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int a = 0, b = 0;
              scanf("%d %d", &a, &b);
              printf("%d + %d = %d\n", a, b, a + b);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int a = 0, b = 0;
                scanf("%d %d", &a, &b);
                printf("%d + %d = %d\n", a, b, a * b);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int a = 0, b = 0;
                scanf("%d", &a);
                printf("%d + %d = %d\n", a, b, a + b);
                return 0;
            }
      - slug: g02
        difficulty: basic
        prompt: |
          cozum.c adında bir program yaz: girdiden bir birim fiyat (double) ve bir adet (int) okusun ve toplam tutarı iki ondalık basamakla yazsın. Örnek: girdi 2.5 4 → çıktı 10.00.
        suite:
          - {id: whole, stdin: "2.5 4\n", expected_stdout: "10.00\n"}
          - {id: cents, stdin: "1.99 3\n", expected_stdout: "5.97\n"}
          - {id: zero, stdin: "7.25 0\n", expected_stdout: "0.00\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              double fiyat = 0;
              int adet = 0;
              scanf("%lf %d", &fiyat, &adet);
              printf("%.2f\n", fiyat * adet);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int fiyat = 0;
                int adet = 0;
                scanf("%d %d", &fiyat, &adet);
                printf("%.2f\n", (double) fiyat * adet);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                double fiyat = 0;
                int adet = 0;
                scanf("%lf %d", &fiyat, &adet);
                printf("%.2f\n", fiyat + adet);
                return 0;
            }
      - slug: g03
        difficulty: basic
        prompt: |
          cozum.c adında bir program yaz: girdiden tek bir karakter okusun (önündeki boşlukları ve satır sonlarını atlayarak) ve o karakteri yan yana üç kez yazsın. Örnek: girdi x → çıktı xxx.
        suite:
          - {id: plain, stdin: "x\n", expected_stdout: "xxx\n"}
          - {id: leading_space, stdin: "  q\n", expected_stdout: "qqq\n"}
          - {id: after_newline, stdin: "\n7\n", expected_stdout: "777\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              char c = ' ';
              scanf(" %c", &c);
              printf("%c%c%c\n", c, c, c);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                char c = ' ';
                scanf("%c", &c);
                printf("%c%c%c\n", c, c, c);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                char c = ' ';
                scanf(" %c", &c);
                printf("%c %c %c\n", c, c, c);
                return 0;
            }
      - slug: g04
        difficulty: authentic_application
        prompt: |
          cozum.c adında bir program yaz: girdiden sıfır ya da pozitif bir saniye sayısı okusun ve kaç saat, dakika ve saniye olduğunu S saat D dakika N saniye biçiminde yazsın. Örnek: girdi 7507 → çıktı 2 saat 5 dakika 7 saniye.
        required_skills: [skill.c.expression_evaluation]
        suite:
          - {id: mixed, stdin: "7507\n", expected_stdout: "2 saat 5 dakika 7 saniye\n"}
          - {id: under_minute, stdin: "59\n", expected_stdout: "0 saat 0 dakika 59 saniye\n"}
          - {id: exact_hour, stdin: "3600\n", expected_stdout: "1 saat 0 dakika 0 saniye\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int toplam = 0;
              scanf("%d", &toplam);
              printf("%d saat %d dakika %d saniye\n", toplam / 3600, toplam % 3600 / 60, toplam % 60);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int toplam = 0;
                scanf("%d", &toplam);
                printf("%d saat %d dakika %d saniye\n", toplam / 3600, toplam / 60, toplam % 60);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int toplam = 0;
                scanf("%d", &toplam);
                printf("%d saat %d dakika %d saniye\n", toplam / 3600, toplam % 60, toplam % 3600 / 60);
                return 0;
            }
      - slug: g05
        difficulty: authentic_application
        prompt: |
          cozum.c adında bir program yaz: girdiden bir dikdörtgenin eni ve boyunu (double) okusun ve tek satırda önce alanını, sonra çevresini iki ondalık basamakla yazsın. Örnek: girdi 2.5 4 → çıktı 10.00 13.00.
        required_skills: [skill.c.expression_evaluation]
        suite:
          - {id: mixed, stdin: "2.5 4\n", expected_stdout: "10.00 13.00\n"}
          - {id: square, stdin: "1 1\n", expected_stdout: "1.00 4.00\n"}
          - {id: decimals, stdin: "0.5 0.25\n", expected_stdout: "0.12 1.50\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              double en = 0, boy = 0;
              scanf("%lf %lf", &en, &boy);
              printf("%.2f %.2f\n", en * boy, 2 * (en + boy));
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                double en = 0, boy = 0;
                scanf("%lf %lf", &en, &boy);
                printf("%.2f %.2f\n", en * boy, 2 * en + boy);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int en = 0, boy = 0;
                scanf("%d %d", &en, &boy);
                printf("%.2f %.2f\n", (double) en * boy, 2.0 * (en + boy));
                return 0;
            }
      - slug: g06
        difficulty: authentic_application
        prompt: |
          cozum.c adında bir program yaz: girdiden boşluklarla ya da satır sonlarıyla ayrılmış iki harf (ad ve soyadın baş harfleri) okusun ve A.B. biçiminde yazsın. Örnek: girdi E K → çıktı E.K.
        suite:
          - {id: spaced, stdin: "E K\n", expected_stdout: "E.K.\n"}
          - {id: lines, stdin: "\nA\n  Y\n", expected_stdout: "A.Y.\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              char ad = ' ', soyad = ' ';
              scanf(" %c %c", &ad, &soyad);
              printf("%c.%c.\n", ad, soyad);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                char ad = ' ', soyad = ' ';
                scanf("%c%c", &ad, &soyad);
                printf("%c.%c.\n", ad, soyad);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                char ad = ' ', soyad = ' ';
                scanf(" %c %c", &ad, &soyad);
                printf("%c%c\n", ad, soyad);
                return 0;
            }
      - slug: g07
        difficulty: authentic_application
        prompt: |
          Aşağıdaki program girilen ondalıklı sayının iki katını yazmalı ama yanlış bir sonuç veriyor (derleyici de bir uyarı yazıyor). scanf'teki biçim belirtecini düşün, hatayı düzelt ve cozum.c olarak kaydet. Örnek: girdi 2.5 → çıktı 5.00.

              #include <stdio.h>

              int main(void) {
                  double x = 0;
                  scanf("%f", &x);
                  printf("%.2f\n", x * 2);
                  return 0;
              }
        suite:
          - {id: half, stdin: "2.5\n", expected_stdout: "5.00\n"}
          - {id: negative, stdin: "-1.25\n", expected_stdout: "-2.50\n"}
          - {id: whole, stdin: "100\n", expected_stdout: "200.00\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              double x = 0;
              scanf("%lf", &x);
              printf("%.2f\n", x * 2);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                double x = 0;
                scanf("%d", &x);
                printf("%.2f\n", x * 2);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int x = 0;
                scanf("%d", &x);
                printf("%.2f\n", x * 2.0);
                return 0;
            }
      - slug: g08
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden bir ay numarası (tam sayı) okusun. Bir tam sayı okunamazsa ya da sayı 1 ile 12 arasında değilse Gecersiz ay yazıp 1 ile çıksın; geçerliyse Ay: N yazıp 0 ile çıksın.
        required_skills: [skill.c.conditionals]
        suite:
          - {id: valid, stdin: "7\n", expected_stdout: "Ay: 7\n", expected_exit_code: 0}
          - {id: too_big, stdin: "13\n", expected_stdout: "Gecersiz ay\n", expected_exit_code: 1}
          - {id: zero, stdin: "0\n", expected_stdout: "Gecersiz ay\n", expected_exit_code: 1}
          - {id: not_number, stdin: "mart\n", expected_stdout: "Gecersiz ay\n", expected_exit_code: 1}
          - {id: boundary, stdin: "12\n", expected_stdout: "Ay: 12\n", expected_exit_code: 0}
        reference: |
          #include <stdio.h>

          int main(void) {
              int ay = 0;
              if (scanf("%d", &ay) != 1 || ay < 1 || ay > 12) {
                  printf("Gecersiz ay\n");
                  return 1;
              }
              printf("Ay: %d\n", ay);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int ay = 0;
                scanf("%d", &ay);
                if (ay < 1 || ay > 12) {
                    printf("Gecersiz ay\n");
                    return 0;
                }
                printf("Ay: %d\n", ay);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int ay = 0;
                if (scanf("%d", &ay) != 1 || ay < 1 || ay >= 12) {
                    printf("Gecersiz ay\n");
                    return 1;
                }
                printf("Ay: %d\n", ay);
                return 0;
            }
      - slug: g09
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden önce kaç sayı geleceğini (n), sonra n tam sayıyı okusun ve toplamlarını yazsın. n 0 olabilir.
        required_skills: [skill.c.for_iteration]
        suite:
          - {id: three, stdin: "3\n4 5 6\n", expected_stdout: "15\n"}
          - {id: none, stdin: "0\n", expected_stdout: "0\n"}
          - {id: lines, stdin: "2\n-7\n10\n", expected_stdout: "3\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0, toplam = 0, x = 0;
              scanf("%d", &n);
              for (int i = 0; i < n; i++) {
                  scanf("%d", &x);
                  toplam += x;
              }
              printf("%d\n", toplam);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, toplam = 0, x = 0;
                scanf("%d", &n);
                for (int i = 0; i < n; i++) {
                    scanf("%d", &x);
                }
                toplam += x;
                printf("%d\n", toplam);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, toplam = 0, x = 0;
                scanf("%d", &n);
                for (int i = 0; i < n; i++) {
                    scanf("%d", &x);
                    toplam += x;
                }
                printf("%d\n", toplam + n);
                return 0;
            }
      - slug: g10
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden saat, dakika ve eklenecek dakika sayısını (üç tam sayı, eklenecek sıfır ya da pozitif) okusun ve yeni saati saat dakika olarak, aralarında bir boşlukla yazsın; gece yarısını geçerse saat 0'dan devam etsin. Örnek: girdi 23 50 20 → çıktı 0 10.
        required_skills: [skill.c.expression_evaluation]
        suite:
          - {id: past_midnight, stdin: "23 50 20\n", expected_stdout: "0 10\n"}
          - {id: same_hour, stdin: "9 5 30\n", expected_stdout: "9 35\n"}
          - {id: many_hours, stdin: "10 0 125\n", expected_stdout: "12 5\n"}
          - {id: full_day, stdin: "8 15 1440\n", expected_stdout: "8 15\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int saat = 0, dakika = 0, ek = 0;
              scanf("%d %d %d", &saat, &dakika, &ek);
              int toplam = (saat * 60 + dakika + ek) % (24 * 60);
              printf("%d %d\n", toplam / 60, toplam % 60);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int saat = 0, dakika = 0, ek = 0;
                scanf("%d %d %d", &saat, &dakika, &ek);
                int toplam = saat * 60 + dakika + ek;
                printf("%d %d\n", toplam / 60, toplam % 60);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int saat = 0, dakika = 0, ek = 0;
                scanf("%d %d %d", &saat, &dakika, &ek);
                printf("%d %d\n", saat + ek / 60, (dakika + ek) % 60);
                return 0;
            }
      - slug: g11
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden üç ondalıklı sayı (double) okusun ve en büyüğünü bir ondalık basamakla yazsın. Örnek: girdi 2.5 9.75 -1 → çıktı 9.8.
        required_skills: [skill.c.conditionals]
        suite:
          - {id: middle, stdin: "2.5 9.75 -1\n", expected_stdout: "9.8\n"}
          - {id: first, stdin: "7 3 5\n", expected_stdout: "7.0\n"}
          - {id: negatives, stdin: "-3.5 -1.25 -8\n", expected_stdout: "-1.2\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              double a = 0, b = 0, c = 0;
              scanf("%lf %lf %lf", &a, &b, &c);
              double en = a;
              if (b > en) {
                  en = b;
              }
              if (c > en) {
                  en = c;
              }
              printf("%.1f\n", en);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                double a = 0, b = 0, c = 0;
                scanf("%lf %lf %lf", &a, &b, &c);
                double en = 0;
                if (a > en) {
                    en = a;
                }
                if (b > en) {
                    en = b;
                }
                if (c > en) {
                    en = c;
                }
                printf("%.1f\n", en);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int a = 0, b = 0, c = 0;
                scanf("%d %d %d", &a, &b, &c);
                int en = a;
                if (b > en) {
                    en = b;
                }
                if (c > en) {
                    en = c;
                }
                printf("%.1f\n", (double) en);
                return 0;
            }
      - slug: t01
        difficulty: transfer_integration
        transfer_profile: cross_topic_context
        context_family: division_identity
        required_skills: [skill.c.expression_evaluation]
        prompt: |
          cozum.c adında bir program yaz: aralarında boşluk olan iki pozitif tam sayı a ve b okusun; ekrana a = b * bölüm + kalan eşitliğini, aralarında birer boşlukla yazsın. Örnek: 17 5 → 17 = 5 * 3 + 2
        suite:
          - {id: example, stdin: "17 5\n", expected_stdout: "17 = 5 * 3 + 2\n"}
          - {id: exact, stdin: "20 4\n", expected_stdout: "20 = 4 * 5 + 0\n"}
          - {id: smaller, stdin: "3 7\n", expected_stdout: "3 = 7 * 0 + 3\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int a = 0;
              int b = 0;
              scanf("%d %d", &a, &b);
              printf("%d = %d * %d + %d\n", a, b, a / b, a % b);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int a = 0;
                int b = 0;
                scanf("%d %d", &a, &b);
                printf("%d = %d * %d + %d\n", a, a / b, b, a % b);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int a = 0;
                int b = 0;
                scanf("%d %d", &a, &b);
                printf("%d=%d*%d+%d\n", a, b, a / b, a % b);
                return 0;
            }

                return 0;
            }
      - slug: g11
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden aynı yıla ait iki tarihi gün ay gün ay sırasıyla (dört tam sayı) okusun; birinci tarih ikinciden önceyse once, sonraysa sonra, aynıysa ayni yazsın.
        required_skills: [skill.c.standard_io_basic]
        suite:
          - {id: earlier_month, stdin: "30 1 2 2\n", expected_stdout: "once\n"}
          - {id: later_day, stdin: "15 6 3 6\n", expected_stdout: "sonra\n"}
          - {id: same, stdin: "9 9 9 9\n", expected_stdout: "ayni\n"}
          - {id: later_month_smaller_day, stdin: "1 12 31 1\n", expected_stdout: "sonra\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int g1 = 0, a1 = 0, g2 = 0, a2 = 0;
              scanf("%d %d %d %d", &g1, &a1, &g2, &a2);
              if (a1 < a2 || (a1 == a2 && g1 < g2)) {
                  printf("once\n");
              } else if (a1 == a2 && g1 == g2) {
                  printf("ayni\n");
              } else {
                  printf("sonra\n");
              }
              return 0;
          }
        wrong:

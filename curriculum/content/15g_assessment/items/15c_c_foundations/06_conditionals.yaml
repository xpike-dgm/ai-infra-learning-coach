                char isik = ' ';
                scanf(" %c", &isik);
                switch (isik) {
                    case 'k':
                        printf("dur\n");
                        break;
                    case 's':
                        printf("hazirlan\n");
                    case 'y':
                        printf("gec\n");
                        break;
                    default:

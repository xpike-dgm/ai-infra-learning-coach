            #include <stdio.h>

            int main(void) {
                char isik = ' ';
                scanf(" %c", &isik);
                switch (isik) {
                    case 'k':
                        printf("dur\n");
                        break;
                    case 's':
                        printf("hazirlan\n");
                        break;
                    case 'y':
                        printf("gec\n");

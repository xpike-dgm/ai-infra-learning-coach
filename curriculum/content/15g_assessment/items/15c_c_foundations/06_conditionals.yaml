            #include <stdio.h>

            int main(void) {
                int g1 = 0, a1 = 0, g2 = 0, a2 = 0;
                scanf("%d %d %d %d", &g1, &a1, &g2, &a2);
                if (g1 < g2 || a1 < a2) {
                    printf("once\n");
                } else if (a1 == a2 && g1 == g2) {
                    printf("ayni\n");
                } else {
                    printf("sonra\n");
                }
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int g1 = 0, a1 = 0, g2 = 0, a2 = 0;
                scanf("%d %d %d %d", &g1, &a1, &g2, &a2);
                if (a1 < a2 && g1 < g2) {
                    printf("once\n");
                } else if (a1 == a2 && g1 == g2) {
                    printf("ayni\n");
                } else {
                    printf("sonra\n");
                }
                return 0;
            }

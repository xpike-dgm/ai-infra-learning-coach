      - slug: g05
        difficulty: authentic_application
        prompt: |
          cozum.c adında bir program yaz: girdiden önce n'yi (en az 1), sonra n tam sayıyı okusun ve en büyüğünü yazsın.
        required_skills: [skill.c.standard_io_basic, skill.c.conditionals]
        suite:
          - {id: mixed, stdin: "4\n3 9 -2 7\n", expected_stdout: "9\n"}
          - {id: all_negative, stdin: "3\n-8 -3 -5\n", expected_stdout: "-3\n"}
          - {id: single, stdin: "1\n42\n", expected_stdout: "42\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0, x = 0, en = 0;
              scanf("%d", &n);
              scanf("%d", &en);
              for (int i = 1; i < n; i++) {
                  scanf("%d", &x);
                  if (x > en) {
                      en = x;
                  }
              }
              printf("%d\n", en);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, x = 0, en = 0;
                scanf("%d", &n);
                for (int i = 0; i < n; i++) {
                    scanf("%d", &x);
                    if (x > en) {
                        en = x;
                    }
                }
                printf("%d\n", en);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, x = 0, en = 0;
                scanf("%d", &n);
                scanf("%d", &en);
                for (int i = 1; i < n; i++) {
                    scanf("%d", &x);
                    if (x < en) {
                        en = x;
                    }
                }
                printf("%d\n", en);
                return 0;
            }
      - slug: g06
        difficulty: authentic_application
        prompt: |
          cozum.c adında bir program yaz: girdiden bir taban ve sıfır ya da pozitif bir üs (iki tam sayı) okusun ve taban üzeri üs değerini bir for döngüsüyle hesaplayıp yazsın. Sonuç büyüyebileceği için long long kullan.
        required_skills: [skill.c.standard_io_basic]
        suite:
          - {id: two_ten, stdin: "2 10\n", expected_stdout: "1024\n"}
          - {id: zero_power, stdin: "7 0\n", expected_stdout: "1\n"}
          - {id: negative_base, stdin: "-3 3\n", expected_stdout: "-27\n"}
          - {id: big, stdin: "10 12\n", expected_stdout: "1000000000000\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int taban = 0, us = 0;
              scanf("%d %d", &taban, &us);
              long long sonuc = 1;
              for (int i = 0; i < us; i++) {
                  sonuc *= taban;
              }
              printf("%lld\n", sonuc);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int taban = 0, us = 0;
                scanf("%d %d", &taban, &us);
                int sonuc = 1;
                for (int i = 0; i < us; i++) {
                    sonuc *= taban;
                }
                printf("%d\n", sonuc);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int taban = 0, us = 0;
                scanf("%d %d", &taban, &us);
                long long sonuc = 1;
                for (int i = 1; i < us; i++) {
                    sonuc *= taban;
                }
                printf("%lld\n", sonuc);
                return 0;
            }
      - slug: g07

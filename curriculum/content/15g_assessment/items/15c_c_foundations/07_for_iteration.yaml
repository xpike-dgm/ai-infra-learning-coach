      - slug: g08
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden bir n okusun ve n × n'lik çarpım tablosunu yazsın: i. satırda i × 1'den i × n'ye kadar sayılar aralarında bir boşlukla (satır sonundaki boşluk önemsiz). Örnek, n = 3: 1 2 3 / 2 4 6 / 3 6 9 satırları.
        required_skills: [skill.c.standard_io_basic]
        suite:
          - {id: three, stdin: "3\n", expected_stdout: "1 2 3\n2 4 6\n3 6 9\n"}
          - {id: one, stdin: "1\n", expected_stdout: "1\n"}
          - {id: four, stdin: "4\n", expected_stdout: "1 2 3 4\n2 4 6 8\n3 6 9 12\n4 8 12 16\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0;
              scanf("%d", &n);
              for (int i = 1; i <= n; i++) {
                  for (int j = 1; j <= n; j++) {
                      printf("%d ", i * j);
                  }
                  printf("\n");
              }
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0;
                scanf("%d", &n);
                for (int i = 1; i <= n; i++) {
                    for (int j = 1; j <= n; j++) {
                        printf("%d ", i * j);
                    }
                }
                printf("\n");
                return 0;
            }
          - |

skill: skill.c.for_iteration
objectives:
  - id: objective.c.for_iteration.demonstrate_capability
    items:
      - slug: g01
        difficulty: basic
        prompt: |
          cozum.c adında bir program yaz: girdiden bir n okusun ve tek satıra yan yana n tane yıldız (*) yazıp satır sonuyla bitirsin. n 0 ise yalnız satır sonu yazsın.
        required_skills: [skill.c.standard_io_basic]
        suite:
          - {id: four, stdin: "4\n", expected_stdout: "****\n"}
          - {id: one, stdin: "1\n", expected_stdout: "*\n"}
          - {id: zero, stdin: "0\n", expected_stdout: "\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0;
              scanf("%d", &n);
              for (int i = 0; i < n; i++) {
                  printf("*");
              }
              printf("\n");
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0;
                scanf("%d", &n);
                for (int i = 0; i <= n; i++) {
                    printf("*");
                }
                printf("\n");
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0;
                scanf("%d", &n);
                for (int i = 0; i < n; i++) {
                    printf("*\n");
                }
                return 0;
            }
      - slug: g02
        difficulty: basic
        prompt: |
          cozum.c adında bir program yaz: girdiden bir n okusun ve 1'den n'e kadar (n dahil) çift sayıların toplamını yazsın. Örnek: n = 7 → 2 + 4 + 6 = 12.
        required_skills: [skill.c.standard_io_basic]
        suite:
          - {id: seven, stdin: "7\n", expected_stdout: "12\n"}
          - {id: eight, stdin: "8\n", expected_stdout: "20\n"}
          - {id: one, stdin: "1\n", expected_stdout: "0\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0, toplam = 0;
              scanf("%d", &n);
              for (int i = 2; i <= n; i += 2) {
                  toplam += i;
              }
              printf("%d\n", toplam);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, toplam = 0;
                scanf("%d", &n);
                for (int i = 2; i < n; i += 2) {
                    toplam += i;
                }
                printf("%d\n", toplam);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, toplam = 0;
                scanf("%d", &n);
                for (int i = 1; i <= n; i += 2) {
                    toplam += i;
                }
                printf("%d\n", toplam);
                return 0;
            }
      - slug: g03
        difficulty: basic
        prompt: |
          cozum.c adında bir program yaz: girdiden bir n okusun ve 1'den n'e kadar (n dahil) sayılardan kaçının 7'ye tam bölündüğünü yazsın.
        required_skills: [skill.c.standard_io_basic, skill.c.conditionals]
        suite:
          - {id: twenty, stdin: "20\n", expected_stdout: "2\n"}
          - {id: exact, stdin: "21\n", expected_stdout: "3\n"}
          - {id: small, stdin: "6\n", expected_stdout: "0\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0, sayac = 0;
              scanf("%d", &n);
              for (int i = 1; i <= n; i++) {
                  if (i % 7 == 0) {
                      sayac++;
                  }
              }
              printf("%d\n", sayac);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, sayac = 0;
                scanf("%d", &n);
                for (int i = 1; i < n; i++) {
                    if (i % 7 == 0) {
                        sayac++;
                    }
                }
                printf("%d\n", sayac);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, sayac = 0;
                scanf("%d", &n);
                for (int i = 0; i <= n; i++) {
                    if (i % 7 == 0) {
                        sayac++;
                    }
                }
                printf("%d\n", sayac);
                return 0;
            }
      - slug: g04

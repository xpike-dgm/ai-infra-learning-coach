      - slug: g10
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden bir n okusun ve n satırlık, sağa yaslı bir merdiven yazsın: i. satırda önce n − i tane nokta (.), sonra i tane # olsun. Örnek, n = 3: ..# / .## / ### satırları.
        required_skills: [skill.c.standard_io_basic]
        suite:
          - {id: three, stdin: "3\n", expected_stdout: "..#\n.##\n###\n"}
          - {id: one, stdin: "1\n", expected_stdout: "#\n"}
          - {id: four, stdin: "4\n", expected_stdout: "...#\n..##\n.###\n####\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0;
              scanf("%d", &n);
              for (int i = 1; i <= n; i++) {
                  for (int j = 0; j < n - i; j++) {
                      printf(".");
                  }
                  for (int j = 0; j < i; j++) {
                      printf("#");
                  }
                  printf("\n");
              }
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0;
                scanf("%d", &n);
                for (int i = 1; i <= n; i++) {
                    for (int j = 0; j < i; j++) {
                        printf("#");
                    }
                    for (int j = 0; j < n - i; j++) {
                        printf(".");
                    }
                    printf("\n");
                }
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0;
                scanf("%d", &n);
                for (int i = 1; i <= n; i++) {
                    for (int j = 0; j < n - i - 1; j++) {
                        printf(".");
                    }
                    for (int j = 0; j < i; j++) {
                        printf("#");
                    }
                    printf("\n");
                }
                return 0;
            }
      - slug: g11
        difficulty: transfer_integration
        prompt: |
          cozum.c adında bir program yaz: girdiden önce n'yi (en az 1), sonra n tam sayıyı okusun ve kaç kez bir sayının kendisinden hemen önceki sayıdan büyük olduğunu (artış sayısını) yazsın. Örnek: 3 5 4 6 7 → 3.
        required_skills: [skill.c.standard_io_basic, skill.c.conditionals]
        suite:
          - {id: mixed, stdin: "5\n3 5 4 6 7\n", expected_stdout: "3\n"}
          - {id: single, stdin: "1\n9\n", expected_stdout: "0\n"}
          - {id: equal_not_rise, stdin: "3\n2 2 2\n", expected_stdout: "0\n"}
          - {id: falling, stdin: "4\n9 7 5 3\n", expected_stdout: "0\n"}
        reference: |
          #include <stdio.h>

          int main(void) {
              int n = 0, onceki = 0, x = 0, artis = 0;
              scanf("%d", &n);
              scanf("%d", &onceki);
              for (int i = 1; i < n; i++) {
                  scanf("%d", &x);
                  if (x > onceki) {
                      artis++;
                  }
                  onceki = x;
              }
              printf("%d\n", artis);
              return 0;
          }
        wrong:
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, onceki = 0, x = 0, artis = 0;
                scanf("%d", &n);
                scanf("%d", &onceki);
                for (int i = 1; i < n; i++) {
                    scanf("%d", &x);
                    if (x >= onceki) {
                        artis++;
                    }
                    onceki = x;
                }
                printf("%d\n", artis);
                return 0;
            }
          - |
            #include <stdio.h>

            int main(void) {
                int n = 0, onceki = 0, x = 0, artis = 0;
                scanf("%d", &n);
                scanf("%d", &onceki);
                for (int i = 1; i < n; i++) {
                    scanf("%d", &x);
                    if (x > onceki) {
                        artis++;
                    }
                }
                printf("%d\n", artis);
                return 0;
            }

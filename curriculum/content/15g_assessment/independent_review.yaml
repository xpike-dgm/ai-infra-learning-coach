# 15G (ACNX-v0 / D-120): the independent review of every added item and every wrong-option misconception key.
# Merged from the reviewers' round files; a later round's verdict replaces an earlier one.
reviewer: independent_15g_content_review
method: Independent reviewer agents, one per content package (15A; 15B 01-10; 15B 11-20; 15C; 15D+15E; 15F), each reading
  the review brief, every lesson explanation form, the published items and the sibling added items, and running check_added.py
  for the mechanical check. Each item was judged on its key (worked by hand and re-run), leakage from the lesson, near-variance
  to published and sibling items, cues in the prompt, the construct it measures, hidden prerequisites and its difficulty label;
  each wrong-option mapping on whether the option follows from exactly that misconception. Failed items were rewritten or
  dropped and reviewed again until every item left passed (up to four rounds). The reviewers changed no repository file.
rounds: 4
summary:
  items: 613
  mappings: 144
  items_by_final_round:
    '1': 425
    '2': 158
    '3': 25
    '4': 5
findings:
- round: 1
  file: review_15a.yaml
  finding: 'Every added key is correct: check_added.py reports no FAIL and 128/128 validated, and independent re-execution
    / hand-working found no wrong key. All 40 item failures are about what the item measures, not its key.'
- round: 1
  file: review_15a.yaml
  finding: 'Dominant defect (about 26 of 40 failures): near-variants. Many g* items clone a published item''s template and
    option set with only names/numbers changed (e.g. 05 g04/g05 vs f03/f04, 07 g02 vs f02, 08 g04/g09 vs f03/f02, 09 t01 vs
    f06, 10 g06 vs f06, 12 g01/g02/g03 vs f01/f02/f04), or re-solve a lesson example/check (03 g08/g09, 05 g07, 06 g03/g09,
    06 nontermination g07, 07 g05, 11 g03). The pool would let a learner meet ''the same item'' twice; the builder cannot
    see this because it compares only keys/notation, not structure.'
- round: 1
  file: review_15a.yaml
  finding: 'Transfer items: 7 of 12 t* fail. Recurrent problem: the declared other-Topic Skill is not needed (01 t01 test
    framing, 02 t01 debug framing, 10 t01 prose rule with no code) or the context is the Objective''s ordinary context (11
    t01 loop accumulator, 12 t01 one-line function wrapper); 01 t01 and 12 t01 also reuse lesson scenarios, and 06 trace_iteration
    t01 / 09 t01 are near-variants of g01 / published f06. Passing t* (03, 04, 05, 07, 08) genuinely require the other Skill''s
    construct and keep the item''s own discriminating work.'
- round: 1
  file: review_15a.yaml
  finding: 'Hidden-knowledge / self-containment: 01 g07 depends on OS-specific executable formats never taught; 02 g04 depends
    on gcc -c, never taught, with the keyed option supplying the explanation; 09 g05 refers to ''Bir önceki programda'' (another
    item). Difficulty labels: 06 nontermination g09 and 12 g08 are basic recall/one-comparison items labelled transfer_integration.'
- round: 1
  file: review_15a.yaml
  finding: 'Mappings (14/103 fail): wrong direction or wrong misconception (02 g08:B predicts the opposite of executable_needs_source;
    03 g05:C and g08:C belong to other catalog entries), triggers absent from the stimulus (02 g03:D, t01:A; 08 g06:B where
    there is no print), and options better explained by another error (10 g05:B, f03:B, f05:D; 08 f06:D; 07 f07:C with literal
    arguments). The ''any wrong option = any_input_detects'' pattern is acceptable for ordinary agreeing inputs but not for
    zero/near-boundary inputs that the lesson''s own edge heuristics attract.'
- round: 1
  file: review_15a.yaml
  finding: 'Pool impact (passing added items per Objective): explain_pipeline 7/9, classify_artifacts 5/9, trace_state 8/11,
    evaluate_condition 10/11, predict_branch 6/10, trace_iteration 7/10, detect_nontermination 6/9, define_io_responsibility
    7/9, produce_trace 5/10, locate_cause 8/10, design_expected_case 6/10, code_reading 8/10, input_validation 5/10. Combined
    with the 7-8 published items, several Objectives fall below the 15-item target and need structurally new replacements.'
- round: 1
  file: review_15b1.yaml
  finding: 'Systemic (15B 01): fix-the-script items show the script inside `prompt` with an extra 4-space indent (the YAML
    block keeps it; the builder only strips newlines; AssessmentSessionScreen renders the prompt verbatim). For items whose
    learner must save and run the shown script, a verbatim copy fails with "IndentationError: unexpected indent" on line 1,
    contradicting the described behaviour. Published 15B items place such code at column 0. Dedent (or move to `code:`) before
    re-review. For read-only "what does this print" items the indent is cosmetic.'
- round: 1
  file: review_15b1.yaml
  finding: 15B 08 debug_infinite_loop added items repeat the 4-space-indented script in the prompt (see the 15B 01 finding).
    Here the learner already knows indentation (conditionals) and the construct — finding a non-termination cause — survives,
    so the items were judged on content; but a verbatim copy still raises IndentationError instead of hanging, so the scripts
    should be dedented to column 0 like published f01–f05 before shipping.
- round: 1
  file: review_15b1.yaml
  finding: '15B 10: list membership (`x in liste` / `not in`) is used by added references (g05, g10) but is taught only by
    later Skills (set_operations, string_text_operations); the notation file has no construct for `in`, so the build cannot
    catch it. Consider adding an `in`-membership construct to notation.yaml (pattern excluding `for … in`).'
- round: 1
  file: review_15b1.yaml
  finding: 'Mechanical check: check_added.py over the ten stems built 129 added items, all 129 mechanically validated, 10
    mappings, no FAIL lines. Every key/suite I re-derived agreed; no item failed this review for a wrong key.'
- round: 1
  file: review_15b1.yaml
  finding: 'Dominant failure pattern (about 35 of 49 fails): leakage or near-variance. Many basic/authentic items re-use a
    lesson example, lesson check or misconception contrast with changed literals (e.g. 02 g06/g08, 04 g07, 09 g03, 10 g02
    is the worked example verbatim), or repeat a published f-item''s structure (01 g02 ↔ f02, 09 g01 ↔ f01, 03 g01/g03 ↔ f01).
    The authoring pass appears to have checked lesson text for exact matches only, not for same-structure variants; replacements
    should be new families, not new numbers.'
- round: 1
  file: review_15b1.yaml
  finding: 'Transfer items: 6 of 10 t-items fail the transfer claim — two duplicate or near-duplicate a published item (03
    t01 = list_operations f03; 07 t01 ≈ for_iteration f03), one re-uses the worked example (02 t01), one declares only input_output_basic,
    which every item of that Skill already declares (08 write t01), and two hinge on the other Skill so that the own Objective
    does not decide the answer (01 t01, 04 t01).'
- round: 1
  file: review_15b1.yaml
  finding: 'Prompt hints: 01 g07/g10 and 08 debug g03/g06 tell the learner where or what the defect is, which removes the
    diagnosis that their Objectives measure.'
- round: 1
  file: review_15b2.yaml
  finding: 'check_added.py on the ten stems: 118 added items, 118 validated, 40 tasks, 7 mappings, no FAIL — every key passes
    its own execution and the notation scan. All 32 fails below are judgement defects the script cannot see.'
- round: 1
  file: review_15b2.yaml
  finding: 'Lesson re-use is the most frequent defect: lesson worked examples re-issued almost verbatim (18.g04 kisalt, 19.g04
    yedek_yolu→yedek_adi, 20.g04 en_uzun_satir, 14.g09 the ilk/return liste[0] chain), a lesson check re-issued (17.g01 =
    check 2''s cevir, 18.g07 = check 3''s '':.2f TL'' format), the lesson''s own literal as the example (11.g03 ''(5,)'',
    19.g01 ''belgeler/2026/rapor.pdf''), and the canonical example''s layout (14.g07). The builder has no leakage check; comparing
    an added item''s function name, example literal and reference against the lesson''s worked_example/checks would catch
    most of these.'
- round: 1
  file: review_15b2.yaml
  finding: '17_exception_handling: the Objective''s own reconciliation requires every item to contain a test in which an unexpected
    error must propagate, so a catch-everything solution cannot pass. 9 of the 12 added items (g01-g06, g09, g10, g11, t01
    — g04 via `except ValueError ... except Exception`) are passed by a catch-everything rewrite of their own reference (run).
    The builder could enforce this automatically for this Objective by adding the `except Exception` mutant to each item''s
    wrong set.'
- round: 1
  file: review_15b2.yaml
  finding: 'Transfer items (t*): 6 of the 10 fail their transfer claim — the declared other-Topic Skill is not needed for
    the answer (12.t01, 14.t01, 15.t01), the item duplicates another item (16.t01 = g01) or a published item (17.t01 ≈ f02,
    18.t01 ≈ lesson join example), or it measures a different, dependent Skill (19.t01 = file reading). Passing transfer items
    (11, 13, 20) are the ones where the other Skill''s operation is part of the solution.'
- round: 1
  file: review_15b2.yaml
  finding: 'Difficulty inflation: two one-line items are labelled transfer_integration (12.g10 len(x)-len(set(x)); 16.g10
    whose prompt dictates the full expression).'
- round: 1
  file: review_15b2.yaml
  finding: 'Option cueing in 15.g06/g07: only the correct option carries an explanation clause.'
- round: 1
  file: review_15b2.yaml
  finding: 'Minor: 16.g04''s unseeded wrong solution fails only probabilistically (≈0.5% chance of matching all three outcomes),
    so its ''wrong solution fails'' verification is not deterministic.'
- round: 1
  file: review_15b2.yaml
  finding: All 7 misconception mappings in scope (6 per-item + 1 published f03) point at an option the named misconception

- round: 1
  file: review_15de.yaml
  finding: 'Near-variants and lesson re-use are the dominant defect (most fails): many g items take a lesson check, canonical
    example or worked example (often keeping its function name, file name or even its values — artir, degistir/takas, sinirla,
    fark, say(), zeytin, s.txt) or reproduce a published item with renamed identifiers. The builder has no near-variant or
    lesson-overlap check; a similarity check of g-item code against lesson checks/explanations/published items would have
    caught most of them.'
- round: 1
  file: review_15de.yaml
  finding: Several t* items claim cross_topic_context where the other-Topic element is cosmetic (a loop replacing repeated
    calls or assignments; a Python program whose output is irrelevant to a redirect; a context identical to an ordinary published
    item with the same required_skills). The builder accepts any required_skills Skill of another Topic; it cannot see whether
    the context is needed.
- round: 1
  file: review_15de.yaml
  finding: 'Evidence-type mismatch the builder does not catch: an item without its own evidence_type gets the Objective''s

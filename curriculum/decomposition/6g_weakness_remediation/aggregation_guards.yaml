rules:
- guard_id: guard.no_domain_reset
  rule: A failure localized to one Objective/Skill cannot reset or reteach an entire Domain by default.
- guard_id: guard.no_topic_broadcast
  rule: Topic weakening/remediation_required is derived from required Skill evidence; Topic state never broadcasts weakness
    back to all linked Skills.
- guard_id: guard.no_skill_broadcast_from_one_incidental_objective
  rule: One Objective failure affects Skill state only through GRE required/critical gates and hysteresis; no manual whole-Skill
    fail flag bypasses GRE.
- guard_id: guard.no_project_broadcast
  rule: Global project pass/fail cannot write evidence or weakness to every tagged Objective; component must be structurally
    essential and separately observable.
- guard_id: guard.branch_local_prerequisite_effect
  rule: Confirmed prerequisite weakness blocks only dependent hard-prerequisite work; independent branches remain schedulable.
- guard_id: guard.review_due_not_weakness
  rule: Time-based review_due is maintenance scheduling, not negative learner evidence.
- guard_id: guard.english_not_global_failure
  rule: Unknown Technical English cannot be silently interpreted as technical Skill weakness unless it is an explicit fair
    task prerequisite.
- guard_id: guard.guidance_fading
  rule: High guidance is for novice/prerequisite repair; as verified success/transfer accumulate, hints/worked examples fade
    toward retrieval, transfer and independent problem solving.
- guard_id: guard.mastered_target_reverification_first
  rule: A previously mastered target defaults to fresh verification/retrieval/transfer/debug localization before full worked-example
    reteaching.
- guard_id: guard.ai_scaffold_not_closure
  rule: AI assistance may scaffold remediation but cannot satisfy fresh H0 independent closure evidence.

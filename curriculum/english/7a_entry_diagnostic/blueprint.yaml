  - skill_id: skill.english.read_definition_and_constraint
    diagnostic_tier: applied_comprehension
    hard_prerequisite_skill_ids:
      - skill.english.technical_noun_phrase_recognition
      - skill.english.be_and_simple_present_comprehension
    primary_evidence_type: reading_comprehension
    task_family_id: english.definition_constraint_extract
    default_stage: branch_probe

  - skill_id: skill.english.read_procedure_sequence
    diagnostic_tier: applied_comprehension
    hard_prerequisite_skill_ids:
      - skill.english.imperative_instruction_comprehension
      - skill.english.preposition_function_word_comprehension
    primary_evidence_type: reading_comprehension
    task_family_id: english.procedure_sequence_track
    default_stage: branch_probe

  - skill_id: skill.english.write_command_result_note
    diagnostic_tier: production
    hard_prerequisite_skill_ids:
      - skill.english.be_and_simple_present_comprehension
    primary_evidence_type: written_or_spoken_production
    task_family_id: english.command_result_note

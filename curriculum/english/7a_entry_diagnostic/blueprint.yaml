model: EED-v0
stage_step: 7A
status: candidate_pending_qa
canonical_skill_registry: curriculum/decomposition/6c_foundations/skills.yaml
canonical_objective_registry: curriculum/decomposition/6c_foundations/objectives.yaml
canonical_prerequisite_registry: curriculum/decomposition/6c_foundations/prerequisite_edges.yaml
cefr_alignment_status: pending_7B
cefr_level: null

scope:
  domain_id: domain.technical_english
  route_family_id: D01
  expected_skill_count: 15
  objective_resolution: canonical_owner_objectives
  broad_domain_score_required: false

invariants:
  diagnostic_mastery_standard: GRE-v0
  diagnostic_waiver_policy: VDW-v0
  prerequisite_policy: PRG-v0
  weakness_attribution_policy: WLRM-v0
  resource_trust_policy: QAB-v0+AIV-v0
  self_report_is_evidence: false
  certificate_claim_is_mastery: false
  confidence_is_mastery: false
  fixed_item_count_for_mastery: null
  diagnostic_pass_percentage: null
  technical_curriculum_global_english_gate: false
  downstream_failure_broadcast: false
  unknown_grammar_hidden_prerequisite: forbidden

profile_resolution_vocabulary:
  - mastery_or_waiver_confirmed
  - evidence_present_not_yet_sufficient
  - learning_needed_clean_evidence
  - prerequisite_unresolved
  - not_assessed
  - user_deferred
  - invalid_or_contaminated

routing:
  entry_root_skill_ids:
    - skill.english.recognize_core_technical_labels
  diagnostic_stages:
    - entry_probe
    - branch_probe
    - confirm
    - production_probe
    - transfer_confirm
  selection_priority:
    - unresolved_hard_prerequisite_information
    - downstream_unlock_value
    - prior_knowledge_claim_check
    - missing_GRE_or_VDW_evidence_gate
    - expensive_production_probe
  clean_success_actions:
    - record_exact_objective_evidence
    - recompute_downstream_eligibility
    - schedule_confirm_only_if_normal_GRE_or_VDW_gate_requires_it
    - never_broadcast_mastery_to_downstream_skill
  clean_failure_actions:
    - localize_learning_need_to_exact_target
    - mark_hard_dependents_prerequisite_unresolved
    - keep_independent_sibling_branches_eligible
    - never_mark_whole_english_domain_failed
  invalid_or_contaminated_actions:
    - do_not_write_target_negative_evidence
    - preserve_target_as_unresolved
  pause_conditions:
    - user_deferred
    - session_capacity_exhausted
    - remaining_branches_prerequisite_unresolved
    - trusted_resource_or_evaluator_unavailable
    - in_scope_branches_resolved

technical_context_policy:
  default: minimal_context_no_specialist_knowledge
  safe_examples:
    - file_exists_or_missing
    - command_runs_or_fails
    - input_output
    - value_error
    - short_option_or_example_block
    - fictional_cli_or_documentation_fragment
  forbidden_hidden_dependencies:
    - python_semantics
    - c_pointer_reasoning
    - linux_administration
    - cuda_gpu_knowledge
    - distributed_systems_knowledge
  contaminated_task_resolution: invalid_or_contaminated

self_report_context:
  allowed_fields:
    - prior_english_learning
    - documentation_reading_comfort
    - error_message_reading_comfort
    - short_technical_writing_comfort
    - claimed_general_or_technical_level
    - external_certificate_claim
    - preferred_session_length
  allowed_uses:
    - probe_ordering
    - branch_priority
    - explanation_context
  prohibited_uses:
    - mastery_write
    - coverage_waiver_write
    - negative_evidence_write

claims:
  - skill_id: skill.english.recognize_core_technical_labels
    diagnostic_tier: foundation_recognition
    hard_prerequisite_skill_ids: []
    primary_evidence_type: recognition
    task_family_id: english.term_meaning_match
    default_stage: entry_probe

  - skill_id: skill.english.technical_noun_phrase_recognition
    diagnostic_tier: receptive_language_reasoning
    hard_prerequisite_skill_ids:
      - skill.english.recognize_core_technical_labels
    primary_evidence_type: reading_comprehension
    task_family_id: english.noun_phrase_meaning
    default_stage: branch_probe

  - skill_id: skill.english.be_and_simple_present_comprehension
    diagnostic_tier: receptive_language_reasoning
    hard_prerequisite_skill_ids:
      - skill.english.recognize_core_technical_labels
    primary_evidence_type: reading_comprehension
    task_family_id: english.simple_sentence_function
    default_stage: branch_probe

  - skill_id: skill.english.imperative_instruction_comprehension
    diagnostic_tier: receptive_language_reasoning
    hard_prerequisite_skill_ids:
      - skill.english.recognize_core_technical_labels
    primary_evidence_type: reading_comprehension
    task_family_id: english.imperative_action_object
    default_stage: branch_probe

  - skill_id: skill.english.follow_bilingual_technical_instruction
    diagnostic_tier: applied_comprehension
    hard_prerequisite_skill_ids:
      - skill.english.imperative_instruction_comprehension
    primary_evidence_type: reading_comprehension
    task_family_id: english.bilingual_instruction_follow
    default_stage: branch_probe

  - skill_id: skill.english.read_simple_terminal_error_fragments
    diagnostic_tier: applied_comprehension
    hard_prerequisite_skill_ids:
      - skill.english.recognize_core_technical_labels
    primary_evidence_type: reading_comprehension
    task_family_id: english.error_signal_extract
    default_stage: branch_probe

  - skill_id: skill.english.preposition_function_word_comprehension
    diagnostic_tier: receptive_language_reasoning
    hard_prerequisite_skill_ids:
      - skill.english.be_and_simple_present_comprehension
    primary_evidence_type: reading_comprehension
    task_family_id: english.function_word_relation
    default_stage: branch_probe

  - skill_id: skill.english.negation_question_comprehension
    diagnostic_tier: receptive_language_reasoning
    hard_prerequisite_skill_ids:
      - skill.english.be_and_simple_present_comprehension
    primary_evidence_type: reading_comprehension
    task_family_id: english.negation_question_meaning
    default_stage: branch_probe

  - skill_id: skill.english.documentation_navigation
    diagnostic_tier: applied_comprehension
    hard_prerequisite_skill_ids:

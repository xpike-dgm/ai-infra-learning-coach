  band_role: receptive_foundation
  cefr_scale_families:
  - cefr.overall_reading_comprehension
  - cefr.vocabulary_range
  technical_target_statement: Recognize frequent technical labels and map them to basic task meaning in short strings.
  b2_plus_extension_eligible: false
- skill_id: skill.english.technical_noun_phrase_recognition
  anchor_band: A1
  band_role: receptive_foundation
  cefr_scale_families:
  - cefr.overall_reading_comprehension
  - cefr.vocabulary_range
  technical_target_statement: Resolve short technical noun phrases without requiring specialist domain reasoning.
  b2_plus_extension_eligible: false
- skill_id: skill.english.be_and_simple_present_comprehension
  anchor_band: A1
  band_role: grammar_receptive_foundation
  cefr_scale_families:
  - cefr.overall_reading_comprehension
  - cefr.grammatical_accuracy
  technical_target_statement: Understand basic state, identity and routine behavior expressed with be/simple present in technical examples.
  b2_plus_extension_eligible: false
- skill_id: skill.english.imperative_instruction_comprehension
  anchor_band: A1
  band_role: instruction_reception
  cefr_scale_families:
  - cefr.reading_instructions
  technical_target_statement: Extract action and object from short straightforward technical imperatives.
  b2_plus_extension_eligible: false
- skill_id: skill.english.preposition_function_word_comprehension
  anchor_band: A1
  band_role: grammar_relation_reception
  cefr_scale_families:
  - cefr.overall_reading_comprehension
  - cefr.grammatical_accuracy
  technical_target_statement: Interpret basic relation/function-word meaning needed by short technical sentences and instructions.
  b2_plus_extension_eligible: false
- skill_id: skill.english.negation_question_comprehension
  anchor_band: A2
  band_role: receptive_interaction_bridge
  cefr_scale_families:
  - cefr.overall_reading_comprehension
  - cefr.grammatical_accuracy
  - cefr.overall_written_interaction
  technical_target_statement: Distinguish straightforward negation and question intent in technical task communication.
  b2_plus_extension_eligible: false
- skill_id: skill.english.follow_bilingual_technical_instruction
  anchor_band: A2
  band_role: scaffolded_instruction_application
  cefr_scale_families:
  - cefr.reading_instructions
  - cefr.plurilingual_comprehension
  technical_target_statement: Follow a short structured technical instruction with bilingual scaffold while English prerequisites remain separately observable.
  b2_plus_extension_eligible: false
- skill_id: skill.english.read_simple_terminal_error_fragments
  anchor_band: A2
  band_role: error_reception
  cefr_scale_families:
  - cefr.reading_for_orientation
  - cefr.reading_for_information_and_argument
  technical_target_statement: Extract location/category/basic signal from short terminal or compiler error fragments without requiring diagnosis expertise.
  b2_plus_extension_eligible: false
- skill_id: skill.english.documentation_navigation
  anchor_band: A2
  band_role: documentation_orientation
  cefr_scale_families:
  - cefr.reading_for_orientation
  - cefr.reading_for_information_and_argument
  technical_target_statement: Locate relevant heading, option, example or short section in straightforward technical documentation.
  b2_plus_extension_eligible: true
  b2_plus_extension_scope: Navigate denser documentation and cross-references while staying within information-location/navigation semantics.
- skill_id: skill.english.write_command_result_note
  anchor_band: A2
  band_role: short_written_production
  cefr_scale_families:
  - cefr.overall_written_production
  - cefr.overall_written_interaction
  technical_target_statement: Write a short factual command/input/result note using already-established grammar and vocabulary.
  b2_plus_extension_eligible: false
- skill_id: skill.english.read_definition_and_constraint
  anchor_band: B1
  band_role: independent_information_reception
  cefr_scale_families:
  - cefr.reading_for_information_and_argument
  technical_target_statement: Independently extract a technical definition together with its stated condition, limitation or constraint.
  b2_plus_extension_eligible: true
  b2_plus_extension_scope: Track multiple qualifiers, exceptions or linked constraints without expanding into specialist technical correctness judgment.
- skill_id: skill.english.read_procedure_sequence
  anchor_band: B1
  band_role: independent_instruction_reception
  cefr_scale_families:
  - cefr.reading_instructions
  - cefr.reading_for_information_and_argument
  technical_target_statement: Follow a multi-step technical procedure and track sequence, condition and warning language independently.
  b2_plus_extension_eligible: true
  b2_plus_extension_scope: Track denser conditional/warning/dependency structure and cross-references while remaining a procedure-reading capability.
- skill_id: skill.english.write_basic_bug_description
  anchor_band: B1
  band_role: basic_professional_written_interaction
  cefr_scale_families:
  - cefr.overall_written_interaction
  - cefr.goal_oriented_online_transactions_collaboration
  technical_target_statement: Write a basic expected/actual/error bug description that another person can act on without requiring advanced report-writing semantics.
  b2_plus_extension_eligible: false
- skill_id: skill.english.explain_simple_technical_process
  anchor_band: B1
  band_role: independent_short_explanation
  cefr_scale_families:
  - cefr.overall_written_production
  technical_target_statement: Explain a simple technical process in a coherent short sequence using independently produced language.
  b2_plus_extension_eligible: false
- skill_id: skill.english.ask_clarifying_technical_question
  anchor_band: B1
  band_role: professional_clarification_interaction
  cefr_scale_families:
  - cefr.overall_written_interaction
  - cefr.goal_oriented_online_transactions_collaboration
  technical_target_statement: Ask a clear technical clarification question that resolves missing or ambiguous task information.
  b2_plus_extension_eligible: true
  b2_plus_extension_scope: Formulate precise clarification in professional online collaboration, including relevant condition/context, without requiring broader negotiation capability.

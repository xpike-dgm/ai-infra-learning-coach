- band: A2
  label: Technical Operator
  expected_anchor_skill_count: 5
  intent: Operate in straightforward technical task/error/documentation contexts and produce a short command/result note.
- band: B1
  label: Technical Independent Base
  expected_anchor_skill_count: 5
  intent: Independently read definitions/procedures and perform basic professional technical writing/explanation/clarification in text-first workflows.

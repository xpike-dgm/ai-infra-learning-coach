org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# Dynamic colour is disabled by decision (AMTS-v0 / VDSX-v0 / WFPX-v0): the palette is measured,
# not derived from wallpaper. In Compose this is enforced by never calling the dynamic scheme
# functions, which tools/validate_project_skeleton.py checks by source scan.

# Set to false to build the product without the AI adapter (TVSX-v0 T5-NULLEVAL-01):
#   ./gradlew :app-wiring:assembleDebug -PwithAiAdapter=false
withAiAdapter=true

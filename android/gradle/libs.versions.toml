# Every version here was verified against a current source on 2026-08-31 and recorded in
# research/10a_project_setup_research.md. Per AMTS-v0, currency is verified, not asserted:
# these are configuration values, not canonical claims. Re-verify before changing them.

[versions]
agp = "9.3.0"                  # AGP 9.3.0, July 2026; requires Gradle 9.5.0, JDK 17+, build-tools 36.0.0+
kotlin = "2.4.0"               # Kotlin 2.4.0, 11 August 2026
composeBom = "2026.08.00"      # -> Compose 1.12.0 / Material3 1.4.0; Compose 1.12 compiles against API 37
composeAdaptive = "1.3.0"      # androidx.compose.material3.adaptive, 12 August 2026
sqlite = "2.7.0"               # androidx.sqlite, 1 July 2026; Android minSdk 23; bundled driver runs on the JVM

# Platform levels. minSdk is a policy (AMTS-v0 §8.1): the lowest level that needs no weakening
# shim. java.time is native from 26, which is why retention/review timing does not need desugaring.
# Confirmed against the recorded target device (Poco M6 Pro, Android 16 / API 36).
minSdk = "26"
targetSdk = "36"
compileSdk = "37"              # forced by Compose 1.12; AGP 9.3 supports API 37 as its maximum

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
compose-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "composeAdaptive" }
compose-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "composeAdaptive" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.11.0" }
sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# kotlin-android is deliberately absent: AGP 9.0+ provides Kotlin support built in and
# rejects the standalone plugin (verified by the build, 2026-08-31).
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Deliberately absent, with reasons recorded in the 10A research synthesis:
# - no DI framework: app-wiring is a hand-written composition root (MSBX-v0 composition_root)
# - no ORM: DDM-v0 requires a library-neutral physical schema and TVSX-v0 requires append-only
#   to be enforced by the storage layer and proven by attempted UPDATE/DELETE
# - no architecture-rule library: the dependency rule is checked by :verifyModuleBoundaries,
#   which needs no dependency and fails the build
# - no HTTP client: AIAX-v0's adapter has no call sites yet (10A declares nothing speculative)
